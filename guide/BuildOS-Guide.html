s in <code>.os/data/extractions.jsonl<\/code>.<\/p>\n<hr>\n<h3 id=\"feature\"><span>feature<\/span><a class=\"h-anchor\" href=\"#/20-glossary/feature\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Not a record type in the shipped system. People reach for it when they mean <a href=\"#/20-glossary/capability\">capability<\/a>, and there is nowhere to put it if they insist.<\/p>\n<hr>\n<h3 id=\"finding\"><span>finding<\/span><a class=\"h-anchor\" href=\"#/20-glossary/finding\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>See <a href=\"#/20-glossary/raw-finding\">raw finding<\/a> for one nobody has proved, and <a href=\"#/20-glossary/qualified-finding\">qualified finding<\/a> for one that passed a test.<\/p>\n<hr>\n<h3 id=\"front-matter\"><span>front matter<\/span><a class=\"h-anchor\" href=\"#/20-glossary/front-matter\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A block of structured data at the top of a Markdown file, fenced above and below by a line of three hyphens. It is how a file states its ID, its status, and its scope. The format is YAML, which reads like a list of labelled values.<\/p>\n<hr>\n<h3 id=\"guardrail\"><span>guardrail<\/span><a class=\"h-anchor\" href=\"#/20-glossary/guardrail\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A <a href=\"#/20-glossary/playbook\">playbook<\/a> that states a rule instead of a job. It never runs and produces nothing. It says what you must and must not do.<\/p>\n<p><strong>In practice.<\/strong> It works by being read. No tool enforces it. Two of the three playbooks switched on in a fresh copy are guardrails.<\/p>\n<hr>\n<h3 id=\"harness-the-playbook-field\"><span>harness (the playbook field)<\/span><a class=\"h-anchor\" href=\"#/20-glossary/harness-the-playbook-field\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>On a playbook, the kind of tooling the job needs: <code>browser<\/code>, <code>computer-use<\/code>, <code>mcp<\/code>, <code>shell<\/code>, or <code>none<\/code>. It names a capability rather than a product.<\/p>\n<p><strong>Not to be confused with.<\/strong> The <a href=\"#/20-glossary/agent-harness\">agent harness<\/a>, which is the software you are running. Same word, two meanings.<\/p>\n<hr>\n<h3 id=\"identity-key\"><span>identity key<\/span><a class=\"h-anchor\" href=\"#/20-glossary/identity-key\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The approved phrase that names a <a href=\"#/20-glossary/persona\">persona<\/a>. Only personas have one, and a person has to approve it.<\/p>\n<hr>\n<h3 id=\"index\"><span>index<\/span><a class=\"h-anchor\" href=\"#/20-glossary/index\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A generated lookup file. It is never the source of truth. Delete it and rebuild it whenever you like.<\/p>\n<p>One index ships, and it holds a list named <code>runnable_playbooks<\/code>. The name is wrong. The list holds every playbook that is switched on, including guardrails, and a guardrail never runs. Read it as &quot;switched on&quot;, not &quot;things you can execute.&quot;<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>Two other index files are named in the contracts and do not exist until you build them: the converted-source index and the entity lookup file. See <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a>.<\/p>\n<\/div><\/aside>\n<p><strong>Where it lives.<\/strong> <code>.os/indexes/<\/code><\/p>\n<hr>\n<h3 id=\"instance\"><span>instance<\/span><a class=\"h-anchor\" href=\"#/20-glossary/instance\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>One deployment of BuildOS: one copy of the folder, with its own configuration file naming the real systems, environments, and owners it points at.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>The configuration file that ships is the neutral example. If you do not edit it, everything validates against invented names and nothing warns you. See <a href=\"#/04-install-and-configure-your-instance\">Install and configure your instance<\/a>.<\/p>\n<\/div><\/aside>\n<p><strong>Where it lives.<\/strong> <code>.os/config/instance.yaml<\/code><\/p>\n<hr>\n<h3 id=\"intake\"><span>intake<\/span><a class=\"h-anchor\" href=\"#/20-glossary/intake\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Taking a file from outside and bringing it in as clean text that remembers where it came from.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Attaching a file in your agent&#39;s chat window is not intake. Nothing lands on disk, nothing is recorded, and the next session knows nothing about it. See <a href=\"#/05-bring-in-source-material\">Bring in source material<\/a>.<\/p>\n<\/div><\/aside>\n<hr>\n<h3 id=\"lifecycle-state\"><span>lifecycle state<\/span><a class=\"h-anchor\" href=\"#/20-glossary/lifecycle-state\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The stage an artifact has reached, written in its own fields. The words differ by artifact type:<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Artifact<\/th>\n<th>States<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Playbook<\/td>\n<td><code>draft<\/code> → <code>reviewed<\/code> → <code>active<\/code> → <code>archived<\/code><\/td>\n<\/tr>\n<tr>\n<td>Entity record<\/td>\n<td><code>draft<\/code>, <code>active<\/code>, <code>superseded<\/code>, <code>archived<\/code><\/td>\n<\/tr>\n<tr>\n<td>Converted twin<\/td>\n<td><code>candidate<\/code> → <code>converted<\/code> → <code>superseded<\/code> or <code>rejected<\/code><\/td>\n<\/tr>\n<tr>\n<td>Run<\/td>\n<td><code>running<\/code> → <code>closed<\/code> or <code>aborted<\/code><\/td>\n<\/tr>\n<tr>\n<td>Finding<\/td>\n<td><code>qualified<\/code>, <code>designed<\/code>, <code>archived<\/code><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Only an <code>active<\/code> playbook runs or applies. See <a href=\"#/20-glossary/review-to-activate\">review-to-activate<\/a>.<\/p>\n<hr>\n<h3 id=\"load-plan\"><span>load plan<\/span><a class=\"h-anchor\" href=\"#/20-glossary/load-plan\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The running list of extraction rows.<\/p>\n<p><strong>In practice.<\/strong> You will not meet it. The file it names is empty.<\/p>\n<hr>\n<h3 id=\"make-docs\"><span>make-docs<\/span><a class=\"h-anchor\" href=\"#/20-glossary/make-docs\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A separate documentation system installed into the repository as a plug-in. It owns four folders, and BuildOS must not write into them directly.<\/p>\n<p><strong>In practice.<\/strong> It owns <code>docs/<\/code>, where designs, plans, PRDs, backlogs, and guides go. The outputs you care about most live in its folders, reached through its own routers.<\/p>\n<p><strong>Not to be confused with.<\/strong> The two folders named <code>assets<\/code>. <code>assets/<\/code> holds converted twins and belongs to BuildOS. <code>docs/assets/<\/code> belongs to Make Docs and holds guides and shared project material. Make Docs&#39; own rule files are under <code>.make-docs/system/<\/code>.<\/p>\n<hr>\n<h3 id=\"minted-referenced-updated\"><span>minted, referenced, updated<\/span><a class=\"h-anchor\" href=\"#/20-glossary/minted-referenced-updated\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Three lists on an <a href=\"#/20-glossary/extraction\">extraction<\/a> row. <strong>Minted<\/strong> means it created new records. <strong>Referenced<\/strong> means it reused records without changing them. <strong>Updated<\/strong> means it deliberately changed records.<\/p>\n<p><strong>In practice.<\/strong> Read them after a second pass over material you already processed. A second pass does not only add.<\/p>\n<hr>\n<h3 id=\"owner\"><span>owner<\/span><a class=\"h-anchor\" href=\"#/20-glossary/owner\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A team, organisation, vendor, or group accountable for something. Named once in the configuration file, then referenced by ID everywhere else.<\/p>\n<hr>\n<h3 id=\"persona\"><span>persona<\/span><a class=\"h-anchor\" href=\"#/20-glossary/persona\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A record describing a kind of user or stakeholder: what they are trying to get done, and what they need in order to do it.<\/p>\n<p><strong>Not to be confused with.<\/strong> A permission set. It grants nothing, restricts nothing, and no part of the target system knows it exists.<\/p>\n<hr>\n<h3 id=\"phase\"><span>phase<\/span><a class=\"h-anchor\" href=\"#/20-glossary/phase\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A chunk inside a <a href=\"#/20-glossary/plan\">plan<\/a> or a <a href=\"#/20-glossary/backlog\">backlog<\/a>. Each phase is its own file, <code>0N-&lt;phase&gt;.md<\/code>. <code>p{P}<\/code> never appears in the directory name, and exists so you can refer to a phase from outside, as in <code>w2 r0 p3<\/code>.<\/p>\n<hr>\n<h3 id=\"plan\"><span>plan<\/span><a class=\"h-anchor\" href=\"#/20-glossary/plan\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A folder of documents written before work starts. It settles the shape of the output, the order, and who does what.<\/p>\n<p><strong>Not to be confused with.<\/strong> Your agent tool&#39;s own planning mode. See <a href=\"#/20-glossary/plan-mode-plan\">plan-mode plan<\/a> below.<\/p>\n<p><strong>Where it lives.<\/strong> <code>docs/plans/YYYY-MM-DD-w{W}-r{R}-&lt;slug&gt;/<\/code><\/p>\n<hr>\n<h3 id=\"playbook\"><span>playbook<\/span><a class=\"h-anchor\" href=\"#/20-glossary/playbook\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A short written procedure telling a person or an agent how to do one job. It is a Markdown file with a fixed header block and fixed sections.<\/p>\n<p><strong>Not to be confused with.<\/strong> The script that does the work. Two separate things exist: an agent clicking around like a user, and a script that repeats a check the same way every time. The playbook is the written instruction behind either one. This is the confusion people hit most often.<\/p>\n<p><strong>Where it lives.<\/strong> <code>playbooks/&lt;category&gt;/&lt;slug&gt;.md<\/code><\/p>\n<hr>\n<h3 id=\"polarity\"><span>polarity<\/span><a class=\"h-anchor\" href=\"#/20-glossary/polarity\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Whether a finding proves something is there (<code>positive<\/code>) or reliably is not there or fails (<code>negative<\/code>). A negative result is a successful run with a useful answer.<\/p>\n<hr>\n<h3 id=\"prd\"><span>PRD<\/span><a class=\"h-anchor\" href=\"#/20-glossary/prd\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Product requirements: a numbered set of documents describing the product, kept deliberately short and pointing at the records behind them rather than repeating those records. One set is active at a time.<\/p>\n<p><strong>Where it lives.<\/strong> <code>docs/prd/NN-&lt;slug&gt;.md<\/code><\/p>\n<hr>\n<h3 id=\"procedure-playbook\"><span>procedure playbook<\/span><a class=\"h-anchor\" href=\"#/20-glossary/procedure-playbook\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A <a href=\"#/20-glossary/playbook\">playbook<\/a> you run, as opposed to one that states a rule. It produces evidence. The other kind is a <a href=\"#/20-glossary/guardrail\">guardrail<\/a>, and every playbook is one or the other.<\/p>\n<hr>\n<h3 id=\"provenance\"><span>provenance<\/span><a class=\"h-anchor\" href=\"#/20-glossary/provenance\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The record of where a piece of text came from: the original path, a fingerprint of the original file, what produced the copy, and when.<\/p>\n<p><strong>In practice.<\/strong> It is the header at the top of every <a href=\"#/20-glossary/converted-twin\">converted twin<\/a>. The fingerprint is what makes it <em>possible<\/em> to tell that a file with the same name has changed, though no shipped tool does that comparison for you. See <a href=\"#/05-bring-in-source-material\">Bring in source material<\/a>.<\/p>\n<hr>\n<h3 id=\"qualification\"><span>qualification<\/span><a class=\"h-anchor\" href=\"#/20-glossary/qualification\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The repeatable test that proves an observation. A hunch does not count and a single sighting does not count. Somebody else has to be able to run it and get the same answer.<\/p>\n<p><strong>Where it lives.<\/strong> <code>qualification.md<\/code> inside the finding folder.<\/p>\n<hr>\n<h3 id=\"qualified-finding\"><span>qualified finding<\/span><a class=\"h-anchor\" href=\"#/20-glossary/qualified-finding\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>An observation that passed a repeatable test. It gets an ID of the form <code>FIND-NNN<\/code> and its own folder holding the statement and the test that proved it.<\/p>\n<p><strong>In practice.<\/strong> Some important observations cannot pass. A mismatch between how a platform models the world and how your business works is a conclusion, not a behaviour a test can trigger. See <a href=\"#/09-qualify-what-you-found\">Qualify what you found<\/a>.<\/p>\n<p><strong>Where it lives.<\/strong> <code>workspace/findings/FIND-NNN/<\/code><\/p>\n<hr>\n<h3 id=\"raw-finding\"><span>raw finding<\/span><a class=\"h-anchor\" href=\"#/20-glossary/raw-finding\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Something you noticed during a <a href=\"#/20-glossary/run\">run<\/a> that nobody has proved. It has no ID.<\/p>\n<p><strong>Where it lives.<\/strong> An <a href=\"#/20-glossary/anchor\">anchor<\/a> inside that run&#39;s <code>raw-findings.md<\/code>.<\/p>\n<hr>\n<h3 id=\"redirect\"><span>redirect<\/span><a class=\"h-anchor\" href=\"#/20-glossary/redirect\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A pointer on a losing record saying which record replaced it, who decided, when, and why. Nothing is deleted, and the losing record keeps everything that was recorded about it.<\/p>\n<p><strong>In practice.<\/strong> It only folds one record into another. Splitting one record into two is manual re-authoring, and no tool does it.<\/p>\n<hr>\n<h3 id=\"requirement\"><span>requirement<\/span><a class=\"h-anchor\" href=\"#/20-glossary/requirement\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A record of something a system must do.<\/p>\n<p><strong>Not to be confused with.<\/strong> A <a href=\"#/20-glossary/capability\">capability<\/a>. The difference is ownership: somebody requires a requirement and is tracking whether it is met. A capability is only a description of what the system can do.<\/p>\n<hr>\n<h3 id=\"result\"><span>result<\/span><a class=\"h-anchor\" href=\"#/20-glossary/result\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The outcome of running a check: <code>pass<\/code>, <code>fail<\/code>, <code>blocked<\/code>, or <code>inconclusive<\/code>. The last one means the check could not settle the question either way.<\/p>\n<p><strong>In practice.<\/strong> <code>blocked<\/code> is the one people write down without checking. Confirm it is blocked before you record it.<\/p>\n<hr>\n<h3 id=\"review-to-activate\"><span>review-to-activate<\/span><a class=\"h-anchor\" href=\"#/20-glossary/review-to-activate\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The gate a <a href=\"#/20-glossary/playbook\">playbook<\/a> passes before it counts. A person moves it from <code>draft<\/code> to <code>reviewed<\/code> to <code>active<\/code>, and only an <code>active<\/code> playbook runs or applies.<\/p>\n<p>The point of the gate is that a human decides before an agent starts operating a real system.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>No tool performs this. Activation is a hand edit of the header block followed by an <a href=\"#/20-glossary/index\">index<\/a> rebuild, and nothing anywhere records who approved it. An agent that edits the header for you has not reviewed anything. See <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a>.<\/p>\n<\/div><\/aside>\n<hr>\n<h3 id=\"revision\"><span>revision<\/span><a class=\"h-anchor\" href=\"#/20-glossary/revision\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A redo inside one <a href=\"#/20-glossary/wave\">wave<\/a>. Written <code>r{R}<\/code> in a folder name. Redoing a wave is the ordinary way a change gets absorbed, rather than a signal that something went wrong.<\/p>\n<hr>\n<h3 id=\"router\"><span>router<\/span><a class=\"h-anchor\" href=\"#/20-glossary/router\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A short instruction file that sits in a folder and says what belongs there, what does not, and where to go next. It is named <code>AGENTS.md<\/code>. Agent tools load it on their own before anything else.<\/p>\n<p><strong>In practice.<\/strong> People skip these files because the name suggests they are not for humans. They are the fastest way to understand any folder in the tree, so read them.<\/p>\n<p><strong>Not to be confused with.<\/strong> The second file beside it, <code>CLAUDE.md<\/code>. It carries the same pointer so that a tool which only looks for that filename still gets sent to the real instructions. In the BuildOS-owned folders it contains nothing else.<\/p>\n<hr>\n<h3 id=\"run\"><span>run<\/span><a class=\"h-anchor\" href=\"#/20-glossary/run\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>One recorded attempt at doing something. It is a folder holding a summary, the raw material captured, and the rough notes. Once it is closed, you leave it alone. The folder is also called the run record.<\/p>\n<p><strong>In practice.<\/strong> No example ships. The runs folder in a fresh copy holds routers and nothing else.<\/p>\n<p><strong>Where it lives.<\/strong> <code>workspace/runs/RUN-NNN/<\/code><\/p>\n<hr>\n<h3 id=\"scoped-metadata\"><span>scoped metadata<\/span><a class=\"h-anchor\" href=\"#/20-glossary/scoped-metadata\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The three list fields <code>systems<\/code>, <code>environments<\/code>, and <code>owners<\/code> that sit on artifacts. Every value must be an ID that exists in the configuration file.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>The catch-all values <code>both<\/code>, <code>all<\/code>, <code>any<\/code>, and <code>default<\/code> are rejected, and so are the older field names <code>env<\/code>, <code>envs<\/code>, <code>for<\/code>, and <code>target_systems<\/code>. Write out the list.<\/p>\n<\/div><\/aside>\n<hr>\n<h3 id=\"side-artifact\"><span>side artifact<\/span><a class=\"h-anchor\" href=\"#/20-glossary/side-artifact\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>An image, chart, or diagram pulled out of a source during conversion and stored beside the <a href=\"#/20-glossary/converted-twin\">converted twin<\/a>. It is not a record and it carries no ID.<\/p>\n<p><strong>In practice.<\/strong> You will see few of these. PDF conversion does not pull images out at all.<\/p>\n<hr>\n<h3 id=\"slug\"><span>slug<\/span><a class=\"h-anchor\" href=\"#/20-glossary/slug\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A lowercase, hyphenated version of a name, safe to use in a filename. <code>Lending Policies<\/code> becomes <code>lending-policies<\/code>.<\/p>\n<hr>\n<h3 id=\"source\"><span>source<\/span><a class=\"h-anchor\" href=\"#/20-glossary/source\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The original file, before anything touches it. It lives outside BuildOS and stays there.<\/p>\n<hr>\n<h3 id=\"source-anchor\"><span>source anchor<\/span><a class=\"h-anchor\" href=\"#/20-glossary/source-anchor\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The field on a record that holds an <a href=\"#/20-glossary/anchor\">anchor<\/a> pointing back to the exact place in a <a href=\"#/20-glossary/converted-twin\">converted twin<\/a> the record came from. It behaves like an entry in a bibliography.<\/p>\n<p><strong>In practice.<\/strong> It is what lets you answer &quot;who said this, and where&quot; months later, when the person who wrote it has left.<\/p>\n<p><strong>Where it lives.<\/strong> The <code>source_anchor<\/code> field, written as <code>&lt;path-to-twin&gt;#&lt;anchor&gt;<\/code>.<\/p>\n<hr>\n<h3 id=\"state-nature\"><span>state nature<\/span><a class=\"h-anchor\" href=\"#/20-glossary/state-nature\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Whether a <a href=\"#/20-glossary/playbook\">playbook<\/a> needs a starting state and changes it (<code>stateful<\/code>), is safe to run at any time (<code>standing<\/code>), or is a rule rather than a run (<code>guardrail<\/code>). Spelled <code>state_nature<\/code> in the file.<\/p>\n<hr>\n<h3 id=\"system\"><span>system<\/span><a class=\"h-anchor\" href=\"#/20-glossary/system\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A thing you are studying: a product, a platform, an application. Named once in the configuration file, then referenced by ID.<\/p>\n<p><strong>Not to be confused with.<\/strong> Two things. It does not mean BuildOS itself, which trips people up in the playbook folder names. And it is not an <a href=\"#/20-glossary/environment\">environment<\/a>: the system is the type of thing, the environment is one running copy of it.<\/p>\n<p><strong>Where it lives.<\/strong> The <code>systems<\/code> list in <code>.os/config/instance.yaml<\/code>.<\/p>\n<hr>\n<h3 id=\"task\"><span>task<\/span><a class=\"h-anchor\" href=\"#/20-glossary/task\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The smallest line in a <a href=\"#/20-glossary/backlog\">backlog<\/a>: one checkbox item under a stage.<\/p>\n<hr>\n<h3 id=\"terminal-id\"><span>terminal ID<\/span><a class=\"h-anchor\" href=\"#/20-glossary/terminal-id\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The ID you arrive at after following every <a href=\"#/20-glossary/redirect\">redirect<\/a> in the chain. It is the record that is current.<\/p>\n<hr>\n<h3 id=\"test-case\"><span>test case<\/span><a class=\"h-anchor\" href=\"#/20-glossary/test-case\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A record of a repeatable check: what it verifies, what has to be true before it starts, its steps, and the expected outcome.<\/p>\n<hr>\n<h3 id=\"wave\"><span>wave<\/span><a class=\"h-anchor\" href=\"#/20-glossary/wave\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>One full pass around design, plan, and work. Written <code>w{W}<\/code> in a folder name.<\/p>\n<p><strong>In practice.<\/strong> Treat the numbering as coordinates for where a piece of work sits in the sequence. The words are loose on purpose, and you can rename them.<\/p>\n<hr>\n<h3 id=\"work-item\"><span>work item<\/span><a class=\"h-anchor\" href=\"#/20-glossary/work-item\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>One unit of work in a <a href=\"#/20-glossary/backlog\">backlog<\/a>. Which level of the file that means depends on where you export to, so say which level you mean.<\/p>\n<hr>\n<h2 id=\"words-your-agent-will-hand-back-to-you\"><span>Words your agent will hand back to you<\/span><a class=\"h-anchor\" href=\"#/20-glossary/words-your-agent-will-hand-back-to-you\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>None of the four below is BuildOS vocabulary. Your agent will write them into a generated document anyway, and each has brought a competent reader to a halt. When a generated word means nothing to you, ask the agent what it means in that document, then write the answer down.<\/p>\n<h3 id=\"owned-ids\"><span>owned IDs<\/span><a class=\"h-anchor\" href=\"#/20-glossary/owned-ids\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A column header an agent may put on a generated table. When it appeared, it held capability IDs.<\/p>\n<p>The name is misleading: they would better be called capability IDs. There is no such thing in BuildOS. An agent naming a column is not the system naming a thing, and both arrive in the same document.<\/p>\n<h3 id=\"hydration-rules\"><span>hydration rules<\/span><a class=\"h-anchor\" href=\"#/20-glossary/hydration-rules\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A section heading an agent invented for a rule about keeping BuildOS&#39;s own example records out of counts of your product.<\/p>\n<p>The heading is not shipped vocabulary, though the problem behind it is: three example records ship in the data files, and they describe BuildOS itself rather than anything you are studying. Delete or relabel them before you add your own. See <a href=\"#/11-keep-the-record-clean\">Keep the record clean<\/a>.<\/p>\n<h3 id=\"plan-mode-plan\"><span>plan-mode plan<\/span><a class=\"h-anchor\" href=\"#/20-glossary/plan-mode-plan\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Some agent tools have a mode where they describe an approach and wait for you rather than acting. The proposal they produce is a plan in the tool&#39;s sense.<\/p>\n<p>A <a href=\"#/20-glossary/plan\">plan<\/a> in BuildOS is a folder of documents on disk. The two collide often enough that saying which one you mean is worth the extra three words.<\/p>\n<h3 id=\"index-versus-overview\"><span>index versus overview<\/span><a class=\"h-anchor\" href=\"#/20-glossary/index-versus-overview\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The overview is the document you read. The <a href=\"#/20-glossary/index\">index<\/a> is the file your agent uses to find things quickly. If you are wondering which of the two to open, open the overview.<\/p>\n<hr>\n<h2 id=\"what-you-should-have-now\"><span>What you should have now<\/span><a class=\"h-anchor\" href=\"#/20-glossary/what-you-should-have-now\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>A definition for every BuildOS word used in this set.<\/li>\n<li>The three badly named things, and what each really means: <code>administrative<\/code>, <code>runnable_playbooks<\/code>, owned IDs.<\/li>\n<li>The pairs people mix up: convert and extraction, system and environment, capability and requirement, playbook and script, the two <code>assets<\/code> folders, the two meanings of harness.<\/li>\n<li>A habit for the next unexplained word: ask the agent, then write the answer here.<\/li>\n<\/ul>\n<h2 id=\"next\"><span>Next<\/span><a class=\"h-anchor\" href=\"#/20-glossary/next\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><a href=\"#/21-guides-and-stakeholder-material\">Guides and stakeholder material<\/a>, which turns what you proved into something for the people who will use it.<\/p>\n","toc":[{"id":"how-to-use-this-article","text":"How to use this article","level":2},{"id":"the-words","text":"The words","level":2},{"id":"active-set-evolution","text":"active-set evolution","level":3},{"id":"adapter","text":"adapter","level":3},{"id":"agent","text":"agent","level":3},{"id":"agent-harness","text":"agent harness","level":3},{"id":"agentsmd","text":"AGENTS.md","level":3},{"id":"alias","text":"alias","level":3},{"id":"anchor","text":"anchor","level":3},{"id":"backlog","text":"backlog","level":3},{"id":"candidate","text":"candidate","level":3},{"id":"canonical-id","text":"canonical ID","level":3},{"id":"capability","text":"capability","level":3},{"id":"category","text":"category","level":3},{"id":"compat-mode-and-strict-mode","text":"compat mode and strict mode","level":3},{"id":"computer-use","text":"computer use","level":3},{"id":"consolidation-manifest","text":"consolidation manifest","level":3},{"id":"contract","text":"contract","level":3},{"id":"convert","text":"convert","level":3},{"id":"converted-twin","text":"converted twin","level":3},{"id":"design","text":"design","level":3},{"id":"entity-record","text":"entity record","level":3},{"id":"environment","text":"environment","level":3},{"id":"epic","text":"epic","level":3},{"id":"evidence","text":"evidence","level":3},{"id":"execution-mode","text":"execution mode","level":3},{"id":"extraction","text":"extraction","level":3},{"id":"feature","text":"feature","level":3},{"id":"finding","text":"finding","level":3},{"id":"front-matter","text":"front matter","level":3},{"id":"guardrail","text":"guardrail","level":3},{"id":"harness-the-playbook-field","text":"harness (the playbook field)","level":3},{"id":"identity-key","text":"identity key","level":3},{"id":"index","text":"index","level":3},{"id":"instance","text":"instance","level":3},{"id":"intake","text":"intake","level":3},{"id":"lifecycle-state","text":"lifecycle state","level":3},{"id":"load-plan","text":"load plan","level":3},{"id":"make-docs","text":"make-docs","level":3},{"id":"minted-referenced-updated","text":"minted, referenced, updated","level":3},{"id":"owner","text":"owner","level":3},{"id":"persona","text":"persona","level":3},{"id":"phase","text":"phase","level":3},{"id":"plan","text":"plan","level":3},{"id":"playbook","text":"playbook","level":3},{"id":"polarity","text":"polarity","level":3},{"id":"prd","text":"PRD","level":3},{"id":"procedure-playbook","text":"procedure playbook","level":3},{"id":"provenance","text":"provenance","level":3},{"id":"qualification","text":"qualification","level":3},{"id":"qualified-finding","text":"qualified finding","level":3},{"id":"raw-finding","text":"raw finding","level":3},{"id":"redirect","text":"redirect","level":3},{"id":"requirement","text":"requirement","level":3},{"id":"result","text":"result","level":3},{"id":"review-to-activate","text":"review-to-activate","level":3},{"id":"revision","text":"revision","level":3},{"id":"router","text":"router","level":3},{"id":"run","text":"run","level":3},{"id":"scoped-metadata","text":"scoped metadata","level":3},{"id":"side-artifact","text":"side artifact","level":3},{"id":"slug","text":"slug","level":3},{"id":"source","text":"source","level":3},{"id":"source-anchor","text":"source anchor","level":3},{"id":"state-nature","text":"state nature","level":3},{"id":"system","text":"system","level":3},{"id":"task","text":"task","level":3},{"id":"terminal-id","text":"terminal ID","level":3},{"id":"test-case","text":"test case","level":3},{"id":"wave","text":"wave","level":3},{"id":"work-item","text":"work item","level":3},{"id":"words-your-agent-will-hand-back-to-you","text":"Words your agent will hand back to you","level":2},{"id":"owned-ids","text":"owned IDs","level":3},{"id":"hydration-rules","text":"hydration rules","level":3},{"id":"plan-mode-plan","text":"plan-mode plan","level":3},{"id":"index-versus-overview","text":"index versus overview","level":3},{"id":"what-you-should-have-now","text":"What you should have now","level":2},{"id":"next","text":"Next","level":2}]},"21-guides-and-stakeholder-material":{"slug":"21-guides-and-stakeholder-material","num":"21","title":"Guides and stakeholder material","lede":"This article is optional. Nothing earlier in the documentation depends on it, and you can run the whole BuildOS chain without ever writing a word of what follows.","html":"<p>It covers what you can do after the work backlog exists: turning proven work into something for the people who will use the system, and something for the people who will fund it.<\/p>\n<h2 id=\"what-you-need-first\"><span>What you need first<\/span><a class=\"h-anchor\" href=\"#/21-guides-and-stakeholder-material/what-you-need-first\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>You need a finished work backlog, or at least one converted source and something you have proved. Read <a href=\"#/13-build-the-work-backlog\">Build the work backlog<\/a> if you have not produced a backlog yet.<\/p>\n<h2 id=\"guides-for-the-people-who-will-use-the-system\"><span>Guides for the people who will use the system<\/span><a class=\"h-anchor\" href=\"#/21-guides-and-stakeholder-material/guides-for-the-people-who-will-use-the-system\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A <strong>guide<\/strong> is current-state documentation aimed at a reader who has to do something. Make Docs 2.0.9 separates two built-in audiences (it calls them Personas) and keeps them in separate directories:<\/p>\n<ul>\n<li><code>docs/assets/user/<\/code> holds guides for people or agents who use what the project ships.<\/li>\n<li><code>docs/assets/maintainer/<\/code> holds guides for contributors, maintainers, integrators, and operators.<\/li>\n<\/ul>\n<p>A project can configure more audiences in <code>.make-docs/config.yaml<\/code>; each one gets its own <code>docs/assets/&lt;persona-slug&gt;/<\/code> folder.<\/p>\n<p>Three files in the documentation layer govern this:<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>File<\/th>\n<th>What it is for<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>.make-docs/system/contracts/guide-contract.md<\/code><\/td>\n<td>The rules. Required frontmatter, audience rules, and the coverage decision.<\/td>\n<\/tr>\n<tr>\n<td><code>.make-docs/system/templates/guide-user.md<\/code><\/td>\n<td>The section skeleton for a user guide.<\/td>\n<\/tr>\n<tr>\n<td><code>.make-docs/system/templates/guide-maintainer.md<\/code><\/td>\n<td>The same, for a maintainer guide.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>A <strong>contract<\/strong> is the rule book for one kind of file. It says what fields that file must have and what states it can be in, and it wins over templates and over routing files. You do not have to read the guide contract yourself. Your agent does, and it will follow it.<\/p>\n<p>There is also a starting prompt at <code>.make-docs/system/prompts/work-to-guides.prompt.md<\/code>. A prompt starter is a convenience rather than an authority. Use it or write your own.<\/p>\n<h3 id=\"how-to-produce-one\"><span>How to produce one<\/span><a class=\"h-anchor\" href=\"#/21-guides-and-stakeholder-material/how-to-produce-one\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<ol>\n<li>Point your agent at a converted source, or at the completed phases of your work backlog.<\/li>\n<li>Ask it to propose which durable document to write, rather than telling it. A good agent will propose a user guide, say why it rejected the alternatives, and confirm it has written nothing yet and is waiting for approval.<\/li>\n<li>Approve, or redirect.<\/li>\n<li>It creates the audience directory if it does not exist, and writes the file.<\/li>\n<\/ol>\n<p>That third step is the review gate in miniature. A proposal costs one paragraph and the document costs a great deal more, so the cheap moment is where the decision belongs.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p><code>docs/assets/user/<\/code> and <code>docs/assets/maintainer/<\/code> do not exist until you create them. The router says to create them only when the first guide is written, so the first guide you write also creates its directory. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<h3 id=\"what-makes-a-good-one\"><span>What makes a good one<\/span><a class=\"h-anchor\" href=\"#/21-guides-and-stakeholder-material/what-makes-a-good-one\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The contract is specific about this, and the advice generalises.<\/p>\n<ul>\n<li><strong>Write the current state.<\/strong> A guide is not a phase log, a release note, or a summary of what was implemented. Use the plan, the PRD and the backlog as evidence, then write about what the reader needs to do next.<\/li>\n<li><strong>Decide coverage before you write.<\/strong> For each thing worth documenting, the verdict is one of <code>create<\/code>, <code>update-existing<\/code>, <code>link-only<\/code>, or <code>none<\/code>, and the audience (<code>user<\/code> or <code>maintainer<\/code>) is chosen separately. Updating a guide that already owns a topic is usually better than adding a new file next to it.<\/li>\n<li><strong>Start with the shortest path to a first success<\/strong>, then go deeper. The user template puts orientation and a first working outcome before advanced usage on purpose.<\/li>\n<li><strong>Give it prerequisites, expected results, and troubleshooting.<\/strong> Without those, a reader who cannot tell whether a step worked has nowhere to go.<\/li>\n<li><strong>Say what is not covered yet.<\/strong> The contract provides a <code>## Future Coverage<\/code> section for exactly this, with what it is blocked by and when to update it. Use it instead of inventing a placeholder document to remember the work.<\/li>\n<\/ul>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Phrase every instruction so it cannot be read as a command to perform. A plan item reading &quot;customer walkthrough&quot; was interpreted by a later agent as an instruction to walk a customer through something, when what was wanted was a written walkthrough for customers. Say &quot;write a walkthrough for X&quot;, not &quot;do the X walkthrough&quot;.<\/p>\n<\/div><\/aside>\n<p>The intended future version of this, described but never built, is to prove a requirement with a run that captures screenshots, then let those screenshots flow into the guide.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>Nothing connects run evidence to guide generation, and the run directory starts empty, so there are no captured screenshots to use. Illustrate guides by hand for now. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<h2 id=\"stakeholder-material\"><span>Stakeholder material<\/span><a class=\"h-anchor\" href=\"#/21-guides-and-stakeholder-material/stakeholder-material\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The people who fund the work will not open a work directory, so somebody has to explain the plan to them.<\/p>\n<p>BuildOS has no artifact type for this, and nothing else either: no template, contract, prompt starter or directory. The shipped documentation flow ends at guides. What follows is improvised work with an ordinary prompt.<\/p>\n<p>An ordinary prompt can produce a slide deck covering every phase of a plan, built from the same PRD and work backlog that produced the backlog export, with no skill written for the task.<\/p>\n<h3 id=\"how-to-do-it\"><span>How to do it<\/span><a class=\"h-anchor\" href=\"#/21-guides-and-stakeholder-material/how-to-do-it\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<ol>\n<li><strong>Say who the audience is.<\/strong> Naming the audience is what carries the run without any tooling. Say it in the prompt, in plain words.<\/li>\n<li><strong>Remove the ambiguity from your own prompt before you send it.<\/strong> Two ambiguities had to be taken out of the first draft. A reference to a review workflow would have been read as an instruction to put those references into the deck. And &quot;explain our backlog&quot; could mean explain how the backlog is structured, explain the product, or explain the plan. It meant the plan.<\/li>\n<li><strong>State the constraint.<\/strong> In this case: stay non-technical.<\/li>\n<li><strong>Name what it must land.<\/strong> What are the phases, and what capabilities does each phase address.<\/li>\n<li><strong>Name the output path.<\/strong> Skip this and the file lands in a cloud folder nobody chose.<\/li>\n<li><strong>Review it and fix the layout by hand.<\/strong> Expect it to come out cosmetically broken in places.<\/li>\n<li><strong>Keep the prompt.<\/strong> You will reuse it long after this particular file is obsolete.<\/li>\n<\/ol>\n<p>The person who ran it uses the structure the deck suggests rather than the deck itself. Treat the output as a draft outline that happens to be in slide form.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>The agent installed a software package on its own in order to write the file. That is your agent tool&#39;s behaviour, not BuildOS. Know your organisation&#39;s position on agents installing software before you start, rather than while you are explaining it afterwards.<\/p>\n<\/div><\/aside>\n<h2 id=\"reframing-your-own-material-is-a-review-technique\"><span>Reframing your own material is a review technique<\/span><a class=\"h-anchor\" href=\"#/21-guides-and-stakeholder-material/reframing-your-own-material-is-a-review-technique\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>This technique tends to be discovered by accident.<\/p>\n<p>Reviewing a generated deck for slide quality is how you notice that the plan puts security and access work before the personas exist. Weeks of reading the plan itself will not surface that, and the summary surfaces it immediately.<\/p>\n<p>The reason is straightforward. A plan written for the team is read by people who already carry the context, and a missing piece of context is invisible to them. Rewriting the same material for an audience that has none forces every assumption into the open. Ordering problems, missing prerequisites and unstated dependencies are the defects most likely to survive a normal read and fail a plain-language summary.<\/p>\n<p>So use it deliberately:<\/p>\n<ul>\n<li>After a plan or a PRD set is written, have your agent summarise it for an audience that has never seen it. Name that audience.<\/li>\n<li>Read the summary looking for what is wrong with the plan, not for what is wrong with the summary.<\/li>\n<li>Anything you find is a finding about the plan. Write it down where it belongs, either as a design input or as a change to the plan, before the conversation moves on.<\/li>\n<\/ul>\n<p>That last step is the one that gets skipped. A defect is spotted, discussed, agreed, and never written anywhere. Nothing in BuildOS captures an observation made out loud, so an observation that stays in the conversation is lost.<\/p>\n<h2 id=\"pointing-the-method-at-a-different-engagement\"><span>Pointing the method at a different engagement<\/span><a class=\"h-anchor\" href=\"#/21-guides-and-stakeholder-material/pointing-the-method-at-a-different-engagement\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>BuildOS is a folder you copy. Reusing the method on a different client, product, or question means copying the tree and editing <code>.os/config/instance.yaml<\/code> for the new subject. Nothing else is required and nothing automates it.<\/p>\n<p>One piece of advice matters most here. Establish the baseline first. Bring in whatever documentation already exists about the <em>existing<\/em> system, then add the new material, so the difference between them can be worked out rather than assumed. Expect it to take several passes.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Most of what a new engagement offers you cannot be read directly. Videos, slide decks, screen recordings and wikis are not supported source types, and a link is not a source because there is no network access. See <a href=\"#/06-sources-the-converter-cannot-read\">Sources the converter cannot read<\/a> before you promise anyone that their material can go in. Do not promise automatic de-duplication of what arrives, because the shipped system does not do it.<\/p>\n<\/div><\/aside>\n<h2 id=\"what-you-should-have-now\"><span>What you should have now<\/span><a class=\"h-anchor\" href=\"#/21-guides-and-stakeholder-material/what-you-should-have-now\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>The three files that govern guides, and where user and maintainer guides live.<\/li>\n<li>A repeatable way to ask for a guide: propose, approve, write.<\/li>\n<li>A working prompt shape for stakeholder material: audience, constraint, what it must land, and where to save it.<\/li>\n<li>One deliberate review technique: summarise your plan for outsiders, then read the summary for defects in the plan.<\/li>\n<li>A habit of writing down what that review finds, in a file, the same day.<\/li>\n<\/ul>\n<h2 id=\"next\"><span>Next<\/span><a class=\"h-anchor\" href=\"#/21-guides-and-stakeholder-material/next\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Go back to <a href=\"#/00-start-here\">Start here<\/a> for the full map, or pick whichever chapter your next task belongs to.<\/p>\n","toc":[{"id":"what-you-need-first","text":"What you need first","level":2},{"id":"guides-for-the-people-who-will-use-the-system","text":"Guides for the people who will use the system","level":2},{"id":"how-to-produce-one","text":"How to produce one","level":3},{"id":"what-makes-a-good-one","text":"What makes a good one","level":3},{"id":"stakeholder-material","text":"Stakeholder material","level":2},{"id":"how-to-do-it","text":"How to do it","level":3},{"id":"reframing-your-own-material-is-a-review-technique","text":"Reframing your own material is a review technique","level":2},{"id":"pointing-the-method-at-a-different-engagement","text":"Pointing the method at a different engagement","level":2},{"id":"what-you-should-have-now","text":"What you should have now","level":2},{"id":"next","text":"Next","level":2}]}}}</script>
<script>
(function () {

  var DATA = JSON.parse(document.getElementById('docs-data').textContent);
  var $ = function (s) { return document.querySelector(s); };
  var el = {
    article: $('#article'), nav: $('#nav'), toc: $('#toc'),
    input: $('#search-input'), results: $('#search-results'),
    themeBtn: $('#theme-btn'), menuBtn: $('#menu-btn'), scrim: $('#scrim'), main: $('#main')
  };
  var HEADER = 56;
  var current = null;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  /* ------------------------------------------------------------ theme */
  var THEME_KEY = 'buildos-guide-theme';
  var THEMES = ['system', 'light', 'dark'];
  var ICON = {
    system: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
    light: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
  };
  var LABEL = { system: 'Theme: follows your system', light: 'Theme: light', dark: 'Theme: dark' };
  function getTheme() {
    try { var t = localStorage.getItem(THEME_KEY); return THEMES.indexOf(t) >= 0 ? t : 'system'; } catch (e) { return 'system'; }
  }
  function applyTheme(t) {
    if (t === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    el.themeBtn.innerHTML = ICON[t];
    el.themeBtn.title = LABEL[t] + ' (click to change)';
    el.themeBtn.setAttribute('aria-label', LABEL[t] + ', click to change');
  }
  el.themeBtn.addEventListener('click', function () {
    var next = THEMES[(THEMES.indexOf(getTheme()) + 1) % THEMES.length];
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { }
    applyTheme(next);
  });
  applyTheme(getTheme());

  /* ------------------------------------------------------------ left nav */
  function buildNav() {
    var html = DATA.nav.map(function (g) {
      return '<div class="nav-group">' + (g.title ? '<h3>' + esc(g.title) + '</h3>' : '') +
        g.docs.map(function (s) {
          var d = DATA.docs[s];
          return '<a class="nav-link" href="#/' + s + '" data-slug="' + s + '">' +
            (d.num ? '<span class="num">' + d.num + '</span>' : '') + '<span>' + esc(d.title) + '</span></a>';
        }).join('') + '</div>';
    }).join('');
    html += '<div class="nav-foot">' + esc(DATA.title) + ' &middot; built ' + esc(DATA.built) + '</div>';
    el.nav.innerHTML = html;
  }
  function groupOf(slug) {
    for (var i = 0; i < DATA.nav.length; i++) if (DATA.nav[i].docs.indexOf(slug) >= 0) return DATA.nav[i].title;
    return null;
  }

  /* ------------------------------------------------------------ routing */
  function parseHash() {
    var h = '';
    try { h = decodeURIComponent(location.hash || ''); } catch (e) { h = location.hash || ''; }
    var m = h.match(/^#\/([^\/]+)(?:\/(.*))?$/);
    if (m && DATA.docs[m[1]]) return { slug: m[1], anchor: m[2] || null };
    return { slug: DATA.order[0], anchor: null };
  }
  function pager(d, dir) {
    return '<a class="pager ' + dir + '" href="#/' + d.slug + '"><small>' + (dir === 'prev' ? 'Previous' : 'Next') + '</small><span>' + esc(d.title) + '</span></a>';
  }
  function render(slug) {
    var d = DATA.docs[slug];
    var i = DATA.order.indexOf(slug);
    var prev = i > 0 ? DATA.docs[DATA.order[i - 1]] : null;
    var next = i < DATA.order.length - 1 ? DATA.docs[DATA.order[i + 1]] : null;
    var kicker = groupOf(slug);
    el.article.innerHTML = '<div class="doc">' +
      (kicker ? '<p class="doc-kicker">' + esc(kicker) + '</p>' : '') +
      '<h1>' + esc(d.title) + '</h1>' +
      (d.lede ? '<p class="lede">' + d.lede + '</p>' : '') +
      '<div class="doc-body">' + d.html + '</div>' +
      '<nav class="doc-footer" aria-label="Previous and next">' +
      (prev ? pager(prev, 'prev') : '<span></span>') + (next ? pager(next, 'next') : '') +
      '</nav></div>';
    document.title = d.title + ' · ' + DATA.title;

    var links = el.nav.querySelectorAll('.nav-link');
    for (var k = 0; k < links.length; k++) {
      if (links[k].getAttribute('data-slug') === slug) {
        links[k].setAttribute('aria-current', 'page');
        var r = links[k].getBoundingClientRect(), nr = el.nav.getBoundingClientRect();
        if (r.top < nr.top || r.bottom > nr.bottom) links[k].scrollIntoView({ block: 'center' });
      } else links[k].removeAttribute('aria-current');
    }
    buildToc(d);
    current = slug;
  }
  function buildToc(d) {
    if (!d.toc.length) { el.toc.innerHTML = ''; return; }
    el.toc.innerHTML = '<h4>On this page</h4><ul>' + d.toc.map(function (t) {
      return '<li><a class="l' + t.level + '" href="#/' + d.slug + '/' + t.id + '" data-id="' + t.id + '">' + esc(t.text) + '</a></li>';
    }).join('') + '</ul>';
  }
  function findAnchor(id) {
    var nodes = el.article.querySelectorAll('[id]');
    for (var i = 0; i < nodes.length; i++) if (nodes[i].id === id) return nodes[i];
    return null;
  }
  function route() {
    var r = parseHash();
    if (r.slug !== current) render(r.slug);
    closeNav();
    closeSearch();
    var t = r.anchor ? findAnchor(r.anchor) : null;
    if (t) {
      t.scrollIntoView({ block: 'start' });
      t.classList.remove('target'); void t.offsetWidth; t.classList.add('target');
    } else window.scrollTo(0, 0);
    updateSpy();
  }
  // Re-scroll when the same anchor link is clicked twice (hash does not change).
  el.article.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#/"]');
    if (!a) return;
    var want = a.getAttribute('href'), have = '';
    try { have = decodeURIComponent(location.hash); } catch (err) { have = location.hash; }
    if (want === have) { e.preventDefault(); route(); }
  });

  /* ------------------------------------------------------------ scroll spy */
  function updateSpy() {
    var links = el.toc.querySelectorAll('a[data-id]');
    if (!links.length) return;
    var heads = el.article.querySelectorAll('h2[id], h3[id]');
    var line = HEADER + 40, cur = null;
    for (var i = 0; i < heads.length; i++) {
      if (heads[i].getBoundingClientRect().top <= line) cur = heads[i].id; else break;
    }
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2 && heads.length) cur = heads[heads.length - 1].id;
    for (var k = 0; k < links.length; k++) {
      var on = links[k].getAttribute('data-id') === cur;
      links[k].classList.toggle('active', on);
      if (on) {
        var r = links[k].getBoundingClientRect(), tr = el.toc.getBoundingClientRect();
        if (r.top < tr.top || r.bottom > tr.bottom) links[k].scrollIntoView({ block: 'nearest' });
      }
    }
  }
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { updateSpy(); ticking = false; });
  }, { passive: true });

  /* ------------------------------------------------------------ copy buttons */
  el.article.addEventListener('click', function (e) {
    var btn = e.target.closest('.copy-btn');
    if (!btn) return;
    var code = btn.parentElement.querySelector('code');
    var text = code.textContent.replace(/\n$/, '');
    var done = function () {
      btn.textContent = 'Copied'; btn.classList.add('done');
      setTimeout(function () { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1500);
    };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (err) { }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  });

  /* ------------------------------------------------------------ mobile nav */
  function openNav() { document.body.classList.add('nav-open'); el.menuBtn.setAttribute('aria-expanded', 'true'); }
  function closeNav() { document.body.classList.remove('nav-open'); el.menuBtn.setAttribute('aria-expanded', 'false'); }
  el.menuBtn.addEventListener('click', function () { document.body.classList.contains('nav-open') ? closeNav() : openNav(); });
  el.scrim.addEventListener('click', closeNav);

  /* ------------------------------------------------------------ search */
  var index = null;
  function buildIndex() {
    index = [];
    var parser = new DOMParser();
    DATA.order.forEach(function (slug) {
      var d = DATA.docs[slug];
      var doc = parser.parseFromString('<div>' + (d.lede ? '<p>' + d.lede + '</p>' : '') + d.html + '</div>', 'text/html');
      var root = doc.body.firstChild;
      var sec = { slug: slug, docTitle: d.title, id: null, heading: d.title, text: '' };
      index.push(sec);
      for (var n = root.firstElementChild; n; n = n.nextElementSibling) {
        if (/^H[23]$/.test(n.tagName)) {
          var label = n.firstElementChild ? n.firstElementChild.textContent : n.textContent;
          sec = { slug: slug, docTitle: d.title, id: n.id, heading: label, text: '' };
          index.push(sec);
        } else sec.text += ' ' + n.textContent;
      }
    });
    index.forEach(function (s) {
      s.text = s.text.replace(/\s+/g, ' ').trim();
      s.lcText = s.text.toLowerCase();
      s.lcHead = s.heading.toLowerCase();
      s.lcDoc = s.docTitle.toLowerCase();
    });
  }
  function countIn(hay, needle) {
    var c = 0, i = 0;
    while ((i = hay.indexOf(needle, i)) >= 0) { c++; i += needle.length; if (c > 20) break; }
    return c;
  }
  function search(q) {
    var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return { items: [], terms: terms };
    var out = [];
    index.forEach(function (s) {
      var score = 0;
      for (var i = 0; i < terms.length; i++) {
        var t = terms[i];
        var inHead = s.lcHead.indexOf(t) >= 0, inDoc = s.lcDoc.indexOf(t) >= 0, n = countIn(s.lcText, t);
        if (!inHead && !inDoc && !n) return;
        if (inHead) score += 12;
        if (inDoc) score += 4;
        score += Math.min(n, 8);
      }
      if (s.id === null) score += 2;
      out.push({ s: s, score: score });
    });
    out.sort(function (a, b) { return b.score - a.score; });
    return { items: out.slice(0, 12), terms: terms };
  }
  function highlight(html, terms) {
    var re = new RegExp('(' + terms.map(function (t) { return escRe(esc(t)); }).join('|') + ')', 'ig');
    return html.replace(re, '<mark>$1</mark>');
  }
  function snippet(s, terms) {
    var pos = -1;
    for (var i = 0; i < terms.length; i++) {
      var p = s.lcText.indexOf(terms[i]);
      if (p >= 0 && (pos < 0 || p < pos)) pos = p;
    }
    if (pos < 0) return esc(s.text.slice(0, 150)) + (s.text.length > 150 ? '…' : '');
    var start = Math.max(0, pos - 60), end = Math.min(s.text.length, pos + 110);
    if (start > 0) { var sp = s.text.lastIndexOf(' ', start); if (sp > 0 && start - sp < 20) start = sp + 1; }
    var str = (start > 0 ? '…' : '') + s.text.slice(start, end) + (end < s.text.length ? '…' : '');
    return highlight(esc(str), terms);
  }
  function renderResults(res) {
    if (!res.items.length) {
      el.results.innerHTML = '<div class="sr-empty">No matches</div>';
    } else {
      el.results.innerHTML = res.items.map(function (r, i) {
        var s = r.s;
        return '<a class="sr' + (i === 0 ? ' active' : '') + '" role="option" href="#/' + s.slug + (s.id ? '/' + s.id : '') + '">' +
          (s.id ? '<div class="sr-doc">' + esc(s.docTitle) + '</div>' : '') +
          '<div class="sr-title">' + highlight(esc(s.heading), res.terms) + '</div>' +
          '<div class="sr-snip">' + snippet(s, res.terms) + '</div></a>';
      }).join('');
    }
    el.results.classList.add('open');
    el.input.setAttribute('aria-expanded', 'true');
  }
  function closeSearch() {
    el.results.classList.remove('open');
    el.input.setAttribute('aria-expanded', 'false');
  }
  var timer = null;
  function runSearch() {
    var q = el.input.value.trim();
    if (q.length < 2) { closeSearch(); return; }
    if (!index) buildIndex();
    renderResults(search(q));
  }
  el.input.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(runSearch, 70); });
  el.input.addEventListener('focus', runSearch);
  el.input.addEventListener('keydown', function (e) {
    var items = el.results.querySelectorAll('.sr');
    var active = el.results.querySelector('.sr.active');
    var idx = Array.prototype.indexOf.call(items, active);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!items.length) return;
      e.preventDefault();
      idx = e.key === 'ArrowDown' ? Math.min(items.length - 1, idx + 1) : Math.max(0, idx - 1);
      for (var i = 0; i < items.length; i++) items[i].classList.toggle('active', i === idx);
      items[idx].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      if (active) { e.preventDefault(); location.hash = active.getAttribute('href'); route(); el.input.blur(); }
    } else if (e.key === 'Escape') {
      closeSearch(); el.input.blur();
    }
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#search')) closeSearch();
  });
  document.addEventListener('keydown', function (e) {
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
    if ((e.key === '/' && !typing) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) {
      e.preventDefault(); el.input.focus(); el.input.select();
    }
  });

  /* ------------------------------------------------------------ start */
  buildNav();
  route();
  window.addEventListener('hashchange', route);
})();

</script>
</body>
</html>

/* ---------------------------------------------------------------- tokens */
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --bg-sidebar: #f6f6f8;
  --bg-code: #f3f3f6;
  --bg-hover: #ebebef;
  --border: #e3e3e8;
  --text: #1a1a1f;
  --text-2: #4f4f58;
  --text-3: #86868f;
  --accent: #3b5bdb;
  --accent-soft: #e8edfb;
  --link: #2f4fc9;
  --mark: #fde68a;
  --note: #2563eb;   --note-bg: #eef4ff;
  --tip: #15803d;    --tip-bg: #ecfdf3;
  --warning: #c2650c; --warning-bg: #fff6e8;

  --shadow: 0 10px 30px rgba(20, 20, 40, .14);

  --sidebar-w: 292px;
  --toc-w: 236px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
:root[data-theme="light"] { color-scheme: light; }

@media (prefers-color-scheme: dark) {

    --bg-code: #1d1d23;
    --bg-hover: #25252c;
    --border: #2b2b33;
    --text: #e8e8ec;
    --text-2: #a8a8b3;
    --text-3: #72727d;
    --accent: #8ea0f6;
    --accent-soft: #232a45;
    --link: #98a9f8;
    --mark: #7a5a00;
    --note: #7fa7ff;   --note-bg: #161d30;

  --border: #2b2b33;
  --text: #e8e8ec;
  --text-2: #a8a8b3;
  --text-3: #72727d;
  --accent: #8ea0f6;
  --accent-soft: #232a45;

}

/* ---------------------------------------------------------------- base */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--header-h) + 20px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.65 var(--font);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.skip { position: absolute; left: -9999px; top: 8px; padding: 8px 12px; background: var(--accent); color: #fff; border-radius: 6px; z-index: 100; }
.skip:focus { left: 8px; }
svg { flex: none; }

/* ---------------------------------------------------------------- header */
.topbar {
  position: sticky; top: 0; z-index: 50;
  height: var(--header-h);
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-weight: 650; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 8px;
  border: 1px solid transparent; background: transparent; color: var(--text-2); cursor: pointer;
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }
.icon-btn:focus-visible, .search input:focus-visible, .nav-link:focus-visible, .pager:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.menu-btn { display: none; }

.search { position: relative; margin-left: auto; width: min(440px, 42vw); }
.search-icon { position: absolute; left: 11px; top: 10px; color: var(--text-3); pointer-events: none; }
.search input {
  width: 100%; height: 36px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg-sidebar); color: var(--text);
  padding: 0 40px 0 34px; font: inherit; font-size: 14px;
  appearance: none; -webkit-appearance: none;
}
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.search input:focus { outline: none; border-color: var(--accent); background: var(--bg); }
.kbd { position: absolute; right: 9px; top: 9px; height: 18px; padding: 0 6px; border: 1px solid var(--border); border-radius: 4px; font: 11px/16px var(--mono); color: var(--text-3); background: var(--bg); }
.search-results {
  display: none; position: absolute; top: 44px; left: 0; right: 0;
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow); max-height: min(70vh, 540px); overflow-y: auto; padding: 4px;
}
.search-results.open { display: block; }
.sr { display: block; padding: 9px 12px; border-radius: 7px; text-decoration: none; color: inherit; }
.sr.active, .sr:hover { background: var(--bg-hover); }
.sr-doc { font-size: 11.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
.sr-title { font-weight: 600; font-size: 14px; line-height: 1.35; }
.sr-snip { font-size: 13px; color: var(--text-2); line-height: 1.45; margin-top: 2px; }
.sr-empty { padding: 14px; color: var(--text-3); font-size: 14px; text-align: center; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

/* ---------------------------------------------------------------- layout */
.layout { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--toc-w); max-width: 1520px; margin: 0 auto; }

.sidebar {
  position: sticky; top: var(--header-h);
  height: calc(100vh - var(--header-h)); overflow-y: auto;
  padding: 20px 12px 32px;
  border-right: 1px solid var(--border);
  background: var(--bg-sidebar);
  display: flex; flex-direction: column;
}
.nav-group { margin-top: 18px; }
.nav-group:first-child { margin-top: 0; }
.nav-group h3 { margin: 0 0 4px 12px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
.nav-link {
  display: flex; gap: 10px; align-items: baseline;
  padding: 6px 12px; border-radius: 6px;
  color: var(--text-2); text-decoration: none; font-size: 14px; line-height: 1.35;
}
.nav-link .num { font: 11px var(--mono); color: var(--text-3); min-width: 18px; }
.nav-link:hover { background: var(--bg-hover); color: var(--text); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-link[aria-current="page"] .num { color: var(--accent); }
.nav-foot { margin-top: auto; padding: 24px 12px 0; font-size: 11.5px; color: var(--text-3); }

.content { min-width: 0; padding: 40px 48px 80px; }
.doc { max-width: 780px; margin: 0 auto; }
.doc-kicker { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.doc h1 { margin: 0 0 20px; font-size: 2.15rem; line-height: 1.2; letter-spacing: -.02em; font-weight: 700; }
.lede { margin: 0 0 30px; font-size: 1.15rem; line-height: 1.55; color: var(--text-2); }
.lede + .doc-body > h2:first-child { margin-top: 0; }

/* ---------------------------------------------------------------- prose */
.doc-body > :first-child { margin-top: 0; }
.doc-body h2 { font-size: 1.5rem; line-height: 1.3; margin: 2.3em 0 .7em; letter-spacing: -.015em; font-weight: 650; }
.doc-body h3 { font-size: 1.17rem; line-height: 1.35; margin: 1.9em 0 .6em; font-weight: 650; }
.doc-body h4 { font-size: 1rem; margin: 1.6em 0 .5em; }
.h-anchor { margin-left: 8px; color: var(--text-3); text-decoration: none; font-weight: 400; opacity: 0; transition: opacity .12s; }
h2:hover .h-anchor, h3:hover .h-anchor, h4:hover .h-anchor, .h-anchor:focus { opacity: 1; }
.doc-body p { margin: 0 0 1.05em; }
.doc-body a { color: var(--link); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2.5px; text-decoration-color: color-mix(in srgb, var(--link) 45%, transparent); }
.doc-body a:hover { text-decoration-color: var(--link); }
.doc-body strong { font-weight: 650; }
.doc-body ul, .doc-body ol { margin: 0 0 1.05em; padding-left: 1.6em; }
.doc-body li { margin: .3em 0; }
.doc-body li > p { margin: .35em 0; }
.doc-body li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.6em; }
.doc-body input[type="checkbox"] { margin: 0 .55em 0 0; vertical-align: -.1em; accent-color: var(--accent); }
.doc-body hr { border: 0; border-top: 1px solid var(--border); margin: 2.2em 0; }
.doc-body img { max-width: 100%; height: auto; }

code { font-family: var(--mono); font-size: .875em; background: var(--bg-code); border: 1px solid var(--border); border-radius: 5px; padding: .08em .35em; }
h1 code, h2 code, h3 code { font-size: .85em; }
pre { margin: 0; padding: 14px 16px; overflow-x: auto; background: var(--bg-code); border: 1px solid var(--border); border-radius: 8px; font: 13.5px/1.55 var(--mono); tab-size: 2; }
pre code { background: none; border: 0; padding: 0; font-size: inherit; }
.code-block { position: relative; margin: 0 0 1.2em; }
.code-block[data-lang]::before { content: attr(data-lang); position: absolute; top: 9px; right: 68px; font: 11px var(--mono); color: var(--text-3); text-transform: uppercase; }
.copy-btn {
  position: absolute; top: 8px; right: 8px;
  padding: 3px 9px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text-2);
  font: 600 11px var(--font); cursor: pointer; opacity: 0; transition: opacity .12s;
}
.code-block:hover .copy-btn, .copy-btn:focus-visible, .copy-btn.done { opacity: 1; }
.copy-btn.done { color: var(--tip); border-color: var(--tip); }

.table-wrap { overflow-x: auto; margin: 0 0 1.2em; border: 1px solid var(--border); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.5; }

th { background: var(--bg-sidebar); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td > p:last-child { margin-bottom: 0; }

blockquote { margin: 0 0 1.2em; padding: 2px 18px; border-left: 3px solid var(--border); color: var(--text-2); }
blockquote > :last-child { margin-bottom: 0; }

.callout { margin: 0 0 1.25em; padding: 12px 16px 12px 15px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); border-left: 4px solid var(--c); background: var(--c-bg); }
.callout-note      { --c: var(--note);     --c-bg: var(--note-bg); }
.callout-tip       { --c: var(--tip);      --c-bg: var(--tip-bg); }
.callout-important { --c: var(--notbuilt); --c-bg: var(--notbuilt-bg); }
.callout-warning, .callout-caution { --c: var(--warning); --c-bg: var(--warning-bg); }
.callout-notbuilt  { --c: var(--notbuilt); --c-bg: var(--notbuilt-bg); }
.callout-title { display: flex; align-items: center; gap: 8px; margin: 0 0 5px !important; font-size: 13.5px; font-weight: 700; color: var(--c); letter-spacing: .01em; }
.callout-body > :last-child { margin-bottom: 0; }
.callout-body code { background: color-mix(in srgb, var(--bg) 60%, transparent); }

.target { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }

.doc-footer { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 60px; padding-top: 24px; border-top: 1px solid var(--border); }
.pager { display: block; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; text-decoration: none; color: inherit; }
.pager:hover { border-color: var(--accent); background: var(--accent-soft); }
.pager.next { text-align: right; grid-column: 2; }
.pager small { display: block; font-size: 12px; color: var(--text-3); margin-bottom: 2px; }
.pager span { font-weight: 600; color: var(--accent); font-size: 15px; }

/* ---------------------------------------------------------------- on this page */
.toc { position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h)); overflow-y: auto; padding: 44px 20px 40px 8px; font-size: 13px; }
.toc h4 { margin: 0 0 8px 12px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
.toc ul { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--border); }
.toc a { display: block; padding: 4px 12px; margin-left: -1px; border-left: 2px solid transparent; color: var(--text-2); text-decoration: none; line-height: 1.4; }
.toc a.l3 { padding-left: 26px; font-size: 12.5px; }
.toc a:hover { color: var(--text); }
.toc a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

.scrim { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 40; }

/* ---------------------------------------------------------------- responsive */
@media (max-width: 1120px) {
  .layout { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
  .toc { display: none; }
}
@media (max-width: 840px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; left: 0; top: var(--header-h); z-index: 45;
    width: min(330px, 86vw);
    transform: translateX(-100%); transition: transform .2s ease;
    border-right: 1px solid var(--border);
  }
  body.nav-open .sidebar { transform: none; box-shadow: var(--shadow); }
  body.nav-open .scrim { display: block; }
  .menu-btn { display: inline-flex; }
  .content { padding: 28px 20px 60px; }
  .search { width: auto; flex: 1; }
  .kbd { display: none; }
  .doc h1 { font-size: 1.75rem; }
  .doc-footer { grid-template-columns: 1fr; }
  .pager.next { grid-column: auto; }
}
@media (max-width: 480px) {
  .brand span { display: none; }
}

@media print {
  .topbar, .sidebar, .toc, .scrim, .copy-btn, .doc-footer, .h-anchor { display: none !important; }
  .layout { display: block; }
  .content { padding: 0; }
  pre { white-space: pre-wrap; }
}

</style>

<script id="docs-data" type="application/json">{"title":"BuildOS Guide","built":"2026-11-27","order":["00-start-here","01-what-buildos-is","02-how-it-works","03-before-you-start","04-install-and-configure-your-instance","05-bring-in-source-material","06-sources-the-converter-cannot-read","07-pull-knowledge-out-of-it","08-write-and-run-a-playbook","09-qualify-what-you-found","10-compare-two-systems","11-keep-the-record-clean","12-designs-plans-and-prds","13-build-the-work-backlog","14-export-to-a-work-tracker","15-working-with-your-agent","16-harness-independence-and-trust","17-when-things-go-wrong","18-what-is-not-built-yet","19-a-worked-walkthrough","20-glossary","21-guides-and-stakeholder-material"],"nav":[{"title":null,"docs":["00-start-here"]},{"title":"Understand it","docs":["01-what-buildos-is","02-how-it-works"]},{"title":"Set it up","docs":["03-before-you-start","04-install-and-configure-your-instance"]},{"title":"Get material in","docs":["05-bring-in-source-material","06-sources-the-converter-cannot-read","07-pull-knowledge-out-of-it"]},{"title":"Find out what is true","docs":["08-write-and-run-a-playbook","09-qualify-what-you-found","10-compare-two-systems","11-keep-the-record-clean"]},{"title":"Turn it into work","docs":["12-designs-plans-and-prds","13-build-the-work-backlog","14-export-to-a-work-tracker"]},{"title":"Working with an agent","docs":["15-working-with-your-agent","16-harness-independence-and-trust"]},{"title":"Reference","docs":["17-when-things-go-wrong","18-what-is-not-built-yet","19-a-worked-walkthrough","20-glossary","21-guides-and-stakeholder-material"]}],"docs":{"00-start-here":{"slug":"00-start-here","num":"00","title":"Start here","lede":"","html":"<h2 id=\"what-buildos-is\"><span>What BuildOS is<\/span><a class=\"h-anchor\" href=\"#/00-start-here/what-buildos-is\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>BuildOS is a folder of plain text files that you copy into your own project and keep in source control. It gives a team a fixed place to put things and a fixed set of rules for what each thing has to look like. The rules sit in files next to the work, so an AI agent can read them and follow the project&#39;s conventions without being told them. You use it to take a system you have been handed, work out what it actually does, compare that against what it needs to do, and end up with a work backlog an engineering team can build from.<\/p>\n<h2 id=\"who-this-documentation-is-for\"><span>Who this documentation is for<\/span><a class=\"h-anchor\" href=\"#/00-start-here/who-this-documentation-is-for\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>This documentation is for you if you have been handed a system to evaluate, a pile of documents about it, and a deadline to produce a backlog.<\/p>\n<p>It assumes you know nothing about BuildOS. It does not assume you are an engineer. Where an article needs you to have read another one first, it says so in its opening lines.<\/p>\n<h2 id=\"how-to-read-it\"><span>How to read it<\/span><a class=\"h-anchor\" href=\"#/00-start-here/how-to-read-it\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Readers arrive here for different reasons, so there is more than one sensible route.<\/p>\n<p>To decide whether BuildOS is worth your time, give it twenty minutes. Read <a href=\"#/01-what-buildos-is\">What BuildOS is<\/a>, then skim <a href=\"#/19-a-worked-walkthrough\">A worked walkthrough<\/a>. That article works the whole chain through from start to finish, rough steps included.<\/p>\n<p>If you are about to start using it, read <a href=\"#/01-what-buildos-is\">What BuildOS is<\/a>, <a href=\"#/02-how-it-works\">How it works<\/a>, <a href=\"#/03-before-you-start\">Before you start<\/a> and <a href=\"#/04-install-and-configure-your-instance\">Install and configure your instance<\/a> in order, then do the setup before reading further. The last two exist because setup is where most of the delay happens, and almost none of it is BuildOS itself.<\/p>\n<p>Read <a href=\"#/15-working-with-your-agent\">Working with your agent<\/a> before you ask an agent to generate anything. It carries the procedure for checking what an agent produced. <a href=\"#/07-pull-knowledge-out-of-it\">Pull knowledge out of it<\/a>, <a href=\"#/10-compare-two-systems\">Compare two systems<\/a> and <a href=\"#/12-designs-plans-and-prds\">Designs, plans and PRDs<\/a> all send you there, and reading the set in order puts it eight articles after your first extraction, which is too late to be useful.<\/p>\n<p>If you are already set up and have a job in front of you, find that job in the table below.<\/p>\n<p>When something breaks, go to <a href=\"#/17-when-things-go-wrong\">When things go wrong<\/a>. It is arranged for lookup. Find the symptom you are seeing, and it points at the likely causes.<\/p>\n<p>When a word makes no sense, check <a href=\"#/20-glossary\">Glossary<\/a>. It covers all 73 BuildOS terms in plain language, alphabetically. Where a term is badly named, the entry warns you.<\/p>\n<h2 id=\"the-articles\"><span>The articles<\/span><a class=\"h-anchor\" href=\"#/00-start-here/the-articles\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<h3 id=\"understand-it\"><span>Understand it<\/span><a class=\"h-anchor\" href=\"#/00-start-here/understand-it\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Article<\/th>\n<th>What it gives you<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>01<\/td>\n<td><a href=\"#/01-what-buildos-is\">What BuildOS is<\/a><\/td>\n<td>What it is, what it produces, and whether it is worth the setup.<\/td>\n<\/tr>\n<tr>\n<td>02<\/td>\n<td><a href=\"#/02-how-it-works\">How it works<\/a><\/td>\n<td>The three flows, the pieces that move through them, and the two gates.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"set-it-up\"><span>Set it up<\/span><a class=\"h-anchor\" href=\"#/00-start-here/set-it-up\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Article<\/th>\n<th>What it gives you<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>03<\/td>\n<td><a href=\"#/03-before-you-start\">Before you start<\/a><\/td>\n<td>What has to be in place on your machine and in your organization first. None of it is BuildOS itself, and any missing piece will block you.<\/td>\n<\/tr>\n<tr>\n<td>04<\/td>\n<td><a href=\"#/04-install-and-configure-your-instance\">Install and configure your instance<\/a><\/td>\n<td>Setting up BuildOS in your project with one command, plus one configuration file that describes your own project.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"get-material-in\"><span>Get material in<\/span><a class=\"h-anchor\" href=\"#/00-start-here/get-material-in\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Article<\/th>\n<th>What it gives you<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>05<\/td>\n<td><a href=\"#/05-bring-in-source-material\">Bring in source material<\/a><\/td>\n<td>Turn a document you already have into clean text, with a record of where it came from.<\/td>\n<\/tr>\n<tr>\n<td>06<\/td>\n<td><a href=\"#/06-sources-the-converter-cannot-read\">Sources the converter cannot read<\/a><\/td>\n<td>What to do about email, slide decks, recordings, and diagram-heavy PDFs.<\/td>\n<\/tr>\n<tr>\n<td>07<\/td>\n<td><a href=\"#/07-pull-knowledge-out-of-it\">Pull knowledge out of it<\/a><\/td>\n<td>Turn that text into typed records: requirements, capabilities, personas, test cases.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"find-out-what-is-true\"><span>Find out what is true<\/span><a class=\"h-anchor\" href=\"#/00-start-here/find-out-what-is-true\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Article<\/th>\n<th>What it gives you<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>08<\/td>\n<td><a href=\"#/08-write-and-run-a-playbook\">Write and run a playbook<\/a><\/td>\n<td>Write the instruction that sends a person or an agent to go look, then run it and keep the evidence.<\/td>\n<\/tr>\n<tr>\n<td>09<\/td>\n<td><a href=\"#/09-qualify-what-you-found\">Qualify what you found<\/a><\/td>\n<td>Turn something you noticed into something you can prove, and keep proving.<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td><a href=\"#/10-compare-two-systems\">Compare two systems<\/a><\/td>\n<td>Line up what one system does against what another needs, and audit the result.<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td><a href=\"#/11-keep-the-record-clean\">Keep the record clean<\/a><\/td>\n<td>Why your records fill with duplicates, and what to do about them instead of deleting.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"turn-it-into-work\"><span>Turn it into work<\/span><a class=\"h-anchor\" href=\"#/00-start-here/turn-it-into-work\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Article<\/th>\n<th>What it gives you<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>12<\/td>\n<td><a href=\"#/12-designs-plans-and-prds\">Designs, plans and PRDs<\/a><\/td>\n<td>Turning a list of gaps into documents an engineering team can build from.<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td><a href=\"#/13-build-the-work-backlog\">Build the work backlog<\/a><\/td>\n<td>Requirements and a plan become work items someone can pick up.<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td><a href=\"#/14-export-to-a-work-tracker\">Export to a work tracker<\/a><\/td>\n<td>Turning the backlog into a file your project-tracking tool can import, with the hierarchy preserved.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"working-with-an-agent\"><span>Working with an agent<\/span><a class=\"h-anchor\" href=\"#/00-start-here/working-with-an-agent\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Article<\/th>\n<th>What it gives you<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>15<\/td>\n<td><a href=\"#/15-working-with-your-agent\">Working with your agent<\/a><\/td>\n<td>What to hand an agent, how to steer it, and how to check the result.<\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td><a href=\"#/16-harness-independence-and-trust\">Harness independence and trust<\/a><\/td>\n<td>Why BuildOS does not depend on a particular agent product, and who you should share the project with.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"reference\"><span>Reference<\/span><a class=\"h-anchor\" href=\"#/00-start-here/reference\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Article<\/th>\n<th>What it gives you<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>17<\/td>\n<td><a href=\"#/17-when-things-go-wrong\">When things go wrong<\/a><\/td>\n<td>A lookup article, organized by symptom.<\/td>\n<\/tr>\n<tr>\n<td>18<\/td>\n<td><a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a><\/td>\n<td>The complete register of what the shipped system does not do today.<\/td>\n<\/tr>\n<tr>\n<td>19<\/td>\n<td><a href=\"#/19-a-worked-walkthrough\">A worked walkthrough<\/a><\/td>\n<td>The whole chain, from first source document to imported backlog.<\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td><a href=\"#/20-glossary\">Glossary<\/a><\/td>\n<td>Every BuildOS term, alphabetical, in plain language.<\/td>\n<\/tr>\n<tr>\n<td>21<\/td>\n<td><a href=\"#/21-guides-and-stakeholder-material\">Guides and stakeholder material<\/a><\/td>\n<td>Optional. What to produce for the people who will use or fund the work.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2 id=\"before-you-begin\"><span>Before you begin<\/span><a class=\"h-anchor\" href=\"#/00-start-here/before-you-begin\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> collects everything that&#39;s still a work-in-progress in one place. Read it early if you are deciding whether to adopt BuildOS.<\/p>\n<p>However, the system works and the chain does complete. <a href=\"#/19-a-worked-walkthrough\">A worked walkthrough<\/a> follows it end to end, from the first source document through to work items imported into a tracker with a three-level hierarchy intact.<\/p>\n<p><strong>No part of this documentation requires a particular AI product.<\/strong> BuildOS keeps its instructions in plain files, so any capable agent can follow them. Throughout the documentation you will read &quot;your agent&quot; or &quot;the agent harness&quot; instead of a product name. Two people on the same project can use different tools without changing anything in the project, and <a href=\"#/16-harness-independence-and-trust\">Harness independence and trust<\/a> explains why that works and where the limits are.<\/p>\n<h2 id=\"what-you-should-have-now\"><span>What you should have now<\/span><a class=\"h-anchor\" href=\"#/00-start-here/what-you-should-have-now\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>A sense of what BuildOS is and what it produces<\/li>\n<li>A reading path that fits why you are here<\/li>\n<li>Two expectations set: some steps are not automated yet, and no particular AI tool is required<\/li>\n<\/ul>\n<h2 id=\"next\"><span>Next<\/span><a class=\"h-anchor\" href=\"#/00-start-here/next\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><a href=\"#/01-what-buildos-is\">What BuildOS is<\/a><\/p>\n","toc":[{"id":"what-buildos-is","text":"What BuildOS is","level":2},{"id":"who-this-documentation-is-for","text":"Who this documentation is for","level":2},{"id":"how-to-read-it","text":"How to read it","level":2},{"id":"the-articles","text":"The articles","level":2},{"id":"understand-it","text":"Understand it","level":3},{"id":"set-it-up","text":"Set it up","level":3},{"id":"get-material-in","text":"Get material in","level":3},{"id":"find-out-what-is-true","text":"Find out what is true","level":3},{"id":"turn-it-into-work","text":"Turn it into work","level":3},{"id":"working-with-an-agent","text":"Working with an agent","level":3},{"id":"reference","text":"Reference","level":3},{"id":"before-you-begin","text":"Before you begin","level":2},{"id":"what-you-should-have-now","text":"What you should have now","level":2},{"id":"next","text":"Next","level":2}]},"01-what-buildos-is":{"slug":"01-what-buildos-is","num":"01","title":"What BuildOS is","lede":"","html":"<h2 id=\"before-you-start\"><span>Before you start<\/span><a class=\"h-anchor\" href=\"#/01-what-buildos-is/before-you-start\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>This is the first real article of the set, so it assumes you have never heard of BuildOS. You do not need the repository, an agent, or any software installed to read it. If you want the mechanism rather than the idea, go to <a href=\"#/02-how-it-works\">How it works<\/a>.<\/p>\n<h2 id=\"what-buildos-is-for\"><span>What BuildOS is for<\/span><a class=\"h-anchor\" href=\"#/01-what-buildos-is/what-buildos-is-for\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Someone hands you a system and asks you to work out what should be built.<\/p>\n<p>The system might be a product your company has bought, or a platform you are being asked to replace. It might be an application nobody has documented in five years. With it comes a pile of documents. There is usually a requirements workbook, an architecture deck, a vendor feature list, some meeting recaps, and a spreadsheet somebody exported last quarter. Parts of it are current and parts of it are wrong, and nobody can tell you which parts are which.<\/p>\n<p>What you owe at the end is a work backlog, meaning a list of items an engineering team can pick up and build.<\/p>\n<p>The distance between those two points is mostly reading, and the reading repeats one shape. First you work out what the system claims it can do, then what it must do. You check which claims are true. Everything you checked gets recorded, so nobody checks it twice. What survives becomes requirements, and the requirements become work.<\/p>\n<p>Most teams do this in documents, spreadsheets and chat threads. The information is real, but it has no fixed shape. Only a person can read it back, and only a person who was in the room. Six weeks later, answering a simple question means another week of reading, because the answer lives in somebody&#39;s memory. BuildOS gives that work a fixed shape instead.<\/p>\n<h2 id=\"what-buildos-is\"><span>What BuildOS is<\/span><a class=\"h-anchor\" href=\"#/01-what-buildos-is/what-buildos-is\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>BuildOS is a folder of plain text files you copy into your own project. It gives a team a fixed place to put things and a fixed set of rules for what each thing must look like, so that a person or an AI agent can work in it without being told the conventions.<\/p>\n<p>The folder that BuildOS puts in your project holds 158 files, and 95 of them are Markdown. The rest are 20 YAML files, 17 JSON files, 10 line-oriented JSON data files, four CSV examples, eight short command wrappers (one form for macOS and Linux and one for Windows), a small wrapper helper and its message file, and two housekeeping files. From BuildOS <code>0.2.0<\/code>, no skill carries a helper script of its own: the skills run <code>buildos<\/code> commands. It lives in git alongside your project. One npm package, <code>build-os<\/code>, carries it and the <code>buildos<\/code> command.<\/p>\n<p>This documentation uses three words constantly:<\/p>\n<ul>\n<li>An <strong>LLM<\/strong> is a language model: a stateless thing that turns text into text.<\/li>\n<li>An <strong>agent harness<\/strong> is the software wrapped around a model that gives it tools, a working directory and a loop.<\/li>\n<li>An <strong>agent<\/strong> is the two together, working on your files.<\/li>\n<\/ul>\n<p>This documentation never assumes you use a particular harness. BuildOS reads its instructions from files on disk, and any capable harness can follow them. Agents from different products can be pointed at the same BuildOS repository without anything in it changing to accommodate them.<\/p>\n<p>Every folder in BuildOS carries a short instruction file saying what belongs there, what does not, and where to go next. Harnesses load those files on their own. That is why you can point an agent at the folder, give it a plain instruction, and watch it do the right thing without being told the layout. <a href=\"#/02-how-it-works\">How it works<\/a> explains that mechanism.<\/p>\n<p>Two descriptions help: a system in a folder that steers an agent, and an analyst who has already been told where to put things.<\/p>\n<h2 id=\"what-buildos-is-not\"><span>What BuildOS is not<\/span><a class=\"h-anchor\" href=\"#/01-what-buildos-is/what-buildos-is-not\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><strong>BuildOS is not a model.<\/strong> This is the most common mistake. The folder contains no model and no intelligence of its own. It is text that instructs whatever model you bring. Without an agent, it is a filing system with rules.<\/p>\n<p><strong>There is no service behind it.<\/strong> You do not sign into anything, and there is nothing to connect to. The tools that ship with it make no network calls, and conversion for most file types runs entirely on your machine.<\/p>\n<aside class=\"callout callout-note\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 8h.01M11 12h1v4h1\"/><\/svg><span>Note<\/span><\/p><div class=\"callout-body\">\n<p>While BuildOS can convert several common file types including PDF&#39;s, it cannot convert PDF files that contain complex tables or are scanned images wrapped in a PDF format.  Therefore, when converting PDF&#39;s, BuildOS first attempts a basic conversion with its built-in tools and, if it fails, a second attempt is made by handing the file to your agent to read and convert.<\/p>\n<\/div><\/aside>\n<p><strong>It is not a test framework.<\/strong> BuildOS does produce repeatable tests, and browser automation is one of the things a playbook can ask an agent to do. But testing is one part of one of three flows, and most of the system has nothing to do with it.<\/p>\n<p><strong>Nothing in it runs as an application.<\/strong> No file in the folder starts a process, opens a port, or needs a running daemon. There is no database and no user interface. The data layer is deliberately plain text, so you can script against it, import it elsewhere, or read it with your own tools.<\/p>\n<h2 id=\"what-a-full-pass-produces\"><span>What a full pass produces<\/span><a class=\"h-anchor\" href=\"#/01-what-buildos-is/what-a-full-pass-produces\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Each step contributes one thing, in this order:<\/p>\n<ol>\n<li>Source documents become clean text copies that record where they came from.<\/li>\n<li>Structured records come out of those copies: the capabilities the system claims, the requirements the business has, and the people who use it.<\/li>\n<li>The two systems get compared, producing a gap list with a verdict on each row.<\/li>\n<li>Those verdicts become a set of numbered requirement documents.<\/li>\n<li>A review of that set produces a remediation list, which you work through.<\/li>\n<li>A <strong>plan bundle<\/strong>, meaning a directory of planning documents settling what gets built, in what order, and by whom, is written from the remediated set.<\/li>\n<li>The plan becomes a work backlog with phases, stages and tasks.<\/li>\n<li>The backlog is exported and imported into your work tracker as a correct three-level tree.<\/li>\n<\/ol>\n<p>A pile of unstructured documents becomes tracked work items, with every step of the chain between them written down.<\/p>\n<p>Only step 1 is fully tooled. The rest is a person and an agent following written rules. Step 3, the comparison, has no artifact type or command of its own, so a person and an agent produce it by reading the records BuildOS holds. <a href=\"#/10-compare-two-systems\">Compare two systems<\/a> covers that gap where you will hit it.<\/p>\n<h2 id=\"what-you-get-out-of-it\"><span>What you get out of it<\/span><a class=\"h-anchor\" href=\"#/01-what-buildos-is/what-you-get-out-of-it\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>At the end of a full pass you have, in git:<\/p>\n<ul>\n<li>Clean text copies of your source documents, each stamped with its origin, a content hash, what converted it, and when.<\/li>\n<li>Structured records for the things you learned, such as capabilities, requirements, personas and test cases, each with a stable ID.<\/li>\n<li>A written record of every check you ran against the live system, with its evidence attached.<\/li>\n<li>The observations that survived a repeatable test, kept separate from the ones that did not.<\/li>\n<li>Designs, plans, requirement documents and a work backlog, in fixed shapes.<\/li>\n<\/ul>\n<p>What pays for the setup is being able to ask an ordinary question six weeks later, such as <em>do we have anything about this topic in our requirements?<\/em>, and get the answer out of the files instead of out of somebody&#39;s memory.<\/p>\n<h2 id=\"who-it-is-for-and-when-it-is-worth-it\"><span>Who it is for, and when it is worth it<\/span><a class=\"h-anchor\" href=\"#/01-what-buildos-is/who-it-is-for-and-when-it-is-worth-it\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>BuildOS suits a consultant, product manager, business analyst or engineer who has been handed a system and a document pile and owes somebody a backlog. It assumes you are comfortable with git and a text editor, and that you have an agent harness you are allowed to use on the material.<\/p>\n<p>It is worth the setup when the work will outlive the working session, when more than one person needs the same answers, or when you will have to defend a conclusion later.<\/p>\n<p>It is not worth it for a one-off question you can answer in an afternoon. Before you convert your first document you have to get an agent onto your machine, install Node.js, set up BuildOS in your project, and configure the instance. <a href=\"#/03-before-you-start\">Before you start<\/a> and <a href=\"#/04-install-and-configure-your-instance\">Install and configure your instance<\/a> cover all of that.<\/p>\n<h2 id=\"how-finished-this-is\"><span>How finished this is<\/span><a class=\"h-anchor\" href=\"#/01-what-buildos-is/how-finished-this-is\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Of the 158 files that ship, most are rules and instruction, and the tooling is thinner. In a freshly set-up project, two hops run end to end with a command: configuring the instance and converting a source document. One <code>buildos<\/code> command does the deterministic work: converting, indexing, recording runs and findings, promoting a finding to a design, entity checks, and validation.<\/p>\n<p>Most of what this documentation describes is you and your agent following written rules rather than running a program. The rules are what keep the output consistent, and an agent picks them up from the files rather than from your prompt. Each article says which steps are tooled and which are not.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>Several steps the method depends on have no tool behind them today: writing extracted records, comparing two systems, moving a playbook through its review gate, and everything from the design onward. Each is flagged where you meet it. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list in one place.<\/p>\n<\/div><\/aside>\n<p>Read that article before you commit a team to this, though not before the rest of this set.<\/p>\n<h2 id=\"what-you-should-have-now\"><span>What you should have now<\/span><a class=\"h-anchor\" href=\"#/01-what-buildos-is/what-you-should-have-now\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>A one-sentence answer to &quot;what is BuildOS&quot; that you could give a colleague.<\/li>\n<li>Four things it is not: a model, a service, a test framework, an application.<\/li>\n<li>A concrete idea of the output: converted sources, structured records, findings, and a work backlog you can import into a tracker.<\/li>\n<li>A clear sense of how much is tooled today, and where to find the full gap list.<\/li>\n<\/ul>\n<h2 id=\"next\"><span>Next<\/span><a class=\"h-anchor\" href=\"#/01-what-buildos-is/next\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><a href=\"#/02-how-it-works\">How it works<\/a>, covering the three flows, the artifact types, the two gates, and the mechanism that makes an agent orient itself.<\/p>\n","toc":[{"id":"before-you-start","text":"Before you start","level":2},{"id":"what-buildos-is-for","text":"What BuildOS is for","level":2},{"id":"what-buildos-is","text":"What BuildOS is","level":2},{"id":"what-buildos-is-not","text":"What BuildOS is not","level":2},{"id":"what-a-full-pass-produces","text":"What a full pass produces","level":2},{"id":"what-you-get-out-of-it","text":"What you get out of it","level":2},{"id":"who-it-is-for-and-when-it-is-worth-it","text":"Who it is for, and when it is worth it","level":2},{"id":"how-finished-this-is","text":"How finished this is","level":2},{"id":"what-you-should-have-now","text":"What you should have now","level":2},{"id":"next","text":"Next","level":2}]},"02-how-it-works":{"slug":"02-how-it-works","num":"02","title":"How it works","lede":"The three flows, the pieces that move through them, the two gates, and the mechanism that lets an agent orient itself.","html":"<h2 id=\"before-you-start\"><span>Before you start<\/span><a class=\"h-anchor\" href=\"#/02-how-it-works/before-you-start\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Read <a href=\"#/01-what-buildos-is\">What BuildOS is<\/a> first. This article assumes it. You do not need the repository open, and nothing here asks you to run anything. This article names things. Every procedure lives in a later article, and is linked from here.<\/p>\n<h2 id=\"the-shape-of-the-whole-thing\"><span>The shape of the whole thing<\/span><a class=\"h-anchor\" href=\"#/02-how-it-works/the-shape-of-the-whole-thing\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>BuildOS chains three flows. Each one takes something loose and turns it into something with a fixed shape, and the output of one becomes the input of the next.<\/p>\n<p>Every name in the diagram is defined further down this article. If a word means nothing to you yet, read past it and come back.<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>FLOW 1 - INTAKE AND KNOWLEDGE\n\n    your documents  (Word, Excel, CSV, HTML, a folder of HTML, PDF)\n          |\n          |  convert\n          v\n    converted twin ........... assets/&lt;source-slug&gt;/\n          |\n          |  extract\n          v\n    entity records ........... .os/data/*.jsonl\n          |                    requirements, capabilities,\n          |                    personas, test cases\n          |\n          +--- feeds --------------------------+\n                                               |\nFLOW 2 - DISCOVERY AND EXECUTION               |\n                                               |\n    playbook ................. playbooks/&lt;category&gt;/\n          |                                    |\n          |  GATE 1: review-to-activate  (draft -&gt; reviewed -&gt; active)\n          v                                    |\n    run record ............... workspace/runs/RUN-NNN/\n          |                    run.md, evidence/, raw-findings.md\n          |\n          |  GATE 2: qualification  (a repeatable test that passes)\n          v\n    qualified finding ........ workspace/findings/FIND-NNN/\n          |\n          +--- feeds ---+\n                        |\nFLOW 3 - PLANNING AND ENGINEERING\n                        |\n    design ............... docs/designs/\n          |\n          v\n    plan ................. docs/plans/\n          |\n          v\n    PRD .................. docs/prd/\n          |\n          v\n    work backlog ......... docs/work/\n          |\n          v\n    (export to your work tracker - outside BuildOS)\n<\/code><\/pre><\/div>\n<p>Two path conventions in that diagram. A <strong>slug<\/strong> is a lowercase, hyphenated name with no spaces, so <code>&lt;source-slug&gt;<\/code> is the folder named after one source document. A <code>.jsonl<\/code> file is line-oriented JSON: one complete JSON record per line, one line per thing.<\/p>\n<p>Nothing physically moves between the flows. What carries over is knowledge. Flow 1 tells you what the system is supposed to do, flow 2 checks whether it does, and flow 3 turns what you proved into work.<\/p>\n<h2 id=\"instruction-lives-next-to-the-files-it-governs\"><span>Instruction lives next to the files it governs<\/span><a class=\"h-anchor\" href=\"#/02-how-it-works/instruction-lives-next-to-the-files-it-governs\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Every directory in BuildOS carries a short file named <code>AGENTS.md<\/code>. It says what belongs in that directory, what does not, and where to go next. Agent harnesses load these files automatically, before any other instruction. There is no central configuration mapping agents to instructions. Each instruction sits in the directory it applies to, which keeps it from drifting away from the files it describes.<\/p>\n<p>These files work as a router for an agent. The root file points into the machinery, and that points into each working area.<\/p>\n<p>Alongside each <code>AGENTS.md<\/code> sits a <code>CLAUDE.md<\/code>. In the BuildOS-owned part of the tree it holds nothing but a pointer back to <code>AGENTS.md<\/code>, so that a harness which only reads <code>CLAUDE.md<\/code> still arrives at the real instruction. There are 30 of each, one pair per directory, with no directory holding one and not the other. <a href=\"#/16-harness-independence-and-trust\">Harness independence and trust<\/a> covers why.<\/p>\n<p>Point an agent at the folder and give it an ordinary instruction with no conventions in it. It reads the routers first, then reports the correct next step. Agents also pick up rules nobody put in the prompt, such as keeping new playbooks in <code>draft<\/code>, refusing to write data rows without approval, or proposing a boundary rule the system already enforces.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>The filename says <code>AGENTS.md<\/code>, so humans assume it is not for them and click around guessing instead. These files are written for you too. Read the router in a folder before you touch anything in it.<\/p>\n<\/div><\/aside>\n<p>The routers repeat each other on purpose. Instructions stay short at the top of the tree and get more specific as you go deeper, so an agent loads only what the current directory needs. If you see the same rule twice, the design is working as intended.<\/p>\n<h2 id=\"contracts\"><span>Contracts<\/span><a class=\"h-anchor\" href=\"#/02-how-it-works/contracts\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A <strong>contract<\/strong> is the rule book for one kind of file. It says what fields that file must have and what states it can be in. Contracts win over templates and over routers.<\/p>\n<p>Ten contracts ship, in <code>.os/contracts/<\/code>. They govern the configuration file, playbooks, run records, findings, converted sources, intake translation, extractions, entity records, record consolidation, and persona identity.<\/p>\n<p>You do not have to read them. They are dense, and skipping them is a fair choice. The part that matters is that contracts settle arguments. If a template and a contract disagree, the contract decides. If your agent proposes something the contract forbids, the contract decides again. A human can tell an agent to break a rule, but an agent may not decide to break one on its own.<\/p>\n<p>Contracts are also what keeps the output consistent. An agent pointed at the local playbook contract will keep playbooks in <code>draft<\/code>, rebuild the index, and refuse to write data rows or qualify findings without the approval and evidence the contract requires.<\/p>\n<p>Templates live separately, in <code>.os/templates/<\/code>. There are eight: seven playbook shapes and one starting configuration file. Copy from them. A template is a convenience, and a contract still overrides it.<\/p>\n<h2 id=\"flow-1-intake-and-knowledge\"><span>Flow 1 · intake and knowledge<\/span><a class=\"h-anchor\" href=\"#/02-how-it-works/flow-1-intake-and-knowledge\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Flow 1 works out what the system claims it can do, and what the business needs from it.<\/p>\n<p><strong>Intake<\/strong> is taking a file from outside and bringing it into BuildOS as clean text that remembers where it came from. The result is a <strong>converted twin<\/strong>: a clean text copy of an original file, carrying a header that records the source path, a content hash, what converted it, and when. Twins land in <code>assets/&lt;source-slug&gt;/<\/code>.<\/p>\n<p>The conversion is deterministic and local. No model reads the file, and nothing goes over the network. Excel becomes one CSV per worksheet, Word becomes Markdown, HTML becomes Markdown, PDF becomes plain text. The content hash means that if somebody edits the original and re-submits it under the same name, the system can tell it is the same document, changed.<\/p>\n<p>An <strong>extraction<\/strong> is a record of one reading pass. It names the piece of the converted twin that was read and the entity records that came out of it. An <strong>entity record<\/strong> is one line of JSON in <code>.os/data/*.jsonl<\/code> describing one thing, with a stable ID. Four record types carry most of the weight:<\/p>\n<ul>\n<li>A <strong>capability<\/strong> is descriptive. It is something the system <em>can<\/em> do, according to whatever you read. Flow 2 is where you find out whether that is true.<\/li>\n<li>A <strong>requirement<\/strong> is normative. It is something the system <em>must<\/em> do.<\/li>\n<li>A <strong>persona<\/strong> describes a kind of user or stakeholder, with their goals and needs.<\/li>\n<li>A <strong>test case<\/strong> is a repeatable check: what it verifies, its setup, its steps, and the expected outcome.<\/li>\n<\/ul>\n<p><a href=\"#/05-bring-in-source-material\">Bring in source material<\/a> and <a href=\"#/07-pull-knowledge-out-of-it\">Pull knowledge out of it<\/a> cover both halves.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>No extraction writer and no entity-record writer exist. The file <code>.os/data/extractions.jsonl<\/code> is empty, and nothing shipped appends to it. Records are hand-authored, or written by your agent against the contract. Conversion works. Everything after it in this flow is you and your agent. See <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a>.<\/p>\n<\/div><\/aside>\n<h2 id=\"flow-2-discovery-and-execution\"><span>Flow 2 · discovery and execution<\/span><a class=\"h-anchor\" href=\"#/02-how-it-works/flow-2-discovery-and-execution\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Flow 2 checks whether a claim is actually true, and whether you can prove it again.<\/p>\n<p>A <strong>playbook<\/strong> is a short written procedure telling a person or an AI agent how to do one job. It lives as a Markdown file with a fixed header block. A playbook is a document. It describes the job, and a separate tool or a person carries the job out. New readers often expect it to be a script instead.<\/p>\n<p>Playbooks live in <code>playbooks/<\/code>, in one of four directories: <code>administrative<\/code>, <code>build<\/code>, <code>discovery<\/code>, <code>testing<\/code>. The directory is the category. There are two kinds:<\/p>\n<ul>\n<li>A <strong>procedure playbook<\/strong> is one you run. It produces evidence.<\/li>\n<li>A <strong>guardrail<\/strong> is a playbook that states a rule instead of describing a job. It never runs and produces nothing. It says what you must and must not do. Nothing enforces a guardrail except the fact that agents read it, and a capable agent will cite the rule back to you before acting against it.<\/li>\n<\/ul>\n<p>A <strong>run<\/strong> is one recorded attempt at doing something. It is a folder, <code>RUN-NNN/<\/code>, in <code>workspace/runs/<\/code>, holding a summary (<code>run.md<\/code>), the raw <strong>evidence<\/strong> captured during the run, and <code>raw-findings.md<\/code>. Once a run is closed you do not change it.<\/p>\n<p>A <strong>raw finding<\/strong> is something you noticed during a run that has not been proven yet. It has no ID. It lives as an <strong>anchor<\/strong> inside that run&#39;s <code>raw-findings.md<\/code>. An anchor is a link to one heading in that file, and it is how everything downstream points back at the observation.<\/p>\n<p>A <strong>qualified finding<\/strong> is a raw finding that passed a repeatable test. It gets a <code>FIND-NNN<\/code> ID and its own folder in <code>workspace/findings/<\/code>, holding the finding and the test that proved it. <strong>Polarity<\/strong> says whether it proves something <em>is<\/em> there (<code>positive<\/code>) or reliably <em>is not<\/em> there (<code>negative<\/code>). A negative finding still counts as a successful run.<\/p>\n<p><a href=\"#/08-write-and-run-a-playbook\">Write and run a playbook<\/a> and <a href=\"#/09-qualify-what-you-found\">Qualify what you found<\/a> cover this flow.<\/p>\n<p>The software that actually drives a browser or controls a screen sits outside BuildOS by design. BuildOS keeps the record of the run: what it did, what it produced and what it proved. The driving itself happens elsewhere.<\/p>\n<h2 id=\"flow-3-planning-and-engineering\"><span>Flow 3 · planning and engineering<\/span><a class=\"h-anchor\" href=\"#/02-how-it-works/flow-3-planning-and-engineering\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Flow 3 settles what gets built.<\/p>\n<ul>\n<li>A <strong>design<\/strong> is a dated document recording one decision: what was chosen, what else was considered, and what follows from it.<\/li>\n<li>A <strong>plan<\/strong> is a directory of documents written before work starts. It settles the shape of the output, the order, and who does what.<\/li>\n<li>A <strong>PRD<\/strong> is a numbered set of documents describing the product. There is one active set at a time, and it evolves by adding numbered change documents rather than being rewritten.<\/li>\n<li>A <strong>work backlog<\/strong> is a directory of phase files. Each phase has stages, and each stage has checkbox tasks and plain-bullet acceptance criteria.<\/li>\n<\/ul>\n<p>If you use a work tracker, the mapping is close. The backlog directory becomes an epic, each phase file becomes a feature, each stage becomes a backlog item, and tasks stay tasks.<\/p>\n<p>These four live under <code>docs/<\/code>, which is owned by a separate documentation system called <strong>make-docs<\/strong>, installed into the repository as a plug-in. BuildOS must never edit those trees directly, so you work through their own routers. That ownership split is why the repository has two directories named <code>assets<\/code>.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p><code>assets/<\/code> holds converted twins and belongs to BuildOS. <code>docs/assets/<\/code> belongs to Make Docs: it holds guides for each audience (such as <code>docs/assets/user/<\/code>) and shared project material, and it does not exist until the first such file is written. Make Docs keeps its own rule files (contracts, templates, prompts, and references) under <code>.make-docs/system/<\/code>. The two <code>assets<\/code> folders are different things with the same name. An active guardrail exists because people write to the wrong one.<\/p>\n<\/div><\/aside>\n<p><a href=\"#/12-designs-plans-and-prds\">Designs, plans and PRDs<\/a> and <a href=\"#/13-build-the-work-backlog\">Build the work backlog<\/a> cover this flow.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>One hop in this flow is tooled, the one that turns a qualified finding into a design (<code>buildos design promote finding<\/code>), and it needs a project that Make Docs set up. Plans, PRDs and backlogs are written by you and your agent against contracts and templates. There is no command for them.<\/p>\n<\/div><\/aside>\n<h2 id=\"the-core-artifact-types\"><span>The core artifact types<\/span><a class=\"h-anchor\" href=\"#/02-how-it-works/the-core-artifact-types\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Artifact<\/th>\n<th>What it is for<\/th>\n<th>Where it lives<\/th>\n<th>Governed by<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Configuration<\/td>\n<td>Names your real systems, environments and owners<\/td>\n<td><code>.os/config/instance.yaml<\/code><\/td>\n<td><code>config-contract.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>Converted twin<\/td>\n<td>A clean, provenance-stamped text copy of a source<\/td>\n<td><code>assets/&lt;source-slug&gt;/<\/code><\/td>\n<td><code>converted-source-contract.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>Extraction<\/td>\n<td>A record of what was read and what came out of it<\/td>\n<td><code>.os/data/extractions.jsonl<\/code><\/td>\n<td><code>extraction-contract.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>Entity record<\/td>\n<td>One thing, one line of JSON, one stable ID<\/td>\n<td><code>.os/data/*.jsonl<\/code><\/td>\n<td><code>entity-records-contract.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>Playbook<\/td>\n<td>How to do one job, or a rule you must follow<\/td>\n<td><code>playbooks/&lt;category&gt;/<\/code><\/td>\n<td><code>playbook-contract.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>Run record<\/td>\n<td>One recorded attempt, with its evidence<\/td>\n<td><code>workspace/runs/RUN-NNN/<\/code><\/td>\n<td><code>run-record-contract.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>Qualified finding<\/td>\n<td>Something proved, with the test that proved it<\/td>\n<td><code>workspace/findings/FIND-NNN/<\/code><\/td>\n<td><code>finding-contract.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>Design, plan, PRD, backlog<\/td>\n<td>The deliverables<\/td>\n<td><code>docs/<\/code><\/td>\n<td>make-docs contracts<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The contracts are in <code>.os/contracts/<\/code>. You can work without reading them, as long as you remember that they decide arguments.<\/p>\n<h2 id=\"the-two-gates\"><span>The two gates<\/span><a class=\"h-anchor\" href=\"#/02-how-it-works/the-two-gates\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Two places in the chain stop and wait for a person.<\/p>\n<p><strong>Gate 1 · review-to-activate, for playbooks.<\/strong> A playbook goes <code>draft → reviewed → active<\/code>. Only <code>active<\/code> playbooks run or apply. The gate exists because a procedure playbook sends an agent to go poke at a real system. Somebody should read it before that happens. A person moves it by editing the status field in the playbook&#39;s header and then rebuilding the playbook index.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>There is no tooling for this gate and no approval is recorded anywhere. Activation is a hand edit plus an index rebuild. Your agent is technically able to do both. Keep this review with a person. <a href=\"#/08-write-and-run-a-playbook\">Write and run a playbook<\/a> has the procedure.<\/p>\n<\/div><\/aside>\n<p><strong>Gate 2 · qualification, for findings.<\/strong> A raw finding becomes a qualified finding only by passing a deterministic, repeatable test. Neither intuition nor a single observation is enough. Whoever writes and runs the confirmation test moves it through.<\/p>\n<p>The test earns its keep by proving the gap now and proving the fix later, with nobody writing the test a second time. Speed is not the reason for it. Some real and important observations cannot pass this gate, because a mismatch between two models is not a behaviour a script can check. <a href=\"#/09-qualify-what-you-found\">Qualify what you found<\/a> says what happens to those.<\/p>\n<p>Promotion from a qualified finding to a design is never automatic, and a person always decides it.<\/p>\n<h2 id=\"lifecycle-states\"><span>Lifecycle states<\/span><a class=\"h-anchor\" href=\"#/02-how-it-works/lifecycle-states\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Most things in BuildOS carry a status. The one that will affect you first is the playbook lifecycle: <code>draft<\/code> → <code>reviewed<\/code> → <code>active<\/code> → <code>archived<\/code>.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>A <code>draft<\/code> playbook refuses to run. That is the gate working correctly, and it is the most likely thing to stop your first run. On a fresh copy of the repository the only discovery playbook ships as <code>draft<\/code>, so the discovery flow cannot start until you activate it or write your own. Fix: set the status to <code>active<\/code>, then rebuild the index. If you skip the rebuild you get the same failure again, with nothing to explain it.<\/p>\n<\/div><\/aside>\n<p>Going straight from <code>draft<\/code> to <code>active<\/code> without ever using <code>reviewed<\/code> is common. The contract allows all three. Use <code>reviewed<\/code> if more than one person is involved.<\/p>\n<p>Other artifact types use their own vocabulary.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>States<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Entity record<\/td>\n<td><code>draft<\/code>, <code>active<\/code>, <code>superseded<\/code>, <code>archived<\/code><\/td>\n<\/tr>\n<tr>\n<td>Run<\/td>\n<td><code>running<\/code>, <code>closed<\/code>, <code>aborted<\/code><\/td>\n<\/tr>\n<tr>\n<td>Converted twin<\/td>\n<td><code>candidate<\/code>, <code>converted<\/code>, <code>superseded<\/code>, <code>rejected<\/code><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Each contract lists its own. Do not assume a status word means the same thing across two types.<\/p>\n<h2 id=\"what-you-touch-and-what-you-leave-alone\"><span>What you touch and what you leave alone<\/span><a class=\"h-anchor\" href=\"#/02-how-it-works/what-you-touch-and-what-you-leave-alone\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Area<\/th>\n<th>What it is<\/th>\n<th>You<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>.os/config/<\/code><\/td>\n<td>Your instance configuration<\/td>\n<td><strong>Write<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>playbooks/<\/code><\/td>\n<td>Your playbooks and guardrails<\/td>\n<td><strong>Write<\/strong><\/td>\n<\/tr>\n<tr>\n<td><code>assets/<\/code><\/td>\n<td>Converted twins<\/td>\n<td><strong>Write<\/strong>, through the intake tool<\/td>\n<\/tr>\n<tr>\n<td><code>workspace/<\/code><\/td>\n<td>Runs, findings, local datasets<\/td>\n<td><strong>Write.<\/strong> Runs and findings through the tools, datasets by hand<\/td>\n<\/tr>\n<tr>\n<td><code>.os/data/<\/code><\/td>\n<td>Entity records<\/td>\n<td><strong>Write<\/strong>, but see below<\/td>\n<\/tr>\n<tr>\n<td><code>docs/<\/code><\/td>\n<td>Your designs, plans, PRDs, backlogs<\/td>\n<td><strong>Write<\/strong>, through its own routers<\/td>\n<\/tr>\n<tr>\n<td><code>.os/contracts/<\/code><\/td>\n<td>The rule books<\/td>\n<td><strong>Read.<\/strong> Do not modify unless asked<\/td>\n<\/tr>\n<tr>\n<td><code>.os/templates/<\/code><\/td>\n<td>Starting shapes<\/td>\n<td><strong>Read<\/strong>, and copy from<\/td>\n<\/tr>\n<tr>\n<td><code>.os/scripts/<\/code><\/td>\n<td>The command wrappers: <code>.os/scripts/buildos<\/code> runs every BuildOS command<\/td>\n<td><strong>Read<\/strong>, and run from<\/td>\n<\/tr>\n<tr>\n<td><code>.os/indexes/<\/code><\/td>\n<td>Generated lookup files<\/td>\n<td><strong>Leave alone.<\/strong> Rebuild, never hand-edit<\/td>\n<\/tr>\n<tr>\n<td><code>.make-docs/<\/code><\/td>\n<td>Documentation plug-in state<\/td>\n<td><strong>Leave alone<\/strong><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>The data layer is the one you never edit by hand.<\/strong> The entity records under <code>.os/data/<\/code> are stored as plain text on purpose. You can script against them, import them into another system, or map them somewhere else, and nothing is hidden from you in a format you cannot open. That openness is a commitment to you rather than an engineering convenience. Line-oriented JSON still makes poor reading for a person.<\/p>\n<p>If you ever need to review the data layer, ask your agent to retrieve what you are looking for and display it as a table.<\/p>\n<h2 id=\"what-you-should-have-now\"><span>What you should have now<\/span><a class=\"h-anchor\" href=\"#/02-how-it-works/what-you-should-have-now\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>The three flows by name, and what moves between them: intake and knowledge, discovery and execution, planning and engineering.<\/li>\n<li>The artifact types, what each is for, and which contract governs it.<\/li>\n<li>The routing idea: instruction lives in a file next to the files it governs, and your agent reads it before it does anything.<\/li>\n<li>The two gates, review-to-activate for playbooks and qualification for findings, and who moves things through each.<\/li>\n<li>The lifecycle states <code>draft<\/code>, <code>reviewed<\/code>, <code>active<\/code>, and the fact that a <code>draft<\/code> playbook will refuse to run.<\/li>\n<li>A map of what you write, what you read, and what you leave alone.<\/li>\n<\/ul>\n<h2 id=\"next\"><span>Next<\/span><a class=\"h-anchor\" href=\"#/02-how-it-works/next\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><a href=\"#/03-before-you-start\">Before you start<\/a>, covering Node.js, getting an agent onto your machine, and the git moves you will need.<\/p>\n","toc":[{"id":"before-you-start","text":"Before you start","level":2},{"id":"the-shape-of-the-whole-thing","text":"The shape of the whole thing","level":2},{"id":"instruction-lives-next-to-the-files-it-governs","text":"Instruction lives next to the files it governs","level":2},{"id":"contracts","text":"Contracts","level":2},{"id":"flow-1-intake-and-knowledge","text":"Flow 1 · intake and knowledge","level":2},{"id":"flow-2-discovery-and-execution","text":"Flow 2 · discovery and execution","level":2},{"id":"flow-3-planning-and-engineering","text":"Flow 3 · planning and engineering","level":2},{"id":"the-core-artifact-types","text":"The core artifact types","level":2},{"id":"the-two-gates","text":"The two gates","level":2},{"id":"lifecycle-states","text":"Lifecycle states","level":2},{"id":"what-you-touch-and-what-you-leave-alone","text":"What you touch and what you leave alone","level":2},{"id":"what-you-should-have-now","text":"What you should have now","level":2},{"id":"next","text":"Next","level":2}]},"03-before-you-start":{"slug":"03-before-you-start","num":"03","title":"Before you start","lede":"What has to be in place on your machine and in your organization before BuildOS is worth opening.","html":"<h2 id=\"what-you-need-first\"><span>What you need first<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/what-you-need-first\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>This is the first page in the set with work to do on it, and it needs nothing from you in advance. It assumes no BuildOS knowledge and uses no BuildOS vocabulary except where it defines the word first. Reading <a href=\"#/01-what-buildos-is\">What BuildOS is<\/a> and <a href=\"#/02-how-it-works\">How it works<\/a> helps, but this article does not require them.<\/p>\n<hr>\n<h2 id=\"five-prerequisites\"><span>Five prerequisites<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/five-prerequisites\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Before BuildOS does anything for you, five things have to be true.<\/p>\n<ol>\n<li>You have <strong>git<\/strong> installed and working on your machine.<\/li>\n<li>You have an <strong>agent tool<\/strong> you can point at a folder on your own machine.<\/li>\n<li>You have <strong>Node.js 24 or newer<\/strong> on the machine where the agent runs. It is the one program BuildOS needs.<\/li>\n<li>Your machine can reach the <strong>npm registry<\/strong>, the public store that Node.js fetches packages from, or someone can hand you the BuildOS package file. <a href=\"#/04-install-and-configure-your-instance\">Install and configure your instance<\/a> covers the second case.<\/li>\n<li>You know enough version control to save your work and to throw a change away.<\/li>\n<\/ol>\n<p>All five sit outside the product. BuildOS installs no agent, leaves your source control to you, and never installs Node.js for you. It assumes all five are already handled.<\/p>\n<p>Budget a day for this article. A slow start here is normal, because none of it is BuildOS work yet.<\/p>\n<hr>\n<h2 id=\"terms-from-outside-buildos\"><span>Terms from outside BuildOS<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/terms-from-outside-buildos\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Six words in this documentation are not BuildOS words at all. They belong to the terminal and to git, and no other document in the set explains them, so they are defined here.<\/p>\n<p>One convention first. In any command in this documentation, text in angle brackets is a placeholder. Replace <code>&lt;repository-url&gt;<\/code>, brackets included, with the real value. Everything outside the brackets you type exactly as written.<\/p>\n<h3 id=\"exit-code\"><span>Exit code<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/exit-code\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Every command you run finishes with a number. Zero means it succeeded. Anything else means it failed, and the number says which kind of failure.<\/p>\n<p>The number is not printed on screen. To see the one from the command you just ran, type:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>echo $?\n<\/code><\/pre><\/div>\n<p>In Windows Command Prompt, type <code>echo %ERRORLEVEL%<\/code> instead. Run it immediately after the command you care about, because the next command you run replaces it. Five documents in this set use an exit code as the pass-or-fail test, so the habit is worth building now.<\/p>\n<h3 id=\"environment-variable\"><span>Environment variable<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/environment-variable\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A named value that your shell hands to every command it starts. You set one for the current terminal window like this:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>export NPM_CONFIG_CACHE=&lt;full-path-to-a-folder&gt;\n<\/code><\/pre><\/div>\n<p>Close the window and it is gone. To keep it, put the same line in your shell&#39;s startup file: <code>~/.zshrc<\/code> on macOS, <code>~/.bashrc<\/code> on most Linux systems.<\/p>\n<h3 id=\"path\"><span><code>PATH<\/code><\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/path\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>One particular environment variable: the list of folders your shell searches when you type a program&#39;s name. A program that is &quot;on your <code>PATH<\/code>&quot; is one you can run by name alone, from any folder. To add a folder to it:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>export PATH=&quot;$PATH:&lt;full-path-to-the-folder&gt;&quot;\n<\/code><\/pre><\/div>\n<p>The same rule applies. That lasts for one terminal window unless you put it in your startup file.<\/p>\n<h3 id=\"shell\"><span>Shell<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/shell\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The program that reads the commands you type and runs them. macOS and Linux give you <code>zsh<\/code> or <code>bash<\/code> in the Terminal app. Windows gives you Command Prompt and PowerShell.<\/p>\n<p>BuildOS commands run in any of them. The project wrapper has one form for macOS and Linux, <code>.os/scripts/buildos<\/code>, and one for Windows, <code>.os\\scripts\\buildos.cmd<\/code>. On Windows, BuildOS writes the commands it shows you for Command Prompt; it shows no PowerShell form. Your agent usually picks the right shell for you.<\/p>\n<h3 id=\"runtime\"><span>Runtime<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/runtime\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The program that has to be installed before code written in a given language will run. JavaScript needs Node.js, and Python code needs Python. Two runtimes appear in this documentation.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Runtime<\/th>\n<th>What needs it<\/th>\n<th>Where you meet it<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Node.js 24 or newer<\/td>\n<td>every BuildOS command, and every skill that runs one<\/td>\n<td><a href=\"#/04-install-and-configure-your-instance\">Install and configure your instance<\/a><\/td>\n<\/tr>\n<tr>\n<td>Python 3<\/td>\n<td>one skill&#39;s own tool: the capability matrix, until its BuildOS command, planned for <code>0.2.0<\/code>. With BuildOS <code>0.1.0<\/code>, also bulk extraction and fit-gap analysis; from <code>0.2.0<\/code>, those two run BuildOS commands. No BuildOS command needs it<\/td>\n<td><a href=\"#/04-install-and-configure-your-instance\">Install and configure your instance<\/a>, section Skills<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Install Node.js 24 or newer now, from <code>https://nodejs.org<\/code> or your company&#39;s software portal. To check it, run <code>node --version<\/code>: it must print <code>v24<\/code> or a higher number. Install Python 3 only if you plan to use one of those skills. A missing runtime discovered halfway through a task is an expensive interruption.<\/p>\n<h3 id=\"branch\"><span>Branch<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/branch\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A named line of work inside a git repository. Every clone starts on one. Changes you commit land on whichever branch you are on, and someone on a different branch will not see them.<\/p>\n<p>If files you expect are missing, check which branch you are on first:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>git branch --show-current\n<\/code><\/pre><\/div>\n<hr>\n<h2 id=\"get-an-agent-tool\"><span>Get an agent tool<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/get-an-agent-tool\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<aside class=\"callout callout-tip\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.4 1 2.5h6c0-1.1.4-1.9 1-2.5A6 6 0 0 0 12 3z\"/><\/svg><span>Tip<\/span><\/p><div class=\"callout-body\">\n<ul>\n<li>An <strong>LLM<\/strong> is the model. It turns text into text and remembers nothing between turns.  <\/li>\n<li>A <strong>harness<\/strong> or <strong>agent harness<\/strong> is the software wrapped around the model. It gives the model a set of tools, a working directory, and a loop so it can take more than one step.  <\/li>\n<li>An <strong>agent<\/strong> is the two together, working on your tasks and files.<\/li>\n<li><strong>BuildOS<\/strong> is a system of instructions that agents can follow.<\/li>\n<\/ul>\n<\/div><\/aside>\n<h3 id=\"the-capabilities-your-agent-needs\"><span>The capabilities your agent needs<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/the-capabilities-your-agent-needs\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Your agent must be able to do two things inside a folder on your machine:<\/p>\n<ul>\n<li><strong>Read and write files in that folder.<\/strong> It has to open, edit, create, and delete files on disk. A tool that only summarizes files you paste in, or answers questions about a document library, does not qualify.<\/li>\n<li><strong>Run commands in that folder.<\/strong> BuildOS ships command-line tools, and the agent has to be able to call them.<\/li>\n<\/ul>\n<p>BuildOS reads its instructions from plain text files, so any tool that meets those two conditions can operate it. This documentation never names an agent harness and never assumes one. See <a href=\"#/16-harness-independence-and-trust\">Harness independence and trust<\/a> for the limits.<\/p>\n<h3 id=\"driving-a-browser-is-a-separate-capability\"><span>Driving a browser is a separate capability<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/driving-a-browser-is-a-separate-capability\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Later in this documentation you will write a <strong>playbook<\/strong>: a short Markdown file that tells a person or an agent how to do one job. Some playbooks ask the agent to go and poke at the system you a

your-instance\">Install and configure your instance<\/a>, <a href=\"#/08-write-and-run-a-playbook\">Write and run a playbook<\/a><\/td>\n<\/tr>\n<tr>\n<td>Playbook categories are fixed at four by the contract. The folder is the category.<\/td>\n<td>Organising playbooks your own way.<\/td>\n<td>Use the four that exist.<\/td>\n<td><a href=\"#/08-write-and-run-a-playbook\">Write and run a playbook<\/a><\/td>\n<\/tr>\n<tr>\n<td><code>workspace/<\/code> and <code>assets/<\/code> ship empty. No example run, finding or converted copy exists anywhere.<\/td>\n<td>Learning by example.<\/td>\n<td>Read the contracts and the fixtures in <code>.os/contracts/examples/<\/code>.<\/td>\n<td><a href=\"#/07-pull-knowledge-out-of-it\">Pull knowledge out of it<\/a>, <a href=\"#/19-a-worked-walkthrough\">A worked walkthrough<\/a><\/td>\n<\/tr>\n<tr>\n<td><code>docs/<\/code> exists only with Make Docs and holds no finished example.<\/td>\n<td>Seeing a finished design, plan or requirement set.<\/td>\n<td>Use the Make Docs templates.<\/td>\n<td><a href=\"#/12-designs-plans-and-prds\">Designs, plans and PRDs<\/a><\/td>\n<\/tr>\n<tr>\n<td>No interface over the data. Nothing starts a process or opens a port.<\/td>\n<td>Reading the record files.<\/td>\n<td>Ask your agent for a table. Never open a <code>.jsonl<\/code> file directly.<\/td>\n<td><a href=\"#/07-pull-knowledge-out-of-it\">Pull knowledge out of it<\/a><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2 id=\"where-the-shipped-documentation-disagrees-with-the-shipped-system\"><span>Where the shipped documentation disagrees with the shipped system<\/span><a class=\"h-anchor\" href=\"#/18-what-is-not-built-yet/where-the-shipped-documentation-disagrees-with-the-shipped-system\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Documentation inside the repository describes things that are no longer true, and following one into a path that does not exist will cost you an afternoon. Where the two disagree, what is actually in your project is correct.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>A document says<\/th>\n<th>What is actually there<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Converted output goes to <code>assets/converted/<\/code>.<\/td>\n<td>The path is <code>assets/&lt;source-slug&gt;/&lt;asset-slug&gt;.&lt;ext&gt;<\/code>. No <code>converted/<\/code> subdirectory exists anywhere.<\/td>\n<\/tr>\n<tr>\n<td>Structured rows load into <code>data/<\/code>.<\/td>\n<td>The path is <code>.os/data/<\/code>. <code>data/<\/code> does not exist.<\/td>\n<\/tr>\n<tr>\n<td>Artifacts carry <code>env:<\/code> and <code>for:<\/code> fields, with a value meaning &quot;both&quot;.<\/td>\n<td>Both fields are explicitly rejected as legacy, and the &quot;both&quot; value is banned. Scoping uses <code>systems<\/code>, <code>environments<\/code> and <code>owners<\/code>. Named customers and vendors are banned from reusable contracts.<\/td>\n<\/tr>\n<tr>\n<td>There are two gates: verify-to-promote for findings, review-to-activate for instruments.<\/td>\n<td>Only review-to-activate exists. The finding-side step is called qualification, and the contract term is <code>qualified<\/code>, not <code>verified<\/code>.<\/td>\n<\/tr>\n<tr>\n<td><code>references.json<\/code> and <code>entity-resolution.json<\/code> are listed in the index table as if they exist.<\/td>\n<td>Neither file exists. Both must be built first.<\/td>\n<\/tr>\n<tr>\n<td>If a discovery playbook cannot run, confirm it appears in <code>runnable_playbooks<\/code>.<\/td>\n<td>Correct as written, but no discovery playbook is active, so the implied path is unreachable on a fresh copy.<\/td>\n<\/tr>\n<tr>\n<td>Qualifying a finding requires a confirmation test written in one specific browser-testing technology.<\/td>\n<td>The contract defines the test neutrally: any command, manual procedure, harness, script or other deterministic method. The tool is stricter than the contract.<\/td>\n<\/tr>\n<tr>\n<td><code>workspace/<\/code> is planned, and <code>buildos intake<\/code> is a scaffold for a planned toolkit.<\/td>\n<td>Both are built. <code>workspace/<\/code> has its directories, routers and two contracts, and is simply empty. <code>buildos intake<\/code> is implemented and was verified working.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h2 id=\"what-is-missing-but-does-not-matter-much\"><span>What is missing but does not matter much<\/span><a class=\"h-anchor\" href=\"#/18-what-is-not-built-yet/what-is-missing-but-does-not-matter-much\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>None of these should change what you do.<\/p>\n<ul>\n<li><code>runnable_playbooks<\/code> in the playbook index is a misleading name. It includes guardrail playbooks, which by contract never run.<\/li>\n<li><code>workspace/datasets/<\/code> contains only a placeholder file, with no example dataset and no format guidance beyond which file types belong where.<\/li>\n<\/ul>\n<h2 id=\"what-this-means-practically\"><span>What this means practically<\/span><a class=\"h-anchor\" href=\"#/18-what-is-not-built-yet/what-this-means-practically\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Of the 58 distinct things this documentation describes people doing with BuildOS, only a small share run as one command. Most are defined by a written contract and produced by you and your agent, some are part command and part procedure, and some are described here but absent from the shipped system. (The 2026-08-23 count was 7 commands in 58; <code>0.1.0<\/code> added the entity, design, setup, and validation commands, and the count was not redone.)<\/p>\n<p>So most of the work is a procedure against a written contract. The contracts are what keep the output consistent, and an agent will obey rules it was never shown in the prompt. That proportion changes how you plan the work. You are budgeting review time rather than run time, and you need somebody who will read what the agent wrote.<\/p>\n<p><a href=\"#/19-a-worked-walkthrough\">A worked walkthrough<\/a> runs the whole chain once with real paths, and names each of the four breaks at the exact point you meet it.<\/p>\n<h2 id=\"what-you-should-have-now\"><span>What you should have now<\/span><a class=\"h-anchor\" href=\"#/18-what-is-not-built-yet/what-you-should-have-now\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>The four breaks in the chain, in order of severity, and what you do at each one.<\/li>\n<li>A register of every verified gap, with the workaround and the document that covers it.<\/li>\n<li>The places where documentation inside the repository points somewhere that does not exist.<\/li>\n<li>The proportion of this documentation that is commands rather than procedures: a small share.<\/li>\n<\/ul>\n<h2 id=\"next\"><span>Next<\/span><a class=\"h-anchor\" href=\"#/18-what-is-not-built-yet/next\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><a href=\"#/19-a-worked-walkthrough\">A worked walkthrough<\/a>, the whole chain end to end, with the breaks named where they occur.<\/p>\n","toc":[{"id":"what-you-need-first","text":"What you need first","level":2},{"id":"how-to-read-this-article","text":"How to read this article","level":2},{"id":"the-four-breaks-in-the-chain","text":"The four breaks in the chain","level":2},{"id":"1-extraction-the-chain-stops-after-conversion","text":"1. Extraction · the chain stops after conversion","level":3},{"id":"2-comparison-there-is-no-subsystem-for-it","text":"2. Comparison · there is no subsystem for it","level":3},{"id":"3-activation-the-discovery-half-cannot-be-started-on-a-fresh-copy","text":"3. Activation · the discovery half cannot be started on a fresh copy","level":3},{"id":"4-the-planning-half-one-automated-hop-and-it-needs-make-docs","text":"4. The planning half · one automated hop, and it needs Make Docs","level":3},{"id":"the-full-gap-register","text":"The full gap register","level":2},{"id":"where-the-shipped-documentation-disagrees-with-the-shipped-system","text":"Where the shipped documentation disagrees with the shipped system","level":2},{"id":"what-is-missing-but-does-not-matter-much","text":"What is missing but does not matter much","level":2},{"id":"what-this-means-practically","text":"What this means practically","level":2},{"id":"what-you-should-have-now","text":"What you should have now","level":2},{"id":"next","text":"Next","level":2}]},"19-a-worked-walkthrough":{"slug":"19-a-worked-walkthrough","num":"19","title":"A worked walkthrough","lede":"You can read this article on its own, before or after the rest of the set.","html":"<p>This page follows one project the whole way: a pile of documents at one end, a work backlog inside a work tracker at the other. Seventeen hops, in order, with the file that moves at each one.<\/p>\n<h2 id=\"what-you-need-first\"><span>What you need first<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/what-you-need-first\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>You need nothing installed to read this. If you want to follow along in your own project, you need Node.js 24 or newer, a project folder, and an agent that can open it. <a href=\"#/03-before-you-start\">Before you start<\/a> covers all three.<\/p>\n<p>Two things up front, so the article below reads cleanly:<\/p>\n<ul>\n<li>An <strong>agent harness<\/strong> is the software wrapped around a language model that gives it tools, a working directory and a loop. An <strong>agent<\/strong> is the two together, working on your files. This documentation never assumes a particular one.<\/li>\n<li>A <strong>contract<\/strong> is a Markdown file in <code>.os/contracts/<\/code> that states what one kind of artifact must look like. Contracts are the authority. Ten of them ship.<\/li>\n<\/ul>\n<p>Every other term is defined in one line where it first appears, and properly in the chapter that owns it. <a href=\"#/20-glossary\">Glossary<\/a> has all of them.<\/p>\n<h2 id=\"the-situation\"><span>The situation<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/the-situation\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A team is handed a community library&#39;s book-lending system. It runs on top of a general-purpose business platform, and it has been customized. With it comes a pile of documents: a requirements workbook, an architecture deck, a vendor feature list, several meeting recaps and a spreadsheet. The team also has sign-in access to a running instance, and a deadline.<\/p>\n<p>What they owe at the end is a work backlog that an engineering team can pick up, sitting inside the work tracker the organization already uses.<\/p>\n<p>That is what the seventeen hops below do. The chain completes end to end, finishing with a hierarchical backlog imported into a work tracker.<\/p>\n<h2 id=\"the-whole-chain-in-one-table\"><span>The whole chain in one table<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/the-whole-chain-in-one-table\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Hop<\/th>\n<th>What comes out of it<\/th>\n<th>Tooled?<\/th>\n<th>Covered in<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>1<\/td>\n<td>Get the project and an agent<\/td>\n<td>A project folder on your machine, Node.js 24, and an agent that can open it<\/td>\n<td>No<\/td>\n<td><a href=\"#/03-before-you-start\">Before you start<\/a><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Set up BuildOS<\/td>\n<td><code>buildos init<\/code> done, <code>.os/scripts/buildos version<\/code> working<\/td>\n<td>Yes<\/td>\n<td><a href=\"#/04-install-and-configure-your-instance\">Install and configure your instance<\/a><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Configure the instance<\/td>\n<td><code>.os/config/instance.yaml<\/code>, validated<\/td>\n<td>Yes<\/td>\n<td><a href=\"#/04-install-and-configure-your-instance\">Install and configure your instance<\/a><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Convert your sources<\/td>\n<td><code>assets/&lt;source-slug&gt;/&lt;asset-slug&gt;.&lt;ext&gt;<\/code><\/td>\n<td>Yes, six formats<\/td>\n<td><a href=\"#/05-bring-in-source-material\">Bring in source material<\/a>, <a href=\"#/06-sources-the-converter-cannot-read\">Sources the converter cannot read<\/a><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Index what you have<\/td>\n<td><code>.os/indexes/references.json<\/code><\/td>\n<td>Yes<\/td>\n<td><a href=\"#/05-bring-in-source-material\">Bring in source material<\/a><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Extract structured records<\/td>\n<td><code>EXT-NNN<\/code> rows plus <code>REQ<\/code> / <code>CAP<\/code> / <code>PER<\/code> / <code>TC<\/code> rows in <code>.os/data/<\/code><\/td>\n<td><strong>No<\/strong><\/td>\n<td><a href=\"#/07-pull-knowledge-out-of-it\">Pull knowledge out of it<\/a><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Consolidate duplicates<\/td>\n<td><code>redirect<\/code> objects and a reviewed manifest<\/td>\n<td>Partly<\/td>\n<td><a href=\"#/11-keep-the-record-clean\">Keep the record clean<\/a><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Build the yardstick and compare<\/td>\n<td>Capability models and a comparison table with verdicts<\/td>\n<td><strong>Outside BuildOS<\/strong><\/td>\n<td><a href=\"#/10-compare-two-systems\">Compare two systems<\/a><\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Author and activate a playbook<\/td>\n<td><code>playbooks/&lt;category&gt;/&lt;slug&gt;.md<\/code> with <code>status: active<\/code><\/td>\n<td><strong>No<\/strong><\/td>\n<td><a href=\"#/08-write-and-run-a-playbook\">Write and run a playbook<\/a><\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Run it and record the run<\/td>\n<td><code>workspace/runs/RUN-NNN/<\/code><\/td>\n<td>Yes, once hop 9 is done<\/td>\n<td><a href=\"#/08-write-and-run-a-playbook\">Write and run a playbook<\/a><\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>Qualify a finding<\/td>\n<td><code>workspace/findings/FIND-NNN/<\/code><\/td>\n<td>Yes, once hop 10 is done<\/td>\n<td><a href=\"#/09-qualify-what-you-found\">Qualify what you found<\/a><\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>Promote to a design<\/td>\n<td><code>docs/designs/YYYY-MM-DD-&lt;slug&gt;.md<\/code><\/td>\n<td>Tooled, needs Make Docs<\/td>\n<td><a href=\"#/12-designs-plans-and-prds\">Designs, plans and PRDs<\/a><\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>Plan<\/td>\n<td><code>docs/plans/YYYY-MM-DD-w{W}-r{R}-&lt;slug&gt;/<\/code><\/td>\n<td><strong>No<\/strong><\/td>\n<td><a href=\"#/12-designs-plans-and-prds\">Designs, plans and PRDs<\/a><\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>PRD<\/td>\n<td><code>docs/prd/NN-&lt;slug&gt;.md<\/code><\/td>\n<td><strong>No<\/strong><\/td>\n<td><a href=\"#/12-designs-plans-and-prds\">Designs, plans and PRDs<\/a><\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Work backlog<\/td>\n<td><code>docs/work/YYYY-MM-DD-w{W}-r{R}-&lt;slug&gt;/<\/code><\/td>\n<td><strong>No<\/strong><\/td>\n<td><a href=\"#/13-build-the-work-backlog\">Build the work backlog<\/a><\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>Export<\/td>\n<td>A hierarchical import CSV<\/td>\n<td><strong>Outside BuildOS<\/strong><\/td>\n<td><a href=\"#/14-export-to-a-work-tracker\">Export to a work tracker<\/a><\/td>\n<\/tr>\n<tr>\n<td>17<\/td>\n<td>Import and verify<\/td>\n<td>Work items in the tracker, three levels deep<\/td>\n<td>Manual, by design<\/td>\n<td><a href=\"#/14-export-to-a-work-tracker\">Export to a work tracker<\/a><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Those rows group into four hard breaks. Each one is named below at the point you reach it, rather than collected at the end.<\/p>\n<hr>\n<h2 id=\"1-get-the-project-and-an-agent\"><span>1. Get the project and an agent<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/1-get-the-project-and-an-agent\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Nothing lands in BuildOS at this hop. You end it with two things: a project folder holding the BuildOS files, and an agent tool that can open that folder and write files in it.<\/p>\n<p>Make the project folder and put it under git. Sharing that repository across an organization boundary is the step most likely to stall.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>An enterprise chat licence is not a coding-agent licence. Confirm what your employer actually licenses before you plan around it. Some agent tools also accept prompts and quietly do nothing until an acceptance agreement is signed, with no error shown.<\/p>\n<\/div><\/aside>\n<p>Keep the project outside a synced cloud folder. <a href=\"#/03-before-you-start\">Before you start<\/a> has the access and sharing traps in full.<\/p>\n<p><strong>Hand-off to the next hop:<\/strong> the project folder. Every path from here is relative to its root.<\/p>\n<h2 id=\"2-set-up-buildos\"><span>2. Set up BuildOS<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/2-set-up-buildos\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>BuildOS is one npm package. In the project folder, your agent runs:<\/p>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">npx -y build-os@0.1.0 init\n<\/code><\/pre><\/div>\n<p>It stops first with exit code <code>10<\/code> and one question for you: set up Make Docs too? Answer it on purpose, because with the tested Make Docs version a No cannot be undone later in this folder, and the planning hops (12 onwards) use Make Docs. Your agent then runs the one command <code>buildos init<\/code> printed for your answer. BuildOS adds <code>.os/<\/code>, <code>assets/<\/code>, <code>playbooks/<\/code>, <code>workspace/<\/code>, and its section of <code>AGENTS.md<\/code>, <code>CLAUDE.md<\/code>, and <code>.gitignore<\/code>; with Make Docs you also get <code>docs/<\/code>.<\/p>\n<p>Check it:<\/p>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">.os/scripts/buildos version\n<\/code><\/pre><\/div>\n<p>It prints the version that <code>.os/manifest.json<\/code> pins, and exits 0. On Windows, use <code>.os\\scripts\\buildos.cmd<\/code>.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Use <code>.os/scripts/buildos &lt;domain&gt;<\/code> in everything you write down. The old names <code>buildos-intake<\/code>, <code>buildos-discovery<\/code>, and <code>buildos-design<\/code> still work but stop working in BuildOS <code>0.3.0<\/code>.<\/p>\n<\/div><\/aside>\n<p><strong>Hand-off to the next hop:<\/strong> a set-up project and a working <code>.os/scripts/buildos<\/code>.<\/p>\n<h2 id=\"3-configure-the-instance\"><span>3. Configure the instance<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/3-configure-the-instance\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>An <strong>instance<\/strong> is one deployment of BuildOS, with its own configuration file. This is the one place your instance names its real world, and it is one of the few hops in the chain that runs end to end with a command on a fresh copy.<\/p>\n<p>Open <code>.os/config/instance.yaml<\/code>. Fill in four collections:<\/p>\n<ul>\n<li><code>systems[]<\/code> names the products or platforms you are studying. Treat a system as a <em>type<\/em> rather than a deployment. Here that is the library lending system, and the business platform under it.<\/li>\n<li><code>environments[]<\/code> names the actual deployments. Each one names which systems it belongs to. A team might settle on a baseline vendor environment and one configured sandbox.<\/li>\n<li><code>owners[]<\/code> names teams, organizations or vendors, each with a <code>kind<\/code>.<\/li>\n<li><code>defaults<\/code> says which of the above apply when an artifact does not say.<\/li>\n<\/ul>\n<p>IDs are lowercase with hyphens. Then run:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos validate\n<\/code><\/pre><\/div>\n<p>Success prints <code>OK. No problems found.<\/code> and exits 0.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>The shipped <code>instance.yaml<\/code> is the unmodified neutral template. Its example IDs are <code>primary-system<\/code>, <code>baseline<\/code>, <code>customized<\/code>, <code>adopter-team<\/code> and <code>platform-owner<\/code>. If you forget to edit it, the validator passes cleanly against fake IDs and everything downstream quietly scopes itself to a system that does not exist. Edit it before you convert anything.<\/p>\n<\/div><\/aside>\n<p>Every scoped artifact from here on carries three list fields, <code>systems<\/code>, <code>environments<\/code> and <code>owners<\/code>, and every value in them must resolve to an ID in this file. <a href=\"#/04-install-and-configure-your-instance\">Install and configure your instance<\/a> has the schema and the validator&#39;s full rule set.<\/p>\n<p><strong>Hand-off to the next hop:<\/strong> a validated <code>instance.yaml<\/code>. The IDs in it are the vocabulary every later artifact uses.<\/p>\n<h2 id=\"4-convert-your-sources\"><span>4. Convert your sources<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/4-convert-your-sources\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A <strong>converted source<\/strong>, or twin, is a clean text copy of an original file carrying a header that records where it came from, its checksum, what converted it and when. That header is the provenance, and it is the reason a claim made six weeks from now can be traced back.<\/p>\n<p>Run one source at a time:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos intake convert --source &lt;path&gt;\n<\/code><\/pre><\/div>\n<p>Add <code>--dry-run<\/code> first. It doubles the wall time and finds the problem before the tool commits anything. Exit code 0 means the conversion is clean.<\/p>\n<p>Output lands in <code>assets/&lt;source-slug&gt;/&lt;asset-slug&gt;.&lt;ext&gt;<\/code>. Spreadsheets produce one CSV per worksheet. Word documents and HTML produce Markdown. PDFs produce plain text. Images and diagrams pulled out of a source land beside the twin as side artifacts.<\/p>\n<p>The team&#39;s pile converted cleanly for the requirements workbook, the vendor feature list and the HTML documentation. The architecture deck and the meeting recordings did not.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>PDF conversion is deliberately minimal: plain text only, no OCR, no table reconstruction, no layout. Presentation decks, email and audio have no converter at all. <a href=\"#/06-sources-the-converter-cannot-read\">Sources the converter cannot read<\/a> covers the hand path, which is a shipped, active playbook: PB-003, twelve steps.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Attaching a file to an agent chat is not intake. It produces a record with the wrong source name and no provenance, and the work has to be redone. Save the file where the tool can reach it, then convert it.<\/p>\n<\/div><\/aside>\n<p><strong>Hand-off to the next hop:<\/strong> a directory of twins under <code>assets/<\/code>, each with a provenance header. Everything after this reads the twins, not the originals.<\/p>\n<h2 id=\"5-index-what-you-have\"><span>5. Index what you have<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/5-index-what-you-have\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>An <strong>index<\/strong> is a generated lookup file. It is never the source of truth, and you can delete and rebuild it at any time.<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos intake index references\n<\/code><\/pre><\/div>\n<p>This reads the frontmatter of every twin under <code>assets/<\/code> and writes <code>.os/indexes/references.json<\/code>. It answers &quot;have we already converted this?&quot; without opening files.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p><code>references.json<\/code> does not exist in the shipped tree, and rebuilding it against an empty <code>assets/<\/code> produces <code>{&quot;version&quot;: 1, &quot;references&quot;: null}<\/code>. It only becomes useful after hop 4 has run for real. Contracts, routers and guides all refer to the file as though it were present. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p><strong>Hand-off to the next hop:<\/strong> a catalog of what you hold. It tells you what to extract from.<\/p>\n<h2 id=\"6-extract-structured-records\"><span>6. Extract structured records<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/6-extract-structured-records\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>This is where the tooling stops.<\/p>\n<p>An <strong>extraction<\/strong> is a record saying: I read this piece of this twin, and these records came out of it. An <strong>entity record<\/strong> is one line of JSON in <code>.os/data/*.jsonl<\/code> describing one thing with a stable ID. Four types matter here. A <strong>capability<\/strong> is what a system can do. A <strong>requirement<\/strong> is what it must do. A <strong>persona<\/strong> is a kind of user, with goals and needs. A <strong>test case<\/strong> is a repeatable check.<\/p>\n<p>The extraction row goes in <code>.os/data/extractions.jsonl<\/code> with an <code>EXT-NNN<\/code> ID, an anchor into the twin it read, and a <code>minted[]<\/code> list naming every record it created. The records go in <code>requirements.jsonl<\/code>, <code>capabilities.jsonl<\/code>, <code>personas.jsonl<\/code> and <code>test-cases.jsonl<\/code>.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>No extraction writer exists. No entity-record writer exists either. <code>extractions.jsonl<\/code> is an empty file and no shipped tool appends to it. Everything from here to hop 8 is you and your agent writing JSONL by hand against a contract the agent has read. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p>The contracts ship, the ID registry ships, and the validator ships, so the rules are enforceable even though nothing writes for you. What the team did was prompt the agent with the rules explicitly:<\/p>\n<ul>\n<li>Do not invent a loader.<\/li>\n<li>If a safe data file and a contract exist, propose exact rows for review.<\/li>\n<li>State for each output whether the workspace has deterministic tooling, or the step is manual.<\/li>\n<li>Read the contract.<\/li>\n<li>Proceed only with the outputs I approve.<\/li>\n<li>Cite the applicable contract.<\/li>\n<\/ul>\n<p>The agent came back with a plan and a set of scoped options. It also reported, unprompted, that row writing is manual and gated because no tool does it. Then it proposed rows. A person approved them. They were appended.<\/p>\n<p>Hundreds of rows can come out of a single pass. Nine ID prefixes are valid, those being <code>REQ<\/code>, <code>CAP<\/code>, <code>PER<\/code>, <code>TC<\/code>, <code>RES<\/code>, <code>RUN<\/code>, <code>FIND<\/code>, <code>EXT<\/code> and <code>PB<\/code>, and anything else the agent invents is wrong.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Statuses from the source system leak in. The entity status vocabulary is exactly <code>draft<\/code>, <code>active<\/code>, <code>superseded<\/code>, <code>archived<\/code>. <code>candidate<\/code> is a converted-source status only, and the validator rejects it on an entity row.<\/p>\n<\/div><\/aside>\n<p>Run the validator again after each batch. It checks one JSON object per line, the ID prefix and format, the status, the source anchor, and that every scoped value resolves. <a href=\"#/07-pull-knowledge-out-of-it\">Pull knowledge out of it<\/a> carries the prompt and the rules in full.<\/p>\n<p><strong>Hand-off to the next hop:<\/strong> rows. Every later hop counts them, which is something prose does not allow.<\/p>\n<h2 id=\"7-consolidate-duplicates\"><span>7. Consolidate duplicates<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/7-consolidate-duplicates\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Two source documents describing the same thing produce two records. Folding them together is a separate, explicit step: you write a <strong>consolidation manifest<\/strong> listing which record folds into which, a person reviews it, and only then do you apply it. The losing record keeps its ID and gains a <code>redirect<\/code> pointing at the winner, so old references still resolve.<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos entities consolidate --root . --mode compat --manifest &lt;path&gt; --apply\n.os/scripts/buildos entities rebuild-index --root . --mode strict --apply\n<\/code><\/pre><\/div>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>A freshly set-up project fails strict validation, because <code>entity-resolution.json<\/code> has never been built, so <code>.os/scripts/buildos entities validate --root . --mode strict<\/code> exits 4. Run the <code>rebuild-index<\/code> command above once. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p>Personas are the exception: they are the only entity type with an identity contract, so they are the only type with a deterministic way to decide that two records are the same person-shape. <a href=\"#/11-keep-the-record-clean\">Keep the record clean<\/a> covers both.<\/p>\n<p><strong>Hand-off to the next hop:<\/strong> one record per thing, and a redirect trail explaining every fold.<\/p>\n<h2 id=\"8-build-the-yardstick-and-compare\"><span>8. Build the yardstick and compare<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/8-build-the-yardstick-and-compare\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The comparison is the outcome the team was hired to produce, and it went well. An agent working from the records produced a genuinely strong analysis. What is missing is the machinery.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>BuildOS has no comparison artifact, contract, command or vocabulary term, and no skill that guides the process. You run the analysis with your agent against the project&#39;s own files and write the result back yourself. Prompting covers the gap, without guaranteeing the same output shape from one run to the next. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p>The method is four steps.<\/p>\n<ol>\n<li>Pick the sources for each side, and deliberately exclude sources belonging to a different version of the question.<\/li>\n<li>Extract both sides into the same shape: a narrative capability model, a structured model, a capabilities table, a requirements table and a data dictionary.<\/li>\n<li>Settle the taxonomy and the status vocabulary <em>before<\/em> extracting, because two products described in their own words cannot be lined up against each other.<\/li>\n<li>Produce the delta as its own document, one row per capability, each carrying a verdict, the gap detail, mapped counterparts, evidence, confidence, effort and a migration note.<\/li>\n<\/ol>\n<p>The verdicts used were <code>gap<\/code>, <code>partial gap<\/code>, <code>configurable<\/code>, <code>&lt;system&gt; only<\/code>, <code>preview gap<\/code> and <code>native<\/code>.<\/p>\n<p>What made this run smoothly was hop 6. The comparison had clean structured rows on both sides, in one taxonomy, so it had very little to work out for itself. That is the return on the manual extraction work, and it arrives here.<\/p>\n<p>The headline result is not the number of gaps. It is the ratio: a handful of true gaps against a large requirements set. The value of the exercise was proving with evidence that almost everything was <em>not<\/em> a gap.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Each of those gaps is a raw observation from reading documents, not a test against a running system. Under the finding contract, none of them qualifies as evidence yet. That is not a defect in the analysis. It is the bridge to the next three hops: the comparison tells you what to go and prove.<\/p>\n<\/div><\/aside>\n<p><a href=\"#/10-compare-two-systems\">Compare two systems<\/a> has the method and the traps.<\/p>\n<p><strong>Hand-off to the next hop:<\/strong> a shortlist of claims worth testing against the live system.<\/p>\n<h2 id=\"9-author-and-activate-a-playbook\"><span>9. Author and activate a playbook<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/9-author-and-activate-a-playbook\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A <strong>playbook<\/strong> is a short Markdown file that tells a person or an agent how to do one job. It lives in <code>playbooks/&lt;category&gt;/<\/code>, and the directory name is the category: <code>administrative<\/code>, <code>build<\/code>, <code>discovery<\/code> or <code>testing<\/code>.<\/p>\n<p>Copy one of the seven playbook shapes from <code>.os/templates/<\/code> into <code>playbooks/discovery/<\/code>, and write the steps for the thing you want proved.<\/p>\n<p>Then comes the gate. A playbook ships as <code>draft<\/code>. The <strong>review-to-activate gate<\/strong> is a person reading it and moving it to <code>active<\/code>, and only <code>active<\/code> playbooks run. The reason is plain: the agent is about to drive a browser against a real system, and somebody should read the instructions first.<\/p>\n<ol>\n<li>Open the playbook file.<\/li>\n<li>Change <code>status<\/code> from <code>draft<\/code> to <code>active<\/code>. It is the sixth field in the frontmatter.<\/li>\n<li>Rebuild the index:<\/li>\n<\/ol>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos intake index playbooks\n<\/code><\/pre><\/div>\n<p>It prints <code>wrote &lt;path&gt; (&lt;n&gt; playbooks)<\/code>.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>The review-to-activate gate has no tooling. Activation is a hand edit of the frontmatter plus an index rebuild, and no approval is recorded anywhere. On a stock checkout no discovery playbook is active, because the only one, PB-005, is a draft. The whole discovery half cannot be started until you do this by hand. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Forgetting the index rebuild leaves the playbook active on disk and invisible to the run command. It gets skipped constantly. Also: an agent can flip the status for you, and it will if you let it. That defeats the gate. The point of the gate is that a person read the steps.<\/p>\n<\/div><\/aside>\n<p><a href=\"#/08-write-and-run-a-playbook\">Write and run a playbook<\/a> covers the shapes and the frontmatter.<\/p>\n<p><strong>Hand-off to the next hop:<\/strong> an active discovery playbook that appears in the <code>runnable_playbooks<\/code> list inside <code>.os/indexes/playbooks.json<\/code>.<\/p>\n<h2 id=\"10-run-it-and-record-the-run\"><span>10. Run it and record the run<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/10-run-it-and-record-the-run\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A <strong>run<\/strong> is one recorded attempt at doing something. It is a folder, <code>RUN-NNN/<\/code>, holding a summary, the raw evidence and the rough notes. Once closed, you do not change it.<\/p>\n<p>Two things are true at once here. The live browser work is external to BuildOS by design, with the agent driving a real signed-in browser through your harness. BuildOS records what happened:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos discovery run discovery --playbook-id &lt;PB-NNN&gt; --outcome positive|negative|inconclusive --evidence &lt;path&gt; --raw-finding &lt;path&gt;\n<\/code><\/pre><\/div>\n<p>That writes <code>workspace/runs/RUN-NNN/<\/code> containing <code>run.md<\/code>, an <code>evidence/<\/code> directory and <code>raw-findings.md<\/code>, and appends one row to <code>.os/data/runs.jsonl<\/code>.<\/p>\n<p>A <strong>raw finding<\/strong> is something you noticed that has not been proved. It has no ID. It lives as an anchor inside that run&#39;s <code>raw-findings.md<\/code>.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Nothing supplies the environment URL. The environment record in <code>instance.yaml<\/code> has no URL field, so a person pastes it in on every run. This was named as a gap early and is still open.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>A blocked run is still a run. So is an inconclusive one. <code>inconclusive<\/code> means the run could not confirm the claim either way, which is a legitimate result with a stated reason rather than a failure to be deleted. Write down the signal you expect to see <em>before<\/em> the run starts, or you will read a step that quietly did nothing as a success.<\/p>\n<\/div><\/aside>\n<p><strong>Hand-off to the next hop:<\/strong> a run folder with frozen evidence, and one or more raw-finding anchors inside it.<\/p>\n<h2 id=\"11-qualify-a-finding\"><span>11. Qualify a finding<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/11-qualify-a-finding\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A <strong>qualified finding<\/strong> is a raw finding that passed a repeatable test. It gets a <code>FIND-NNN<\/code> ID and its own folder. <strong>Qualification<\/strong> is the test itself. Intuition and a one-off observation do not qualify.<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos discovery qualify finding --run-id &lt;RUN-NNN&gt; --raw-finding-ref &lt;path#anchor&gt; --outcome positive|negative --confirmation-test &lt;path&gt; --confirmation-evidence &lt;path&gt;\n<\/code><\/pre><\/div>\n<p>This writes <code>workspace/findings/FIND-NNN/<\/code> with <code>finding.md<\/code> and <code>qualification.md<\/code>, and appends a <code>status: &quot;qualified&quot;<\/code> row to <code>findings.jsonl<\/code>. The qualification file records the test type, the procedure, the assertion, the result, which must be <code>pass<\/code>, and the evidence.<\/p>\n<p>The discipline behind it: for everything you manually test that does not work or exposes a gap, write a script that reliably and repeatably proves that gap. It also proves when the gap is fixed.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Nothing generates the confirmation test for you. And the shipped tool is stricter than the contract it implements: the contract accepts any deterministic method, and the tool requires a browser test file.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Some real findings cannot be qualified at all. An important observation can be that the product assumes a branch structure the library does not have. No repeatable test proves that. It is still true and it still needs recording somewhere, though not as a finding under this contract.<\/p>\n<\/div><\/aside>\n<p><a href=\"#/09-qualify-what-you-found\">Qualify what you found<\/a> covers the gate and what to do with the observations that cannot pass it.<\/p>\n<p><strong>Hand-off to the next hop:<\/strong> findings with IDs, and tests anyone can run again.<\/p>\n<h2 id=\"12-promote-to-a-design\"><span>12. Promote to a design<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/12-promote-to-a-design\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A <strong>design<\/strong> is a dated document recording one decision: what was chosen, what else was considered, and what follows. It ends with an <code>## Intended Follow-On<\/code> section naming the route to a plan.<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos design promote finding --finding-id &lt;FIND-NNN&gt; --route baseline-plan|change-plan\n<\/code><\/pre><\/div>\n<p>This is the only automated hop in the entire planning half, and the only place where the discovery half connects to the planning half through tooling.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>This command needs Make Docs in the project; without it, it stops with exit code 3 and says why. In practice designs are mostly not produced this way. They are written by describing the concern to the agent and asking it to draft the design. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p>The prompt path is legitimate and it is what happened. It is also ungated, and it has a failure mode: feeding an unqualified observation to a design produces a document that is structurally perfect and substantively empty, because there was nothing proved to write about.<\/p>\n<p><strong>Hand-off to the next hop:<\/strong> a design in <code>docs/designs/<\/code>, with a named route.<\/p>\n<h2 id=\"13-14-15-plan-prd-work-backlog\"><span>13, 14, 15. Plan, PRD, work backlog<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/13-14-15-plan-prd-work-backlog\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>From here to the end of BuildOS, there are no commands. These three hops are documents written by your agent against contracts that ship as reference material and templates.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>Hops 13, 14 and 15 have no tooling of any kind. Make Docs keeps its templates and prompt starters under <code>.make-docs/system/<\/code>, and <code>docs/plans/<\/code>, <code>docs/prd/<\/code> and <code>docs/work/<\/code> all start empty apart from their router files. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p><strong>A plan<\/strong> is a directory of documents written before work starts. It settles the shape of the output and who does what. It lands at <code>docs/plans/YYYY-MM-DD-w{W}-r{R}-&lt;slug&gt;/<\/code> as <code>00-overview.md<\/code> plus one file per phase.<\/p>\n<p>The <code>w{W}-r{R}<\/code> in that path is the wave model. A <strong>wave<\/strong> is one full design-plan-work loop, a <strong>revision<\/strong> is a redo inside that wave, and a <strong>phase<\/strong> is a chunk inside a plan or a backlog. Give the agent those coordinates explicitly, because it handles them well and it will invent them if you leave them out.<\/p>\n<p><strong>A PRD<\/strong> is the numbered set of documents that is the authority on what the product is. One active set at a time, at <code>docs/prd/NN-&lt;slug&gt;.md<\/code>. The fixed core is always <code>00-index.md<\/code>, <code>01-product-overview.md<\/code>, <code>02-architecture-overview.md<\/code>, <code>03-open-questions-and-risk-register.md<\/code> and <code>04-glossary.md<\/code>. Numbers <code>05<\/code> to <code>99<\/code> are yours.<\/p>\n<p>A team may run the PRD <em>before<\/em> the plan, which inverts the canonical order, for a stated reason: many capabilities already exist from hop 6, and generating the plan first would orphan them. That is a supported case, and a decompose template exists for exactly it. One generation can produce a full baseline set in under an hour.<\/p>\n<p>Then spot-check, which is the step worth copying.<\/p>\n<p>Open the glossary first to see whether the vocabulary survived. Then open one substantive document and read one table row carefully. Look for a contradiction, such as two columns saying one system owns a capability while the evidence column says the other does. Refuse the one-row fix, on the grounds that patching a row you do not understand leaves you no wiser about how many more are wrong.<\/p>\n<p>The sweep that follows will typically turn up dozens.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>A defect in a generated document usually runs through the whole set. Never accept a one-row patch for a generated set. Ask for the class of error, then constrain the shape of the remediation: correct rows in place, add a revision section inside each document, and create no new plan bundle for a correction.<\/p>\n<\/div><\/aside>\n<p><strong>A work backlog<\/strong> is a directory of phase files at <code>docs/work/YYYY-MM-DD-w{W}-r{R}-&lt;slug&gt;/<\/code>. It holds <code>00-index.md<\/code> plus one file per phase. Each phase has stages, and each stage has checkbox tasks written as <code>- [ ] t1: ...<\/code> alongside plain-bullet acceptance criteria.<\/p>\n<p>Generate it from the PRD <em>and<\/em> the plan together, and state the completeness constraint out loud. Say, in effect: do not leave any of the existing capabilities orphaned. Prefix every capability-bearing task with its capability ID, so the backlog stays searchable back to the row it came from.<\/p>\n<p>Each phase that comes out should carry prerequisites, owned capabilities and persona assignments.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Agents skip the checkbox convention. Check for it. Also check that BuildOS&#39;s own governance language has not leaked into your product backlog. A task reading &quot;confirm the operating register and the traceability guardrails&quot; belongs to BuildOS rather than to a lending system.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Long runs outlast working sessions. A PRD generation can take most of an hour, a full plan-and-backlog run can take most of a day, and even a small plan takes minutes. Kick long runs off well ahead of the discussion where you want the result.<\/p>\n<\/div><\/aside>\n<p><a href=\"#/12-designs-plans-and-prds\">Designs, plans and PRDs<\/a> and <a href=\"#/13-build-the-work-backlog\">Build the work backlog<\/a> carry these three hops properly.<\/p>\n<p><strong>Hand-off to the next hop:<\/strong> <code>docs/work/&lt;backlog&gt;/<\/code>, with <code>00-index.md<\/code> and every phase file. That directory is the whole input to the export.<\/p>\n<h2 id=\"16-export\"><span>16. Export<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/16-export\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The backlog is only useful when it reaches the tool the delivery team already uses.<\/p>\n<blockquote>\n<p><strong>A skill, not a command.<\/strong> BuildOS has no export command. The exporter that produced the real CSV is the skill <code>buildos-export-azure-boards<\/code>, which <code>buildos init<\/code> copies into <code>.os/skills/<\/code>. <a href=\"#/14-export-to-a-work-tracker\">Export to a work tracker<\/a> shows how to run it.<\/p>\n<\/blockquote>\n<p>One step that makes this work appears in no documentation: derive the format from the destination. Run a saved export query in your target tracker, open it, delete the columns you do not want, save it as CSV, and hand that file to the agent as the format specification. That is how the column template was produced.<\/p>\n<p>Then run the exporter. It reads the work directory and every phase file, and it stops to ask before it writes: which backlog, which adapter, and any parameter the adapter needs.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Never let it guess a parameter. The adapter&#39;s own rule forbids inferring one from the project name, the repository, an example in the skill, or a previous export. When the answer would be inconsistent it refuses outright. It may hit several consecutive stop-and-ask gates, ending in a hard refusal. A first-time reader takes that refusal for a crash, when it is the rule doing its job.<\/p>\n<\/div><\/aside>\n<p>The default mapping is work directory to Epic, phase file to Feature, stage to backlog item. The fourth level is reserved and not emitted. New items carry no ID, no state and no assigned user, because the tracker assigns those.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>The hierarchy, the columns and the import were all correct on the first run, and the descriptions read as governance boilerplate rather than an explanation of the work. Review the titles and the prose before you import, and fix them by prompt rather than by hand.<\/p>\n<\/div><\/aside>\n<p><strong>Hand-off to the next hop:<\/strong> one hierarchical CSV.<\/p>\n<h2 id=\"17-import-and-verify\"><span>17. Import and verify<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/17-import-and-verify\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A human does this, and that is deliberate. The exporter&#39;s own instruction is not to import or save work items without separate approval for that external change.<\/p>\n<ol>\n<li>Find the import screen in your tracker. In some trackers it sits under a menu you would not guess, such as Queries.<\/li>\n<li>Before importing, fill in what the export deliberately leaves blank: tags, states and the iteration path.<\/li>\n<li>Import.<\/li>\n<li>Search the work items and count them.<\/li>\n<li>Open one epic and inspect its children.<\/li>\n<\/ol>\n<p>Do not skip the last step. An import nobody opened has proved nothing.<\/p>\n<p>Confirm the count, the three-level tree, and one epic spot-checked one level deep.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>A wrong area path on a first import can need a tracker administrator to fix. Confirm which tracker and which project you are importing into before you build the export, not after.<\/p>\n<\/div><\/aside>\n<p><strong>Hand-off:<\/strong> none. That is the end of the chain.<\/p>\n<hr>\n<h2 id=\"what-the-chain-produces\"><span>What the chain produces<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/what-the-chain-produces\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Read hops 4, 6, 8, 13, 14, 15, 16 and 17 together and you have one complete traverse:<\/p>\n<p>source documents → converted twins → extracted rows → a comparison → a numbered PRD set → a remediation pass → a plan bundle → a work backlog → work items in your own tracker.<\/p>\n<p>All seventeen hops happened, and only hop 4 was tooled.<\/p>\n<p>That is the shape of BuildOS today: thin tooling on top of fixed places and fixed rules. The comparison runs cleanly because the rows on both sides share one taxonomy. Every task in the backlog carries the capability ID of the row it came from, which is what keeps it traceable. And the remediation finds wrong rows because there is a defined shape to check them against.<\/p>\n<p>The part of the chain that did not run end to end here is the discovery half, meaning hops 9 through 11 and the gated route into hop 12. The tooling for hops 10 and 11 exists and works, the gate in front of it does not, and nothing generates the confirmation test that hop 11 requires. If your value is in proving claims against a running system rather than reorganizing documents, read <a href=\"#/08-write-and-run-a-playbook\">Write and run a playbook<\/a> and <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> before you commit.<\/p>\n<h2 id=\"what-it-costs\"><span>What it costs<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/what-it-costs\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><strong>What is fast.<\/strong> Conversion is seconds to minutes per source. Configuration is one sitting. Index rebuilds are immediate. The export runs in minutes from the first question to a written CSV, and the import and verification take about as long again. Extraction produces hundreds of rows in a single pass, and a full PRD set generates in well under an hour.<\/p>\n<p><strong>What is slow.<\/strong> Long generations. A plan-and-backlog run can take most of a day. Review is slower than generation and cannot be skipped, and a remediation sweep takes a full working session after the spot-check that found it.<\/p>\n<p><strong>Where a first-time team loses time.<\/strong> Setup and access, rather than BuildOS itself. Between them they can consume most of several working sessions before any BuildOS work starts.<\/p>\n<ul>\n<li>Getting a coding agent onto a single laptop can take a whole session on its own.<\/li>\n<li>Sharing one repository across an organization boundary can fail outright, with an external party unable even to file the access request, because both request systems need a corporate laptop or a VPN.<\/li>\n<li>A toolchain install can be blocked mid-download by network security and have to be re-obtained through the employer&#39;s software portal.<\/li>\n<\/ul>\n<p><strong>Giving the agent a real browser costs more than everything else put together.<\/strong> Expect to lose time to a browser extension, a connector and a missing runtime, where a runtime that was never installed is a common root cause. A harness&#39;s built-in browser will not hold a login. A failed sign-in has two likely causes, the network blocking the agent&#39;s browser or the vendor blocking agent browsers from the application, and neither is easy to confirm.<\/p>\n<p>If you are budgeting: assume the first week is access, licensing and installation, and assume the browser is its own project. The BuildOS work starts after that, and it runs at the speed of reading and review.<\/p>\n<h2 id=\"what-you-should-have-now\"><span>What you should have now<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/what-you-should-have-now\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>The seventeen hops in order, and which document covers each one.<\/li>\n<li>The four places the chain is broken: extraction, comparison, playbook activation, and the whole planning half.<\/li>\n<li>A concrete idea of what moves between hops, meaning twins, rows, findings, PRD documents, phase files and a CSV, and how each one becomes the input to the next.<\/li>\n<li>A realistic picture of what adoption costs, and where the time actually goes.<\/li>\n<\/ul>\n<h2 id=\"next\"><span>Next<\/span><a class=\"h-anchor\" href=\"#/19-a-worked-walkthrough/next\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><a href=\"#/20-glossary\">Glossary<\/a>, which defines every term used in this set.<\/p>\n","toc":[{"id":"what-you-need-first","text":"What you need first","level":2},{"id":"the-situation","text":"The situation","level":2},{"id":"the-whole-chain-in-one-table","text":"The whole chain in one table","level":2},{"id":"1-get-the-project-and-an-agent","text":"1. Get the project and an agent","level":2},{"id":"2-set-up-buildos","text":"2. Set up BuildOS","level":2},{"id":"3-configure-the-instance","text":"3. Configure the instance","level":2},{"id":"4-convert-your-sources","text":"4. Convert your sources","level":2},{"id":"5-index-what-you-have","text":"5. Index what you have","level":2},{"id":"6-extract-structured-records","text":"6. Extract structured records","level":2},{"id":"7-consolidate-duplicates","text":"7. Consolidate duplicates","level":2},{"id":"8-build-the-yardstick-and-compare","text":"8. Build the yardstick and compare","level":2},{"id":"9-author-and-activate-a-playbook","text":"9. Author and activate a playbook","level":2},{"id":"10-run-it-and-record-the-run","text":"10. Run it and record the run","level":2},{"id":"11-qualify-a-finding","text":"11. Qualify a finding","level":2},{"id":"12-promote-to-a-design","text":"12. Promote to a design","level":2},{"id":"13-14-15-plan-prd-work-backlog","text":"13, 14, 15. Plan, PRD, work backlog","level":2},{"id":"16-export","text":"16. Export","level":2},{"id":"17-import-and-verify","text":"17. Import and verify","level":2},{"id":"what-the-chain-produces","text":"What the chain produces","level":2},{"id":"what-it-costs","text":"What it costs","level":2},{"id":"what-you-should-have-now","text":"What you should have now","level":2},{"id":"next","text":"Next","level":2}]},"20-glossary":{"slug":"20-glossary","num":"20","title":"Glossary","lede":"Every BuildOS word used in this set, defined in plain language, in one alphabetical list.","html":"<h2 id=\"how-to-use-this-article\"><span>How to use this article<\/span><a class=\"h-anchor\" href=\"#/20-glossary/how-to-use-this-article\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>You arrived here because one word stopped you. Find that word, read the two or three lines under it, and go back to what you were doing. Where a definition needs another word from this article, it links to it. Paths under <strong>Where it lives<\/strong> are real, written from the root of the copied folder.<\/p>\n<hr>\n<h2 id=\"the-words\"><span>The words<\/span><a class=\"h-anchor\" href=\"#/20-glossary/the-words\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<h3 id=\"active-set-evolution\"><span>active-set evolution<\/span><a class=\"h-anchor\" href=\"#/20-glossary/active-set-evolution\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Changing a numbered set of documents by adding new numbered change documents, rather than rewriting the ones already there.<\/p>\n<p><strong>In practice.<\/strong> You meet this when a <a href=\"#/20-glossary/prd\">PRD<\/a> that people are already working from needs to change.<\/p>\n<hr>\n<h3 id=\"adapter\"><span>adapter<\/span><a class=\"h-anchor\" href=\"#/20-glossary/adapter\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A component of the companion export skill that adds one target platform&#39;s authoring rules on top of the base export contract: the title grammar, the property set, and how deep each description section has to go. An adapter is running code rather than a note to the agent. It runs its own checks when the file is written, and its errors stop the write.<\/p>\n<p><strong>Not to be confused with.<\/strong> Anything in your BuildOS project. Adapters belong to the exporter skill that ships beside BuildOS, not to BuildOS itself. See <a href=\"#/14-export-to-a-work-tracker\">Export to a work tracker<\/a>.<\/p>\n<hr>\n<h3 id=\"agent\"><span>agent<\/span><a class=\"h-anchor\" href=\"#/20-glossary/agent\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A language model plus the software wrapped around it, working on the files in your folder. The model supplies the reading and writing. The software supplies the tools, the folder, and the loop that keeps it going.<\/p>\n<p><strong>Not to be confused with.<\/strong> BuildOS. BuildOS is a folder of files that steers an agent. It is not a model and it does not run one.<\/p>\n<hr>\n<h3 id=\"agent-harness\"><span>agent harness<\/span><a class=\"h-anchor\" href=\"#/20-glossary/agent-harness\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The software wrapped around a language model that gives it tools, a working folder, and a loop.<\/p>\n<p><strong>In practice.<\/strong> This set says &quot;your agent&quot; rather than naming a product, because BuildOS keeps its instructions in files and any capable tool can read them. See <a href=\"#/16-harness-independence-and-trust\">Harness independence and trust<\/a>.<\/p>\n<p><strong>Not to be confused with.<\/strong> The intelligence. People say the harness writes the code, when the writing comes from the model and the harness only supplies the hands.<\/p>\n<hr>\n<h3 id=\"agentsmd\"><span>AGENTS.md<\/span><a class=\"h-anchor\" href=\"#/20-glossary/agentsmd\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>See <a href=\"#/20-glossary/router\">router<\/a>.<\/p>\n<hr>\n<h3 id=\"alias\"><span>alias<\/span><a class=\"h-anchor\" href=\"#/20-glossary/alias\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Another approved spelling of the phrase that names a <a href=\"#/20-glossary/persona\">persona<\/a>. A person has to approve it. An agent that reads a name in a document cannot add one on its own.<\/p>\n<p><strong>Where it lives.<\/strong> The <code>aliases[]<\/code> field on a persona row.<\/p>\n<hr>\n<h3 id=\"anchor\"><span>anchor<\/span><a class=\"h-anchor\" href=\"#/20-glossary/anchor\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The <code>#<\/code> fragment on the end of a path, naming one place inside a Markdown file. It is normally a heading: take the heading text, lowercase it, and replace each space with a hyphen. A file with the heading <code>## Reservation rules<\/code> gives you the anchor <code>#reservation-rules<\/code>.<\/p>\n<p><strong>In practice.<\/strong> You write anchors into a <a href=\"#/20-glossary/source-anchor\">source anchor<\/a> field, and you read them out of a run&#39;s <code>raw-findings.md<\/code> when you qualify a <a href=\"#/20-glossary/raw-finding\">raw finding<\/a>. <a href=\"#/07-pull-knowledge-out-of-it\">Pull knowledge out of it<\/a> shows one worked example.<\/p>\n<hr>\n<h3 id=\"backlog\"><span>backlog<\/span><a class=\"h-anchor\" href=\"#/20-glossary/backlog\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A folder of phase files describing work to be done. Each phase holds stages, and each stage holds checkbox tasks with plain-bullet acceptance criteria under them.<\/p>\n<p><strong>Where it lives.<\/strong> <code>docs/work/YYYY-MM-DD-w{W}-r{R}-&lt;slug&gt;/<\/code><\/p>\n<hr>\n<h3 id=\"candidate\"><span>candidate<\/span><a class=\"h-anchor\" href=\"#/20-glossary/candidate\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A status on a <a href=\"#/20-glossary/converted-twin\">converted twin<\/a> meaning the text is useful but a person should read it before anyone relies on it.<\/p>\n<p><strong>Not to be confused with.<\/strong> The same word on an <a href=\"#/20-glossary/entity-record\">entity record<\/a>. It is not legal there, and the validator rejects it. The equivalent for a record is <code>draft<\/code>.<\/p>\n<hr>\n<h3 id=\"canonical-id\"><span>canonical ID<\/span><a class=\"h-anchor\" href=\"#/20-glossary/canonical-id\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>See <a href=\"#/20-glossary/terminal-id\">terminal ID<\/a>.<\/p>\n<hr>\n<h3 id=\"capability\"><span>capability<\/span><a class=\"h-anchor\" href=\"#/20-glossary/capability\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A record of something a system can do. It is a description rather than a demand, and it may turn out to be false, which is what testing is for.<\/p>\n<p><strong>Not to be confused with.<\/strong> A feature. See <a href=\"#/20-glossary/feature\">feature<\/a>.<\/p>\n<hr>\n<h3 id=\"category\"><span>category<\/span><a class=\"h-anchor\" href=\"#/20-glossary/category\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Which of four folders a <a href=\"#/20-glossary/playbook\">playbook<\/a> sits in: <code>administrative<\/code>, <code>build<\/code>, <code>discovery<\/code>, <code>testing<\/code>. The folder decides the category, so there is no separate setting to get wrong.<\/p>\n<p>Read the four names with &quot;the system&quot; after them: administer the system, build the system, run discovery about the system, test the system. &quot;The system&quot; means the thing you are studying, not BuildOS. <code>administrative<\/code> is the name that misleads. A careful newcomer read it as &quot;administering BuildOS&quot; and used the folder backwards for weeks. Nothing in the name corrects that, so correct it yourself each time you read it.<\/p>\n<p><strong>Where it lives.<\/strong> <code>playbooks/&lt;category&gt;/&lt;slug&gt;.md<\/code><\/p>\n<hr>\n<h3 id=\"compat-mode-and-strict-mode\"><span>compat mode and strict mode<\/span><a class=\"h-anchor\" href=\"#/20-glossary/compat-mode-and-strict-mode\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Two levels of strictness when checking entity data. <code>compat<\/code> reports an old record with no forwarding pointer, and a missing lookup file, as warnings. <code>strict<\/code> treats both as failures.<\/p>\n<p><strong>In practice.<\/strong> A fresh copy of the folder fails <code>strict<\/code>, because the entity lookup file has never been built. That is expected, not a defect in your setup.<\/p>\n<hr>\n<h3 id=\"computer-use\"><span>computer use<\/span><a class=\"h-anchor\" href=\"#/20-glossary/computer-use\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>An agent driving the mouse and keyboard as if it were a person sitting at the machine, instead of calling a programming interface. It is one of the tool kinds a playbook can declare.<\/p>\n<p><strong>In practice.<\/strong> The tool that drives sits outside BuildOS. The folder records what happened afterwards.<\/p>\n<hr>\n<h3 id=\"consolidation-manifest\"><span>consolidation manifest<\/span><a class=\"h-anchor\" href=\"#/20-glossary/consolidation-manifest\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A reviewed file listing which records fold into which. Planning one changes nothing. Applying it is a separate, deliberate step that you have to ask for.<\/p>\n<hr>\n<h3 id=\"contract\"><span>contract<\/span><a class=\"h-anchor\" href=\"#/20-glossary/contract\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The rule book for one kind of file. It says which fields that file must carry and which states it may be in. A contract beats a template and beats a <a href=\"#/20-glossary/router\">router<\/a>.<\/p>\n<p><strong>In practice.<\/strong> You do not have to read them. Know that they are the authority, and your agent will follow them without being told.<\/p>\n<p><strong>Where it lives.<\/strong> <code>.os/contracts/<\/code>, holding ten contracts plus the two router files.<\/p>\n<hr>\n<h3 id=\"convert\"><span>convert<\/span><a class=\"h-anchor\" href=\"#/20-glossary/convert\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Turning a file from outside into clean text inside BuildOS, using code rather than a model. The same input gives the same output every time.<\/p>\n<p><strong>Not to be confused with.<\/strong> <a href=\"#/20-glossary/extraction\">Extraction<\/a>. Converting produces text. Extraction reads that text and writes records. The two get mixed up constantly, including by people who know better.<\/p>\n<p><strong>Where it lives.<\/strong> <code>.os/scripts/buildos intake convert --source &lt;path&gt;<\/code><\/p>\n<hr>\n<h3 id=\"converted-twin\"><span>converted twin<\/span><a class=\"h-anchor\" href=\"#/20-glossary/converted-twin\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The clean text copy of an original file, carrying a header that records where it came from, a fingerprint of the original, what produced it, and when. Also called a converted source.<\/p>\n<p><strong>Not to be confused with.<\/strong> Something true. The copy is faithful to the original file, which is a different claim. If the original was wrong, so is the copy.<\/p>\n<p><strong>Where it lives.<\/strong> <code>assets/&lt;source-slug&gt;/<\/code><\/p>\n<hr>\n<h3 id=\"design\"><span>design<\/span><a class=\"h-anchor\" href=\"#/20-glossary/design\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A dated document recording one decision: what was chosen, what else was considered, and what follows from it.<\/p>\n<p><strong>Where it lives.<\/strong> <code>docs/designs/YYYY-MM-DD-&lt;slug&gt;.md<\/code><\/p>\n<hr>\n<h3 id=\"entity-record\"><span>entity record<\/span><a class=\"h-anchor\" href=\"#/20-glossary/entity-record\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>One line of JSON describing one thing, with a stable ID that nothing else uses.<\/p>\n<p><strong>In practice.<\/strong> You do not open these files. Ask your agent to show you the rows as a table.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>No tool writes requirements, capabilities, personas, test cases, or results. They are written by hand. See <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a>.<\/p>\n<\/div><\/aside>\n<p><strong>Where it lives.<\/strong> <code>.os/data/*.jsonl<\/code>, across eight files.<\/p>\n<hr>\n<h3 id=\"environment\"><span>environment<\/span><a class=\"h-anchor\" href=\"#/20-glossary/environment\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>One deployment, tenant, sandbox, or configuration of a configured <a href=\"#/20-glossary/system\">system<\/a>. What you prove is only true of the environment you proved it in.<\/p>\n<p><strong>In practice.<\/strong> The configuration has no field for a web address and none for whether the environment works today. Keep those somewhere else.<\/p>\n<p><strong>Where it lives.<\/strong> The <code>environments<\/code> list in <code>.os/config/instance.yaml<\/code>.<\/p>\n<hr>\n<h3 id=\"epic\"><span>epic<\/span><a class=\"h-anchor\" href=\"#/20-glossary/epic\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Not a BuildOS word. It comes from work trackers, and it is the fastest way to explain the shape of a <a href=\"#/20-glossary/backlog\">backlog<\/a>: the backlog folder behaves like an epic, each phase file like a feature, each stage like a work item, and each checkbox like a task.<\/p>\n<p>None of those four words appears in a file.<\/p>\n<hr>\n<h3 id=\"evidence\"><span>evidence<\/span><a class=\"h-anchor\" href=\"#/20-glossary/evidence\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The raw material captured during a <a href=\"#/20-glossary/run\">run<\/a>: screenshots, logs, command output, transcripts. It freezes when the run closes.<\/p>\n<p><strong>Not to be confused with.<\/strong> Somebody saying what happened. A description of a defect is not evidence, and a vendor who cannot reproduce it from your description will ask you to show it.<\/p>\n<p><strong>Where it lives.<\/strong> The <code>evidence/<\/code> folder inside the run folder.<\/p>\n<hr>\n<h3 id=\"execution-mode\"><span>execution mode<\/span><a class=\"h-anchor\" href=\"#/20-glossary/execution-mode\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>How much a playbook spells out. <code>explicit-steps<\/code> means do exactly this. <code>guided-objective<\/code> means reach this outcome, your call how. <code>inferred-actions<\/code> means work out the steps. <code>n/a<\/code> is for <a href=\"#/20-glossary/guardrail\">guardrails<\/a>, which are not run at all. Spelled <code>execution_mode<\/code> in the file.<\/p>\n<hr>\n<h3 id=\"extraction\"><span>extraction<\/span><a class=\"h-anchor\" href=\"#/20-glossary/extraction\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A record saying: I read this part of this <a href=\"#/20-glossary/converted-twin\">converted twin<\/a>, and these entity records came out of it.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>No tool writes these rows. The file is empty and stays empty unless somebody writes to it by hand. See <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a>.<\/p>\n<\/div><\/aside>\n<p><strong>Where it lives.<\/strong> Row

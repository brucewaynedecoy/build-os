re studying, such as opening a page or filling in a form to see what happens. That attempt is a <strong>run<\/strong>: one recorded attempt at doing something.<\/p>\n<p>Runs against a web application need the agent to control a browser. That is a separate capability from reading and writing files, and plenty of capable agent tools do not have it.<\/p>\n<p>Check two things before you commit to a tool:<\/p>\n<ul>\n<li>Browser and screen control tends to belong to desktop agent applications rather than editor extensions. The same vendor may offer it in one product and not in another.<\/li>\n<li>A built-in browser inside an agent tool may not be able to hold a login session.<\/li>\n<\/ul>\n<p>You do not need this capability for <a href=\"#/05-bring-in-source-material\">Bring in source material<\/a> or for the configuration work in <a href=\"#/04-install-and-configure-your-instance\">Install and configure your instance<\/a>. You do need it, or a person willing to do the clicking, before <a href=\"#/08-write-and-run-a-playbook\">Write and run a playbook<\/a>.<\/p>\n<h3 id=\"prove-your-tool-works-before-you-go-further\"><span>Prove your tool works before you go further<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/prove-your-tool-works-before-you-go-further\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Do these three checks. They take about two minutes.<\/p>\n<ol>\n<li>Point the agent at an empty folder and ask it to create a file with one line in it.<\/li>\n<li>Look for that file on disk yourself, in a file browser or a terminal. Do not take the agent&#39;s word for it.<\/li>\n<li>Ask the agent to run a command that prints something, and check the output appears.<\/li>\n<\/ol>\n<p>If any of those fails, stop and fix the tool before you go further.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>An agent can accept your prompts and silently do nothing before a licence agreement has been signed inside the tool. No error appears. The conversation looks normal and the disk never changes. Check 2 above is what catches this.<\/p>\n<\/div><\/aside>\n<hr>\n<h2 id=\"get-buildos-into-your-project\"><span>Get BuildOS into your project<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/get-buildos-into-your-project\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<h3 id=\"how-you-get-it\"><span>How you get it<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/how-you-get-it\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>BuildOS is one npm package, <code>build-os<\/code>. You do not download, copy, or build anything by hand. In <a href=\"#/04-install-and-configure-your-instance\">Install and configure your instance<\/a>, your agent runs one command in your project folder, <code>npx -y build-os@0.1.0 init<\/code>, and BuildOS puts its files there.<\/p>\n<h3 id=\"choose-your-project-folder\"><span>Choose your project folder<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/choose-your-project-folder\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<ol>\n<li>Choose a folder on your machine&#39;s own hard drive for your project. Not a cloud-synced folder, and not your Documents folder if that folder syncs.<\/li>\n<li>Make it a git repository, or use your team&#39;s existing project repository. If the repository lives on a hosting service, ask whoever holds it to give your account access, accept the invitation, and confirm you can actually open it in a browser. Accepting is not the same as having access.<\/li>\n<li>The folder can be empty, or it can already hold your own files. BuildOS adds its files next to them. In a new setup, it stops and changes nothing when one of its files would replace one of yours; in your <code>AGENTS.md<\/code>, <code>CLAUDE.md<\/code>, and <code>.gitignore<\/code> it adds only its own marked section.<\/li>\n<\/ol>\n<h3 id=\"if-you-cannot-get-access\"><span>If you cannot get access<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/if-you-cannot-get-access\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Access to your team&#39;s project repository fails in more than one way, and it is the most likely thing to stop you on day one.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>On a repository owned by an organization, the personal invite-a-collaborator flow may do nothing at all. Access on those repositories is controlled by organization roles and policies instead. The hosting platform&#39;s own help text says so. If you sent an invite and the other person still cannot see anything, this is the most likely cause. Ask an organization administrator to grant access through the organization, not through the repository.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Adding a person by username can fail silently. If a username lookup appears to succeed and nothing arrives, try the email address instead.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>An accepted invitation that immediately locks you out looks like success. If the account is governed by single sign-on that has not been provisioned for you, you will see a message along the lines of &quot;user is not assigned to the application.&quot; That is an identity problem, not a repository problem, and only your identity administrators can clear it.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Forking a repository from outside your organization into your enterprise organization may be blocked by policy, with the Fork control disabled. There is no workaround from your side.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Two people can create two repositories with the same name and then clone different ones. Confirm the full owner-and-name of the repository, not the name on its own.<\/p>\n<\/div><\/aside>\n<p>If none of the sanctioned routes are open to you, the practical answer is to work in a repository that everyone involved can actually reach. Nothing in BuildOS depends on where the project lives, because the whole system is files in a folder.<\/p>\n<hr>\n<h2 id=\"learn-enough-git-to-be-safe\"><span>Learn enough git to be safe<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/learn-enough-git-to-be-safe\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>This section covers the small set of git habits that made the difference for people who had never used version control. Anything past that, look up elsewhere.<\/p>\n<p><strong>Git<\/strong> is version control: a record of every change to every file in the project. BuildOS is git-native, and git provides the only undo you get.<\/p>\n<h3 id=\"the-diff-view\"><span>The diff view<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/the-diff-view\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Most people learn version control for backup. In BuildOS the more useful reason is review.<\/p>\n<p>An agent makes changes to your documents. The diff view is the side-by-side display of a file before and after, and it shows you <strong>where the agent touched it<\/strong>. Treat reading a diff as reviewing somebody else&#39;s work rather than as disaster recovery. That framing is what worked on real newcomers.<\/p>\n<h3 id=\"three-habits\"><span>Three habits<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/three-habits\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<ol>\n<li><strong>Commit before you bring in new material.<\/strong> Then the only uncommitted changes in the folder are the ones the import produced, and you can throw the whole import away in one action if it went badly.<\/li>\n<li><strong>Commit before a long agent run.<\/strong> Same reason. From a clean starting point you can throw a bad run away instead of picking it apart afterwards.<\/li>\n<li><strong>Read the diff before you commit anything an agent wrote.<\/strong> Open each changed file and look at what changed. Nothing else reviews the agent&#39;s output for you.<\/li>\n<\/ol>\n<h3 id=\"the-mechanics\"><span>The mechanics<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/the-mechanics\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<ul>\n<li><strong>See what changed.<\/strong> In most editors, a source-control panel lists changed files. New files, modified files, and deleted files are marked differently.<\/li>\n<li><strong>Open a changed file to see the diff.<\/strong> The old version and the new version, side by side.<\/li>\n<li><strong>Stage deliberately.<\/strong> Choose which changes go into this commit. Do not let the editor decide for you.<\/li>\n<li><strong>Write a message that says what you did.<\/strong> &quot;Edited agent instructions&quot; is a good message.<\/li>\n<li><strong>Commit, then push.<\/strong> A commit is local and reversible. Pushing is what makes it visible to anyone else.<\/li>\n<li><strong>Discard a change you do not want.<\/strong> This is the undo.<\/li>\n<\/ul>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Some editors will commit unstaged changes if you type a message and click commit with nothing staged. You can end up committing work you meant to leave alone. Stage first, then check what is staged, then commit.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Do not discard a file only because you do not recognize it. As a rule of thumb, anything named after a BuildOS artifact is probably real work, and that includes <code>run.md<\/code>, <code>raw-findings.md<\/code> and <code>finding.md<\/code>. Ask before you discard it.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Do not commit large binary files. A large file committed by accident can stall a sync and block a planned working session. If a file is large, keep it outside the repository and reference it instead.<\/p>\n<\/div><\/aside>\n<hr>\n<h2 id=\"working-inside-a-restrictive-corporate-environment\"><span>Working inside a restrictive corporate environment<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/working-inside-a-restrictive-corporate-environment\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A tightly controlled environment rarely blocks BuildOS itself. BuildOS is plain text files plus git and one command-line program, with no server to start, no port to open, no database, and no network calls of its own. It needs Node.js 24 or newer and, once per version, the npm registry. Restrictions in a managed environment land on your <strong>agent&#39;s<\/strong> privileges instead: what it may install, what it may write, and where it may reach.<\/p>\n<p>Expect the agent to need help at specific moments on a locked-down machine. If it is denied write access to the project and refuses to act, ask it to print the git commands it wants to run, then run them yourself in a terminal.<\/p>\n<h3 id=\"environment-problems-to-expect\"><span>Environment problems to expect<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/environment-problems-to-expect\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>These are the environment problems most likely to stop work.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Problem<\/th>\n<th>What it looks like<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>No corporate identity for an external collaborator<\/td>\n<td>Both routes to request access need a corporate laptop or VPN the collaborator does not have<\/td>\n<td>Move the project to a repository everyone can reach.<\/td>\n<\/tr>\n<tr>\n<td>Chat file sharing blocked by identity<\/td>\n<td>One party cannot attach a file in the corporate chat tool because they have no client identity<\/td>\n<td>Fall back to email, and expect it to be slow and error-prone.<\/td>\n<\/tr>\n<tr>\n<td>Direct download of a language runtime blocked<\/td>\n<td>The download stops mid-transfer with a malware warning<\/td>\n<td>Use the employer&#39;s approved-software portal. Ask whether one exists.<\/td>\n<\/tr>\n<tr>\n<td>npm registry blocked<\/td>\n<td><code>npx<\/code> stops with a network or certificate error and BuildOS never starts<\/td>\n<td>Install BuildOS from the package file instead. <a href=\"#/04-install-and-configure-your-instance\">Install and configure your instance<\/a> has the steps.<\/td>\n<\/tr>\n<tr>\n<td>AI policy gate<\/td>\n<td>A redirect page and an acceptance agreement before reaching a non-approved AI site, then a warning on every invocation of the approved one<\/td>\n<td>Accept and continue. There is no fix.<\/td>\n<\/tr>\n<tr>\n<td>Licence terms<\/td>\n<td>A vendor&#39;s terms forbid plugging an enterprise subscription into a third-party agent tool<\/td>\n<td>Run different tools and coordinate through git.<\/td>\n<\/tr>\n<tr>\n<td>Repeated forced sign-ins<\/td>\n<td>Sign-in prompts several times an hour, interrupting whatever the agent is doing<\/td>\n<td>Commit locally, and push from a separately authenticated desktop git client.<\/td>\n<\/tr>\n<tr>\n<td>Meeting transcripts locked to the organizer<\/td>\n<td>Only the person who booked the meeting can get the transcript<\/td>\n<td>There is no fix. Check this before you plan to feed meeting recordings into BuildOS.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<hr>\n<h2 id=\"what-will-go-wrong-here\"><span>What will go wrong here<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/what-will-go-wrong-here\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A short list of the failures most likely to hit you on day one, with what to do about each.<\/p>\n<p><strong>The agent accepts prompts and nothing happens on disk.<\/strong> A licence agreement inside the tool has probably not been signed. No error is shown. Check the disk yourself, then look for an agreement prompt in the tool&#39;s settings.<\/p>\n<p><strong>You installed the wrong product.<\/strong> Vendors ship several similarly named applications, and one of them is not an agent tool. Confirm the exact product name before you spend a session on it.<\/p>\n<p><strong>The command-line installer for your agent tool hangs.<\/strong> If the command-line route stalls, switch to the desktop application instead of debugging it.<\/p>\n<p><strong>Your agent tool cannot control a browser.<\/strong> No extension may exist for it. Building a substitute can take most of a working call, and a common root cause of the failed attempts is a required runtime that was never installed. Plan for a person to do the clicking instead, or choose a tool with the capability.<\/p>\n<p><strong>Git tooling fails on your machine.<\/strong> If git is fighting you, try the desktop client before you try anything else. It tends to succeed where an editor integration or a command-line client does not.<\/p>\n<p><strong>You cannot tell folders from files in your editor.<\/strong> This blocked a newcomer through an entire walkthrough until a file-icon extension fixed it.<\/p>\n<p><strong>Your agent tool asks to restart constantly.<\/strong> This is normal harness behaviour. It is also the correct first fix when a newly installed capability does not appear.<\/p>\n<p><strong>Access does not arrive.<\/strong> Requests through IT can take days. Plan for that, and start the request before you need it.<\/p>\n<p><a href=\"#/17-when-things-go-wrong\">When things go wrong<\/a> collects the recovery steps for problems that appear later, once you are actually using the system.<\/p>\n<hr>\n<h2 id=\"what-you-should-have-now\"><span>What you should have now<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/what-you-should-have-now\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>An agent tool that can read files, write files, and run commands in a folder on your machine, proven by a file you found on disk yourself.<\/li>\n<li>A clear answer to whether that tool can drive a browser, and a plan if it cannot.<\/li>\n<li>A project folder on your machine&#39;s own hard drive, outside any synced folder, under git.<\/li>\n<li>The ability to see what changed, stage it, commit it, push it, and discard a change.<\/li>\n<li>The three git habits written down: commit before you bring in material, commit before a long run, read the diff before you commit agent work.<\/li>\n<li>Node.js 24 or newer installed, checked with <code>node --version<\/code>.<\/li>\n<li>A plain-language answer for each of six terms this documentation assumes: exit code, environment variable, <code>PATH<\/code>, shell, runtime, and branch.<\/li>\n<\/ul>\n<h2 id=\"next\"><span>Next<\/span><a class=\"h-anchor\" href=\"#/03-before-you-start/next\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><a href=\"#/04-install-and-configure-your-instance\">Install and configure your instance<\/a>, which sets up BuildOS in your project with one command and names your own systems, environments, and owners.<\/p>\n","toc":[{"id":"what-you-need-first","text":"What you need first","level":2},{"id":"five-prerequisites","text":"Five prerequisites","level":2},{"id":"terms-from-outside-buildos","text":"Terms from outside BuildOS","level":2},{"id":"exit-code","text":"Exit code","level":3},{"id":"environment-variable","text":"Environment variable","level":3},{"id":"path","text":"PATH","level":3},{"id":"shell","text":"Shell","level":3},{"id":"runtime","text":"Runtime","level":3},{"id":"branch","text":"Branch","level":3},{"id":"get-an-agent-tool","text":"Get an agent tool","level":2},{"id":"the-capabilities-your-agent-needs","text":"The capabilities your agent needs","level":3},{"id":"driving-a-browser-is-a-separate-capability","text":"Driving a browser is a separate capability","level":3},{"id":"prove-your-tool-works-before-you-go-further","text":"Prove your tool works before you go further","level":3},{"id":"get-buildos-into-your-project","text":"Get BuildOS into your project","level":2},{"id":"how-you-get-it","text":"How you get it","level":3},{"id":"choose-your-project-folder","text":"Choose your project folder","level":3},{"id":"if-you-cannot-get-access","text":"If you cannot get access","level":3},{"id":"learn-enough-git-to-be-safe","text":"Learn enough git to be safe","level":2},{"id":"the-diff-view","text":"The diff view","level":3},{"id":"three-habits","text":"Three habits","level":3},{"id":"the-mechanics","text":"The mechanics","level":3},{"id":"working-inside-a-restrictive-corporate-environment","text":"Working inside a restrictive corporate environment","level":2},{"id":"environment-problems-to-expect","text":"Environment problems to expect","level":3},{"id":"what-will-go-wrong-here","text":"What will go wrong here","level":2},{"id":"what-you-should-have-now","text":"What you should have now","level":2},{"id":"next","text":"Next","level":2}]},"04-install-and-configure-your-instance":{"slug":"04-install-and-configure-your-instance","num":"04","title":"Install and configure your instance","lede":"Set up BuildOS in your project folder with one command, name your own systems and environments in one configuration file, and check that the system agrees with you.","html":"<h2 id=\"what-you-need-first\"><span>What you need first<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/what-you-need-first\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Read <a href=\"#/03-before-you-start\">Before you start<\/a> first. This page assumes it. You need three things:<\/p>\n<ul>\n<li><strong>Node.js 24 or newer<\/strong> on the machine where your agent runs. It is the only thing BuildOS needs. To check, run <code>node --version<\/code>. It must print <code>v24<\/code> or a higher number.<\/li>\n<li><strong>A project folder<\/strong> on your machine&#39;s own hard drive, ideally a git repository. It can be empty, or it can already hold your own files.<\/li>\n<li><strong>An agent tool<\/strong> that can read and write files and run commands in that folder.<\/li>\n<\/ul>\n<p>Your agent can run every command on this page for you. You make two decisions: whether to set up Make Docs, and what to name your systems, environments, and owners.<\/p>\n<p>This page uses a few words that belong to the terminal rather than to BuildOS: exit code, <code>PATH<\/code>, shell. <a href=\"#/03-before-you-start\">Before you start<\/a> defines them under &quot;Terms from outside BuildOS&quot;. In any command, text in angle brackets such as <code>&lt;path&gt;<\/code> is a placeholder for your own value.<\/p>\n<hr>\n<h2 id=\"set-up-buildos-in-your-project\"><span>Set up BuildOS in your project<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/set-up-buildos-in-your-project\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<h3 id=\"the-one-command\"><span>The one command<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/the-one-command\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Open your project folder in your agent tool and ask the agent to run this command there:<\/p>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">npx -y build-os@0.1.0 init\n<\/code><\/pre><\/div>\n<p><code>npx<\/code> comes with Node.js. It fetches the BuildOS package from the npm registry, keeps a copy in npm&#39;s own cache folder on your machine (so the next run of the same version is faster), and runs it. It installs no <code>buildos<\/code> command for the whole machine, and the only files it adds to your project are the ones <code>buildos init<\/code> writes. <code>0.1.0<\/code> is the BuildOS version; use the version your team agreed on.<\/p>\n<h3 id=\"the-one-question-make-docs\"><span>The one question: Make Docs<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/the-one-question-make-docs\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Before <code>buildos init<\/code> writes anything, it needs one answer: <strong>set up Make Docs in this project?<\/strong><\/p>\n<p>Make Docs is a separate, optional documentation tool. It adds the folders <code>docs/designs/<\/code>, <code>docs/plans/<\/code>, <code>docs/prd/<\/code> (requirements documents), and <code>docs/work/<\/code> (work backlogs), each with instructions for agents, and keeps its templates, contracts, prompts, and references in <code>.make-docs/system/<\/code>. The later chapters on <a href=\"#/12-designs-plans-and-prds\">designs, plans and PRDs<\/a> and <a href=\"#/13-build-the-work-backlog\">the work backlog<\/a> use it. BuildOS works without it.<\/p>\n<p>An agent usually runs commands without a terminal you can type into. Then <code>buildos init<\/code> does not guess. It stops, changes nothing, and exits with code <code>10<\/code>. Its output tells the agent what to ask you and the exact command for each answer. Here is the real output in an empty folder on macOS or Linux (the folder path is shortened to <code>&lt;project folder&gt;<\/code>; when the real path holds a space or another special character, the commands show it in single quotes, ready to copy):<\/p>\n<div class=\"code-block\" data-lang=\"text\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-text\">Project folder: &lt;project folder&gt;\nStopped. Nothing was changed. BuildOS needs one answer from the user first.\n\nAsk the user: &quot;Set up Make Docs in this project?&quot;\n\nMake Docs is an optional companion tool. It adds docs/ folders for designs, plans, requirements, and work, each with instructions for agents, and keeps its templates, rules, and prompts in .make-docs/, so agents can keep project documents in order.\nIf the user says no, Make Docs cannot be set up in this folder later with this Make Docs version: it does not set up a folder that has an AGENTS.md or CLAUDE.md file that Make Docs did not write, and BuildOS adds such a file here.\n\nIf the user says yes, run:\n  npx -y build-os@0.1.0 init --root &lt;project folder&gt; --make-docs\nIf the user says no, run:\n  npx -y build-os@0.1.0 init --root &lt;project folder&gt; --skip-make-docs\n<\/code><\/pre><\/div>\n<p>On Windows, the two commands are written for Command Prompt, and the folder is in double quotes:<\/p>\n<div class=\"code-block\" data-lang=\"text\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-text\">If the user says yes, run this in Command Prompt:\n  npx -y build-os@0.1.0 init --root &quot;&lt;project folder&gt;&quot; --make-docs\nIf the user says no, run this in Command Prompt:\n  npx -y build-os@0.1.0 init --root &quot;&lt;project folder&gt;&quot; --skip-make-docs\n<\/code><\/pre><\/div>\n<p>Your agent should ask you the question in plain words and then run the one command for your answer. If you type the command yourself in a terminal, <code>buildos init<\/code> asks <code>Set up Make Docs in this project? [Y/n]<\/code> instead.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Decide now. With the Make Docs version BuildOS is tested with (2.0.9), Make Docs cannot be set up later in a folder that has an <code>AGENTS.md<\/code> or <code>CLAUDE.md<\/code> that Make Docs did not write. If you answer No in a new project, BuildOS creates those two files, so Make Docs cannot be added there later with that version. If your folder already has your own <code>AGENTS.md<\/code> or <code>CLAUDE.md<\/code>, Make Docs setup will not finish there now or later, and BuildOS setup finishes either way. The output of <code>buildos init<\/code> says which case your folder is in.<\/p>\n<\/div><\/aside>\n<p>When you answer Yes, Make Docs runs first, then BuildOS adds its files. If Make Docs fails, BuildOS is still set up: the output says that Make Docs is not set up and shows the exact command to try it again.<\/p>\n<h3 id=\"what-buildos-init-does\"><span>What <code>buildos init<\/code> does<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/what-buildos-init-does\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>After your answer, <code>buildos init<\/code> lists every file it will add, then adds them. The end of the output for a No answer looks like this:<\/p>\n<div class=\"code-block\" data-lang=\"text\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-text\">Shared files. BuildOS changes only its own section of these files, between its buildos:begin and buildos:end lines, and only when that section is still exactly as BuildOS wrote it.\n  AGENTS.md: created, with only the BuildOS section\n  CLAUDE.md: created, with only the BuildOS section\n  .gitignore: created, with only the BuildOS section\n\nDone. BuildOS is set up in this folder.\nMake Docs: not set up, as chosen. With this Make Docs version, Make Docs cannot be set up in this folder later. This Make Docs version does not set up a folder that has an AGENTS.md or CLAUDE.md file that Make Docs did not write.\n<\/code><\/pre><\/div>\n<p>Exit code <code>0<\/code> means it worked. How it treats your files:<\/p>\n<ul>\n<li><strong>In a new setup, it does not replace your files.<\/strong> It adds the BuildOS folders (<code>.os/<\/code>, <code>assets/<\/code>, <code>playbooks/<\/code>, <code>workspace/<\/code>) next to what is already there. If a file it must add already exists, it changes nothing, lists the clashing files, and exits with code <code>10<\/code>. Move or back up those files, then run it again.<\/li>\n<li><strong>It shares three files.<\/strong> In <code>AGENTS.md<\/code>, <code>CLAUDE.md<\/code>, and <code>.gitignore<\/code>, BuildOS adds only its own marked section and never changes another line.<\/li>\n<li><strong>It tries to undo everything when a step fails.<\/strong> It removes what it created and puts back what it replaced. When it cannot put a path back (for example, you changed that file while it ran), it lists each such path, exits with code <code>10<\/code>, and the JSON result says <code>partially_applied<\/code>. Then look at each listed path: keep your own version or delete the leftover, and run <code>buildos init<\/code> again. Make Docs makes its own writes when you answer Yes, and BuildOS does not undo those. A crash or a power cut in the middle of a run is not undone either: what was already written stays (each single file is either the old one or the new one).<\/li>\n<li><strong>You can look first.<\/strong> Add <code>--dry-run<\/code> to see the plan without writing anything.<\/li>\n<li><strong>Running it again is safe.<\/strong> In a folder that is already set up, it changes nothing except a BuildOS section that is out of date.<\/li>\n<\/ul>\n<p>It also writes <code>.os/manifest.json<\/code>, which records the BuildOS version this project uses:<\/p>\n<div class=\"code-block\" data-lang=\"json\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-json\">{\n  &quot;schema_version&quot;: 1,\n  &quot;buildos_version&quot;: &quot;0.1.0&quot;,\n  &quot;initialized_at&quot;: &quot;2026-11-24T22:15:17.018Z&quot;\n}\n<\/code><\/pre><\/div>\n<h3 id=\"a-project-set-up-with-the-earlier-tools\"><span>A project set up with the earlier tools<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/a-project-set-up-with-the-earlier-tools\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>If your project was set up with the earlier BuildOS tools (it has an <code>.os/<\/code> folder but no <code>.os/manifest.json<\/code>), the same command adopts it. It adopts only a folder that looks like such a project: one with an <code>.os/data/<\/code> folder, or with all five of <code>.os/<\/code>, <code>assets/<\/code>, <code>docs/<\/code>, <code>playbooks/<\/code>, and <code>workspace/<\/code>. Any other <code>.os/<\/code> folder, an empty one too, stops it with exit code <code>10<\/code> and nothing written.<\/p>\n<p>Adoption writes only <code>.os/manifest.json<\/code>, the command wrappers in <code>.os/scripts/<\/code>, and the skills in <code>.os/skills/<\/code>. Where the earlier tools left a wrapper or a skill file at one of those paths, adoption replaces that file with the new one (it keeps the file&#39;s permission bits). If you changed one of those files yourself, copy your change somewhere else first. Your data, runs, findings, indexes, and configuration stay exactly as they were, and adoption never writes <code>AGENTS.md<\/code>, <code>CLAUDE.md<\/code>, or <code>.gitignore<\/code>. The old Python validator script in <code>.os/scripts/<\/code> stays in place; <code>buildos init<\/code> names it in a note. BuildOS no longer uses it, and you can delete it.<\/p>\n<hr>\n<h2 id=\"run-buildos-commands\"><span>Run BuildOS commands<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/run-buildos-commands\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<h3 id=\"the-project-wrapper\"><span>The project wrapper<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/the-project-wrapper\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>After setup, every BuildOS command runs through one small script in your project, the <strong>wrapper<\/strong>. From the project folder:<\/p>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">.os/scripts/buildos &lt;command&gt;\n<\/code><\/pre><\/div>\n<p>On Windows, in Command Prompt:<\/p>\n<div class=\"code-block\" data-lang=\"bat\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-bat\">.os\\scripts\\buildos.cmd &lt;command&gt;\n<\/code><\/pre><\/div>\n<p>The wrapper always runs the version in <code>.os/manifest.json<\/code> (pin first). It reads that version first. Then it looks for an npm install of exactly that version: in the <code>node_modules<\/code> folder of the project folder or of a folder above it (as Node.js looks, so an install in the root folder of an npm workspace counts), or the first <code>buildos<\/code> program on <code>PATH<\/code>, for example one installed for the whole machine with <code>npm install -g<\/code>. It reads only the package files and starts no program to check the version. A global install is used only when it is an npm install of exactly the pinned version; otherwise the wrapper fetches the pinned version through <code>npx<\/code>. Acceptance goes by layout, not by tool: a package folder <code>node_modules/build-os<\/code> with a matching <code>package.json<\/code> counts whatever tool made it (for example a local pnpm or Yarn link to such a folder). A shim script that only starts the package (as pnpm, Yarn, and Volta make for a global install) does not count, and the wrapper fetches the pinned version through <code>npx<\/code> instead. Every start also tells BuildOS the pinned version, and BuildOS stops with a plain message (exit code 3) if another version starts. So the project keeps the same version until you change it on purpose, also with a machine-wide <code>buildos<\/code>. BuildOS also checks its own Node.js version when it starts. If an older Node.js starts it (for example an old <code>node<\/code> in the project&#39;s <code>node_modules/.bin<\/code> folder), it stops with a plain message that names both versions (exit code 3).<\/p>\n<p>If Node.js is missing or too old, the wrapper prints one plain line and stops:<\/p>\n<div class=\"code-block\" data-lang=\"text\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-text\">BuildOS needs Node.js 24 or newer on this computer. Install it from https://nodejs.org, then try again.\n<\/code><\/pre><\/div>\n<p>Commands come in groups called <strong>domains<\/strong>: <code>intake<\/code>, <code>discovery<\/code>, <code>design<\/code>, <code>entities<\/code>, <code>validate<\/code>, <code>init<\/code>, <code>version<\/code>, and <code>help<\/code>. BuildOS <code>0.2.0<\/code> adds three domains that skills use: <code>extract<\/code> (<code>extract bulk<\/code>, for the <code>buildos-bulk-extract<\/code> skill), <code>fitgap<\/code> (for <code>fit-gap-analysis<\/code>), and <code>export<\/code> (<code>export azure-boards<\/code>, for <code>buildos-export-azure-boards<\/code>). For example, <code>.os/scripts/buildos intake convert --source &lt;path&gt;<\/code> converts a document. The later chapters use these commands.<\/p>\n<h3 id=\"check-that-it-works\"><span>Check that it works<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/check-that-it-works\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">.os/scripts/buildos version\n<\/code><\/pre><\/div>\n<p>The output names the version:<\/p>\n<div class=\"code-block\" data-lang=\"text\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-text\">version: ok\nroot: not_applicable\nmode: not_applicable\nversion: 0.1.0\nsource revision: &lt;commit&gt;\nwrite status: not_requested\n{\n  &quot;version&quot;: &quot;0.1.0&quot;,\n  &quot;source_revision&quot;: &quot;&lt;commit&gt;&quot;\n}\n<\/code><\/pre><\/div>\n<p><code>.os/scripts/buildos help<\/code> lists every domain, and <code>.os/scripts/buildos help &lt;domain&gt;<\/code> explains one. These help forms always print text, also with <code>--json<\/code> after them. For an <code>intake<\/code>, <code>discovery<\/code>, or <code>design<\/code> command, <code>--help<\/code> after the subcommand (for example <code>intake convert --help<\/code>) lists its flags as an error (exit code <code>1<\/code>). The order of the flags is important. <code>intake convert --json --help<\/code> prints a JSON error result. <code>intake convert --help --json<\/code> prints the text error, because the command stops reading its flags at <code>--help<\/code>. When an agent needs a stable, machine-readable result, add <code>--json<\/code> to <code>version<\/code>, <code>validate<\/code>, <code>init<\/code>, or an <code>entities<\/code>, <code>intake<\/code>, <code>discovery<\/code>, or <code>design<\/code> command: they print one JSON result. The <code>intake<\/code> commands print it from BuildOS <code>0.2.0<\/code>; <code>0.1.0<\/code> refuses the flag there.<\/p>\n<blockquote>\n<p><strong>Note.<\/strong> Some help text shows default paths that start with <code>system/<\/code>, such as <code>--assets-root system/assets<\/code>. That is the layout of the BuildOS source code. In your project, BuildOS uses your project&#39;s own folders (<code>assets/<\/code>, <code>.os/<\/code>) without the <code>system/<\/code> part.<\/p>\n<\/blockquote>\n<h3 id=\"the-old-command-names-end-in-030\"><span>The old command names end in 0.3.0<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/the-old-command-names-end-in-030\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The earlier tools were called <code>buildos-intake<\/code>, <code>buildos-discovery<\/code>, and <code>buildos-design<\/code>. When the BuildOS package is installed (with <code>npm install -g<\/code>, or run through <code>npx<\/code> under one of those names), those command names still work and give the same output, and each run prints one line first:<\/p>\n<div class=\"code-block\" data-lang=\"text\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-text\">Note: the command name &quot;buildos-intake&quot; goes away in BuildOS 0.3.0. Use &quot;buildos intake&quot; instead.\n<\/code><\/pre><\/div>\n<p><strong>The old names stop working in BuildOS <code>0.3.0<\/code>.<\/strong> Use <code>buildos intake<\/code>, <code>buildos discovery<\/code>, and <code>buildos design<\/code> (in a project: <code>.os/scripts/buildos intake<\/code> and so on) in your notes, scripts, and playbooks now.<\/p>\n<p>The project also has three small scripts with the old names: <code>.os/scripts/buildos-intake<\/code>, <code>.os/scripts/buildos-discovery<\/code>, and <code>.os/scripts/buildos-design<\/code> (each with a <code>.cmd<\/code> file on Windows). Each one prints the same note first, then runs <code>.os/scripts/buildos<\/code> with its domain, for example <code>buildos intake<\/code>. The note goes to the error stream (stderr), so the normal output and the exit code stay the same. These scripts are removed in BuildOS <code>0.3.0<\/code> together with the old command names. Use <code>.os/scripts/buildos &lt;domain&gt;<\/code> in anything new.<\/p>\n<hr>\n<h2 id=\"configure-the-instance\"><span>Configure the instance<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/configure-the-instance\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<h3 id=\"what-an-instance-is\"><span>What an instance is<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/what-an-instance-is\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>An <strong>instance<\/strong> is one deployment of BuildOS: one project folder, with its own configuration file naming the real things it is pointed at.<\/p>\n<p>That file is <code>.os/config/instance.yaml<\/code>, and it is the only file in the whole system where your own systems, environments and owners are named. Contracts, templates, and playbooks all stay generic. This one file holds the specifics, and everything else refers back to it by ID.<\/p>\n<h3 id=\"the-four-blocks\"><span>The four blocks<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/the-four-blocks\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p><strong><code>systems<\/code><\/strong> names the things you are studying. A <strong>system<\/strong> is a product, a platform, or an application, described as a <em>type<\/em> rather than as a particular deployment. &quot;The library lending system&quot; is a system. &quot;The library lending system in the sandbox&quot; is an environment instead.<\/p>\n<p><strong><code>environments<\/code><\/strong> names the actual deployments. An <strong>environment<\/strong> is one deployment, tenant, sandbox, or configuration of a configured system, and each environment names which systems it contains. Anything you observe is only true of the environment you observed it in, so these IDs affect every record you write later. This is a different word from an <em>environment variable<\/em> in a terminal. The two are unrelated.<\/p>\n<p><strong><code>owners<\/code><\/strong> names who is accountable. An <strong>owner<\/strong> is a team, organization, vendor, or group. Each one carries a <code>kind<\/code>, which is a lowercase word such as <code>team<\/code>, <code>organization<\/code>, <code>vendor<\/code>, or <code>group<\/code>.<\/p>\n<p><strong><code>defaults<\/code><\/strong> is a convenience. It names the systems, environments, and owners to reach for when nothing more specific is stated. A default is not automatic scope, because each artifact type decides for itself whether defaults apply.<\/p>\n<p>Every <code>id<\/code> is a <strong>slug<\/strong>: lowercase, hyphens, no spaces. Display names in <code>name<\/code> can be as loose as you like.<\/p>\n<h3 id=\"a-worked-example\"><span>A worked example<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/a-worked-example\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Here is a filled-in file for a team studying a community library&#39;s book-lending system that runs on a general-purpose business platform, across one vendor baseline and one configured sandbox. This example validates.<\/p>\n<div class=\"code-block\" data-lang=\"yaml\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-yaml\">version: 1\n\ninstance:\n  id: lending-programme\n  name: Library Lending Programme\n\nsystems:\n  - id: lending-system\n    name: Library Lending System\n    description: The book-lending application this instance studies.\n  - id: business-platform\n    name: Business Platform\n    description: The general-purpose business platform underneath it.\n\nenvironments:\n  - id: vendor-baseline\n    name: Vendor Baseline\n    systems:\n      - lending-system\n      - business-platform\n    description: The unmodified vendor environment, used as the reference.\n  - id: configured-sandbox\n    name: Configured Sandbox\n    systems:\n      - lending-system\n    description: The configured environment used for experiments.\n\nowners:\n  - id: product-team\n    name: Product Team\n    kind: team\n  - id: platform-vendor\n    name: Platform Vendor\n    kind: vendor\n\ndefaults:\n  systems:\n    - lending-system\n  environments:\n    - vendor-baseline\n  owners:\n    - product-team\n<\/code><\/pre><\/div>\n<h3 id=\"how-the-rest-of-the-system-uses-it\"><span>How the rest of the system uses it<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/how-the-rest-of-the-system-uses-it\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Artifacts across BuildOS carry three list fields: <code>systems<\/code>, <code>environments<\/code>, and <code>owners<\/code>. Together these are called <strong>scoped metadata<\/strong>. Every value in them must be an ID that exists in <code>instance.yaml<\/code>.<\/p>\n<p>A playbook, meaning a short Markdown file telling a person or an agent how to do one job, carries them in its header. So does every structured record in <code>.os/data/<\/code>.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p><code>owners<\/code> is for teams and organizations, not for kinds of user. A <strong>persona<\/strong> is a separate record type with its own rules and its own file. Do not model people as owners.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>The validator ignores collections it does not know about. You can add extra top-level keys such as <code>customer_scopes<\/code> or <code>target_releases<\/code> and they will validate cleanly, because nothing rejects them. Nothing reads them either. Extra collections are inert.<\/p>\n<\/div><\/aside>\n<hr>\n<h2 id=\"the-shipped-config-is-still-the-template\"><span>The shipped config is still the template<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/the-shipped-config-is-still-the-template\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><strong>The <code>.os/config/instance.yaml<\/code> that <code>buildos init<\/code> writes is byte-for-byte identical to the neutral template<\/strong> at <code>.os/templates/instance-config.yaml<\/code>. It is an example sitting in the place your configuration goes.<\/p>\n<p>Its values are <code>instance.id: example-instance<\/code>, one system <code>primary-system<\/code>, two environments <code>baseline<\/code> and <code>customized<\/code>, and two owners <code>adopter-team<\/code> and <code>platform-owner<\/code>.<\/p>\n<p>Nothing warns you about this. An adopter who never opens the file gets a clean validation pass against entirely fictional IDs, and every artifact written afterwards is scoped to a system that does not exist.<\/p>\n<p>There is no write protection on this file.<\/p>\n<p>Open it and edit it before you do anything else in BuildOS.<\/p>\n<p>Use a plain text editor, your agent tool, or anything else that saves plain text. Do not open it in a word processor. YAML uses indentation to mean structure, so keep the existing spacing exactly: the same number of leading spaces, and spaces rather than tabs. If you are unsure, copy the worked example above and change the values instead of the layout.<\/p>\n<h3 id=\"renaming-the-shipped-ids-breaks-six-files\"><span>Renaming the shipped IDs breaks six files<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/renaming-the-shipped-ids-breaks-six-files\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>When you replace <code>primary-system<\/code> with your own ID, six files that ship with BuildOS still point at the old one, and validation fails until you fix them.<\/p>\n<p>Three playbooks:<\/p>\n<ul>\n<li><code>playbooks/discovery/inspect-ui-discoverability.md<\/code><\/li>\n<li><code>playbooks/testing/run-core-validation.md<\/code><\/li>\n<li><code>playbooks/build/package-build-artifact.md<\/code><\/li>\n<\/ul>\n<p>Three seeded record files, one line each:<\/p>\n<ul>\n<li><code>.os/data/requirements.jsonl<\/code><\/li>\n<li><code>.os/data/capabilities.jsonl<\/code><\/li>\n<li><code>.os/data/test-cases.jsonl<\/code><\/li>\n<\/ul>\n<p>Each carries <code>systems<\/code>, <code>environments<\/code>, and <code>owners<\/code> values drawn from the template. Update them to your own IDs and validation passes again. The failure is loud and the fix is mechanical, so this costs you a few minutes rather than a session.<\/p>\n<hr>\n<h2 id=\"validate-it\"><span>Validate it<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/validate-it\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Run this from your project root:<\/p>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">.os/scripts/buildos validate\n<\/code><\/pre><\/div>\n<p>On Windows: <code>.os\\scripts\\buildos.cmd validate<\/code>. It changes no file.<\/p>\n<p><strong>A pass<\/strong> ends with this line, and exit code 0:<\/p>\n<div class=\"code-block\" data-lang=\"text\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-text\">OK. No problems found.\n<\/code><\/pre><\/div>\n<p><strong>A failure<\/strong> gives a count, then each file with one line per problem: the field, what is wrong, and a code in brackets. Here is the start of the real output after the worked example above replaced the shipped config, before the six files were updated (21 problems in all; the rest follow the same pattern):<\/p>\n<div class=\"code-block\" data-lang=\"text\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-text\">Found 21 problems.\n\nplaybooks/build/package-build-artifact.md\n  systems[0]: &quot;primary-system&quot; is not a configured ID in .os/config/instance.yaml. [unknown_id]\n  environments[0]: &quot;baseline&quot; is not a configured ID in .os/config/instance.yaml. [unknown_id]\n  owners[0]: &quot;platform-owner&quot; is not a configured ID in .os/config/instance.yaml. [unknown_id]\n<\/code><\/pre><\/div>\n<p>It ends with:<\/p>\n<div class=\"code-block\" data-lang=\"text\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-text\">Fix each problem, then run buildos validate again.\n<\/code><\/pre><\/div>\n<p>Exit code 4. Fix the named field in the named file and run it again.<\/p>\n<h3 id=\"what-the-validator-covers\"><span>What the validator covers<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/what-the-validator-covers\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>It runs four passes:<\/p>\n<ol>\n<li>The configuration contract still uses the expected vocabulary.<\/li>\n<li>The configuration file itself is well-formed, and every cross-reference resolves.<\/li>\n<li>Every playbook and playbook template carries valid scoped metadata.<\/li>\n<li>Every line of every file in <code>.os/data/<\/code> is a well-formed record with a valid ID, status, and scope.<\/li>\n<\/ol>\n<p>It leaves other things alone: the body of a playbook, the <strong>frontmatter<\/strong> of converted source material (the header block of <code>key: value<\/code> lines at the top of a Markdown file), the shape of a run record or a finding directory, and the redirect graph between records. A pass tells you your configuration and your scoping are sound, and says nothing about whether your content is right.<\/p>\n<blockquote>\n<p><strong>Note.<\/strong> <code>buildos validate<\/code> replaces the Python validator script that earlier BuildOS projects used. It needs no Python. It reads only files inside the project, and it reads each one with a size limit.<\/p>\n<\/blockquote>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Editing the file and not validating is the common failure. Run the command, which takes a second and is the only confirmation available.<\/p>\n<\/div><\/aside>\n<hr>\n<h2 id=\"words-the-system-rejects\"><span>Words the system rejects<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/words-the-system-rejects\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Older material and some early drafts use vocabulary the shipped system refuses. The validator will fail on these by name.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Rejected<\/th>\n<th>Use instead<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>env<\/code><\/td>\n<td><code>environments<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>envs<\/code><\/td>\n<td><code>environments<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>for<\/code><\/td>\n<td><code>owners<\/code>, or <code>systems<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>target_systems<\/code><\/td>\n<td><code>systems<\/code><\/td>\n<\/tr>\n<tr>\n<td>The values <code>both<\/code>, <code>all<\/code>, <code>any<\/code>, <code>default<\/code><\/td>\n<td>An explicit list of configured IDs<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>One rule explains all of them: every scoped field is a <strong>plural list of configured IDs<\/strong>. A field named <code>env<\/code> implies a single value, and a value like <code>both<\/code> implies the system can work out what you meant. Neither is allowed, because a record scoped to <code>both<\/code> cannot be filtered or compared later.<\/p>\n<p>Here is what a legacy field produces. This is the real output after <code>environments:<\/code> was renamed to <code>env:<\/code> in one shipped playbook:<\/p>\n<div class=\"code-block\" data-lang=\"text\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-text\">Found 2 problems.\n\nplaybooks/testing/run-core-validation.md\n  env: `env` is an old scoped field and is not allowed. Use systems, environments, and owners. [legacy_scoped_field]\n  environments: `environments` is required in scoped frontmatter. Use an empty list ([]) when it does not apply. [scoped_field_required]\n\nFix each problem, then run buildos validate again.\n<\/code><\/pre><\/div>\n<p>One mistake produces two errors: the banned field, and the required field that is now missing.<\/p>\n<hr>\n<h2 id=\"find-your-way-around\"><span>Find your way around<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/find-your-way-around\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><a href=\"#/02-how-it-works\">How it works<\/a> gave you the model. This is the physical map, sorted by what you do in each place.<\/p>\n<p>Most folders hold an <code>AGENTS.md<\/code> file, a short note saying what belongs there and what does not. These are <strong>routers<\/strong>, and they are written for people as well as for agents. If you are unsure about a folder, read its router first.<\/p>\n<p>Beside each one sits a <code>CLAUDE.md<\/code>. In the BuildOS-owned folders it contains a heading and one line with a link to <code>AGENTS.md<\/code>, so that an agent tool which reads only that filename still finds the real instructions. Leave them in place.<\/p>\n<p><strong>Write here.<\/strong><\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Folder<\/th>\n<th>What goes in it<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>.os/config/<\/code><\/td>\n<td><code>instance.yaml<\/code>. The work you did on this page.<\/td>\n<\/tr>\n<tr>\n<td><code>playbooks/<\/code><\/td>\n<td>Your playbooks, in one of four category folders: <code>administrative/<\/code>, <code>build/<\/code>, <code>discovery/<\/code>, <code>testing/<\/code>.<\/td>\n<\/tr>\n<tr>\n<td><code>.os/data/<\/code><\/td>\n<td>Structured records, one JSON object per line, in eight files.<\/td>\n<\/tr>\n<tr>\n<td><code>assets/<\/code><\/td>\n<td>Clean text copies of source material you bring in. Written by <code>buildos intake<\/code>.<\/td>\n<\/tr>\n<tr>\n<td><code>workspace/runs/<\/code><\/td>\n<td>One folder per recorded run. Written by <code>buildos discovery<\/code>.<\/td>\n<\/tr>\n<tr>\n<td><code>workspace/findings/<\/code><\/td>\n<td>One folder per proven observation. Written by <code>buildos discovery<\/code>.<\/td>\n<\/tr>\n<tr>\n<td><code>workspace/datasets/<\/code><\/td>\n<td>Local data your playbooks consume.<\/td>\n<\/tr>\n<tr>\n<td><code>docs/<\/code><\/td>\n<td>Only with Make Docs: your own deliverables, such as designs, plans, requirements documents, work backlogs, and guides.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>Read here.<\/strong><\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Folder<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>.os/contracts/<\/code><\/td>\n<td>The <strong>contracts<\/strong>, the rule book for each artifact type, saying what fields are required and what states are allowed. Contracts win over templates and over routers. You do not modify them and you do not need to read them cover to cover, as long as you know they are the final word.<\/td>\n<\/tr>\n<tr>\n<td><code>.os/templates/<\/code><\/td>\n<td>Eight starting shapes to copy from. Conveniences, not rules.<\/td>\n<\/tr>\n<tr>\n<td><code>.os/scripts/<\/code><\/td>\n<td>The command wrappers: <code>buildos<\/code> and <code>buildos.cmd<\/code>, and the older names <code>buildos-intake<\/code>, <code>buildos-discovery<\/code>, and <code>buildos-design<\/code>, which call <code>buildos<\/code> with their domain.<\/td>\n<\/tr>\n<tr>\n<td><code>.os/skills/<\/code><\/td>\n<td>The BuildOS skills, with a router. See below.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>Leave alone.<\/strong><\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Folder<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>.os/indexes/<\/code><\/td>\n<td>An <strong>index<\/strong> is a generated lookup file, never the source of truth. Rebuild it with the tool rather than hand-editing it.<\/td>\n<\/tr>\n<tr>\n<td><code>.os/manifest.json<\/code><\/td>\n<td>The BuildOS version this project uses. Change it only to update or roll back (below).<\/td>\n<\/tr>\n<tr>\n<td><code>.make-docs/<\/code><\/td>\n<td>Only with Make Docs: its own settings and resources.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>With Make Docs, there can be two folders called <code>assets<\/code>, and they belong to different systems. <code>assets/<\/code> is BuildOS-owned and holds your converted source material. <code>docs/assets/<\/code> belongs to Make Docs: it appears only when the first guide or shared project document is written there. Make Docs keeps its own rule files (contracts, templates, prompts, and references) in <code>.make-docs/system/<\/code>, and an agent can read any of them with <code>make-docs resource read<\/code>. Writing into the wrong <code>assets<\/code> folder is a boundary violation that an active rule in <code>playbooks/administrative/<\/code> exists to prevent.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>The playbook category names read as though they describe administering BuildOS. They describe the system you are studying instead. Append &quot;the system&quot; to each one and they come out right: administer <em>the system<\/em>, build <em>the system<\/em>, discover <em>the system<\/em>, test <em>the system<\/em>.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p><code>workspace/<\/code> is easy to overlook, and it is a quarter of the system. Runs and findings both live there. Do not treat it as scratch space.<\/p>\n<\/div><\/aside>\n<hr>\n<h2 id=\"skills\"><span>Skills<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/skills\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A <strong>skill<\/strong> is a packaged set of instructions an agent can follow for one kind of job, such as converting a batch of files or drafting a playbook. <code>buildos init<\/code> copies 21 BuildOS skills into <code>.os/skills/<\/code>, with a router, <code>.os/skills/AGENTS.md<\/code>, that lists each one and what it is for. Start with <code>buildos-workflow<\/code> when you know the outcome you want but not the skill.<\/p>\n<p>BuildOS never installs a skill into your agent tool by itself. When you want one, ask your agent to install it. The router tells the agent how: copy that one skill folder, unchanged, into the project&#39;s skill folder of its own app (it names the folders for Claude Code, Codex, and GitHub Copilot), or, for another app, read the skill from <code>.os/skills/<\/code> and follow it. Some apps find a new skill only after a restart.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>One skill still needs Python 3 for its own tool: <code>capability-matrix<\/code>. No BuildOS command needs Python. A BuildOS command for that tool is planned for <code>0.2.0<\/code>. From BuildOS <code>0.2.0<\/code>, <code>buildos-bulk-extract<\/code>, <code>fit-gap-analysis<\/code>, and <code>buildos-export-azure-boards<\/code> run the <code>buildos extract bulk<\/code>, <code>buildos fitgap<\/code>, and <code>buildos export azure-boards<\/code> commands through the project wrapper and need only Node.js. In a project that pins <code>0.1.0<\/code>, the first two still run their own Python scripts (the spreadsheet step also needs the <code>openpyxl<\/code> package), and the new skills do not work, because the wrapper still runs <code>0.1.0<\/code>: see &quot;From 0.1.0 to 0.2.0&quot; below. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<hr>\n<h2 id=\"install-without-access-to-the-npm-registry\"><span>Install without access to the npm registry<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/install-without-access-to-the-npm-registry\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Some company networks block the npm registry. You can still use BuildOS: fetch the package once on a machine that has access, check it, and install it from the file.<\/p>\n<ol>\n<li><p>On a machine with registry access, download the package file and compute its SHA-256 digest:<\/p>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">npm pack build-os@0.1.0\nshasum -a 256 build-os-0.1.0.tgz\n<\/code><\/pre><\/div>\n<p>On Windows, use <code>certutil -hashfile build-os-0.1.0.tgz SHA256<\/code> instead of <code>shasum<\/code>.<\/p>\n<\/li>\n<li><p>Compare the digest with the published one. <code>SECURITY.md<\/code> in the package, section &quot;How to Check a Release&quot;, says where it is and how to check the provenance too. Do not use a file whose digest differs.<\/p>\n<\/li>\n<li><p>Copy the file to the machine without registry access and install it from the file:<\/p>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">npm install -g --offline ./build-os-0.1.0.tgz\n<\/code><\/pre><\/div>\n<p>The package has no dependencies, so nothing else is needed.<\/p>\n<\/li>\n<li><p>Set up the project with the installed command instead of <code>npx<\/code>:<\/p>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">buildos init\n<\/code><\/pre><\/div>\n<\/li>\n<\/ol>\n<p>When a <code>buildos<\/code> command is installed like this and its version is the one in <code>.os/manifest.json<\/code>, the project wrappers run it, without the registry (see &quot;Update and roll back&quot; below). When the versions differ, the wrappers run the pinned version through <code>npx<\/code>, which needs the registry or the npm cache. To run one command straight from the file instead, without installing: <code>npx -y --offline --package ./build-os-0.1.0.tgz -- buildos &lt;command&gt;<\/code>.<\/p>\n<hr>\n<h2 id=\"update-and-roll-back\"><span>Update and roll back<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/update-and-roll-back\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The version in <code>.os/manifest.json<\/code> always decides which BuildOS the project wrapper runs. A global install (as in the offline steps above) is used only when it is an npm install of exactly that version; see the last item.<\/p>\n<ul>\n<li><strong>To update<\/strong>, change <code>&quot;buildos_version&quot;<\/code> to the new version, for example <code>&quot;0.1.1&quot;<\/code>, and run <code>.os/scripts/buildos version<\/code> to check. Read the release notes first: when a version changes skills, change the skills too. From <code>0.1.0<\/code> to <code>0.2.0<\/code>, see below.<\/li>\n<li><strong>To roll back<\/strong>, set it back to the earlier exact version, for example <code>&quot;0.1.0&quot;<\/code>. You do not need to change or remove a global install. When the skills changed between the two versions, put back the earlier skills too. From <code>0.2.0<\/code> to <code>0.1.0<\/code>, see &quot;Roll back from 0.2.0 to 0.1.0&quot; below. The wrapper accepts only an exact version, never <code>latest<\/code> or a range.<\/li>\n<li><strong>With a global install<\/strong> (<code>npm install -g<\/code>, as in the offline steps), the wrapper runs that installed <code>buildos<\/code> only when it is an npm install of the version in the manifest. On a machine without registry access, after you change the manifest, install the same version, <code>npm install -g build-os@&lt;version&gt;<\/code> (or the file), so the wrapper can run it without the registry. Until then, the wrapper runs the pinned version through <code>npx<\/code>.<\/li>\n<\/ul>\n<p>Commit <code>.os/manifest.json<\/code> with the change, so everyone on the project runs the same version.<\/p>\n<h3 id=\"from-010-to-020\"><span>From 0.1.0 to 0.2.0<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/from-010-to-020\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p><code>0.2.0<\/code> changes three skills and the skills router, <code>.os/skills/AGENTS.md<\/code>. Every other file that <code>buildos init<\/code> copied is the same as in <code>0.1.0<\/code>. The new skills call commands that <code>0.1.0<\/code> does not have, so change the version and these skills together. If you change only one of the two, a skill command stops with <code>unknown command<\/code> (exit code <code>2<\/code>). BuildOS has no update command yet, and <code>buildos init<\/code> does not do this for you: in a project that BuildOS already set up, it keeps the version and the skills as they are.<\/p>\n<p>These are the files that change in <code>.os/skills/<\/code>:<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>File or skill folder<\/th>\n<th>Changed in <code>0.2.0<\/code><\/th>\n<th>Removed in <code>0.2.0<\/code><\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>AGENTS.md<\/code><\/td>\n<td>The list &quot;What a skill needs&quot;<\/td>\n<td>None<\/td>\n<\/tr>\n<tr>\n<td><code>buildos-bulk-extract/<\/code><\/td>\n<td><code>SKILL.md<\/code><\/td>\n<td><code>scripts/work.py<\/code>, <code>tests/test_work.py<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>buildos-export-azure-boards/<\/code><\/td>\n<td><code>SKILL.md<\/code>, <code>adapters/00-adapter-registry.md<\/code>, <code>adapters/dynamics-365-ce/ADAPTER.md<\/code>, <code>references/azure-boards-csv-contract.md<\/code><\/td>\n<td><code>scripts/azure_boards_csv.mjs<\/code>, <code>scripts/adapters/dynamics-365-ce.mjs<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>fit-gap-analysis/<\/code><\/td>\n<td><code>SKILL.md<\/code>, <code>references/formats.md<\/code>, <code>references/scoring-brief.md<\/code><\/td>\n<td><code>scripts/fitgap.py<\/code><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Refresh only these. Do not delete the <code>.os/skills/<\/code> folder, and do not touch any other skill: a skill that you added stays as it is.<\/p>\n<p>Run the commands in the project folder. They use a work folder, <code>../buildos-upgrade<\/code>, next to the project. Use a new work folder for each project and for each try. The first command of step 1 stops with an error if the folder is there already. If it does, do not continue: an old work folder holds the backup of another project or of an earlier try, and a rollback from it puts back the wrong files. Use another name (for example <code>../buildos-upgrade-2<\/code>) in every command of these steps, or delete the old folder when you are sure that you do not need it. They are for macOS and Linux. In Command Prompt on Windows, use backslashes in the paths, <code>rmdir /s /q<\/code> in place of <code>rm -rf<\/code>, <code>xcopy /e /i /q<\/code> in place of <code>cp -R<\/code>, <code>copy<\/code> in place of <code>cp<\/code>, <code>mkdir<\/code> without <code>-p<\/code>, and <code>.os\\scripts\\buildos.cmd<\/code> in place of <code>.os/scripts/buildos<\/code>. The <code>git<\/code> and <code>npx<\/code> commands are the same.<\/p>\n<ol>\n<li><p><strong>Make a backup.<\/strong> Commit your work first (<code>git add -A<\/code>, then <code>git commit -m &quot;Before BuildOS 0.2.0&quot;<\/code>; if git says that there is nothing to commit, that is fine). Then copy the version file and the skills to the work folder:<\/p>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">mkdir ../buildos-upgrade\n<\/code><\/pre><\/div>\n<p>If this command prints an error, stop: the work folder is there already (see above). If it prints nothing, continue:<\/p>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">mkdir ../buildos-upgrade/backup ../buildos-upgrade/old ../buildos-upgrade/new\ncp .os/manifest.json ../buildos-upgrade/backup/manifest.json\ncp -R .os/skills ../buildos-upgrade/backup/os-skills\n<\/code><\/pre><\/div>\n<p>An agent app can have its own copy of a skill, in a skills folder of its own (for example <code>.claude/skills/<\/code>, <code>.agents/skills/<\/code>, or <code>.github/skills/<\/code> in the project). Copy each of those folders too, with its own name. For example: <code>cp -R .claude/skills ../buildos-upgrade/backup/claude-skills<\/code>. The steps call this folder the app folder.<\/p>\n<p>A skills folder in your home folder is different: the agent uses it in every project. If it holds one of the three skills, do not refresh that copy while one of your projects still uses <code>0.1.0<\/code>. In such a project, the refreshed skill runs a command that <code>0.1.0<\/code> does not have, and the command stops with <code>unknown command<\/code> (exit code <code>2<\/code>). Do one of these two things. Upgrade every project that uses the home-folder copy, and refresh that copy last, as one more app folder. Or move the three skills out of the home folder and give each project its own copy in its app folder, so that each project has the skills of its own version. For a rollback, the same rule applies the other way.<\/p>\n<\/li>\n<li><p><strong>Get clean copies of both versions:<\/strong><\/p>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">npx -y build-os@0.1.0 init --root ../buildos-upgrade/old --skip-make-docs\nnpx -y build-os@0.2.0 init --root ../buildos-upgrade/new --skip-make-docs\n<\/code><\/pre><\/div>\n<\/li>\n<li><p><strong>Find your own changes.<\/strong> Compare each of the three skills and the router with the clean <code>0.1.0<\/code> copy:<\/p>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">git --no-pager diff --no-index --stat ../buildos-upgrade/old/.os/skills/buildos-bulk-extract .os/skills/buildos-bulk-extract\ngit --no-pager diff --no-index --stat ../buildos-upgrade/old/.os/skills/buildos-export-azure-boards .os/skills/buildos-export-azure-boards\ngit --no-pager diff --no-index --stat ../buildos-upgrade/old/.os/skills/fit-gap-analysis .os/skills/fit-gap-analysis\ngit --no-pager diff --no-index --stat ../buildos-upgrade/old/.os/skills/AGENTS.md .os/skills/AGENTS.md\n<\/code><\/pre><\/div>\n<p>Do the same for each of the three skills that an app folder has, with the app folder in place of <code>.os/skills<\/code> in the last path. For example: <code>git --no-pager diff --no-index --stat ../buildos-upgrade/old/.os/skills/buildos-bulk-extract .claude/skills/buildos-bulk-extract<\/code>. No output means no change. A listed file is a file that you or an agent changed or added. Write down each one. To see the change, run the same command without <code>--stat<\/code>.<\/p>\n<p>If a listed file is one of the five files in the &quot;Removed in <code>0.2.0<\/code>&quot; column, stop here. <code>0.2.0<\/code> removes that script, and the BuildOS command that replaces it does not have your change. Do not refresh that skill until you decide what to do with your change: for example, keep the project on <code>0.1.0<\/code>, or ask the BuildOS maintainer for the behavior in the command.<\/p>\n<\/li>\n<li><p><strong>Refresh the three skills.<\/strong> In the project:<\/p>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">rm -rf .os/skills/buildos-bulk-extract .os/skills/buildos-export-azure-boards .os/skills/fit-gap-analysis\ncp -R ../buildos-upgrade/new/.os/skills/buildos-bulk-extract .os/skills/buildos-bulk-extract\ncp -R ../buildos-upgrade/new/.os/skills/buildos-export-azure-boards .os/skills/buildos-export-azure-boards\ncp -R ../buildos-upgrade/new/.os/skills/fit-gap-analysis .os/skills/fit-gap-analysis\ncp ../buildos-upgrade/new/.os/skills/AGENTS.md .os/skills/AGENTS.md\n<\/code><\/pre><\/div>\n<p>Then, in each app folder, do the same for each of the three skills that it has, one skill at a time. For example: <code>rm -rf .claude/skills/buildos-bulk-extract<\/code>, then <code>cp -R ../buildos-upgrade/new/.os/skills/buildos-bulk-extract .claude/skills/buildos-bulk-extract<\/code>. Do not replace the whole app folder, and do not add a skill that the app did not have. An old copy tells the agent to run a script that <code>0.2.0<\/code> removed.<\/p>\n<\/li>\n<li><p><strong>Put your changes back.<\/strong> Go through the list from step 3, one file at a time. Your old files are in the backup (<code>../buildos-upgrade/backup/<\/code>).<\/p>\n<ul>\n<li>A file that you changed, and that <code>0.2.0<\/code> still has: open the new file and make your change again by hand. Do not copy the old file over the new one: the old file tells the agent to run the old script.<\/li>\n<li>A file that you added to one of the three skill folders (a file that the clean <code>0.1.0<\/code> copy does not have): the refresh removed it. Copy it back from the backup to the same place. For example: <code>cp ../buildos-upgrade/backup/os-skills/fit-gap-analysis/my-notes.md .os/skills/fit-gap-analysis/my-notes.md<\/code>.<\/li>\n<\/ul>\n<p>Do the same for the app folders. Do not continue until each file on your list is done.<\/p>\n<\/li>\n<li><p><strong>Change the version.<\/strong> In <code>.os/manifest.json<\/code>, change <code>&quot;buildos_version&quot;<\/code> from <code>&quot;0.1.0&quot;<\/code> to <code>&quot;0.2.0&quot;<\/code>. Change no other field. If you use an npm install of <code>build-os<\/code> (in the project&#39;s <code>node_modules<\/code> folder, or a global install), install <code>0.2.0<\/code> there too. The wrapper uses an install only when it has the pinned version.<\/p>\n<\/li>\n<li><p><strong>Check.<\/strong> Each of these must be true:<\/p>\n<ul>\n<li><code>.os/scripts/buildos version<\/code> prints <code>version: 0.2.0<\/code>.<\/li>\n<li><code>.os/scripts/buildos help<\/code> lists <code>extract<\/code>, <code>fitgap<\/code>, and <code>export<\/code>.<\/li>\n<li><code>.os/scripts/buildos export azure-boards adapters<\/code> lists <code>dynamic

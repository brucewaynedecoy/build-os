s-365-ce<\/code>, with exit code <code>0<\/code>. This command comes from a refreshed skill.<\/li>\n<li>For each of the three skills, in the project and in each app folder that has it, the step 3 command with <code>new<\/code> in place of <code>old<\/code> prints nothing, or only your own changes. For example: <code>git --no-pager diff --no-index --stat ../buildos-upgrade/new/.os/skills/fit-gap-analysis .os/skills/fit-gap-analysis<\/code>.<\/li>\n<li>The same is true for the router: <code>git --no-pager diff --no-index --stat ../buildos-upgrade/new/.os/skills/AGENTS.md .os/skills/AGENTS.md<\/code>.<\/li>\n<li>Each file on your list from step 3 is in place: your change is in the new file, or your added file is back.<\/li>\n<\/ul>\n<p>Then commit. Keep the work folder until you are sure that the new version works for you, then delete it.<\/p>\n<\/li>\n<\/ol>\n<h4 id=\"roll-back-from-020-to-010\"><span>Roll back from 0.2.0 to 0.1.0<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/roll-back-from-020-to-010\" aria-label=\"Link to this section\">#<\/a><\/h4>\n<p>The rollback puts back the version file and the three skills from the backup of step 1, in the project and in each app folder. A change that you made to these three skills after the upgrade goes away, so save it first.<\/p>\n<ol>\n<li><p>Put back the version file and the router:<\/p>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">cp ../buildos-upgrade/backup/manifest.json .os/manifest.json\ncp ../buildos-upgrade/backup/os-skills/AGENTS.md .os/skills/AGENTS.md\n<\/code><\/pre><\/div>\n<\/li>\n<li><p>Put back the three skills in the project:<\/p>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">rm -rf .os/skills/buildos-bulk-extract .os/skills/buildos-export-azure-boards .os/skills/fit-gap-analysis\ncp -R ../buildos-upgrade/backup/os-skills/buildos-bulk-extract .os/skills/buildos-bulk-extract\ncp -R ../buildos-upgrade/backup/os-skills/buildos-export-azure-boards .os/skills/buildos-export-azure-boards\ncp -R ../buildos-upgrade/backup/os-skills/fit-gap-analysis .os/skills/fit-gap-analysis\n<\/code><\/pre><\/div>\n<\/li>\n<li><p>In each app folder, do the same for each of the three skills that it has, from that folder&#39;s backup. For example: <code>rm -rf .claude/skills/buildos-bulk-extract<\/code>, then <code>cp -R ../buildos-upgrade/backup/claude-skills/buildos-bulk-extract .claude/skills/buildos-bulk-extract<\/code>. If the backup has no copy of a skill, delete the app&#39;s copy.<\/p>\n<\/li>\n<li><p>If you installed <code>0.2.0<\/code> with npm, install <code>0.1.0<\/code> there again.<\/p>\n<\/li>\n<li><p><strong>Check.<\/strong> <code>.os/scripts/buildos version<\/code> prints <code>version: 0.1.0<\/code>. Then, for each of the three skills, in the project and in each app folder that has it, compare it with the backup. For example:<\/p>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">git --no-pager diff --no-index --stat ../buildos-upgrade/backup/os-skills/fit-gap-analysis .os/skills/fit-gap-analysis\ngit --no-pager diff --no-index --stat ../buildos-upgrade/backup/claude-skills/buildos-bulk-extract .claude/skills/buildos-bulk-extract\ngit --no-pager diff --no-index --stat ../buildos-upgrade/backup/os-skills/AGENTS.md .os/skills/AGENTS.md\n<\/code><\/pre><\/div>\n<p>Each command must print nothing. If one lists files and exits with code <code>1<\/code>, a <code>0.2.0<\/code> skill is still in place there: do step 2 or 3 again for that skill.<\/p>\n<\/li>\n<\/ol>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>There is no <code>buildos update<\/code> command yet. A new version does not refresh the files that <code>buildos init<\/code> already copied (contracts, templates, skills). <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<hr>\n<h2 id=\"environment-urls-are-not-in-the-config\"><span>Environment URLs are not in the config<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/environment-urls-are-not-in-the-config\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The <code>environments<\/code> block names your deployments and says which systems they contain. It does not record how to reach them. There is no URL field, and there is no readiness field either.<\/p>\n<p>In practice, whoever runs a playbook against a live environment supplies the target address by hand, every time. Nothing carries it forward from the configuration, and nothing checks that the address matches the environment named in the run.<\/p>\n<p><a href=\"#/08-write-and-run-a-playbook\">Write and run a playbook<\/a> assumes you know this.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>The <code>environments<\/code> schema has no URL field and no readiness state. Record the address in the playbook that needs it, or in a note beside it, and expect to supply it by hand on every run. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<hr>\n<h2 id=\"commit-what-you-did\"><span>Commit what you did<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/commit-what-you-did\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>You have set up BuildOS, changed one configuration file and, if you renamed the shipped IDs, six more. Save that work now.<\/p>\n<ol>\n<li>Open your editor&#39;s source-control panel and look at every changed file.<\/li>\n<li>Read the diff on each one. You are checking that nothing changed except what you meant to change.<\/li>\n<li>Stage those files, write a message that says what you did, such as &quot;Set up BuildOS and configure the lending programme&quot;, and commit.<\/li>\n<li>Push.<\/li>\n<\/ol>\n<p><a href=\"#/03-before-you-start\">Before you start<\/a> covers each of these git moves in full. Commit before you go on to 05, so that the next document&#39;s changes arrive on a clean starting point.<\/p>\n<hr>\n<h2 id=\"what-you-should-have-now\"><span>What you should have now<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/what-you-should-have-now\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>Node.js 24 or newer, checked with <code>node --version<\/code>.<\/li>\n<li>BuildOS set up in your project folder by <code>buildos init<\/code>, with your Make Docs choice made on purpose.<\/li>\n<li><code>.os/scripts/buildos version<\/code> printing the version in <code>.os/manifest.json<\/code>.<\/li>\n<li><code>.os/config/instance.yaml<\/code> edited to name your own instance, systems, environments and owners, and confirmed to be no longer the shipped template.<\/li>\n<li>The three shipped playbooks and three seeded record files updated to your IDs, if you renamed the shipped ones.<\/li>\n<li><code>.os/scripts/buildos validate<\/code> printing <code>OK. No problems found.<\/code><\/li>\n<li>A commit containing all of it, with the diff read before you made it.<\/li>\n<li>A working idea of where you write, where you read, and what to leave alone.<\/li>\n<li>The old command names replaced by <code>buildos &lt;domain&gt;<\/code> in anything you write, because they stop working in <code>0.3.0<\/code>.<\/li>\n<\/ul>\n<h2 id=\"next\"><span>Next<\/span><a class=\"h-anchor\" href=\"#/04-install-and-configure-your-instance/next\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><a href=\"#/05-bring-in-source-material\">Bring in source material<\/a>, which turns documents from outside into clean text copies that remember where they came from.<\/p>\n","toc":[{"id":"what-you-need-first","text":"What you need first","level":2},{"id":"set-up-buildos-in-your-project","text":"Set up BuildOS in your project","level":2},{"id":"the-one-command","text":"The one command","level":3},{"id":"the-one-question-make-docs","text":"The one question: Make Docs","level":3},{"id":"what-buildos-init-does","text":"What buildos init does","level":3},{"id":"a-project-set-up-with-the-earlier-tools","text":"A project set up with the earlier tools","level":3},{"id":"run-buildos-commands","text":"Run BuildOS commands","level":2},{"id":"the-project-wrapper","text":"The project wrapper","level":3},{"id":"check-that-it-works","text":"Check that it works","level":3},{"id":"the-old-command-names-end-in-030","text":"The old command names end in 0.3.0","level":3},{"id":"configure-the-instance","text":"Configure the instance","level":2},{"id":"what-an-instance-is","text":"What an instance is","level":3},{"id":"the-four-blocks","text":"The four blocks","level":3},{"id":"a-worked-example","text":"A worked example","level":3},{"id":"how-the-rest-of-the-system-uses-it","text":"How the rest of the system uses it","level":3},{"id":"the-shipped-config-is-still-the-template","text":"The shipped config is still the template","level":2},{"id":"renaming-the-shipped-ids-breaks-six-files","text":"Renaming the shipped IDs breaks six files","level":3},{"id":"validate-it","text":"Validate it","level":2},{"id":"what-the-validator-covers","text":"What the validator covers","level":3},{"id":"words-the-system-rejects","text":"Words the system rejects","level":2},{"id":"find-your-way-around","text":"Find your way around","level":2},{"id":"skills","text":"Skills","level":2},{"id":"install-without-access-to-the-npm-registry","text":"Install without access to the npm registry","level":2},{"id":"update-and-roll-back","text":"Update and roll back","level":2},{"id":"from-010-to-020","text":"From 0.1.0 to 0.2.0","level":3},{"id":"environment-urls-are-not-in-the-config","text":"Environment URLs are not in the config","level":2},{"id":"commit-what-you-did","text":"Commit what you did","level":2},{"id":"what-you-should-have-now","text":"What you should have now","level":2},{"id":"next","text":"Next","level":2}]},"05-bring-in-source-material":{"slug":"05-bring-in-source-material","num":"05","title":"Bring in source material","lede":"This page shows you how to turn a document you already have into a clean text copy that BuildOS and your agent can work with.","html":"<h2 id=\"what-you-need-first\"><span>What you need first<\/span><a class=\"h-anchor\" href=\"#/05-bring-in-source-material/what-you-need-first\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Read <a href=\"#/04-install-and-configure-your-instance\">Install and configure your instance<\/a> first. This page assumes it.<\/p>\n<p>You need three things:<\/p>\n<ul>\n<li>A project that <code>buildos init<\/code> set up, with <code>.os/config/instance.yaml<\/code> filled in for your own project.<\/li>\n<li>The project wrapper working. Check it with <code>.os/scripts/buildos intake --help<\/code> (<code>.os\\scripts\\buildos.cmd intake --help<\/code> on Windows). If that prints help text, you are ready.<\/li>\n<li>One document to convert. A Word file or a spreadsheet is the easiest first try.<\/li>\n<\/ul>\n<p>Every path in this article is written from your project root.<\/p>\n<h2 id=\"what-conversion-does\"><span>What conversion does<\/span><a class=\"h-anchor\" href=\"#/05-bring-in-source-material/what-conversion-does\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><strong>Intake<\/strong> is taking a file from outside and bringing it into BuildOS as clean text that remembers where it came from. The first half of intake is <strong>conversion<\/strong>.<\/p>\n<p>Conversion turns a document into raw text. It does this without any AI. No model is involved and no network connection is used. The tool reads the bytes of your file and writes out text.<\/p>\n<p>The output is a format a program or an agent can consume cheaply, rather than something laid out for a person to read.<\/p>\n<p>Conversion does not decide what your document means. It copies the visible content across and stamps a header on it. Interpreting the content is a later job, and it happens elsewhere.<\/p>\n<p>Conversion is <strong>deterministic<\/strong>. That means the same input always gives the same output. The contract that governs converted text says so as a hard rule: conversion must be deterministic for the same source file, the same hash, and the same converter. So when an agent reads converted text and tells you something, you can go back and confirm that the text it read is the text in your document, with nothing paraphrased on the way in.<\/p>\n<p>The deterministic path exists for a second reason. Handing the original file to a model every time you want to look at it is slow and costs money, while converting once lets you read the text as often as you like.<\/p>\n<p>The result of a conversion is a <strong>converted twin<\/strong>: a clean text copy of an original file, carrying a header that records where it came from, its hash, what converted it, and when.<\/p>\n<h2 id=\"the-six-formats-that-work\"><span>The six formats that work<\/span><a class=\"h-anchor\" href=\"#/05-bring-in-source-material/the-six-formats-that-work\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><code>buildos intake<\/code> converts six kinds of source. Anything else is outside the tool, and <a href=\"#/06-sources-the-converter-cannot-read\">Sources the converter cannot read<\/a> is about what to do then.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Source<\/th>\n<th>What you get<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>CSV file<\/td>\n<td>One <code>.csv<\/code> twin<\/td>\n<td>Read and rewritten through a standard CSV parser, then stamped with the header.<\/td>\n<\/tr>\n<tr>\n<td>Word document (<code>.docx<\/code>)<\/td>\n<td>One <code>.md<\/code> twin<\/td>\n<td>Paragraphs, headings, lists and simple tables are preserved. Link text survives but the address behind it is dropped. Embedded pictures the tool can reach are copied out beside the twin.<\/td>\n<\/tr>\n<tr>\n<td>Excel workbook (<code>.xlsx<\/code>)<\/td>\n<td>One <code>.csv<\/code> twin <strong>per worksheet<\/strong><\/td>\n<td>A workbook with four worksheets produces four CSV files in one directory. Row order and column position are preserved. Embedded images are copied out beside them. Native charts are not extracted at all.<\/td>\n<\/tr>\n<tr>\n<td>HTML file<\/td>\n<td>One <code>.md<\/code> twin<\/td>\n<td>Headings, paragraphs, lists, links and clear tables convert to Markdown. Scripts, styles and layout-only containers are ignored.<\/td>\n<\/tr>\n<tr>\n<td>A directory of HTML files<\/td>\n<td>One <code>.md<\/code> twin <strong>per<\/strong> <code>.html<\/code> or <code>.htm<\/code> file<\/td>\n<td>The file&#39;s relative path inside the directory is used to name each twin.<\/td>\n<\/tr>\n<tr>\n<td>PDF<\/td>\n<td>One <code>.txt<\/code> twin<\/td>\n<td>Plain text only. Read the PDF section of <a href=\"#/06-sources-the-converter-cannot-read\">Sources the converter cannot read<\/a> before you rely on this.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The picture files pulled out of a source are called <strong>side artifacts<\/strong>. A side artifact is an image, chart, or diagram lifted out of a source during conversion and stored next to the converted twin, under <code>media/<\/code> or <code>diagrams/<\/code>. It is a file, not a record. Nothing downstream treats it as data.<\/p>\n<p>Word documents are the format the converter handles best. Choose Word over the other five wherever you have the choice.<\/p>\n<h2 id=\"decide-what-goes-in-and-when\"><span>Decide what goes in, and when<\/span><a class=\"h-anchor\" href=\"#/05-bring-in-source-material/decide-what-goes-in-and-when\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Documents arrive faster than anyone processes them, so most teams keep a holding folder. It is somewhere to drop things as they arrive, before deciding whether and when to convert them.<\/p>\n<p>Keep that habit, with one caution.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>BuildOS does not model a holding folder. The contract has exactly one place for converted material, <code>assets/&lt;source-slug&gt;/<\/code>, and there is no <code>incoming/<\/code>, <code>intake/<\/code> or <code>converted/<\/code> level anywhere in it. A folder on your desktop is outside the repository and outside provenance. Nothing records that a file was ever received, so a document can sit there for weeks while everyone assumes it went in.<\/p>\n<\/div><\/aside>\n<p>Two habits keep it safe:<\/p>\n<ol>\n<li><strong>Convert in rounds, and say what each round is.<\/strong> If a vendor ships a second version of their material halfway through your work, hold it back and run it as its own later round. Two versions of the same material in one pass leave you unable to tell them apart afterwards.<\/li>\n<li><strong>Pick one copy of each thing.<\/strong> The same content often arrives as a spreadsheet, a CSV and a JSON export at the same time. Convert the copy that keeps the most meaning, and leave the others out. A spreadsheet with named columns and sheets usually keeps more than the same data flattened into JSON.<\/li>\n<\/ol>\n<h2 id=\"prepare-the-file\"><span>Prepare the file<\/span><a class=\"h-anchor\" href=\"#/05-bring-in-source-material/prepare-the-file\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Do these checks before you run anything.<\/p>\n<ol>\n<li><strong>Rename the file to plain characters.<\/strong> Letters, digits, hyphens and one full stop before the extension.<\/li>\n<\/ol>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>A pipe character (<code>|<\/code>) or a slash in a source filename will break conversion. The cause is the way the source name is turned into a folder name. Rename the file first, which takes seconds and avoids a failure with no obvious cause.<\/p>\n<\/div><\/aside>\n<ol start=\"2\">\n<li><p><strong>Check the size.<\/strong> Very large exports cause trouble downstream, in git rather than in the converter. Nothing in BuildOS warns you about source size. If a vendor offers you an unfiltered metadata dump, ask for a filtered one before you convert it.<\/p>\n<\/li>\n<li><p><strong>Read it once yourself.<\/strong> Generated documents carry whatever the generator saw, and that can include the author&#39;s local file paths and folder names that should never leave their machine. Conversion and commit put all of it into the record permanently.<\/p>\n<\/li>\n<\/ol>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Attaching a document to a chat with your agent is <strong>not<\/strong> intake, though the two look equivalent from the outside. An agent may go on to report that it completed intake for an entirely different document. Save the file into your project folder, convert it there, and then tell your agent where the twin is. The worked example below shows the whole sequence.<\/p>\n<\/div><\/aside>\n<h2 id=\"run-the-conversion\"><span>Run the conversion<\/span><a class=\"h-anchor\" href=\"#/05-bring-in-source-material/run-the-conversion\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The command is one line, and you should dry-run it first.<\/p>\n<p>A <strong>dry run<\/strong> checks whether a command would work before it changes anything. It roughly doubles the wall time and it finds problems before the tool commits to writing files.<\/p>\n<ol>\n<li>Dry-run the conversion.<\/li>\n<\/ol>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos intake convert --source &lt;path&gt; --dry-run\n<\/code><\/pre><\/div>\n<ol start=\"2\">\n<li><p>Read what it says it will do. Exit code zero means everything is green.<\/p>\n<\/li>\n<li><p>Run it for real.<\/p>\n<\/li>\n<\/ol>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos intake convert --source &lt;path&gt;\n<\/code><\/pre><\/div>\n<p>Useful flags:<\/p>\n<ul>\n<li><code>--type auto|csv|docx|xlsx|pdf|html|html-dir<\/code> forces the source type. The default is <code>auto<\/code>.<\/li>\n<li><code>--force<\/code> overwrites output that is already there.<\/li>\n<li><code>--assets-root assets<\/code> writes somewhere other than the default.<\/li>\n<li><code>--repo-root &lt;path&gt;<\/code> runs the tool from outside the repository.<\/li>\n<\/ul>\n<h3 id=\"a-worked-example-start-to-finish\"><span>A worked example, start to finish<\/span><a class=\"h-anchor\" href=\"#/05-bring-in-source-material/a-worked-example-start-to-finish\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Say the file you were sent is called <code>Lending Overview.docx<\/code> and it is sitting in your Downloads folder.<\/p>\n<ol>\n<li><p>Rename it to plain characters: <code>lending-overview.docx<\/code>.<\/p>\n<\/li>\n<li><p>Move it inside your project folder. BuildOS ships no folder for original files, so make one and use it every time. A <code>sources/<\/code> directory at your project root works:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>sources/lending-overview.docx\n<\/code><\/pre><\/div>\n<\/li>\n<li><p>From your project root, dry-run the conversion:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos intake convert --source sources/lending-overview.docx --dry-run\n<\/code><\/pre><\/div>\n<\/li>\n<li><p>Run it for real:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos intake convert --source sources/lending-overview.docx\n<\/code><\/pre><\/div>\n<\/li>\n<li><p>Open what appeared:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>assets/lending-overview/lending-overview.md\n<\/code><\/pre><\/div>\n<\/li>\n<\/ol>\n<p>The directory name and the file name both come from your filename, lowercased and hyphenated.<\/p>\n<p><strong>Does the original belong inside the repository?<\/strong> Yes, and commit it with the twin. The <code>source<\/code> field in the twin&#39;s header records the path you gave the command, written relative to your project root. When the original sits outside the repository there is no relative path to write, so the tool records the full path from your own machine instead, which nobody else can follow and which leaves the provenance header useless to a second person. The one exception is size: filter a large export rather than committing it, as in the size check above.<\/p>\n<h3 id=\"what-lands-on-disk\"><span>What lands on disk<\/span><a class=\"h-anchor\" href=\"#/05-bring-in-source-material/what-lands-on-disk\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Output goes to:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>assets/&lt;source-slug&gt;/&lt;asset-slug&gt;.&lt;ext&gt;\n<\/code><\/pre><\/div>\n<p>A <strong>slug<\/strong> is a lowercase, hyphenated version of a name, safe to use in a filename. The <code>&lt;source-slug&gt;<\/code> is derived from your original file, and it names the directory. The <code>&lt;asset-slug&gt;<\/code> is derived from the file stem, plus the worksheet, page or part name when a source produces more than one twin.<\/p>\n<p>So one source always produces one directory. A Word document produces a directory with one Markdown file in it. A workbook with three worksheets produces a directory with three CSV files in it. Side artifacts sit in the same directory, under <code>media/<\/code> for images and <code>diagrams/<\/code> for SVG and diagram-as-code. The contract also allows <code>charts/<\/code>, but no shipped tool writes there.<\/p>\n<p>Go and look at what appeared. Open the directory, open at least one converted file, and read the first eight or so lines of it.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p><code>assets/<\/code> ships empty. There is not one example converted twin anywhere in the product, so you have nothing to compare your first output against. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<h2 id=\"the-provenance-header\"><span>The provenance header<\/span><a class=\"h-anchor\" href=\"#/05-bring-in-source-material/the-provenance-header\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The first block of every converted twin is YAML <strong>frontmatter<\/strong>, a small block of labelled values between two lines of three dashes, before the content starts. Here it holds the provenance: the record of where this text came from.<\/p>\n<div class=\"code-block\" data-lang=\"yaml\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-yaml\">---\nsource: &quot;&lt;the original file, as a repo-relative path or a URI&gt;&quot;\nsha256: &quot;&lt;64 lowercase hex characters&gt;&quot;\nconverter: &quot;&lt;the tool or agent that produced this text, with its version&gt;&quot;\ntimestamp: &quot;&lt;ISO 8601 UTC, for example 2026-03-02T14:02:11Z&gt;&quot;\ntype: &quot;markdown&quot;\nstatus: &quot;converted&quot;\n---\n<\/code><\/pre><\/div>\n<p>The tool writes every value in double quotes, as shown. Six fields, and each one answers a question.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>The question it answers<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>source<\/code><\/td>\n<td>Which original file is this a copy of.<\/td>\n<\/tr>\n<tr>\n<td><code>sha256<\/code><\/td>\n<td>What exactly was in that file at the moment it was read.<\/td>\n<\/tr>\n<tr>\n<td><code>converter<\/code><\/td>\n<td>What produced this text, and what version of it.<\/td>\n<\/tr>\n<tr>\n<td><code>timestamp<\/code><\/td>\n<td>When this copy was made.<\/td>\n<\/tr>\n<tr>\n<td><code>type<\/code><\/td>\n<td>What kind of body this is: <code>markdown<\/code>, <code>csv<\/code>, <code>text<\/code>, <code>html<\/code>, <code>image<\/code> or <code>other<\/code>.<\/td>\n<\/tr>\n<tr>\n<td><code>status<\/code><\/td>\n<td>How far this copy has got: <code>candidate<\/code>, <code>converted<\/code>, <code>superseded<\/code> or <code>rejected<\/code>.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Two of those fields need more explanation.<\/p>\n<p><strong>The hash.<\/strong> <code>sha256<\/code> is a code calculated from the content of the file itself. Most systems understand the same code. Change one character in the original and the code comes out completely different, which gives you identity based on content instead of on filename. If someone edits a PDF, keeps its name, and hands it back to you, the hash shows it as the same document in a changed state.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>The hash only makes that possible. <code>buildos intake convert<\/code> takes one source and converts it, with no change detection, no delta step, and no update-in-place behaviour anywhere in the intake flow. Re-running a conversion needs <code>--force<\/code> and overwrites. Noticing that a source is a revised version of one you already hold is work you or your agent do by reading, and the tool never reports it. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p><strong>The <code>type<\/code> field is not the <code>--type<\/code> flag.<\/strong> The flag says what kind of <em>source<\/em> you handed in (<code>docx<\/code>, <code>xlsx<\/code>, <code>pdf<\/code>). The frontmatter field says what kind of <em>body<\/em> came out (<code>markdown<\/code>, <code>csv<\/code>, <code>text<\/code>). A <code>.docx<\/code> source produces <code>type: markdown<\/code>.<\/p>\n<h2 id=\"check-it-before-you-trust-it\"><span>Check it before you trust it<\/span><a class=\"h-anchor\" href=\"#/05-bring-in-source-material/check-it-before-you-trust-it\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><code>status<\/code> has four values, and the first one needs explaining. <strong><code>candidate<\/code><\/strong> means &quot;this converted text is useful, but a person should look at it before we trust it.&quot; <code>buildos intake<\/code> always writes <code>converted<\/code>. <code>candidate<\/code> is a value you set yourself, by editing the twin&#39;s header.<\/p>\n<p>Use it whenever the conversion was not a straight deterministic read, such as a difficult PDF, an agent&#39;s output, or anything hand-made. Then run the check below, which takes about two minutes.<\/p>\n<ol>\n<li>Pick several distinctive values out of the converted text. Choose the ones a model would be most likely to invent: unusual field names, specific numbers, proper nouns.<\/li>\n<li>Open the original document and search for each one.<\/li>\n<li>If they are all there, change <code>status<\/code> to <code>converted<\/code>.<\/li>\n<li>Write down, somewhere a reader will see it, that the check was a sample and not a proof.<\/li>\n<\/ol>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>Step 4 has nowhere to go. The <code>candidate<\/code> and <code>converted<\/code> states exist, but no field records who checked the twin, what they checked, or that only a sample was checked. Put it in your commit message or in a note beside the work. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Nothing in the record says whether a source&#39;s <em>content<\/em> was written by a model. The <code>converter<\/code> field records what converted the file, not who wrote it. Vendors increasingly hand over material they generated with AI and have not reviewed, and some of them will tell you so if you ask. The converted twin will be perfectly faithful to a document that is wrong. Ask where a document came from before you convert it, and set <code>status: candidate<\/code> when the answer is uncomfortable.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>A vendor&#39;s capability list is usually a <em>delta<\/em>. It describes what is new in a release, and leaves out everything the product already did. Treating one as a full surface will make whole areas look missing when they are standard and therefore unmentioned. Establish what the baseline is before you build anything on top of the converted text.<\/p>\n<\/div><\/aside>\n<h2 id=\"one-source-per-run\"><span>One source per run<\/span><a class=\"h-anchor\" href=\"#/05-bring-in-source-material/one-source-per-run\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><code>buildos intake convert<\/code> takes <code>--source &lt;path&gt;<\/code>, and that path is one source. There is no folder sweep. The tool will not walk a directory for you.<\/p>\n<p>So a folder of 40 documents is 40 invocations. In practice teams ask their agent to work through the folder and run the command once per file, and that is how most real intake happens.<\/p>\n<p><strong>Nothing in the product knows the folder as a unit.<\/strong> No record says that a batch happened, duplicates inside it go undetected, and nothing tells you which files have not been done yet. If the loop stops halfway, the only way to find out is to look.<\/p>\n<p><strong>Ground yourself before you start.<\/strong> Write down which directories you expect to change, then compare before and after. Without that, you have no way to check what a bulk run actually did.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>It is tempting to tell the agent to read difficult files itself and write the text out, and it will do it. That breaks the guarantee this whole page rests on. The twin&#39;s <code>converter<\/code> stamp is no longer true, the hash stops implying that anyone can reproduce the text, and the content becomes a model&#39;s reading of the document. Sometimes it is the only option. <a href=\"#/06-sources-the-converter-cannot-read\">Sources the converter cannot read<\/a> covers when, and what to do so the result is still honest.<\/p>\n<\/div><\/aside>\n<h2 id=\"find-out-what-is-already-in-the-system\"><span>Find out what is already in the system<\/span><a class=\"h-anchor\" href=\"#/05-bring-in-source-material/find-out-what-is-already-in-the-system\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>There are two derived catalogs. An <strong>index<\/strong> is a generated lookup file. It is never the source of truth, and you can delete and rebuild it any time.<\/p>\n<p>Rebuild the playbook catalog:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos intake index playbooks\n<\/code><\/pre><\/div>\n<p>It prints <code>wrote &lt;path&gt; (&lt;n&gt; playbooks)<\/code> and writes <code>.os/indexes/playbooks.json<\/code>. In a freshly set-up project it finds six.<\/p>\n<p>Rebuild the converted-source catalog:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos intake index references\n<\/code><\/pre><\/div>\n<p>It writes <code>.os/indexes/references.json<\/code>, built from the frontmatter of every converted twin under <code>assets/<\/code>.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p><code>references.json<\/code> does not exist in the shipped tree, even though contracts, routers and guides all refer to it. The command runs, but against an empty <code>assets/<\/code> it produces <code>{&quot;version&quot;: 1, &quot;references&quot;: null}<\/code>, which catalogs nothing. Until you have converted some sources, there is nothing for it to catalog. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p>Until then, look in <code>assets/<\/code> yourself, or ask your agent to list the converted twins and their <code>source<\/code> fields. Build the reference index after each round of conversion so the answer gets cheaper over time.<\/p>\n<h2 id=\"what-you-should-have-now\"><span>What you should have now<\/span><a class=\"h-anchor\" href=\"#/05-bring-in-source-material/what-you-should-have-now\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>A source file with a plain filename, of one of the six supported types.<\/li>\n<li>At least one directory under <code>assets/<\/code>, holding one or more converted twins.<\/li>\n<li>A provenance header on each twin, and you have read one.<\/li>\n<li>A <code>status<\/code> value you chose deliberately: <code>converted<\/code> if the conversion was a straight deterministic read, <code>candidate<\/code> if it needs a person&#39;s eye.<\/li>\n<li>A clear idea of which of your documents the converter cannot read at all.<\/li>\n<\/ul>\n<h2 id=\"next\"><span>Next<\/span><a class=\"h-anchor\" href=\"#/05-bring-in-source-material/next\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><a href=\"#/06-sources-the-converter-cannot-read\">Sources the converter cannot read<\/a>, which covers your email, your slide decks and your meeting recordings, none of which the converter takes.<\/p>\n","toc":[{"id":"what-you-need-first","text":"What you need first","level":2},{"id":"what-conversion-does","text":"What conversion does","level":2},{"id":"the-six-formats-that-work","text":"The six formats that work","level":2},{"id":"decide-what-goes-in-and-when","text":"Decide what goes in, and when","level":2},{"id":"prepare-the-file","text":"Prepare the file","level":2},{"id":"run-the-conversion","text":"Run the conversion","level":2},{"id":"a-worked-example-start-to-finish","text":"A worked example, start to finish","level":3},{"id":"what-lands-on-disk","text":"What lands on disk","level":3},{"id":"the-provenance-header","text":"The provenance header","level":2},{"id":"check-it-before-you-trust-it","text":"Check it before you trust it","level":2},{"id":"one-source-per-run","text":"One source per run","level":2},{"id":"find-out-what-is-already-in-the-system","text":"Find out what is already in the system","level":2},{"id":"what-you-should-have-now","text":"What you should have now","level":2},{"id":"next","text":"Next","level":2}]},"06-sources-the-converter-cannot-read":{"slug":"06-sources-the-converter-cannot-read","num":"06","title":"Sources the converter cannot read","lede":"This page tells you which of your documents <code>buildos intake<\/code> cannot handle, and what to do with each of them.","html":"<h2 id=\"what-you-need-first\"><span>What you need first<\/span><a class=\"h-anchor\" href=\"#/06-sources-the-converter-cannot-read/what-you-need-first\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Read <a href=\"#/05-bring-in-source-material\">Bring in source material<\/a> first. This page assumes it.<\/p>\n<p>It also assumes two words from that page. A <strong>converted twin<\/strong> is a clean text copy of an original file, carrying a header that records where it came from, its hash, what converted it, and when. <strong>Conversion<\/strong> is the step that produces one, with no model and no network connection involved.<\/p>\n<h2 id=\"what-the-converter-takes\"><span>What the converter takes<\/span><a class=\"h-anchor\" href=\"#/06-sources-the-converter-cannot-read/what-the-converter-takes\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The converter reads six kinds of source: CSV, Word, Excel, HTML, a directory of HTML, and PDF. That list is fixed in the tool, and no configuration setting extends it. Most of what a real team holds falls outside it.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>What you have<\/th>\n<th>Supported?<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Word, Excel, CSV, HTML<\/td>\n<td>Yes<\/td>\n<td>Convert it. See <a href=\"#/05-bring-in-source-material\">Bring in source material<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>PDF<\/td>\n<td>Yes, minimally<\/td>\n<td>Read the PDF section below before you trust the output.<\/td>\n<\/tr>\n<tr>\n<td>Email (<code>.msg<\/code>, <code>.eml<\/code>)<\/td>\n<td>No<\/td>\n<td>Paste the body into a Word document. Below.<\/td>\n<\/tr>\n<tr>\n<td>Slide decks (<code>.pptx<\/code>)<\/td>\n<td>No<\/td>\n<td>Export to PDF first, then read the PDF section.<\/td>\n<\/tr>\n<tr>\n<td>Meeting recordings, audio, video<\/td>\n<td>No<\/td>\n<td>There is no path. Get a text transcript from elsewhere.<\/td>\n<\/tr>\n<tr>\n<td>Meeting transcripts<\/td>\n<td>Only if they are already a Word document<\/td>\n<td>A transcript saved as <code>.docx<\/code> converts. A transcript sitting in a meeting tool does not.<\/td>\n<\/tr>\n<tr>\n<td>Diagrams and entity-relationship models<\/td>\n<td>No, in any useful sense<\/td>\n<td>Hand-convert it. Below.<\/td>\n<\/tr>\n<tr>\n<td>Very large metadata exports<\/td>\n<td>No practical path<\/td>\n<td>Ask for a filtered export.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3 id=\"how-to-tell-quickly\"><span>How to tell quickly<\/span><a class=\"h-anchor\" href=\"#/06-sources-the-converter-cannot-read/how-to-tell-quickly\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Run two checks, in order.<\/p>\n<ol>\n<li><strong>Look at the extension.<\/strong> If it is not <code>.csv<\/code>, <code>.docx<\/code>, <code>.xlsx<\/code>, <code>.html<\/code>, <code>.htm<\/code> or <code>.pdf<\/code>, the tool will not take it.<\/li>\n<li><strong>For a PDF, open it and work out where the meaning lives.<\/strong> In a report the meaning is in the words, and the converter will get it. In a diagram, a screenshot, a scanned page, or a table drawn as boxes, the meaning is in the picture, and the converter reads words only.<\/li>\n<\/ol>\n<p>There is a third check worth doing before you commit anything to the project. Hand the file to your agent and ask whether it can read it at all, before you copy it into the repository or run the converter on it. A no at that point costs you nothing and keeps the file out of the record.<\/p>\n<h2 id=\"email\"><span>Email<\/span><a class=\"h-anchor\" href=\"#/06-sources-the-converter-cannot-read/email\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Email has never been supported. <code>.msg<\/code> and <code>.eml<\/code> are not among the six.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p><code>buildos intake convert<\/code> has no email format. Neither the message file nor its attachments have a conversion path. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p>The workaround is short:<\/p>\n<ol>\n<li>Open the message.<\/li>\n<li>Copy the body text.<\/li>\n<li>Paste it into a <strong>new Word document<\/strong>. Give it a plain filename, no pipes and no slashes.<\/li>\n<li>Add a first line naming the sender, the recipients and the date. The converter has no way to know any of that, and no other part of the system records it.<\/li>\n<li>Save the attachments separately. If one of them is a Word file or a spreadsheet, it is an ordinary supported source. Convert it on its own.<\/li>\n<li>Convert the Word document you just wrote.<\/li>\n<\/ol>\n<p>Use Word rather than Markdown, because <strong>there is no Markdown input type.<\/strong> The supported list is <code>csv<\/code>, <code>docx<\/code>, <code>xlsx<\/code>, <code>pdf<\/code>, <code>html<\/code> and <code>html-dir<\/code>. A <code>.md<\/code> or <code>.txt<\/code> file you typed yourself has no automatic conversion path. You can still bring one in, but you must write its provenance header by hand under the manual playbook described below. Saving as <code>.docx<\/code> and running the command is less work and produces a better header.<\/p>\n<p>The result is a proper converted twin with a real provenance header. Its <code>source<\/code> field points at the document you typed rather than at the original message, so write that fact into the body where a reader will find it.<\/p>\n<h2 id=\"pdfs\"><span>PDFs<\/span><a class=\"h-anchor\" href=\"#/06-sources-the-converter-cannot-read/pdfs\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>PDF is on the supported list, and that support is narrower than it sounds.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>PDF intake is deliberately minimal. There is no OCR, no table reconstruction, no embedded-image extraction, and no layout fidelity. The intake contract states this outright and says none of it is planned. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p>A text-heavy PDF converts acceptably. You get a <code>.txt<\/code> twin holding the words.<\/p>\n<p>A diagram-heavy PDF fails <strong>quietly<\/strong>. The output is a <code>.txt<\/code> file with words in it that looks like a successful conversion. What it holds is whatever loose labels happened to be stored as text, such as box names, stray column headings and page furniture. The relationships, the arrows, the grouping and the row-to-column alignment are all gone.<\/p>\n<p>Nothing marks that file as broken. Its header says <code>converter<\/code> and <code>sha256<\/code> and <code>timestamp<\/code>, the same as any other twin. An agent reading it will find field names and answer confident questions about them, and the answers will be wrong.<\/p>\n<p>Two rules follow from that.<\/p>\n<ul>\n<li><strong>Open every PDF twin and read it<\/strong> before anything else touches it. A quick look tells you whether the meaning survived.<\/li>\n<li><strong>If it did not, set <code>status: rejected<\/code>, or <code>status: candidate<\/code> if part of it is usable.<\/strong> Both values exist for this case. Do not leave a bad conversion sitting at <code>converted<\/code>.<\/li>\n<\/ul>\n<h3 id=\"diagrams-and-data-models\"><span>Diagrams and data models<\/span><a class=\"h-anchor\" href=\"#/06-sources-the-converter-cannot-read/diagrams-and-data-models\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A vendor&#39;s data model usually arrives as a diagram exported to PDF. In that form the converter produces text nobody can use.<\/p>\n<p>What people actually do is skip the converter for that one step. Point a capable agent at the file, ask it to extract only the diagram on a given page, and have it write the model out as text. Then verify a sample of the field names against the original by eye, and keep the one or two output formats you can actually read. Discard the rest.<\/p>\n<p>Be clear about what you have when you are done. That output has no provenance header, so it cannot be indexed as a reference and nothing downstream can tell how it was made. To turn it into a proper twin, follow the manual path below.<\/p>\n<h2 id=\"the-manual-conversion-path\"><span>The manual conversion path<\/span><a class=\"h-anchor\" href=\"#/06-sources-the-converter-cannot-read/the-manual-conversion-path\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>BuildOS ships a playbook for this. A <strong>playbook<\/strong> is a written procedure that tells a person or an agent how to do one job, step by step, and it lives as a Markdown file in the repository.<\/p>\n<p>The one you want is <strong>PB-003, &quot;Manual intake conversion&quot;<\/strong>, at:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>playbooks/administrative/manual-intake-conversion.md\n<\/code><\/pre><\/div>\n<p>It is one of only three playbooks that ship as <code>active<\/code>, and the only active one that produces anything. Its stated purpose is to create trustworthy converted twins when the automated intake is unavailable, fails, or produces output that is not good enough.<\/p>\n<p>It rests on one requirement: <strong>a hand-made conversion must meet the same contract as a machine-made one, so that nothing downstream can tell the difference.<\/strong> That covers the path, the header, and the rules about what the body may contain.<\/p>\n<p>The procedure, in short:<\/p>\n<ol>\n<li><p>Read the two contracts it names, <code>.os/contracts/converted-source-contract.md<\/code> and <code>.os/contracts/intake-translation-contract.md<\/code>.<\/p>\n<\/li>\n<li><p>Create <code>assets/&lt;source-slug&gt;/<\/code> for your source.<\/p>\n<\/li>\n<li><p>Write the converted body into that directory.<\/p>\n<\/li>\n<li><p>Put full frontmatter on it: <code>source<\/code>, <code>sha256<\/code>, <code>converter<\/code>, <code>timestamp<\/code>, <code>type<\/code>, <code>status<\/code>. The <code>sha256<\/code> is computed from the <strong>original<\/strong> file, not from the text you wrote. Run one of these against it and copy the 64-character hex string:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>shasum -a 256 sources/lending-overview.pdf\n<\/code><\/pre><\/div>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>sha256sum sources/lending-overview.pdf\n<\/code><\/pre><\/div>\n<p>macOS ships <code>shasum<\/code>. Most Linux systems ship <code>sha256sum<\/code>. Either one prints the hash first and the filename second, and you want the hash only.<\/p>\n<\/li>\n<li><p>Set <code>converter: &quot;manual-intake/1.0.0&quot;<\/code> when a person did the work. If a local tool or an agent produced the body, name that instead, with its version.<\/p>\n<\/li>\n<li><p>Keep the body faithful. Preserve the order, headings, labels and visible text of the original. Do not add headings that were not there. Do not reconstruct a table&#39;s structure from what it looked like.<\/p>\n<\/li>\n<li><p>Put images, charts and diagrams in the same source directory under <code>media/<\/code>, <code>diagrams/<\/code> or <code>charts/<\/code>, and link to them from the body with relative links.<\/p>\n<\/li>\n<li><p>Add nothing interpretive. No requirement language, no capability labels, no IDs, no findings. A converted twin records only what the source said.<\/p>\n<\/li>\n<li><p>Mark it honestly. If the conversion is incomplete or you cannot vouch for it, <code>status: candidate<\/code> or <code>status: rejected<\/code>.<\/p>\n<\/li>\n<li><p>Rebuild the reference index: <code>buildos intake index references<\/code>.<\/p>\n<\/li>\n<\/ol>\n<p>The playbook lists twelve steps and gives per-format guidance for Word, Excel, HTML, HTML directories, CSV and PDF. Read it before your first hand conversion.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>The failure this playbook prevents is easy to walk into by accident. A Markdown file you pasted content into and dropped in <code>assets/<\/code> has no <code>source<\/code>, no <code>sha256<\/code>, no <code>converter<\/code> and no <code>timestamp<\/code>. It sits in the right folder and looks exactly like a twin. Without the header it will not appear in the reference index, and nothing can trace a claim back through it.<\/p>\n<\/div><\/aside>\n<h2 id=\"what-a-bad-conversion-costs-you\"><span>What a bad conversion costs you<\/span><a class=\"h-anchor\" href=\"#/06-sources-the-converter-cannot-read/what-a-bad-conversion-costs-you\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A converted twin is faithful to whatever the source said, whether or not the source was right, and it carries no signal about how well the conversion went. Downstream, that text becomes the basis for extracted records, and those records become the basis for comparisons, requirements and decisions. Each hop moves further from the original file, and by the fourth hop nobody is going to reopen the PDF.<\/p>\n<p>The failure is quiet at every stage. A diagram PDF converts to plausible-looking text, an agent reads it and produces rows that look like every other row, and a comparison then counts those rows and reports a gap that does not exist. Nothing along the way is marked as suspect, because no part of the system has any way to know.<\/p>\n<p>Two ordinary ways this happens. A transcript can carry hundreds of words of unrelated audio, such as advertising or voiceover, presented as speech. A vendor workbook can lean heavily on AI without saying so on the page. Either one goes in looking clean.<\/p>\n<p>Four things you can do about it, at roughly two minutes per twin:<\/p>\n<ul>\n<li>Open every twin from a source that was not a straight deterministic read.<\/li>\n<li>Spot-check distinctive values against the original.<\/li>\n<li>Use <code>status: candidate<\/code> and <code>status: rejected<\/code>. Each is one word, and it carries forward.<\/li>\n<li>Say in writing that your check was a sample.<\/li>\n<\/ul>\n<h2 id=\"writing-a-source-on-purpose\"><span>Writing a source on purpose<\/span><a class=\"h-anchor\" href=\"#/06-sources-the-converter-cannot-read/writing-a-source-on-purpose\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Sometimes the best move is to stop fighting a source. Some knowledge exists only in someone&#39;s head, or only in a file nothing can read. In both cases, write a clean document yourself and bring that in.<\/p>\n<p>BuildOS asks only that the text is faithful and that the header says where it came from. A document you wrote this morning qualifies as a source in exactly the same way a vendor specification does, with the advantage that you know what is in it.<\/p>\n<p>What works in practice:<\/p>\n<ol>\n<li><strong>Start from something structured you already have.<\/strong> A matrix, a list, an outline. Let it decide what the document has to cover.<\/li>\n<li><strong>Fix a question set and answer it identically for every item.<\/strong> One item per page. The same four or five questions each time. Consistency is what makes the document extractable later.<\/li>\n<li><strong>Use an agent for the first draft, and label what it wrote.<\/strong> A reviewer who knows they are reading a draft will argue with it, which is what you want.<\/li>\n<li><strong>Review it with people who know the domain, before conversion rather than after.<\/strong> An agent&#39;s first structure can be wrong in a way only a domain expert will see. It may invent a general &quot;exceptions&quot; section instead of putting each exception where it actually occurs. Undoing that is a human judgement, and it has to happen before the document goes in.<\/li>\n<li><strong>Save it as Word and convert it.<\/strong> Word is the format the converter handles best.<\/li>\n<\/ol>\n<p>Do not withhold a document because it looks rough. Hand-typed, unnumbered and unprioritised is fine. What usually stops people here is embarrassment rather than any technical problem.<\/p>\n<h2 id=\"keep-invented-names-out\"><span>Keep invented names out<\/span><a class=\"h-anchor\" href=\"#/06-sources-the-converter-cannot-read/keep-invented-names-out\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>One thing does need removing before you convert a document you wrote, and that is any name you guessed at.<\/p>\n<p>Extraction cannot tell an approximate label from a real one. If your document names an entity in the target system and that name is your best guess, it will be read as a fact, extracted into records, and inherited by everything downstream.<\/p>\n<p>Before you convert your own document:<\/p>\n<ol>\n<li>Go through it and mark which parts are fact and which are assumption.<\/li>\n<li>Take the guessed names out. Describe the thing instead of naming it.<\/li>\n<li>Put the hedge <strong>inside the document body<\/strong> rather than in a message to someone. Write that these are the author&#39;s assumptions, that some may already exist under other names, and that the names are approximate. Only text inside the document travels with the document.<\/li>\n<li>If a version with the guesses in it has already been converted, convert the corrected version as a new source and mark the old twin <code>superseded<\/code>. Then ask your agent, explicitly, which already-extracted records carry the bad names, and have it correct them.<\/li>\n<\/ol>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Only one record type in BuildOS protects names deliberately. Personas have an identity contract which says that a name an extractor saw is not an approved name until a person writes it in on purpose. Requirements and capabilities have no such protection. A guessed name inside one of those goes straight through.<\/p>\n<\/div><\/aside>\n<h2 id=\"deciding-what-to-do-with-a-pile-of-documents\"><span>Deciding what to do with a pile of documents<\/span><a class=\"h-anchor\" href=\"#/06-sources-the-converter-cannot-read/deciding-what-to-do-with-a-pile-of-documents\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>There are four outcomes. Work through them in this order.<\/p>\n<p><strong>Convert it.<\/strong> Use the tool when the file is one of the six formats and the meaning is in the words. That covers most Word documents, all spreadsheets, all CSVs, and text-heavy PDFs. It costs one command.<\/p>\n<p><strong>Hand-convert it under PB-003<\/strong> when the content matters and the tool cannot get it out faithfully. Diagram PDFs, slide decks whose content matters, and anything an agent had to read for you all belong here. Each one is real work and you write the header yourself, so reserve this for sources you will actually use.<\/p>\n<p><strong>Rewriting the source<\/strong> is the right answer when the original is a poor container for knowledge you have anyway. Email threads, notes, and anything where a clean Word document you write would be shorter and truer than a faithful copy. Budget an afternoon. The result is often the best source in the set.<\/p>\n<p><strong>Leave it out<\/strong> if it duplicates something already in, if it is a delta document whose baseline you do not have, if it is a very large unfiltered export, or if nobody can vouch for it. That costs nothing. Write down that you excluded it and why, so the question does not get reopened every month.<\/p>\n<p>When two of these seem to apply, ask whether anyone would notice if the conversion came out badly. If nobody would, do not run the converter on it. Hand-convert it or leave it out.<\/p>\n<h2 id=\"what-you-should-have-now\"><span>What you should have now<\/span><a class=\"h-anchor\" href=\"#/06-sources-the-converter-cannot-read/what-you-should-have-now\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>A list of your documents split into the four outcomes above.<\/li>\n<li>The unsupported ones identified before you wasted a command on them.<\/li>\n<li>Any email you needed pasted into a Word document and converted, with sender, recipients and date recorded in the file.<\/li>\n<li>Every PDF twin opened and read, with <code>status<\/code> set honestly on each.<\/li>\n<li>Any hand-made conversion sitting at <code>assets/&lt;source-slug&gt;/<\/code> with full provenance frontmatter and <code>converter: &quot;manual-intake/1.0.0&quot;<\/code>.<\/li>\n<li>A rebuilt reference index, if you added twins by hand.<\/li>\n<\/ul>\n<h2 id=\"next\"><span>Next<\/span><a class=\"h-anchor\" href=\"#/06-sources-the-converter-cannot-read/next\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>You now have converted text in <code>assets/<\/code>. Read <a href=\"#/07-pull-knowledge-out-of-it\">Pull knowledge out of it<\/a> to turn that text into records you can count, compare and trace.<\/p>\n","toc":[{"id":"what-you-need-first","text":"What you need first","level":2},{"id":"what-the-converter-takes","text":"What the converter takes","level":2},{"id":"how-to-tell-quickly","text":"How to tell quickly","level":3},{"id":"email","text":"Email","level":2},{"id":"pdfs","text":"PDFs","level":2},{"id":"diagrams-and-data-models","text":"Diagrams and data models","level":3},{"id":"the-manual-conversion-path","text":"The manual conversion path","level":2},{"id":"what-a-bad-conversion-costs-you","text":"What a bad conversion costs you","level":2},{"id":"writing-a-source-on-purpose","text":"Writing a source on purpose","level":2},{"id":"keep-invented-names-out","text":"Keep invented names out","level":2},{"id":"deciding-what-to-do-with-a-pile-of-documents","text":"Deciding what to do with a pile of documents","level":2},{"id":"what-you-should-have-now","text":"What you should have now","level":2},{"id":"next","text":"Next","level":2}]},"07-pull-knowledge-out-of-it":{"slug":"07-pull-knowledge-out-of-it","num":"07","title":"Pull knowledge out of it","lede":"This page shows you how to turn the text you brought in during intake into typed rows that a person or an agent can query, count, and trace back to their source.","html":"<h2 id=\"what-you-need-first\"><span>What you need first<\/span><a class=\"h-anchor\" href=\"#/07-pull-knowledge-out-of-it/what-you-need-first\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Read <a href=\"#/05-bring-in-source-material\">Bring in source material<\/a> first. This page assumes you have at least one converted source in <code>assets/<\/code>. You also need an agent tool of some kind, and you need to have edited <code>.os/config/instance.yaml<\/code> as described in <a href=\"#/04-install-and-configure-your-instance\">Install and configure your instance<\/a>. Set aside an hour for your first pass.<\/p>\n<h2 id=\"what-extraction-means-here\"><span>What extraction means here<\/span><a class=\"h-anchor\" href=\"#/07-pull-knowledge-out-of-it/what-extraction-means-here\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>You now have clean text. A person can read it, but you cannot count it, sort it, compare two versions of it, or ask which parts of it nobody has tested. So the next job is to read the text and write down what it contains as rows.<\/p>\n<p>Two words do most of the work on this article.<\/p>\n<p>An <strong>entity record<\/strong> is one line of JSON describing one thing, with a stable ID. It lives in a file under <code>.os/data/<\/code>. Think of each file as a table and each row as a line in that table: personas is a table, capabilities is a table.<\/p>\n<p>An <strong>extraction<\/strong> is a record of one reading pass. It says which piece of which converted source was read and which entity records came out of it. The knowledge itself lives in those records, and the extraction row holds the accounting for where they came from.<\/p>\n<p>The distinction that trips everybody, including people who built this system, is between <em>converting<\/em> and <em>extracting<\/em>. Converting turns a Word document into Markdown without reading it. Extracting reads the converted text and decides what it says. The two run at different times, and it is worth keeping the words apart when you talk about them.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>The shipped system has no extraction writer and no entity-record writer. <code>.os/data/extractions.jsonl<\/code> is an empty file, and no shipped command appends to it. The same is true for requirements, capabilities, personas, test cases, and results. Nothing writes them. Every row in this article is authored by hand, or by an agent that you have asked to write it. What ships is the contract that says what a correct row looks like, plus a validator that checks your rows against it. From BuildOS <code>0.2.0<\/code>, the <code>buildos-bulk-extract<\/code> skill adds a writer for the rows an agent drafts: <code>buildos extract bulk<\/code> stages them, records a second reviewer&#39;s decisions, and publishes the approved rows to <code>.os/data/<\/code> with one extraction record for each publication. It does not read your sources; the agent still decides what they say. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p>What keeps your rows consistent, then, is a written contract rather than a program.<\/p>\n<h2 id=\"the-record-types\"><span>The record types<\/span><a class=\"h-anchor\" href=\"#/07-pull-knowledge-out-of-it/the-record-types\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Four types matter when you are reading source material. A <strong>contract<\/strong> is the rule book for one artifact type: it says what fields are required and what states the artifact can be in. <code>.os/contracts/entity-records-contract.md<\/code> is the contract for all of these, and it is the authority for the full field list. What follows covers the shape and the reasoning behind it.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>ID prefix<\/th>\n<th>File<\/th>\n<th>What it is<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>capability<\/td>\n<td><code>CAP<\/code><\/td>\n<td><code>capabilities.jsonl<\/code><\/td>\n<td>Something the system <em>can<\/em> do. Descriptive. It may turn out to be false.<\/td>\n<\/tr>\n<tr>\n<td>requirement<\/td>\n<td><code>REQ<\/code><\/td>\n<td><code>requirements.jsonl<\/code><\/td>\n<td>Something the system <em>must<\/em> do. Normative. Somebody is tracking it.<\/td>\n<\/tr>\n<tr>\n<td>persona<\/td>\n<td><code>PER<\/code><\/td>\n<td><code>personas.jsonl<\/code><\/td>\n<td>A kind of user or stakeholder: their goals and their needs.<\/td>\n<\/tr>\n<tr>\n<td>test case<\/td>\n<td><code>TC<\/code><\/td>\n<td><code>test-cases.jsonl<\/code><\/td>\n<td>A repeatable check: what it verifies, its setup, its steps, its expected outcome.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The capability-versus-requirement line is the one people ask about first. A capability states that a thing can be done, and it may be true or false, which is what testing is for. A requirement demands a capability, and the extra ingredient is ownership: somebody requires it and somebody is tracking whether it exists. Capabilities work as the spine, with requirements as a child table hanging off them.<\/p>\n<p>A test case completes the picture. You have a capability you believe exists and a test that goes to see whether it does. Delivery afterwards tells you whether it really did.<\/p>\n<p>All four record types carry the same envelope: <code>id<\/code>, <code>type<\/code>, <code>title<\/code>, <code>status<\/code>, <code>summary<\/code>, <code>source_anchor<\/code>, <code>source_refs[]<\/code>, <code>related[]<\/code>, <code>created_at<\/code>, <code>updated_at<\/code>.<\/p>\n<p>There is also <strong><code>doc_anchor<\/code><\/strong>. <code>source_anchor<\/code> points back at the converted text a row came <em>from<\/em>. <code>doc_anchor<\/code> points forward at the written document that explains it, meaning a heading inside a file under <code>docs/<\/code>. Leave it out while a row is <code>draft<\/code>. Move the row to any other status and the validator requires it, and requires its path to start with <code>docs/<\/code>.<\/p>\n<p>Three of those fields need more explanation.<\/p>\n<p><strong><code>status<\/code><\/strong> has exactly four values: <code>draft<\/code>, <code>active<\/code>, <code>superseded<\/code>, <code>archived<\/code>. It describes where the row sits in <em>your<\/em> review, not what the system you are studying thinks about it.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Statuses from the source system leak into this field. A vendor document that labels a feature &quot;preview&quot; or &quot;candidate&quot; will tempt an agent to write that word into <code>status<\/code>, and <code>candidate<\/code> in particular looks plausible because BuildOS does use it elsewhere, as a conversion state on a converted source, though never as an entity status. Tell your agent to map the source&#39;s own status into <code>summary<\/code> or <code>tags[]<\/code> and leave <code>status<\/code> alone.<\/p>\n<\/div><\/aside>\n<p><strong><code>source_anchor<\/code><\/strong> is the pointer back to the exact place in the converted text that this row came from. Think of it as the bibliography. Rows without it hold up fine until somebody asks where a number came from, or until the system you are studying renames something and you need to find every row that mentioned it.<\/p>\n<p><strong>How to write one.<\/strong> An <strong>anchor<\/strong> is a pointer to one heading inside a Markdown file. You write the path to the file, then <code>#<\/code>, then a label made from the heading text: lowercase it, drop the punctuation, and turn each run of spaces into a single hyphen. So if the converted twin <code>assets/lending-overview/lending-overview.md<\/code> contains this heading:<\/p>\n<div class=\"code-block\" data-lang=\"markdown\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-markdown\">## Loans and holds\n<\/code><\/pre><\/div>\n<p>then the anchor for it is:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>assets/lending-overview/lending-overview.md#loans-and-holds\n<\/code><\/pre><\/div>\n<p>That lowercase-and-hyphen step is the ordinary Markdown convention rather than a BuildOS rule, and no contract under <code>.os/contracts/<\/code> defines one. The requirement is simply that the text after the <code>#<\/code> names a heading that is really in that file. So derive every anchor from a heading you have opened and looked at, and copy the heading text instead of recalling it.<\/p>\n<p><strong>This rule is for anchors you write yourself<\/strong>, pointing into a converted twin whose headings came from the original document. Anchors into a run&#39;s <code>raw-findings.md<\/code> work differently, because a tool writes that file and generates its headings. Those anchors are always <code>#raw-finding-1<\/code>, <code>#raw-finding-2<\/code>, and so on, numbered in order. You read them out of the file rather than deriving them. <a href=\"#/09-qualify-what-you-found\">Qualify what you found<\/a> covers that case.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Nothing checks that an anchor resolves. <code>buildos validate<\/code> checks the shape of the value: a path inside the project, one <code>#<\/code>, and a label after it, and for an extraction row a path that starts with <code>assets/<\/code>. It never opens the file. A row with a misspelt anchor will pass validation, and the next person who tries to follow that anchor is the one who finds out.<\/p>\n<\/div><\/aside>\n<p><strong>Twins with no headings.<\/strong> A CSV twin has no headings, and a <code>.txt<\/code> twin converted from a PDF often has none either. No contract says what to anchor to in that case. Pick one convention for your team, such as the worksheet name or the page number, write it down, and use the same one everywhere.<\/p>\n<p><strong><code>systems<\/code>, <code>environments<\/code>, and <code>owners<\/code><\/strong> are optional lists that scope a row. Every value in them must be an ID you configured in <code>.os/config/instance.yaml<\/code>. Made-up values fail validation.<\/p>\n<h3 id=\"what-a-row-actually-looks-like\"><span>What a row actually looks like<\/span><a class=\"h-anchor\" href=\"#/07-pull-knowledge-out-of-it/what-a-row-actually-looks-like\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The files hold one record per line. The examples below are spread over several lines so you can read them. Assume the subject is a community library&#39;s book-lending system.<\/p>\n<p>A capability:<\/p>\n<div class=\"code-block\" data-lang=\"json\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-json\">{\n  &quot;id&quot;: &quot;CAP-014&quot;,\n  &quot;type&quot;: &quot;capability&quot;,\n  &quot;title&quot;: &quot;Place a hold on a book copy for a patron&quot;,\n  &quot;status&quot;: &quot;draft&quot;,\n  &quot;summary&quot;: &quot;The system can hold a book copy for a patron before any loan exists.&quot;,\n  &quot;source_anchor&quot;: &quot;assets/lending-overview/lending-overview.md#holds&quot;,\n  &quot;source_refs&quot;: [&quot;assets/lending-overview/lending-overview.md#holds&quot;],\n  &quot;related&quot;: [&quot;REQ-021&quot;],\n  &quot;created_at&quot;: &quot;2026-03-02&quot;,\n  &quot;updated_at&quot;: &quot;2026-03-02&quot;,\n  &quot;systems&quot;: [&quot;lending-system&quot;],\n  &quot;environments&quot;: [&quot;vendor-baseline&quot;],\n  &quot;owners&quot;: [&quot;product-team&quot;],\n  &quot;description&quot;: &quot;A hold keeps one book copy for a named patron until a pickup date, without creating a loan.&quot;,\n  &quot;supports&quot;: [&quot;REQ-021&quot;],\n  &quot;limits&quot;: [&quot;The source does not say whether a hold blocks a transfer of the copy to another branch.&quot;]\n}\n<\/code><\/pre><\/div>\n<p>A requirement, which adds <code>statement<\/code>, <code>rationale<\/code>, and <code>acceptance_refs[]<\/code>:<\/p>\n<div class=\"code-block\" data-lang=\"json\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-json\">{\n  &quot;id&quot;: &quot;REQ-021&quot;,\n  &quot;type&quot;: &quot;requirement&quot;,\n  &quot;title&quot;: &quot;Show the fine owed before checkout&quot;,\n  &quot;status&quot;: &quot;draft&quot;,\n  &quot;summary&quot;: &quot;The patron sees any fine owed before a new loan is made.&quot;,\n  &quot;source_anchor&quot;: &quot;assets/lending-overview/lending-overview.md#fines&quot;,\n  &quot;source_refs&quot;: [&quot;assets/lending-overview/lending-overview.md#fines&quot;],\n  &quot;related&quot;: [&quot;CAP-014&quot;, &quot;TC-018&quot;],\n  &quot;created_at&quot;: &quot;2026-03-02&quot;,\n  &quot;updated_at&quot;: &quot;2026-03-02&quot;,\n  &quot;statement&quot;: &quot;The system must show the total fine a patron owes before a new loan is checked out.&quot;,\n  &quot;rationale&quot;: &quot;Patrons ask what they owe at the desk, and staff need to tell them before they lend more books.&quot;,\n  &quot;acceptance_refs&quot;: [&quot;TC-018&quot;]\n}\n<\/code><\/pre><\/div>\n<p>Write the rationale as a business reason. An agent left to itself will produce something like &quot;must remain traceable to the approved task,&quot; which is bookkeeping rather than a reason anybody can argue with.<\/p>\n<p>A persona adds <code>description<\/code>, <code>goals[]<\/code>, and <code>needs[]<\/code>:<\/p>\n<div class=\"code-block\" data-lang=\"json\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-json\">{\n  &quot;id&quot;: &quot;PER-002&quot;,\n  &quot;type&quot;: &quot;persona&quot;,\n  &quot;title&quot;: &quot;Circulation desk clerk&quot;,\n  &quot;status&quot;: &quot;draft&quot;,\n  &quot;summary&quot;: &quot;Takes loan and hold requests and checks out book copies.&quot;,\n  &quot;source_anchor&quot;: &quot;assets/lending-overview/lending-overview.md#roles&quot;,\n  &quot;source_refs&quot;: [&quot;assets/lending-overview/lending-overview.md#roles&quot;],\n  &quot;related&quot;: [],\n  &quot;created_at&quot;: &quot;2026-03-02&quot;,\n  &quot;updated_at&quot;: &quot;2026-03-02&quot;,\n  &quot;description&quot;: &quot;Takes loan and hold requests at the desk and by phone, then checks out book copies against them.&quot;,\n  &quot;goals&quot;: [&quot;Check out a copy the patron can take home the same day.&quot;],\n  &quot;needs&quot;: [&quot;A live view of which copies are on the shelf at each branch.&quot;]\n}\n<\/code><\/pre><\/div>\n<p>A persona is a described record, and it enforces nothing. There is no different security for a clerk versus a manager, because a persona carries no security at all.<\/p>\n<p>A test case adds <code>verifies[]<\/code>, <code>preconditions[]<\/code>, <code>steps[]<\/code>, and <code>expected<\/code>:<\/p>\n<div class=\"code-block\" data-

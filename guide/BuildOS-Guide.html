nder this contract none of them qualifies until somebody goes and proves it against a running system. Keep producing gap lists, and be precise about what a gap list actually is.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Skipping the gate produces documents that look finished and say nothing. A design generated straight from a run&#39;s raw findings comes out with perfect structure and empty content, because the only thing the run proved was that the environment was reachable. If a design reads as hollow, check whether anything underneath it was ever qualified.<\/p>\n<\/div><\/aside>\n<h2 id=\"what-you-should-have-now\"><span>What you should have now<\/span><a class=\"h-anchor\" href=\"#/09-qualify-what-you-found/what-you-should-have-now\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>A folder at <code>workspace/findings/FIND-NNN/<\/code> holding <code>finding.md<\/code> and <code>qualification.md<\/code>.<\/li>\n<li>One row in <code>.os/data/findings.jsonl<\/code> with <code>status: &quot;qualified&quot;<\/code>.<\/li>\n<li>A confirmation test you can hand to somebody else, that passes today and will change its answer when the underlying problem is fixed.<\/li>\n<li>A <code>finding.md<\/code> whose <code>polarity<\/code> correctly says whether the test proves presence or proves repeatable absence.<\/li>\n<li>A clear list of the observations from your run that could not be qualified, still sitting in that run&#39;s <code>raw-findings.md<\/code>, and a decision about what happens to each.<\/li>\n<\/ul>\n<h2 id=\"next\"><span>Next<\/span><a class=\"h-anchor\" href=\"#/09-qualify-what-you-found/next\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><a href=\"#/10-compare-two-systems\">Compare two systems<\/a>, covering how to put two systems side by side and produce a gap list you can defend.<\/p>\n","toc":[{"id":"what-you-need-first","text":"What you need first","level":2},{"id":"two-kinds-of-finding","text":"Two kinds of finding","level":2},{"id":"why-this-step-exists","text":"Why this step exists","level":2},{"id":"what-qualification-requires","text":"What qualification requires","level":2},{"id":"procedure-qualify-a-finding","text":"Procedure · Qualify a finding","level":2},{"id":"what-lands-on-disk","text":"What lands on disk","level":2},{"id":"a-mismatch-between-the-contract-and-the-tool","text":"A mismatch between the contract and the tool","level":2},{"id":"what-happens-to-a-finding-you-cannot-prove","text":"What happens to a finding you cannot prove","level":2},{"id":"what-you-should-have-now","text":"What you should have now","level":2},{"id":"next","text":"Next","level":2}]},"10-compare-two-systems":{"slug":"10-compare-two-systems","num":"10","title":"Compare two systems","lede":"This page shows you how to compare what one system does against what another system needs, and how to write down the difference so someone else can trust it.","html":"<h2 id=\"what-you-need-first\"><span>What you need first<\/span><a class=\"h-anchor\" href=\"#/10-compare-two-systems/what-you-need-first\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Read <a href=\"#/07-pull-knowledge-out-of-it\">Pull knowledge out of it<\/a> first. This page assumes it. <a href=\"#/09-qualify-what-you-found\">Qualify what you found<\/a> is useful here but not required.<\/p>\n<p>You need converted source material for both systems, the records you pulled out of it, and an agent you can hold a long conversation with.<\/p>\n<h2 id=\"what-buildos-contributes-here\"><span>What BuildOS contributes here<\/span><a class=\"h-anchor\" href=\"#/10-compare-two-systems/what-buildos-contributes-here\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>BuildOS holds the material for the comparison. The machinery for the comparison itself does not exist yet.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>The shipped system has no gap, delta or comparison artifact type, no contract that governs one, no command that produces one, and no directory that holds one. A person and an agent reading the project&#39;s own files can produce a strong comparison. Prompting covers this. What is missing is the machinery that would make the output shape the same every time. Two skills help: <code>capability-matrix<\/code> builds a model of each system, and <code>fit-gap-analysis<\/code> scores one against the other and delivers an Excel workbook. From BuildOS <code>0.2.0<\/code>, <code>fit-gap-analysis<\/code> computes its scores and writes the workbook with the <code>buildos fitgap<\/code> command. Neither adds a comparison record type to <code>.os/data/<\/code>. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p>The hard part of comparing two systems is getting material on both sides that is trustworthy, that covers the same ground, and that is shaped the same way. <a href=\"#/05-bring-in-source-material\">Bring in source material<\/a> through to <a href=\"#/09-qualify-what-you-found\">Qualify what you found<\/a> are what produce that. BuildOS supplies the material and the vocabulary, and the analysis is down to you and your agent.<\/p>\n<p>The comparison can run in a different agent tool from the one that captured the material. Nothing has to be converted, re-recorded, or changed in the project, because the files are ordinary files. See <a href=\"#/16-harness-independence-and-trust\">Harness independence and trust<\/a>.<\/p>\n<h2 id=\"what-a-fit-gap-analysis-is\"><span>What a fit-gap analysis is<\/span><a class=\"h-anchor\" href=\"#/10-compare-two-systems/what-a-fit-gap-analysis-is\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A <strong>fit-gap analysis<\/strong> compares what one system does against what another one needs, and writes down only the difference. The written difference is sometimes called a <strong>delta document<\/strong>.<\/p>\n<p>A <strong>gap<\/strong> is something a system cannot do that somebody needs. It belongs to the wider industry vocabulary rather than to BuildOS. In BuildOS vocabulary a gap becomes either a finding, if you observed it, or a requirement, if somebody demands it.<\/p>\n<p>Two things surprise people who have not done one before.<\/p>\n<p><strong>The ratio carries more weight than the gap count.<\/strong> A comparison covering a large requirements set may end with only a handful of true gaps. What matters to a sponsor is the other side of that arithmetic: with evidence attached to every row, almost everything else turns out <em>not<\/em> to be a gap.<\/p>\n<p><strong>A capability done differently is still a capability.<\/strong> A verdict list with only &quot;gap&quot; and &quot;no gap&quot; on it will report every difference in approach as a hole. The next sections show what to use instead.<\/p>\n<h2 id=\"the-method\"><span>The method<\/span><a class=\"h-anchor\" href=\"#/10-compare-two-systems/the-method\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The method has four steps:<\/p>\n<ol>\n<li>Choose the sources for each side, and exclude the ones that answer a different question.<\/li>\n<li>Settle the categories and the status words before you extract anything.<\/li>\n<li>Extract both sides into the same shape.<\/li>\n<li>Produce the difference as its own document, one row per capability.<\/li>\n<\/ol>\n<p>Step three is one job done twice, once per system, so it gets two sections below. The sections that follow are numbered in the order you will work through them.<\/p>\n<p>Then audit the result. That last part is required, and it gets its own section too.<\/p>\n<h2 id=\"step-1-choose-the-sources-for-each-side\"><span>Step 1 · Choose the sources for each side<\/span><a class=\"h-anchor\" href=\"#/10-compare-two-systems/step-1-choose-the-sources-for-each-side\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Write down, in one list, which documents describe each side. Do this before you prompt anything.<\/p>\n<p>Two things go wrong here, and neither one announces itself.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Material about a system you are not comparing will contaminate the result. A leftover <code>backup/<\/code> folder of superseded documents will be read alongside the live ones, and a file belonging to BuildOS&#39;s own build layer will be read as project material. The agent cannot tell that a file is out of scope. Move stale material out of the tree before you start, and recover old versions from git rather than keeping them in a sibling folder.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Some vendor documents describe only what is new, not what the product already does. Extracting capability rows from a document like that will mint false gaps, because everything the base platform already handles is missing from the page. Customer records can look like a hole when they are a standard part of the platform underneath and simply were not written down again. Establish what the baseline surface is before you extract, and say so in writing.<\/p>\n<\/div><\/aside>\n<p>Then state the boundary out loud, in the document itself. Something like: this comparison read these sources, it has not seen the vendor roadmap, and where it makes a claim about future releases it is inferring. Saying it out loud is easy, and writing it into the file is the half that gets skipped.<\/p>\n<h2 id=\"step-2-settle-the-categories-and-the-status-words\"><span>Step 2 · Settle the categories and the status words<\/span><a class=\"h-anchor\" href=\"#/10-compare-two-systems/step-2-settle-the-categories-and-the-status-words\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Two products described in their own vocabularies cannot be lined up row against row. So you fix the shared vocabulary first, before either side is extracted.<\/p>\n<p>A good agent will ask you about this rather than start work. Answer the schema questions when it does.<\/p>\n<p>Two decisions come out of this.<\/p>\n<p><strong>Mirror the categories rather than blending them.<\/strong> Pick one side&#39;s category list and make the other side use it. Do not invent a hybrid list that suits both. The reasoning is practical: the first side&#39;s work is already finished and nobody is going to re-categorise it, so a blended list produces categories that nothing on the finished side maps back to. In practice this lands on a short list of shared layers, each with a short code, carried by every row on both sides.<\/p>\n<p><strong>Keep both status vocabularies, and define both.<\/strong> The two sides will mean different things by status. One side may describe a design in progress with words like built, designed and sketched. The other may describe a shipping product with words like available, preview and planned. Leave them unreconciled. As long as both vocabularies are written down in a data dictionary next to the output, a reader can follow it, and you can reconcile later because the underlying data is still there.<\/p>\n<p>A <strong>data dictionary<\/strong> is a short file that lists every column and every allowed value, in plain words. Write it at the same time as the comparison. Without one in front of them, readers guess at column meanings even when a dictionary was generated alongside the table.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>The shipped system has nowhere to record a category or layer. A capability record carries <code>description<\/code>, <code>supports[]<\/code> and <code>limits[]<\/code>, and no category field of any kind. The status vocabulary is fixed at four values, <code>draft<\/code>, <code>active<\/code>, <code>superseded<\/code> and <code>archived<\/code>, and <code>buildos validate<\/code> rejects anything else, so none of the status words above is legal in <code>.os/data/<\/code>. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p>The nearest real home is the optional <code>tags[]<\/code> field on an entity record. An <strong>entity record<\/strong> is one line of JSON in <code>.os/data/<\/code> describing one thing, with a stable ID. <code>.os/contracts/entity-records-contract.md<\/code> defines <code>tags<\/code> as lowercase slugs used for classification only, and says explicitly that they must not encode status. The validator does not check tag values against any list. If you want your layer codes to survive inside BuildOS, put them there, and keep the layer list in your data dictionary.<\/p>\n<h2 id=\"step-3-build-the-yardstick\"><span>Step 3 · Build the yardstick<\/span><a class=\"h-anchor\" href=\"#/10-compare-two-systems/step-3-build-the-yardstick\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The yardstick is the &quot;what we need&quot; side: one dense description of what the target system <em>should<\/em> do. You cannot find gaps without a definition of complete, and that definition has to come from somewhere other than the thing you are measuring.<\/p>\n<p>Build it from a separate source set, in a fresh conversation.<\/p>\n<ol>\n<li>Choose sources that describe what you <em>wanted<\/em>, not what you have. Historical backlogs, any specification you already wrote, and notes from sessions with a subject-matter expert.<\/li>\n<li>Start a fresh conversation for this. A clean context stops the baseline material you have already loaded from leaking into the yardstick. It does not have to be outside the project.<\/li>\n<li>Ask for a comprehensive, detailed breakdown of the capabilities and features that would make an ideal version of the target system, according to those documents.<\/li>\n<li>Ask for structure as well as prose. The first pass will return a narrative. Ask for a structured version after that.<\/li>\n<li>Keep both. The narrative explains the shape to a person, and the structured version is what the comparison consumes.<\/li>\n<li>Bring the result back in as <strong>one source<\/strong>, using the procedure in <a href=\"#/05-bring-in-source-material\">Bring in source material<\/a>.<\/li>\n<\/ol>\n<p>Import the yardstick as one source rather than as hundreds of individual records. Summarising is right for the side you are measuring <em>against<\/em>. The material you already converted holds the real system&#39;s behaviour in full detail, and summarising that side as well would throw away the detail the comparison needs.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Ask an agent for a structured version and you will often get five formats back: prose, JSON, two flavours of CSV, and something nobody recognises. Decide up front which two you keep, normally the narrative and one structured file, and delete the rest before they get committed and confuse the next reader.<\/p>\n<\/div><\/aside>\n<h2 id=\"step-4-establish-the-baseline\"><span>Step 4 · Establish the baseline<\/span><a class=\"h-anchor\" href=\"#/10-compare-two-systems/step-4-establish-the-baseline\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The baseline is the &quot;what we have&quot; side. You have already built it, across <a href=\"#/05-bring-in-source-material\">Bring in source material<\/a> through to <a href=\"#/09-qualify-what-you-found\">Qualify what you found<\/a>.<\/p>\n<p>Your baseline comes from three places:<\/p>\n<ul>\n<li>The <strong>capability<\/strong> records in <code>.os/data/capabilities.jsonl<\/code>. A capability is a descriptive record: something the system <em>can<\/em> do. It may be true and it may be false, and proving it is what testing is for.<\/li>\n<li>The <strong>requirement<\/strong> records in <code>.os/data/requirements.jsonl<\/code>. A requirement is a normative record: something the system <em>must<\/em> do, that somebody is tracking. Ownership is the test, so anything nobody is tracking has not reached requirement status.<\/li>\n<li>The <strong>converted twins<\/strong> under <code>assets/<\/code>, which are the plain-text copies of your source documents, each carrying a header that records where it came from and what converted it.<\/li>\n<\/ul>\n<p>Capabilities work as a spine, with requirements as a child table hanging off them. That framing works well when you explain the output to somebody.<\/p>\n<p>If you have already tested against a live system, add what you proved. A <strong>playbook<\/strong> is a written procedure that tells a person or an agent how to do one job, step by step. A <strong>qualified finding<\/strong> is one that a playbook run proved by a repeatable test against a running system, rather than by reading a document. You will not have many of those rows, and they carry more weight than the rest. Mark them, because the difference matters when someone challenges a verdict.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Records that were never re-verified will quietly poison a comparison. A source document may be mid-rename, may contradict its own author&#39;s answer, or may itself have been generated by AI and never reviewed. The shipped state for this is <code>status: candidate<\/code> on the converted twin, which means the text is useful but a person should look at it before you trust it. Use it, and re-check any row extracted from a preview build before you put a verdict next to it.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>A comparison built on a conversion that failed will look completely normal. The converter never falls back to a model, because it is a program with no model and no network connection. Any substitution happens above it. An agent asked to &quot;bring in&quot; a difficult file may read the file itself and write the text out by hand instead of running the converter, without being asked and without anything recording it. Open the twin&#39;s frontmatter and read the <code>converter<\/code> field before you rely on the file. It names whatever produced the text: the tool, or <code>manual-intake/1.0.0<\/code> when a person did the work. If the source is a PDF, a diagram export, or a slide deck, read <a href=\"#/06-sources-the-converter-cannot-read\">Sources the converter cannot read<\/a> before you go any further.<\/p>\n<\/div><\/aside>\n<h2 id=\"step-5-produce-the-comparison\"><span>Step 5 · Produce the comparison<\/span><a class=\"h-anchor\" href=\"#/10-compare-two-systems/step-5-produce-the-comparison\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Ask for the difference as its own document, with one row per capability rather than as a summary.<\/p>\n<p>The comparison is a table, so ask for it as a spreadsheet file: <code>.csv<\/code>, or <code>.xlsx<\/code> if you want frozen panes and filters already set. Two files travel with it. One is the narrative model you kept in step 3. The other is the data dictionary you wrote in step 2. Keep all three together.<\/p>\n<p>Because BuildOS holds no comparison artifact type, as the callout at the top of this article says, it gives these three files no name and no home either. Choose one yourself and use it for every comparison you run.<\/p>\n<p>A layout that works: make a directory at your project root, beside the BuildOS directories, and put all three files in it.<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>comparisons/2026-03-02-lending-system/\n    comparison.csv\n    narrative-model.md\n    data-dictionary.md\n<\/code><\/pre><\/div>\n<p>Commit all three. Nothing in the BuildOS directories points at them, so version control is the only thing that ties them to the records they were built from.<\/p>\n<p>Each row of the comparison carries:<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>What it holds<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>capability<\/code><\/td>\n<td>The thing being compared, named from the shared category list<\/td>\n<\/tr>\n<tr>\n<td><code>verdict<\/code><\/td>\n<td>One value from your verdict list<\/td>\n<\/tr>\n<tr>\n<td><code>gap detail<\/code><\/td>\n<td>One or two sentences on what is actually different<\/td>\n<\/tr>\n<tr>\n<td><code>mapped counterparts<\/code><\/td>\n<td>The capability IDs on the other side that cover this, if any<\/td>\n<\/tr>\n<tr>\n<td><code>evidence<\/code><\/td>\n<td>Which source said so, precisely enough to find again<\/td>\n<\/tr>\n<tr>\n<td><code>confidence<\/code><\/td>\n<td>How sure the analysis is, and why<\/td>\n<\/tr>\n<tr>\n<td><code>effort<\/code><\/td>\n<td>A rough size for closing it<\/td>\n<\/tr>\n<tr>\n<td><code>other side status<\/code><\/td>\n<td>That side&#39;s own status word, from its own dictionary<\/td>\n<\/tr>\n<tr>\n<td><code>migration note<\/code><\/td>\n<td>What to do about it<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>A verdict set that works: <code>native<\/code>, <code>configurable<\/code>, <code>partial gap<\/code>, <code>gap<\/code>, <code>preview gap<\/code>, and <code>&lt;system&gt; only<\/code> for something one side has that the other has no need of. A verdict set that wide is what keeps a difference in approach from being filed as a hole.<\/p>\n<p>A short worked example, using a community library&#39;s book-lending system as the target and a general-purpose business platform as the other side. Every row is invented:<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Capability<\/th>\n<th>Verdict<\/th>\n<th>Gap detail<\/th>\n<th>Evidence<\/th>\n<th>Effort<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Patron record and contact details<\/td>\n<td><code>native<\/code><\/td>\n<td>Standard on the business platform. No lending-specific work.<\/td>\n<td>Platform capability catalogue, § Contacts<\/td>\n<td>none<\/td>\n<\/tr>\n<tr>\n<td>Loan periods by item type<\/td>\n<td><code>configurable<\/code><\/td>\n<td>Supported through standard policy setup, no code.<\/td>\n<td>Policy configuration guide, § Lending policies<\/td>\n<td>small<\/td>\n<\/tr>\n<tr>\n<td>Fine cap per loan<\/td>\n<td><code>partial gap<\/code><\/td>\n<td>Both sides charge fines. One caps the fine per loan, the other only per patron.<\/td>\n<td>Lending overview § Fines; platform billing reference § Charges<\/td>\n<td>medium<\/td>\n<\/tr>\n<tr>\n<td>Copy transfer between branches<\/td>\n<td><code>gap<\/code><\/td>\n<td>No equivalent. Transfers exist for stock, not for individual book copies.<\/td>\n<td>Lending overview § Branches; no counterpart found<\/td>\n<td>large<\/td>\n<\/tr>\n<tr>\n<td>Self-service renewal by text message<\/td>\n<td><code>preview gap<\/code><\/td>\n<td>Announced, not generally available. Treat as unavailable until proved.<\/td>\n<td>Platform release notes, preview section<\/td>\n<td>unknown<\/td>\n<\/tr>\n<tr>\n<td>Interlibrary loan requests<\/td>\n<td><code>lending system only<\/code><\/td>\n<td>Library-specific. The business platform has no reason to carry it.<\/td>\n<td>Lending overview § Interlibrary loans<\/td>\n<td>none<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>A raw count difference is not a verdict. If one side lists three times as many capabilities as the other, that is usually a documentation difference, not a capability difference. The larger surface is usually larger because that side documents its configuration options exhaustively, while the other documents a design. Make sure that sentence is in your document, in writing, near the counts.<\/p>\n<\/div><\/aside>\n<h2 id=\"walk-one-row\"><span>Walk one row<\/span><a class=\"h-anchor\" href=\"#/10-compare-two-systems/walk-one-row\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Some people will never read the table. A sponsor, or a subject-matter expert giving you an hour, needs something smaller. Walk them through one row, end to end, and leave the table closed.<\/p>\n<p>A format that works:<\/p>\n<ol>\n<li>Pick a row that matters to the person in front of you.<\/li>\n<li>Read the capability out in plain words.<\/li>\n<li>Say what each side does. Two sentences each.<\/li>\n<li>Say the verdict and why it is that verdict rather than the next one over.<\/li>\n<li>Say where the evidence came from.<\/li>\n<li>Say what closing it would take.<\/li>\n<\/ol>\n<p>It works because it makes the reasoning visible on a case small enough to hold. After watching one row, a subject-matter expert can restate a partial gap correctly and unprompted: both sides have the same idea, done a little differently. That is somebody who has understood the whole document from six sentences about one row.<\/p>\n<h2 id=\"audit-the-output-before-anyone-else-reads-it\"><span>Audit the output before anyone else reads it<\/span><a class=\"h-anchor\" href=\"#/10-compare-two-systems/audit-the-output-before-anyone-else-reads-it\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The comparison is generated prose. It reads as confident, parts of it are wrong, and nobody downstream will re-check it.<\/p>\n<h3 id=\"the-reading-procedure\"><span>The reading procedure<\/span><a class=\"h-anchor\" href=\"#/10-compare-two-systems/the-reading-procedure\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<ol>\n<li>Open the narrative model first. It explains the shape of what you are about to read.<\/li>\n<li>Find the data dictionary <strong>before<\/strong> you start interpreting columns. Do not guess at a verdict value.<\/li>\n<li>Open the table. Freeze the first column, widen the long text columns, turn on text wrap, and filter by verdict so you read one class at a time.<\/li>\n<li>Walk whole rows, because skimming a comparison table turns up nothing.<\/li>\n<li>Challenge rows out loud as you go, and say when you are assuming the worst reading rather than the best one.<\/li>\n<li>Restate the boundary of the source material. What did this analysis actually see?<\/li>\n<li><strong>Record every correction as you find it.<\/strong> An audit reliably turns up real corrections, and they are just as reliably left unrecorded.<\/li>\n<\/ol>\n<p>Look for two defects in particular. One is a column that is subtly wrong in a way only a domain expert can see. A persona column may tag a configuration setting with the people who <em>use<\/em> the resulting behaviour rather than the people who <em>configure<\/em> it. The other is invented compound words and foreign spellings, which are cosmetic until you remember the document is going to executives.<\/p>\n<h3 id=\"when-you-find-one-bad-row-sweep-for-the-class\"><span>When you find one bad row, sweep for the class<\/span><a class=\"h-anchor\" href=\"#/10-compare-two-systems/when-you-find-one-bad-row-sweep-for-the-class\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<ol>\n<li><strong>Spot-check.<\/strong> Open one substantive document and read a single row carefully, all the way through, instead of skimming ten of them.<\/li>\n<li><strong>Find the contradiction.<\/strong> Two columns may say one system owns a capability while the evidence column says the other one does.<\/li>\n<li><strong>Refuse the one-row fix.<\/strong> Changing one row only tells you whether that row was load-bearing, and says nothing about whether the same mistake is elsewhere.<\/li>\n<li><strong>Start from the governing document.<\/strong> Check whether the assumption behind the bad row is stated in the document that governs the whole set. If it is not stated, or is stated wrongly, fix that first. Everything below it inherited the error.<\/li>\n<li><strong>Ask for a plan, not an answer.<\/strong> Your agent will explain rather than act unless you tell it to produce a remediation plan you can approve.<\/li>\n<li><strong>Constrain the shape of the fix.<\/strong> Correct rows in place. Add a revision section inside each document that changed. Do not accept a new parallel set of documents or a standalone revision file, unless you asked for one.<\/li>\n<\/ol>\n<p>A spot-check like that can turn up one bad row while the sweep it triggers finds dozens, and accepting the one-row patch would send all the others to a delivery team.<\/p>\n<p>The same rule applies to everything an agent produces for you. When you find one defect, sweep for every row that could carry the same mistake instead of patching the row in front of you. See <a href=\"#/15-working-with-your-agent\">Working with your agent<\/a>.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Check the remediation report&#39;s numbers against its own inventory. A report may give one total for the rows that need correction while its completion list adds up to a different number. Numbers get re-narrated by a model at every step and nothing checks them against each other.<\/p>\n<\/div><\/aside>\n<h2 id=\"what-you-can-do-with-the-result\"><span>What you can do with the result<\/span><a class=\"h-anchor\" href=\"#/10-compare-two-systems/what-you-can-do-with-the-result\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Every gap in that document is a <strong>raw finding<\/strong>: something somebody noticed that no repeatable test has proved yet. It rests on reading documents rather than on a repeatable test against a running system, so under <code>.os/contracts/finding-contract.md<\/code> none of them qualifies. That is the analysis working as intended, because what a comparison gives you is a list of things to go and prove.<\/p>\n<p>Those gaps stay where they are, in the comparison document, with their row IDs. They do not go into a run&#39;s <code>raw-findings.md<\/code>, because that file belongs to a run and a comparison never produces one.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>BuildOS has no place to record a raw finding that did not come from a playbook run. Keep the gaps in your comparison directory. When you decide to prove one, write a playbook and run it. That run produces its own <code>raw-findings.md<\/code>, and the anchor in that file is what the qualify command needs. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p>From here:<\/p>\n<ul>\n<li>Take the rows that matter and prove them. Write a playbook, run it against the live system, and qualify what it finds. See <a href=\"#/08-write-and-run-a-playbook\">Write and run a playbook<\/a> and <a href=\"#/09-qualify-what-you-found\">Qualify what you found<\/a>.<\/li>\n<li>Feed the confirmed gaps into designs and PRDs. See <a href=\"#/12-designs-plans-and-prds\">Designs, plans and PRDs<\/a>.<\/li>\n<\/ul>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Record the gap count in a file, with an ID on every row. A count quoted from memory in the morning turns into a different number by the afternoon. An ID on every row is what keeps two people from quoting two different totals.<\/p>\n<\/div><\/aside>\n<h2 id=\"what-you-should-have-now\"><span>What you should have now<\/span><a class=\"h-anchor\" href=\"#/10-compare-two-systems/what-you-should-have-now\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>A written list of which sources describe each side, and a written statement of what the analysis could not see.<\/li>\n<li>One shared category list used by both sides, and a data dictionary defining every column and every status word on both sides.<\/li>\n<li>A yardstick document describing what the target system should do, imported as one source.<\/li>\n<li>A baseline drawn from your capability records, requirement records and converted twins.<\/li>\n<li>A comparison document with one row per capability, carrying a verdict, gap detail, evidence, confidence, effort and a migration note. It sits in a directory of your own, committed alongside its narrative model and its data dictionary.<\/li>\n<li>A walked-row explanation you can give to somebody who will not read the table.<\/li>\n<li>A record of every correction the audit found, and a sweep for any defect that looked systemic.<\/li>\n<\/ul>\n<h2 id=\"next\"><span>Next<\/span><a class=\"h-anchor\" href=\"#/10-compare-two-systems/next\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><a href=\"#/11-keep-the-record-clean\">Keep the record clean<\/a>.<\/p>\n","toc":[{"id":"what-you-need-first","text":"What you need first","level":2},{"id":"what-buildos-contributes-here","text":"What BuildOS contributes here","level":2},{"id":"what-a-fit-gap-analysis-is","text":"What a fit-gap analysis is","level":2},{"id":"the-method","text":"The method","level":2},{"id":"step-1-choose-the-sources-for-each-side","text":"Step 1 · Choose the sources for each side","level":2},{"id":"step-2-settle-the-categories-and-the-status-words","text":"Step 2 · Settle the categories and the status words","level":2},{"id":"step-3-build-the-yardstick","text":"Step 3 · Build the yardstick","level":2},{"id":"step-4-establish-the-baseline","text":"Step 4 · Establish the baseline","level":2},{"id":"step-5-produce-the-comparison","text":"Step 5 · Produce the comparison","level":2},{"id":"walk-one-row","text":"Walk one row","level":2},{"id":"audit-the-output-before-anyone-else-reads-it","text":"Audit the output before anyone else reads it","level":2},{"id":"the-reading-procedure","text":"The reading procedure","level":3},{"id":"when-you-find-one-bad-row-sweep-for-the-class","text":"When you find one bad row, sweep for the class","level":3},{"id":"what-you-can-do-with-the-result","text":"What you can do with the result","level":2},{"id":"what-you-should-have-now","text":"What you should have now","level":2},{"id":"next","text":"Next","level":2}]},"11-keep-the-record-clean":{"slug":"11-keep-the-record-clean","num":"11","title":"Keep the record clean","lede":"This page explains why your record files fill up with duplicates, why deleting them is the wrong fix, and what BuildOS does instead.","html":"<h2 id=\"what-you-need-first\"><span>What you need first<\/span><a class=\"h-anchor\" href=\"#/11-keep-the-record-clean/what-you-need-first\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Read <a href=\"#/07-pull-knowledge-out-of-it\">Pull knowledge out of it<\/a> first. This page assumes you have entity records in <code>.os/data/<\/code> and know what a record&#39;s <code>id<\/code>, <code>status<\/code>, and <code>related[]<\/code> fields are for. A <code>[]<\/code> on the end of a field name means that field holds a list. You do not need to have finished extracting before you read this, and reading it early saves work later.<\/p>\n<h2 id=\"why-duplicates-happen\"><span>Why duplicates happen<\/span><a class=\"h-anchor\" href=\"#/11-keep-the-record-clean/why-duplicates-happen\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Run extraction over two documents that overlap, or over the same document twice a month apart, and you get the same thing recorded more than once under more than one name. That is the process working normally, rather than a sign that anybody made a mistake.<\/p>\n<p>Personas show it most clearly. A round of intake can end with several times as many personas as were intended, and a second pass over vendor material can push the count higher again. Different job titles in different documents each mint their own record, and a vendor capability list adds more. Everyone follows the procedure correctly and the file still ends up a mess.<\/p>\n<p>The same thing happens to capabilities and requirements, where it goes unnoticed for longer because nobody counts those out loud.<\/p>\n<p>Take two counts early, before the volume makes it painful:<\/p>\n<ul>\n<li>How many records of each type do you have?<\/li>\n<li>How many of those describe the same thing?<\/li>\n<\/ul>\n<p>Ask your agent for both as a table. Do not open the <code>.jsonl<\/code> files yourself.<\/p>\n<h2 id=\"why-you-must-not-delete-them\"><span>Why you must not delete them<\/span><a class=\"h-anchor\" href=\"#/11-keep-the-record-clean/why-you-must-not-delete-them\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The obvious fix is to keep the good rows and delete the rest, and it is the wrong move.<\/p>\n<p>Other records point at the ones you would delete. A requirement&#39;s <code>related[]<\/code> names a capability, and a test case&#39;s <code>verifies[]<\/code> names a requirement. Findings carry <code>basis_refs[]<\/code> pointing at whatever they were based on. Every ID an extraction minted is listed on the extraction row. Delete a record and each of those pointers now names nothing.<\/p>\n<p>The fear is easy to name: I don&#39;t want to forget something, and the model is not going to be smart enough to update it everywhere. That instinct is right, and it is why consolidation waits for a mechanism that cannot lose anything.<\/p>\n<p>You will also hear a comforting claim that does not hold for the shipped system, which is that it checks itself, so covering the same ground twice does not create the same record twice. It does create it twice, because nothing deduplicates on its own.<\/p>\n<h2 id=\"how-redirects-work\"><span>How redirects work<\/span><a class=\"h-anchor\" href=\"#/11-keep-the-record-clean/how-redirects-work\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>BuildOS resolves this by keeping every record and pointing the losers at the winner.<\/p>\n<p>The authority is <code>.os/contracts/entity-consolidation-contract.md<\/code>, with the record-level rules in <code>.os/contracts/entity-records-contract.md<\/code>. Both are in your repository, and they carry the full field list. This section covers the shape and the reasoning.<\/p>\n<p><strong>Nothing is deleted.<\/strong> A losing record stays in its original file with its summary, its <code>source_anchor<\/code>, its dates and the rest of its provenance intact. Its <code>status<\/code> changes to <code>superseded<\/code> and it gains one new field.<\/p>\n<p>That field is the <strong>redirect<\/strong>: a pointer on the losing record saying which record replaced it, who decided, when, and why. It has exactly six parts:<\/p>\n<div class=\"code-block\" data-lang=\"json\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-json\">&quot;redirect&quot;: {\n  &quot;target_id&quot;: &quot;PER-101&quot;,\n  &quot;kind&quot;: &quot;duplicate&quot;,\n  &quot;decided_at&quot;: &quot;2026-03-02T16:00:00Z&quot;,\n  &quot;decided_by&quot;: &quot;product-owner&quot;,\n  &quot;reason&quot;: &quot;The two records described the same counter role.&quot;,\n  &quot;evidence_refs&quot;: [&quot;assets/lending-overview/lending-overview.md#roles&quot;]\n}\n<\/code><\/pre><\/div>\n<p><code>kind<\/code> is one of <code>duplicate<\/code>, <code>consolidated<\/code>, or <code>replaced<\/code>. A redirect is required on a <code>superseded<\/code> record and forbidden on <code>draft<\/code>, <code>active<\/code>, and <code>archived<\/code> ones.<\/p>\n<p><strong>The winner stays ordinary.<\/strong> It does not get a special status and it does not carry a hand-maintained list of everything that folded into it. The mapping runs one way only, from loser to winner, and everything else is derived from that, which spares you a list on the winner that somebody has to remember to update.<\/p>\n<p><strong>Chains resolve to a terminal ID.<\/strong> A redirect can point at a record that itself has a redirect. The <strong>terminal canonical ID<\/strong> is the record you arrive at after following every hop. Every part of the system that reads an ID resolves it through the same rule, so an old ID in an old document still lands on the current record:<\/p>\n<div class=\"code-block\" data-lang=\"json\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-json\">{\n  &quot;requested_id&quot;: &quot;PER-103&quot;,\n  &quot;canonical_id&quot;: &quot;PER-101&quot;,\n  &quot;chain&quot;: [&quot;PER-103&quot;, &quot;PER-102&quot;, &quot;PER-101&quot;],\n  &quot;resolved&quot;: true\n}\n<\/code><\/pre><\/div>\n<p><strong><code>archived<\/code> is a different thing from <code>superseded<\/code>.<\/strong> An archived record is retained with nothing having replaced it, whereas a superseded one was replaced by something specific. Do not use archived to hide a duplicate.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>The model covers merges and has nothing for splits. Splitting an overloaded persona into two, because it has quietly become two roles, is a common and useful decision. A redirect cannot express that, since it points one record at one other record. Splitting is a manual re-authoring job: write the two new records, then decide separately what happens to the original. Expect to do this, and do not go looking for a command.<\/p>\n<\/div><\/aside>\n<h2 id=\"personas-are-the-special-case\"><span>Personas are the special case<\/span><a class=\"h-anchor\" href=\"#/11-keep-the-record-clean/personas-are-the-special-case\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Personas are the only record type with a second contract governing identity: <code>.os/contracts/persona-identity-contract.md<\/code>.<\/p>\n<p>An <strong>identity key<\/strong> is an approved phrase that names a persona. An <strong>alias<\/strong> is another approved spelling of it. Both live on the persona record, and the aliases list is kept sorted and free of duplicates.<\/p>\n<p>The matching rule is deliberately simple. Normalising a phrase does five things and no more: require valid text, trim the whitespace at the ends, collapse runs of interior whitespace to one space, lowercase the ASCII letters, and leave every other byte alone. Transliteration, punctuation removal, stemming, synonym expansion and fuzzy matching are all absent. So <code> enterprise SUPPORT lead<\/code> matches an approved alias of <code>Enterprise Support Lead<\/code>, and nothing beyond that is attempted.<\/p>\n<p>An automatic match is returned only when the normalised phrase resolves to exactly one persona that is active and terminal. If two personas both claim the alias <code>Buyer<\/code>, you get a request for review naming both candidates, and nothing changes until somebody decides.<\/p>\n<p>The rule doing the real work is that <strong>an observed name does not become an approved alias because an extractor saw it.<\/strong> Somebody has to write it in on purpose, and that deliberate write is the gate. Without it, every job title in every document becomes a persona, which is exactly how dozens of them appear.<\/p>\n<p>Personas need this on top of redirects for a reason that is easy to miss. Redirects only help once you have an ID to follow, and newly extracted text cites no IDs at all. It says &quot;the desk supervisor&quot; in a sentence. Identity keys and aliases are the second layer that catches that.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Every other record type has no identity contract, no deterministic matching, and no dedup story. Requirements, capabilities, test cases, results, runs, findings, and extractions all have to be matched by a person looking at them. The contract says so directly: those types require their own versioned identity contracts before any of this can be automated. Budget human judgement for them.<\/p>\n<\/div><\/aside>\n<p>Two more things about personas surprise people. Named individuals and job roles in the same file are what produce the mess, so keep individuals out. There is also no settings page for personas the way there is for owners and systems in <code>instance.yaml<\/code>, because personas are records rather than configuration.<\/p>\n<h2 id=\"the-procedure-and-where-it-stops\"><span>The procedure, and where it stops<\/span><a class=\"h-anchor\" href=\"#/11-keep-the-record-clean/the-procedure-and-where-it-stops\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The commands exist, and the contract behind them is specified in more detail than anything else in BuildOS. Eleven named diagnostic codes, a normative test corpus in <code>.os/contracts/examples/entity-resolution/<\/code>, dry-run by default on every mutation.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>A freshly set-up project fails strict entity validation (exit 4), because the resolution index at <code>.os/indexes/entity-resolution.json<\/code> has never been built. Build it once with <code>.os/scripts/buildos entities rebuild-index --root . --mode strict --apply<\/code>, then strict validation passes. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p>Every entity command needs <code>--root<\/code> pointing at a directory that contains <code>.os/data/<\/code>. In a standard layout that is <code>system<\/code>. Mutating commands plan only, unless you add <code>--apply<\/code>.<\/p>\n<p>The four commands:<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Command<\/th>\n<th>Does<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>buildos entities resolve --root . --mode compat --id &lt;entity-id&gt;<\/code><\/td>\n<td>Follows the redirect chain and prints the current canonical ID.<\/td>\n<\/tr>\n<tr>\n<td><code>buildos entities validate --root . --mode compat<\/code><\/td>\n<td>Checks the whole record graph.<\/td>\n<\/tr>\n<tr>\n<td><code>buildos entities consolidate --root . --mode compat --manifest &lt;path&gt;<\/code><\/td>\n<td>Plans a consolidation. Add <code>--apply<\/code> to write it.<\/td>\n<\/tr>\n<tr>\n<td><code>buildos entities rebuild-index --root . --mode compat --apply<\/code><\/td>\n<td>Rebuilds <code>entity-resolution.json<\/code>. <code>--check<\/code> reports instead.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><code>--mode<\/code> picks how strict the check is. <code>compat<\/code> treats a missing index and an old record without a redirect as warnings. <code>strict<\/code> treats both as errors, which is why it is the mode to run before a release.<\/p>\n<p>Two verified results:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos entities validate --root . --mode compat\n<\/code><\/pre><\/div>\n<p>In a new project this exits 0 and reports <code>valid: true<\/code> with three records, plus <code>WARNING [index_stale]: entity-resolution index is missing<\/code>.<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos entities validate --root . --mode strict\n<\/code><\/pre><\/div>\n<p>The same tree exits 4 and reports <code>valid: false<\/code> with <code>ERROR [index_stale]<\/code>. Building the index once with <code>rebuild-index --apply<\/code> is what closes that.<\/p>\n<h3 id=\"the-consolidation-itself\"><span>The consolidation itself<\/span><a class=\"h-anchor\" href=\"#/11-keep-the-record-clean/the-consolidation-itself\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A consolidation is driven by a <strong>manifest<\/strong>: a reviewed JSON file listing which record folds into which. You write it, or your agent proposes it and you review it. It looks like this:<\/p>\n<div class=\"code-block\" data-lang=\"json\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-json\">{\n  &quot;version&quot;: 1,\n  &quot;mappings&quot;: [\n    {\n      &quot;source_id&quot;: &quot;PER-102&quot;,\n      &quot;target_id&quot;: &quot;PER-101&quot;,\n      &quot;kind&quot;: &quot;replaced&quot;,\n      &quot;decided_at&quot;: &quot;2026-03-02T16:00:00Z&quot;,\n      &quot;decided_by&quot;: &quot;product-owner&quot;,\n      &quot;reason&quot;: &quot;The approved coordinator persona replaced the intermediate winner.&quot;,\n      &quot;evidence_refs&quot;: [&quot;assets/lending-overview/lending-overview.md#roles&quot;]\n    }\n  ]\n}\n<\/code><\/pre><\/div>\n<p>Mappings are sorted by <code>source_id<\/code>, and one manifest covers one record type. Every field in it is somebody&#39;s decision written down, so the record of who decided and why survives the consolidation. A delete would have thrown all of that away.<\/p>\n<p>The safe sequence:<\/p>\n<ol>\n<li><strong>Commit first.<\/strong> Nothing else here can be undone.<\/li>\n<li><strong>Run it read-only.<\/strong> Consolidation plans by default. Read the plan.<\/li>\n<li><strong>Have a fresh agent conversation review the plan before you apply it.<\/strong> Ask plainly whether it is safe to run. A reviewer with no stake in the proposal catches things the first one glossed over, and it does not have to be a different tool.<\/li>\n<li><strong>Apply.<\/strong> Add <code>--apply<\/code>.<\/li>\n<li><strong>Rebuild the index<\/strong>, then validate in <code>strict<\/code> mode.<\/li>\n<\/ol>\n<p>Remapping a record that already has a redirect to a different target fails closed, by design, rather than quietly rewriting history.<\/p>\n<h2 id=\"keeping-buildoss-own-records-out-of-your-data\"><span>Keeping BuildOS&#39;s own records out of your data<\/span><a class=\"h-anchor\" href=\"#/11-keep-the-record-clean/keeping-buildoss-own-records-out-of-your-data\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>There is one kind of contamination you get for free, on day one, before you extract anything.<\/p>\n<p><code>.os/data/<\/code> ships with three rows already in it: <code>REQ-001<\/code>, <code>CAP-001<\/code>, and <code>TC-001<\/code>. Each one describes BuildOS&#39;s own playbook activation gate rather than anything you are building. They sit at <code>status: draft<\/code> and point at a documentation path that does not exist in your project.<\/p>\n<p>They are easy to recognise and easy to leave alone, and left alone they end up in a delivery backlog as a task a client will ask about.<\/p>\n<p><strong>Delete all three before you add your own records.<\/strong> This is the one exception to the rule above, and it holds for a narrow reason: these rows describe BuildOS, so nothing you are building will ever need to point at them.<\/p>\n<p>Inside the data files they point only at each other. Outside the data files, three shipped playbooks name them in their <code>targets<\/code> field: <code>playbooks/build/package-build-artifact.md<\/code>, <code>playbooks/discovery/inspect-ui-discoverability.md<\/code>, and <code>playbooks/testing/run-core-validation.md<\/code>. Clear those <code>targets<\/code> lists at the same time. Nothing validates that field, so nothing will tell you that you missed it.<\/p>\n<p>If you would rather keep the rows, set their <code>status<\/code> to <code>archived<\/code> and add a line to each <code>summary<\/code> saying they describe the tooling. Then re-run:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos validate\n<\/code><\/pre><\/div>\n<p>The same contamination runs in both directions and appears in three forms. The tool&#39;s records turn up in your product data, its playbooks sit in your repository, and its governance surfaces as work items in your backlog. Watch for all three.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Do not clear out everything that mentions BuildOS on reflex. Some of BuildOS&#39;s own playbooks are generally useful, and two of them are among the three that ship as <code>active<\/code>. Ask whether a client would count the thing as scope for what you are building, rather than whether it happens to mention the tool.<\/p>\n<\/div><\/aside>\n<h2 id=\"consolidate-as-you-go\"><span>Consolidate as you go<\/span><a class=\"h-anchor\" href=\"#/11-keep-the-record-clean/consolidate-as-you-go\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Consolidation takes a few minutes while the source is still fresh, and becomes a project once you postpone it. A postponed cleanup tends never to get finished, and the duplicates are still there weeks later.<\/p>\n<p>Three habits, none of which take more than a few minutes:<\/p>\n<ul>\n<li>After every extraction pass, ask your agent whether anything it minted looks like something you already had. Ask it while the source is fresh in the conversation.<\/li>\n<li>Approve the identity key and the aliases for a persona when you first accept it. That is a deliberate write whenever you do it, and it is cheapest at the point of acceptance.<\/li>\n<li>Before you hand anything to anyone outside the team, run validation in <code>strict<\/code> mode and read what it says.<\/li>\n<\/ul>\n<p>There is a fourth habit that people skip, which is writing down what you decided. Cross-system duplicates were found once by asking an agent, the answer was useful, and nobody recorded it. The redirect&#39;s <code>reason<\/code> and <code>decided_by<\/code> fields exist so that the next person does not have to rediscover the same thing.<\/p>\n<h2 id=\"what-you-should-have-now\"><span>What you should have now<\/span><a class=\"h-anchor\" href=\"#/11-keep-the-record-clean/what-you-should-have-now\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>An understanding of why duplicate records appear, and why that is expected<\/li>\n<li>The reason deleting a record breaks things that point at it<\/li>\n<li>A working definition of a redirect, a terminal canonical ID, and a consolidation manifest<\/li>\n<li>Knowledge that only personas have identity keys and aliases, and that every other type needs human judgement<\/li>\n<li>The three seeded BuildOS rows removed or relabelled from <code>.os/data/<\/code>, and the three shipped playbooks that named them in <code>targets<\/code> updated to match<\/li>\n<li>The consolidation commands, and the rule that <code>consolidate<\/code> and <code>rebuild-index<\/code> write only with <code>--apply<\/code><\/li>\n<\/ul>\n<h2 id=\"next\"><span>Next<\/span><a class=\"h-anchor\" href=\"#/11-keep-the-record-clean/next\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><a href=\"#/12-designs-plans-and-prds\">Designs, plans and PRDs<\/a>, which turns what you have collected into documents somebody can act on.<\/p>\n","toc":[{"id":"what-you-need-first","text":"What you need first","level":2},{"id":"why-duplicates-happen","text":"Why duplicates happen","level":2},{"id":"why-you-must-not-delete-them","text":"Why you must not delete them","level":2},{"id":"how-redirects-work","text":"How redirects work","level":2},{"id":"personas-are-the-special-case","text":"Personas are the special case","level":2},{"id":"the-procedure-and-where-it-stops","text":"The procedure, and where it stops","level":2},{"id":"the-consolidation-itself","text":"The consolidation itself","level":3},{"id":"keeping-buildoss-own-records-out-of-your-data","text":"Keeping BuildOS's own records out of your data","level":2},{"id":"consolidate-as-you-go","text":"Consolidate as you go","level":2},{"id":"what-you-should-have-now","text":"What you should have now","level":2},{"id":"next","text":"Next","level":2}]},"12-designs-plans-and-prds":{"slug":"12-designs-plans-and-prds","num":"12","title":"Designs, plans and PRDs","lede":"This page takes you from &quot;we know what is missing&quot; to a set of documents an engineering team can build from.","html":"<h2 id=\"what-you-need-first\"><span>What you need first<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/what-you-need-first\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Read <a href=\"#/10-compare-two-systems\">Compare two systems<\/a> first. This page assumes it.<\/p>\n<p>You need a project that BuildOS and Make Docs set up, material already brought in, and your agent harness pointed at the project folder. <strong>Your agent harness<\/strong> is the tool your AI agent runs inside. BuildOS keeps its instructions in plain files on disk, so any capable harness can read them.<\/p>\n<p>You also need time. The runs in this article are long. A requirements set can take most of an hour, and a full plan-and-backlog run can take most of a day.<\/p>\n<h2 id=\"the-chain\"><span>The chain<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/the-chain\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Three documents, in this order.<\/p>\n<ul>\n<li>A <strong>design<\/strong> is a dated document that records one decision: what was chosen, what else was considered, and what follows from it. A design says <strong>what we are going to do<\/strong> about a gap.<\/li>\n<li>A <strong>plan<\/strong> is a directory of documents written before work starts. It settles the shape of the output and who does what. A plan says <strong>how the work is sequenced<\/strong>.<\/li>\n<li>A <strong>PRD<\/strong> is a product requirements document. In BuildOS it is a numbered set of documents describing the product, and there is one active set at a time. The set says <strong>what the thing must actually do<\/strong>.<\/li>\n<\/ul>\n<p>After those three comes the work backlog, which is <a href=\"#/13-build-the-work-backlog\">Build the work backlog<\/a>.<\/p>\n<p>Each document points back at the one before it. A plan links its design. A requirements document carries a source-anchors section pointing at the material it came from. That back-pointing is what makes the chain useful. Six months later, someone can ask why a requirement says what it says and follow the links to an answer.<\/p>\n<p>Here is where each one lands.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Document<\/th>\n<th>Directory<\/th>\n<th>Filename shape<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Design<\/td>\n<td><code>docs/designs/<\/code><\/td>\n<td><code>YYYY-MM-DD-&lt;slug&gt;.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>Plan<\/td>\n<td><code>docs/plans/<\/code><\/td>\n<td><code>YYYY-MM-DD-w{W}-r{R}-&lt;slug&gt;/<\/code> (a directory)<\/td>\n<\/tr>\n<tr>\n<td>Requirements set<\/td>\n<td><code>docs/prd/<\/code><\/td>\n<td><code>NN-&lt;slug&gt;.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>Work backlog<\/td>\n<td><code>docs/work/<\/code><\/td>\n<td><code>YYYY-MM-DD-w{W}-r{R}-&lt;slug&gt;/<\/code> (a directory)<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><code>w{W}-r{R}<\/code> is a numbering scheme for where a piece of work sits in the sequence. &quot;Coordinates&quot; below defines it. You do not need it yet.<\/p>\n<h2 id=\"there-is-no-tooling-in-this-article\"><span>There is no tooling in this article<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/there-is-no-tooling-in-this-article\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>Except for one command described below, nothing in this article is automated. You and your agent write these documents by hand, against written contracts and templates that ship with the system. <code>docs/designs/<\/code>, <code>docs/plans/<\/code>, <code>docs/prd/<\/code> and <code>docs/work/<\/code> all ship empty apart from their router files. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p>A full requirements set and a working plan can be produced this way, against the contracts. There is no validator for any of it.<\/p>\n<h2 id=\"the-design\"><span>The design<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/the-design\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<h3 id=\"what-it-is-and-when-you-write-one\"><span>What it is and when you write one<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/what-it-is-and-when-you-write-one\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A design records one decision, dated, with the alternatives you rejected and what happens if nobody does the work. A feature list or a specification is a different document.<\/p>\n<p>Write one when you know something is missing or wrong and you have decided what to do about it. That decision might come from a comparison you ran in <a href=\"#/10-compare-two-systems\">Compare two systems<\/a>, or from a proven gap, or from a conversation where a subject-matter expert said the current behaviour is wrong and you agreed.<\/p>\n<p>All three are legitimate starting points.<\/p>\n<h3 id=\"where-it-lives-and-what-it-looks-like\"><span>Where it lives and what it looks like<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/where-it-lives-and-what-it-looks-like\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A design is one Markdown file at <code>docs/designs/YYYY-MM-DD-&lt;slug&gt;.md<\/code>. The date is today, never backdated. The slug is lowercase with hyphens.<\/p>\n<p>Designs do not carry wave numbers. Plans and backlogs do. The reason is in <code>.make-docs/system/references/wave-model.md<\/code>: a design is an input to a wave, not a product of one, and numbering it would imply one design maps to one plan and one backlog, which often is not true.<\/p>\n<p>Make Docs 2.0.9 keeps its rule files in your project under <code>.make-docs/system/<\/code>: contracts in <code>contracts/<\/code>, references in <code>references/<\/code>, templates in <code>templates/<\/code>, and prompt starters in <code>prompts/<\/code>. Your agent can also read any of them with <code>make-docs resource read<\/code>, for example <code>make-docs resource read make-docs://system/contract/design-contract.md<\/code>.<\/p>\n<p>The rules for a design are in <code>.make-docs/system/contracts/design-contract.md<\/code>, and the starting shape is <code>.make-docs/system/templates/design.md<\/code>. The template starts with a frontmatter block (the <code>---<\/code> header with <code>title<\/code>, <code>kind<\/code>, <code>status<\/code>, and a <code>follow_on<\/code> group for the hand-off to planning), then has eight sections:<\/p>\n<ul>\n<li><code>## Purpose<\/code><\/li>\n<li><code>## Context<\/code><\/li>\n<li><code>## Human Experience Intent<\/code><\/li>\n<li><code>## Performance Evidence Candidates<\/code><\/li>\n<li><code>## Decision<\/code><\/li>\n<li><code>## Alternatives Considered<\/code><\/li>\n<li><code>## Consequences<\/code><\/li>\n<li><code>## Intended Follow-On<\/code><\/li>\n<\/ul>\n<p>The contract requires seven of them. <code>## Performance Evidence Candidates<\/code> is a short table that the template fills in only when the design has a performance question; leave the row as &quot;none&quot; when it does not.<\/p>\n<p><code>## Intended Follow-On<\/code> carries the hand-off to planning, which is what makes it the section people most often get wrong. The contract asks for four labelled lines inside it:<\/p>\n<ul>\n<li><code>Route:<\/code> takes <code>baseline-plan<\/code> for a fresh build, or <code>change-plan<\/code> for a change to an active requirements set.<\/li>\n<li><code>Next Prompt:<\/code> takes a link to the matching prompt starter. Pair <code>designs-to-plan.prompt.md<\/code> with <code>baseline-plan<\/code>, and <code>designs-to-plan-change.prompt.md<\/code> with <code>change-plan<\/code>. The template also names the prompt by its stable address, such as <code>make-docs://system/prompt/designs-to-plan.prompt.md<\/code>, which <code>make-docs resource read<\/code> opens from anywhere.<\/li>\n<li><code>Why:<\/code> takes one sentence explaining why that route is the right one.<\/li>\n<li><code>Coordinate Handoff:<\/code> takes the earlier position in the sequence, where the work continues earlier work. If the coordinate cannot be worked out, the contract says to write <code>Coordinate Handoff: unresolved; planner must resolve before writing.<\/code><\/li>\n<\/ul>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>The contract requires that the <code>Next Prompt<\/code> link resolves. Open it after the design is written. A link to <code>.make-docs/system/prompts/&lt;file&gt;<\/code> written relative to <code>docs/designs/<\/code> starts with <code>../../<\/code>.<\/p>\n<\/div><\/aside>\n<p>There is one optional section, <code>## Design Lineage<\/code>, for when a new design materially changes what an earlier design said. It records whether you updated the old document or wrote a related new one, links the earlier designs, and says why.<\/p>\n<h3 id=\"a-worked-example\"><span>A worked example<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/a-worked-example\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Suppose you have compared a community library&#39;s book-lending system against the general-purpose business platform underneath it, and you have established that renewing a loan does not recalculate the fine. You decide to add a recalculation step at renewal.<\/p>\n<p>You write <code>docs/designs/2026-03-02-renewal-fine-recalculation.md<\/code>. Under <code>## Decision<\/code> you say you will recalculate at renewal and hold the original fine as a superseded line rather than overwrite it. Under <code>## Alternatives Considered<\/code> you say you rejected a nightly correction job and you say why: it leaves the patron with a wrong fine for up to a day. Under <code>## Consequences<\/code> you say that without this, every renewal is manually corrected at the circulation desk. Under <code>## Intended Follow-On<\/code> you write <code>Route: change-plan<\/code>, because the requirements set already exists and this changes it.<\/p>\n<p>That is a complete design, and it fits on a page.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>A well-formed design is not the same as a good design. A design can come back with every required section present and nothing inside them, because the input did not actually contain a decision. An agent gets the structure right long before it gets the content right. Read what came back before you build on it.<\/p>\n<\/div><\/aside>\n<h3 id=\"promotion-from-a-finding\"><span>Promotion from a finding<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/promotion-from-a-finding\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>BuildOS has one command in this whole chapter. It turns a <strong>qualified finding<\/strong>, meaning an observation that passed a repeatable test and earned an ID as described in <a href=\"#/09-qualify-what-you-found\">Qualify what you found<\/a>, into a dated design:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos design promote finding --finding-id &lt;FIND-NNN&gt; --route baseline-plan\n<\/code><\/pre><\/div>\n<p>It reads the finding, writes one dated design into <code>docs/designs/<\/code>, and records the design path back on the finding. It does not draft a plan, and it only runs when a person runs it.<\/p>\n<p>Two facts about that command need saying plainly.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>The command needs Make Docs. It reads the Make Docs design workflow, contract, template, and prompt from the project, and in a project that Make Docs 2.0.9 set up it writes the design in the Make Docs 2.0.9 form. In a project without Make Docs (you answered No in <code>buildos init<\/code>), it stops with exit code 3 and says what is missing. When Make Docs can still be set up there, it also shows the setup command; when it cannot (a folder with an <code>AGENTS.md<\/code> or <code>CLAUDE.md<\/code> that Make Docs did not write), it says so and shows none. Use <code>--dry-run<\/code> first to see what it would write.<\/p>\n<\/div><\/aside>\n<p>This hop is the one automated step in the planning half of BuildOS, and in practice designs are written by prompt instead. You describe the problem to your agent, or paste raw text into a file and ask the agent to turn it into a design, or point the agent at the analysis and the converted source material and ask for a design from that.<\/p>\n<p>Both routes end up with the same document, because the shape comes from the contract and the template rather than from the tool.<\/p>\n<p>If you have a qualified finding and Make Docs in the project, promote it. Otherwise write the design by prompt. No syntax rules apply, because you are writing prose into a Markdown file and your agent applies the contract. Point your agent at the Make Docs prompt <code>request-to-design.prompt.md<\/code> (in <code>.make-docs/system/prompts/<\/code> in a project that Make Docs 2.0.9 set up) as a starting shape.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Feeding an unqualified observation to a design produces an empty document with perfect structure. Before you ask for a design, be able to say in one sentence what you have decided to do. If you cannot say it, go back to <a href=\"#/09-qualify-what-you-found\">Qualify what you found<\/a> first.<\/p>\n<\/div><\/aside>\n<h2 id=\"the-plan\"><span>The plan<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/the-plan\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<h3 id=\"what-it-is-and-what-it-holds\"><span>What it is and what it holds<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/what-it-is-and-what-it-holds\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>A plan is written before the work starts. It settles the order, the dependencies, and who owns which piece.<\/p>\n<p>A plan is always a directory, never a single file. It lives at <code>docs/plans/YYYY-MM-DD-w{W}-r{R}-&lt;slug&gt;/<\/code> and holds:<\/p>\n<ul>\n<li><code>00-overview.md<\/code>, the entry point, carrying the scope statement and the links back to everything<\/li>\n<li><code>0N-&lt;phase&gt;.md<\/code>, one file per phase<\/li>\n<\/ul>\n<p>The overview&#39;s sections come from <code>.make-docs/system/templates/plan-overview.md<\/code>: <code>## Purpose<\/code>, <code>## Objective<\/code>, <code>## Human Experience Propagation<\/code>, <code>## Performance Evidence Plan<\/code>, <code>## Coordinate Decision<\/code>, <code>## Phase Map<\/code>, <code>## Dependencies<\/code>, <code>## Validation<\/code>, <code>## Intended Follow-On<\/code>, and <code>## Change History<\/code>.<\/p>\n<p><code>.make-docs/system/references/planning-workflow.md<\/code> lists what a plan has to settle: the document tree it will produce, whether execution replaces an existing set or evolves it, the validation pass, and where the backlog will land. Leave any of those open and the plan is not finished.<\/p>\n<h3 id=\"coordinates\"><span>Coordinates<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/coordinates\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>The <code>w{W}-r{R}<\/code> in the directory name is BuildOS&#39;s numbering scheme.<\/p>\n<p>A <strong>wave<\/strong> is one full loop from design to plan to work. A <strong>revision<\/strong> is a redo inside that wave. A <strong>phase<\/strong> is a chunk of work inside a plan or a backlog. Written together they read <code>w1-r0-p3<\/code>.<\/p>\n<p>Think of it as coordinates. The agent needs to know where this piece of work sits in the sequence of events, and it applies the answer well once you give it. The notation itself is only a convention, so if your organisation already numbers work differently, use your own names and be consistent.<\/p>\n<p>Plans and backlogs carry wave numbering. Requirements sets and designs are exempt from it.<\/p>\n<h3 id=\"writing-one\"><span>Writing one<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/writing-one\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<ol>\n<li>Tell your agent to generate a plan from the design. Name the design file.<\/li>\n<li>Give it coordinates. Say which wave and revision this is, or say what it continues.<\/li>\n<li>Say whether this is a fresh build or a change to something that already exists. The distinction matters and the agent honours it. Three templates exist for three real starting points: <code>plan-prd.md<\/code> for a new idea or design, <code>plan-prd-decompose.md<\/code> for reverse-engineering an existing codebase into a fresh set, and <code>plan-prd-change.md<\/code> for a change inside an active set.<\/li>\n<li>Read the plan before anything is written. The workflow reference tells the agent to present the plan first and write only after you approve it.<\/li>\n<li>Approve the write. Approving the plan is not the same as approving execution, and the workflow separates those two questions deliberately. If you only say yes to the plan, you should get a saved plan and a stop.<\/li>\n<\/ol>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>The word &quot;plan&quot; collides with the planning mode built into many agent harnesses. Once real plan documents exist in <code>docs/plans/<\/code>, &quot;write a plan&quot; becomes ambiguous and your agent may answer you instead of acting. The working habit that solved it is to name the mode explicitly, saying &quot;plan mode&quot; when you mean the harness feature and &quot;a plan document&quot; when you mean the file. If the agent replies with a description and asks &quot;does this look go

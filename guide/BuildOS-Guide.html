lang=\"json\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-json\">{\n  &quot;id&quot;: &quot;TC-018&quot;,\n  &quot;type&quot;: &quot;test-case&quot;,\n  &quot;title&quot;: &quot;Checkout shows the fine owed&quot;,\n  &quot;status&quot;: &quot;draft&quot;,\n  &quot;summary&quot;: &quot;Check that checkout displays the full fine owed.&quot;,\n  &quot;source_anchor&quot;: &quot;assets/lending-overview/lending-overview.md#fines&quot;,\n  &quot;source_refs&quot;: [&quot;assets/lending-overview/lending-overview.md#fines&quot;],\n  &quot;related&quot;: [&quot;REQ-021&quot;],\n  &quot;created_at&quot;: &quot;2026-03-02&quot;,\n  &quot;updated_at&quot;: &quot;2026-03-02&quot;,\n  &quot;verifies&quot;: [&quot;REQ-021&quot;],\n  &quot;preconditions&quot;: [&quot;A patron exists with at least one overdue loan.&quot;],\n  &quot;steps&quot;: [&quot;Open the patron's checkout screen.&quot;, &quot;Read the fine presented to the patron.&quot;],\n  &quot;expected&quot;: &quot;The checkout screen shows the total fine owed before the loan is made.&quot;\n}\n<\/code><\/pre><\/div>\n<h3 id=\"the-extraction-row\"><span>The extraction row<\/span><a class=\"h-anchor\" href=\"#/07-pull-knowledge-out-of-it/the-extraction-row\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Alongside those, one more row records the reading itself. It goes in <code>.os/data/extractions.jsonl<\/code> and its contract is <code>.os/contracts/extraction-contract.md<\/code>.<\/p>\n<div class=\"code-block\" data-lang=\"json\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-json\">{\n  &quot;id&quot;: &quot;EXT-004&quot;,\n  &quot;type&quot;: &quot;extraction&quot;,\n  &quot;status&quot;: &quot;draft&quot;,\n  &quot;source_anchor&quot;: &quot;assets/lending-overview/lending-overview.md#holds&quot;,\n  &quot;outcome_contract&quot;: &quot;extraction-outcomes-v1&quot;,\n  &quot;minted&quot;: [&quot;CAP-014&quot;, &quot;REQ-021&quot;, &quot;TC-018&quot;],\n  &quot;referenced&quot;: [&quot;PER-002&quot;],\n  &quot;updated&quot;: [],\n  &quot;extracted_by&quot;: &quot;product-owner&quot;,\n  &quot;extracted_at&quot;: &quot;2026-03-02T14:02:00Z&quot;\n}\n<\/code><\/pre><\/div>\n<p>Those three lists are the point of the row. <strong>Minted<\/strong> means this reading created new records. <strong>Referenced<\/strong> means it reused records without changing them. <strong>Updated<\/strong> means it deliberately changed records.<\/p>\n<p><strong><code>outcome_contract<\/code><\/strong> names which version of the outcome rules the row follows. It has exactly one valid value today, <code>extraction-outcomes-v1<\/code>, and you write that string literally. Write it on every new extraction row. Its presence is what makes <code>minted<\/code>, <code>referenced<\/code> and <code>updated<\/code> required, all three of them even when a list is empty, and it is why one ID may appear in at most one of them. The contract calls the field optional only so that rows written before the rules existed stay valid.<\/p>\n<p>That row answers the question people ask after a second pass over overlapping material, which is whether the re-run quietly re-scoped things they had already agreed. Anything listed in <code>updated<\/code> was changed, and anything listed in <code>referenced<\/code> was left as it was.<\/p>\n<p>The nine ID prefixes in the registry are <code>REQ<\/code>, <code>CAP<\/code>, <code>PER<\/code>, <code>TC<\/code>, <code>RES<\/code>, <code>RUN<\/code>, <code>FIND<\/code>, <code>EXT<\/code>, and <code>PB<\/code>. Nothing else is valid. Agents do invent others, such as <code>REF<\/code>, <code>INT<\/code>, <code>GO<\/code> or a bare <code>Q<\/code>, and the validator rejects them.<\/p>\n<h2 id=\"where-the-records-live\"><span>Where the records live<\/span><a class=\"h-anchor\" href=\"#/07-pull-knowledge-out-of-it/where-the-records-live\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Eight files, one per row type, all in <code>.os/data/<\/code>:<\/p>\n<p><code>requirements.jsonl<\/code> · <code>capabilities.jsonl<\/code> · <code>personas.jsonl<\/code> · <code>test-cases.jsonl<\/code> · <code>results.jsonl<\/code> · <code>runs.jsonl<\/code> · <code>findings.jsonl<\/code> · <code>extractions.jsonl<\/code><\/p>\n<p><code>runs.jsonl<\/code> and <code>findings.jsonl<\/code> are written by commands you will meet in <a href=\"#/08-write-and-run-a-playbook\">Write and run a playbook<\/a> and <a href=\"#/09-qualify-what-you-found\">Qualify what you found<\/a>. The other six are yours, <code>extractions.jsonl<\/code> included.<\/p>\n<p>Four of those eight files hold the record types above. One more needs naming here. A <strong>result<\/strong> is a row saying what happened when something was checked: which <code>TC<\/code>, <code>REQ<\/code>, <code>CAP<\/code>, <code>RUN<\/code> or <code>FIND<\/code> it targets, whether the outcome was <code>pass<\/code>, <code>fail<\/code>, <code>blocked<\/code> or <code>inconclusive<\/code>, and what evidence backs that. Results come out of running playbooks, so 08 is where you will write your first one.<\/p>\n<p>That directory takes NDJSON, JSONL, or CSV and nothing else. Your own datasets go in <code>workspace/datasets/<\/code> instead, which covers spreadsheets a playbook consumes and exports you are keeping.<\/p>\n<h2 id=\"how-you-do-it-today\"><span>How you do it today<\/span><a class=\"h-anchor\" href=\"#/07-pull-knowledge-out-of-it/how-you-do-it-today\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The procedure below is what the work actually looks like today. You direct an agent, review what it proposes, and approve the rows that get appended.<\/p>\n<ol>\n<li><p><strong>Decide the scope and say it out loud.<\/strong> Name the converted sources you are treating as one extraction, and name what you are looking for. Thin results almost always trace back to a scope nobody stated. If you have four spreadsheets of prior backlog items and you did not mention them, they will not appear.<\/p>\n<\/li>\n<li><p><strong>Point the agent at the text and at the contract in the same instruction.<\/strong> Give it the paths under <code>assets/<\/code> and the paths to <code>.os/contracts/entity-records-contract.md<\/code> and <code>.os/contracts/extraction-contract.md<\/code>. Naming the contract is what keeps the output consistent.<\/p>\n<\/li>\n<li><p><strong>Give it the rules before it starts.<\/strong> A set of rules that works:<\/p>\n<ul>\n<li>Do not invent a loader.<\/li>\n<li>Where a safe data file and a contract exist, propose exact rows for review.<\/li>\n<li>For each output, state whether there is deterministic tooling or the step is manual.<\/li>\n<li>Read the applicable contract and cite it.<\/li>\n<li>Proceed only with the outputs I approve.<\/li>\n<\/ul>\n<\/li>\n<li><p><strong>Read the plan it returns.<\/strong> A capable agent will come back with a plan and a set of scoped options rather than a pile of rows. Pick one. Watch for the contract&#39;s own vocabulary coming back at you, such as &quot;append one extraction row and mint draft capability rows&quot;, which is a good sign it read the contract instead of guessing.<\/p>\n<\/li>\n<li><p><strong>Review the proposed rows.<\/strong> The next section covers how, and it is not a step to skip.<\/p>\n<\/li>\n<li><p><strong>Approve, and let it append.<\/strong> Rows go on the end of the matching <code>.jsonl<\/code> file. New rows start at <code>status: draft<\/code>.<\/p>\n<\/li>\n<li><p><strong>Validate.<\/strong> Run:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos validate\n<\/code><\/pre><\/div>\n<p>When it passes you get exit code 0 and the line <code>OK. No problems found.<\/code> When it fails you get exit code 4 and, for each file, one line per problem with the field, what is wrong, and a code in brackets. It checks the envelope, the ID prefixes, the status values, the scope IDs against your <code>instance.yaml<\/code>, and <code>source_anchor<\/code>.<\/p>\n<\/li>\n<\/ol>\n<p>Commit before and after. No command in BuildOS undoes any of this, so version control is your only way back.<\/p>\n<h2 id=\"what-the-contract-does-for-you\"><span>What the contract does for you<\/span><a class=\"h-anchor\" href=\"#/07-pull-knowledge-out-of-it/what-the-contract-does-for-you\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Two people on your team, using two different agent tools, on two different days, can extract from the same document and produce rows that match. What makes that happen is that both of them point their agent at the same contract file and tell it to obey it. The contract is a written artifact in your repository, and any agent can read it.<\/p>\n<p>So the quality of your data comes down to one habit, which is naming the contract in the instruction. An agent that has not read <code>entity-records-contract.md<\/code> will produce something that looks like a record and fails validation, or worse, passes validation and means something slightly different from every other row in the file.<\/p>\n<h2 id=\"reading-your-records-back\"><span>Reading your records back<\/span><a class=\"h-anchor\" href=\"#/07-pull-knowledge-out-of-it/reading-your-records-back\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Do not open these files. They are not written for people, and opening one may fail outright.<\/p>\n<p>Ask your agent for a table instead:<\/p>\n<blockquote>\n<p>Give me a table in chat of all our capabilities, with ID, title, and status.<\/p>\n<\/blockquote>\n<p>Then ask for the same table for requirements and compare the two. Seeing the two tables side by side is how the capability-versus-requirement distinction usually lands.<\/p>\n<p>This is also the point of having a data layer at all. The records are plain text, in fixed shapes, so you can script against them, import them somewhere else, or map them to another system, with nothing hidden inside a database you cannot open. Because the shapes are fixed, the same files are what your agent reads when you ask it a question about the whole corpus, which keeps its answers anchored to what you actually collected.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>The first table you ask for will include three rows about BuildOS itself. <code>REQ-001<\/code>, <code>CAP-001<\/code>, and <code>TC-001<\/code> ship as a seed and describe BuildOS&#39;s own playbook gate, not your system. They are easy to recognise and just as easy to leave in place, where they end up in a delivery backlog as a task nobody can explain. Delete or relabel them before you add your own. <a href=\"#/11-keep-the-record-clean\">Keep the record clean<\/a> covers this properly.<\/p>\n<\/div><\/aside>\n<h2 id=\"reviewing-what-the-agent-wrote\"><span>Reviewing what the agent wrote<\/span><a class=\"h-anchor\" href=\"#/07-pull-knowledge-out-of-it/reviewing-what-the-agent-wrote\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Checking a sample tells you very little about the batch it came from. Extraction produces many rows at once from one reading, so a single misunderstanding spreads through all of them.<\/p>\n<p>A generated set that contradicts itself in one place usually contradicts itself in many. Patching the single row you found teaches you nothing about how many more are wrong, so ask for a sweep of the whole class instead.<\/p>\n<p>Run these three checks, a few minutes each:<\/p>\n<ul>\n<li><strong>Count against the file, not against the summary.<\/strong> Ask how many rows were written, then verify. Numbers get recomputed and re-narrated at each step and nothing reconciles them.<\/li>\n<li><strong>Spot-check the source anchors.<\/strong> Pick three rows, open the converted text at the anchor, and confirm the row says what the text says.<\/li>\n<li><strong>Check for names nobody approved.<\/strong> If a source document contains a guessed or placeholder name for something in the target system, extraction will have promoted that guess into a fact. Only personas have any protection against this, and even that requires a deliberate human write.<\/li>\n<\/ul>\n<p>The full review procedure lives in <a href=\"#/15-working-with-your-agent/the-review-sweep\">The review sweep<\/a>. Read it before your first large extraction.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Expect the volume to surprise you. A single pass can produce hundreds of capabilities, while a stock checkout holds one requirement, one capability, and one test case. Four rows from a forty-page document usually means the scope was never stated. Twelve hundred rows means nobody has reviewed them yet, which is a review problem rather than a data problem.<\/p>\n<\/div><\/aside>\n<h2 id=\"what-you-should-have-now\"><span>What you should have now<\/span><a class=\"h-anchor\" href=\"#/07-pull-knowledge-out-of-it/what-you-should-have-now\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>A clear line in your own head between converting a document and extracting from it<\/li>\n<li>At least one <code>EXT-NNN<\/code> row in <code>.os/data/extractions.jsonl<\/code> naming what it read and what it produced<\/li>\n<li>Capability, requirement, persona, or test case rows in their own files, all at <code>status: draft<\/code><\/li>\n<li>A passing run of <code>buildos validate<\/code><\/li>\n<li>The three seeded BuildOS rows deleted or relabelled<\/li>\n<li>A way to read your data that does not involve opening a <code>.jsonl<\/code> file<\/li>\n<\/ul>\n<h2 id=\"next\"><span>Next<\/span><a class=\"h-anchor\" href=\"#/07-pull-knowledge-out-of-it/next\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><a href=\"#/08-write-and-run-a-playbook\">Write and run a playbook<\/a>, which turns what you now know about the system into a procedure that goes and checks it.<\/p>\n","toc":[{"id":"what-you-need-first","text":"What you need first","level":2},{"id":"what-extraction-means-here","text":"What extraction means here","level":2},{"id":"the-record-types","text":"The record types","level":2},{"id":"what-a-row-actually-looks-like","text":"What a row actually looks like","level":3},{"id":"the-extraction-row","text":"The extraction row","level":3},{"id":"where-the-records-live","text":"Where the records live","level":2},{"id":"how-you-do-it-today","text":"How you do it today","level":2},{"id":"what-the-contract-does-for-you","text":"What the contract does for you","level":2},{"id":"reading-your-records-back","text":"Reading your records back","level":2},{"id":"reviewing-what-the-agent-wrote","text":"Reviewing what the agent wrote","level":2},{"id":"what-you-should-have-now","text":"What you should have now","level":2},{"id":"next","text":"Next","level":2}]},"08-write-and-run-a-playbook":{"slug":"08-write-and-run-a-playbook","num":"08","title":"Write and run a playbook","lede":"This page shows you how to write the instruction file that tells a person or an agent to go poke at the system you are studying, how to switch it on, how to run it, and what lands on disk afterwards.","html":"<h2 id=\"what-you-need-first\"><span>What you need first<\/span><a class=\"h-anchor\" href=\"#/08-write-and-run-a-playbook/what-you-need-first\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Read <a href=\"#/04-install-and-configure-your-instance\">Install and configure your instance<\/a> first. This article assumes your <code>.os/config/instance.yaml<\/code> names your real systems, environments and owners, and that <code>buildos intake<\/code> and <code>buildos discovery<\/code> both answer when you run them.<\/p>\n<p>You also need an agent tool that can drive a browser, and a person who can sign in to the system you are studying. Both are covered below.<\/p>\n<p>Run every command in this article from your project root.<\/p>\n<h2 id=\"exploring-and-testing-use-the-same-loop\"><span>Exploring and testing use the same loop<\/span><a class=\"h-anchor\" href=\"#/08-write-and-run-a-playbook/exploring-and-testing-use-the-same-loop\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Exploring a system and testing it run through one procedure rather than two. You write a playbook, a person switches it on, an agent runs it, and the run leaves a record on disk. The only thing that changes is which of four folders the playbook lives in. The run mechanics, the review gate, the record shape, the evidence capture and the qualification step that follows are identical, so this article covers both.<\/p>\n<h2 id=\"what-a-playbook-is\"><span>What a playbook is<\/span><a class=\"h-anchor\" href=\"#/08-write-and-run-a-playbook/what-a-playbook-is\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A <strong>playbook<\/strong> is a short Markdown file that tells a person or an AI agent how to do one job. It has a fixed header block and a fixed set of sections. It lives in the repository at <code>playbooks/&lt;category&gt;/&lt;slug&gt;.md<\/code>.<\/p>\n<p>A playbook describes a test. It is not the test itself. The file holds everything the person or the agent needs to carry out the job: what the job is, what must be true before it starts, what to do, and what a good or bad result looks like.<\/p>\n<p>Playbooks are short on purpose. An agent running one also reads the source material you brought in and the records already in the system, so the playbook only has to supply the guidance and the boundary.<\/p>\n<p>Playbooks are written for both people and agents. Think of the job as something a person could do with a mouse, a keyboard and a browser. If a person could follow it, so can an agent, and the same file serves both.<\/p>\n<p>Playbooks also work as guardrails. A playbook says what you should not do, as well as what you should. That second job gets its own kind of playbook, described further down.<\/p>\n<h2 id=\"the-four-categories\"><span>The four categories<\/span><a class=\"h-anchor\" href=\"#/08-write-and-run-a-playbook/the-four-categories\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The <strong>category<\/strong> is which of four folders the playbook lives in, so the folder decides the category. There are exactly four, and you cannot add a fifth.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Folder<\/th>\n<th>What belongs in it<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>playbooks/administrative/<\/code><\/td>\n<td>Setup, governance rules, loading data, running scripts.<\/td>\n<\/tr>\n<tr>\n<td><code>playbooks/build/<\/code><\/td>\n<td>Compiling, packaging, deploying.<\/td>\n<\/tr>\n<tr>\n<td><code>playbooks/discovery/<\/code><\/td>\n<td>Exploring: checking schemas, forms, screens, and whether a normal user can find something.<\/td>\n<\/tr>\n<tr>\n<td><code>playbooks/testing/<\/code><\/td>\n<td>Unit, integration and end-to-end tests.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Every folder name here refers to the system you are studying rather than to BuildOS. A capable newcomer read <code>administrative<\/code> as &quot;administering BuildOS&quot; and got the whole folder backwards. Reading each name with &quot;the system&quot; after it fixes that: administering <em>the system<\/em>, building <em>the system<\/em>, discovering <em>the system<\/em>, testing <em>the system<\/em>.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>The categories are fixed at four. The contract that governs playbooks defines <code>administrative<\/code>, <code>build<\/code>, <code>discovery<\/code> and <code>testing<\/code> and nothing else. If your job does not fit neatly, pick the closest one rather than making a new folder. The run command will not recognise a playbook sitting in a folder it does not know.<\/p>\n<\/div><\/aside>\n<h2 id=\"procedure-playbooks-and-guardrail-playbooks\"><span>Procedure playbooks and guardrail playbooks<\/span><a class=\"h-anchor\" href=\"#/08-write-and-run-a-playbook/procedure-playbooks-and-guardrail-playbooks\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>There are two kinds of playbook, and they have different body shapes.<\/p>\n<p>A <strong>procedure playbook<\/strong> is one you actually run. It produces evidence and it leaves a record.<\/p>\n<p>A <strong>guardrail playbook<\/strong> is a rule rather than a job. It never runs and it produces nothing. It states what you must and must not do. Two guardrails ship with the system today, and both are switched on: one forbids editing the documentation plug-in&#39;s folders directly, the other requires every scoped field to use IDs that appear in your configuration file.<\/p>\n<p>Guardrails are worth writing. An agent that finds a guardrail will cite the rule and change what it was about to do, purely because the file sits next to the work.<\/p>\n<p>Writing a guardrail is covered in its own section near the end of this article.<\/p>\n<h2 id=\"the-two-typing-axes\"><span>The two typing axes<\/span><a class=\"h-anchor\" href=\"#/08-write-and-run-a-playbook/the-two-typing-axes\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Every procedure playbook declares two things about itself. Both go in the header block.<\/p>\n<p><strong><code>execution_mode<\/code><\/strong> says how much the playbook spells out.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Value<\/th>\n<th>What it means for you<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>explicit-steps<\/code><\/td>\n<td>You write the exact steps. The agent does exactly what you wrote and nothing more. Choose this when you already know the click path.<\/td>\n<\/tr>\n<tr>\n<td><code>guided-objective<\/code><\/td>\n<td>You write the outcome you want plus some guidance, and the agent works out how to get there like a user would. Choose this when you want to find out whether the path is findable at all.<\/td>\n<\/tr>\n<tr>\n<td><code>inferred-actions<\/code><\/td>\n<td>You write the goal and the agent works out the steps from what it can read. Choose this when the steps depend on things you cannot see from here.<\/td>\n<\/tr>\n<tr>\n<td><code>n/a<\/code><\/td>\n<td>Guardrails only.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong><code>state_nature<\/code><\/strong> says what the playbook does to the system it touches.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Value<\/th>\n<th>What it means for you<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>stateful<\/code><\/td>\n<td>The job needs a particular starting state and it changes that state. A <code>## Preconditions<\/code> section is required.<\/td>\n<\/tr>\n<tr>\n<td><code>standing<\/code><\/td>\n<td>The job is safe to run at any time and leaves nothing behind.<\/td>\n<\/tr>\n<tr>\n<td><code>guardrail<\/code><\/td>\n<td>A rule, not a run.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Take <code>stateful<\/code> seriously. A change one run makes is still there for the next run. A workaround applied to unblock a test can permanently remove your ability to observe the original problem. The <code>## Preconditions<\/code> section exists to catch that case.<\/p>\n<p>There is a third field, <code>harness<\/code>, which names the kind of tooling the job needs. It has five values: <code>browser<\/code> for driving a web browser, <code>computer-use<\/code> for controlling the screen, keyboard and mouse, <code>mcp<\/code> for reaching an external tool through the connector protocol your agent speaks, <code>shell<\/code> for running commands, and <code>none<\/code>. Each value names a capability rather than a product. See <a href=\"#/16-harness-independence-and-trust\">Harness independence and trust<\/a>.<\/p>\n<h2 id=\"the-templates\"><span>The templates<\/span><a class=\"h-anchor\" href=\"#/08-write-and-run-a-playbook/the-templates\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Seven playbook shapes ship with the system, in <code>.os/templates/<\/code>. Six of them are the combinations of the three execution modes and the two runnable state natures. The seventh is the guardrail.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Template file<\/th>\n<th>Use it when<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>procedure-playbook-explicit-steps-standing.md<\/code><\/td>\n<td>Ordered steps, safe to run any time.<\/td>\n<\/tr>\n<tr>\n<td><code>procedure-playbook-explicit-steps-stateful.md<\/code><\/td>\n<td>Ordered steps, needs and changes a starting state.<\/td>\n<\/tr>\n<tr>\n<td><code>procedure-playbook-guided-objective-standing.md<\/code><\/td>\n<td>Outcome plus guidance, safe to run any time.<\/td>\n<\/tr>\n<tr>\n<td><code>procedure-playbook-guided-objective-stateful.md<\/code><\/td>\n<td>Outcome plus guidance, needs and changes a starting state.<\/td>\n<\/tr>\n<tr>\n<td><code>procedure-playbook-inferred-actions-standing.md<\/code><\/td>\n<td>The agent works out the steps, safe to run any time.<\/td>\n<\/tr>\n<tr>\n<td><code>procedure-playbook-inferred-actions-stateful.md<\/code><\/td>\n<td>The agent works out state-changing steps.<\/td>\n<\/tr>\n<tr>\n<td><code>guardrail-playbook.md<\/code><\/td>\n<td>A rule, not a job.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>The templates are conveniences. The authority is the contract at <code>.os/contracts/playbook-contract.md<\/code>. When a template and the contract disagree, the contract wins.<\/p>\n<h2 id=\"procedure-1-write-a-playbook\"><span>Procedure 1 · Write a playbook<\/span><a class=\"h-anchor\" href=\"#/08-write-and-run-a-playbook/procedure-1-write-a-playbook\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Start from a real problem you actually hit. A playbook written from an obstacle you met yourself tends to ask better questions.<\/p>\n<ol>\n<li><p>Pick the category. Say the folder name out loud with &quot;the system&quot; after it. If you hit a wall doing something and want to prove it, <code>testing<\/code> is usually more accurate than <code>discovery<\/code>. If you want to find out whether something is findable at all, use <code>discovery<\/code>.<\/p>\n<\/li>\n<li><p>Pick the two axes. Decide how much you want to spell out (<code>execution_mode<\/code>) and whether the job changes the system (<code>state_nature<\/code>).<\/p>\n<\/li>\n<li><p>Copy the matching template into the category folder, renaming it to a slug. The slug is lowercase with hyphens.<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>cp .os/templates/procedure-playbook-guided-objective-stateful.md playbooks/discovery/check-hold-pickup-notice.md\n<\/code><\/pre><\/div>\n<\/li>\n<li><p>Pick the next free ID. Playbook IDs are <code>PB-NNN<\/code> in a single flat sequence across all categories. Six playbooks ship, numbered <code>PB-001<\/code> to <code>PB-006<\/code>, so a new one starts at <code>PB-007<\/code>. The list is in <code>.os/indexes/playbooks.json<\/code> and in <code>playbooks/AGENTS.md<\/code>.<\/p>\n<\/li>\n<li><p>Fill in the header block. The header is <strong>YAML frontmatter<\/strong>, a block of <code>field: value<\/code> lines fenced by <code>---<\/code> at the very top of the file. The contract requires sixteen fields. The table below covers all sixteen, with <code>systems<\/code>, <code>environments<\/code> and <code>owners<\/code> grouped into one row because you fill them in the same way:<\/p>\n<p>| Field | What to put in it | | --- | --- | | <code>id<\/code> | The <code>PB-NNN<\/code> you picked in step 4. | | <code>title<\/code> | A short imperative name, such as <code>Inspect UI discoverability<\/code>. | | <code>category<\/code> | Must equal the folder the file is in. | | <code>execution_mode<\/code> | From step 2. | | <code>state_nature<\/code> | From step 2. | | <code>status<\/code> | Leave it as <code>draft<\/code>. See procedure 2. | | <code>audience<\/code> | <code>human<\/code>, <code>agent<\/code> or <code>both<\/code>. All six shipped playbooks use <code>both<\/code>. | | <code>harness<\/code> | A list, such as <code>[browser, computer-use]<\/code> or <code>[shell]<\/code>. | | <code>systems<\/code>, <code>environments<\/code>, <code>owners<\/code> | Lists of IDs from your <code>instance.yaml<\/code>. Nothing else is allowed here. | | <code>targets<\/code> | IDs of records this job is about, such as <code>[REQ-001, CAP-001]<\/code>. May be empty. | | <code>produces<\/code> | What a run leaves behind: <code>[run-record]<\/code>, <code>[finding]<\/code>, <code>[dataset]<\/code>, or a combination. | | <code>source_anchor<\/code> | Where this playbook came from, if source material prompted it. Otherwise the bare word <code>null<\/code>, meaning empty. | | <code>version<\/code> | A three-part version number, <code>major.minor.patch<\/code>. Start at <code>1.0.0<\/code>. | | <code>related<\/code> | Links to the contract and to anything relevant. May be empty. |<\/p>\n<\/li>\n<li><p>Fill in the body. A procedure playbook needs these sections, in this order:<\/p>\n<ul>\n<li><code>## Objective<\/code>. The one job, in a sentence or two.<\/li>\n<li><code>## Preconditions<\/code>. Required when <code>state_nature<\/code> is <code>stateful<\/code>. What must be true before this starts, and what must not be present.<\/li>\n<li><code>## Steps &amp; Guidance<\/code>. The steps, or the outcome plus guidance, depending on your <code>execution_mode<\/code>.<\/li>\n<li><code>## Expected Signals<\/code>. Three groups: positive, negative and inconclusive. What each result would look like.<\/li>\n<li><code>## Produces<\/code>. What a run of this leaves behind.<\/li>\n<li><code>## Notes / Links<\/code>. Optional.<\/li>\n<\/ul>\n<\/li>\n<li><p>Write <code>## Expected Signals<\/code> before anyone runs it. In one session a step in the target system appeared to succeed and silently did not do the second half of its job. There was no error message, and only someone who already knew to go and check afterwards would have caught it. Writing down what success looks like beforehand is what stops a run passing quietly.<\/p>\n<\/li>\n<li><p>Keep it short, and do not restate the source material, because the agent reads that too.<\/p>\n<\/li>\n<\/ol>\n<p>You can ask your agent to draft the playbook. An agent pointed at the contract will produce a correctly shaped file with the right sections without being told what they are. Give it the real problem in plain language: what you are trying to do, what is happening, and what the finish line looks like. Then read what it wrote.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Do not write a playbook for something an agent cannot do. Agents drive browsers, not phone apps, so a playbook aimed at a native mobile application with no web equivalent has nothing to run against. Check that the job can be done with a mouse, a keyboard and a browser before you write it.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>A playbook does not produce a repeatable test script. The script goes the other way round, as an input to the step <em>after<\/em> the run. See <a href=\"#/09-qualify-what-you-found\">Qualify what you found<\/a>.<\/p>\n<\/div><\/aside>\n<h2 id=\"procedure-2-activate-it\"><span>Procedure 2 · Activate it<\/span><a class=\"h-anchor\" href=\"#/08-write-and-run-a-playbook/procedure-2-activate-it\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A new playbook starts at <code>draft<\/code>, and a <code>draft<\/code> playbook refuses to run. Nothing happens until a person moves it to <code>active<\/code>.<\/p>\n<p>This gate is called <strong>review-to-activate<\/strong>. The full sequence of states is <code>draft<\/code> → <code>reviewed<\/code> → <code>active<\/code> → <code>archived<\/code>. Only <code>active<\/code> playbooks run, and only <code>active<\/code> guardrails apply.<\/p>\n<p>The system never states the reason for the gate. It is that your agent is about to drive a browser against a real system on your behalf, and a person should read the instructions before that happens.<\/p>\n<ol>\n<li><p>Open the playbook file.<\/p>\n<\/li>\n<li><p>Change <code>status: draft<\/code> to <code>status: active<\/code>. It is the sixth line in the header block.<\/p>\n<\/li>\n<li><p>Save the file.<\/p>\n<\/li>\n<li><p>Rebuild the playbook index.<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos intake index playbooks\n<\/code><\/pre><\/div>\n<p>You should see a line like <code>wrote .os/indexes/playbooks.json (6 playbooks)<\/code>. The number is the total count of playbooks, not the count of active ones.<\/p>\n<\/li>\n<li><p>Check that the tool can see it. Open <code>.os/indexes/playbooks.json<\/code> and look at the <code>runnable_playbooks<\/code> list. Your <code>PB-NNN<\/code> must be in it.<\/p>\n<\/li>\n<\/ol>\n<p>An <strong>index<\/strong> is a generated lookup file. It is never the source of truth. You can delete it and rebuild it at any time. The run command reads the index rather than the folder, which is why step 4 matters.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Step 4 is the one people skip. The playbook then looks <code>active<\/code> when you open the file and stays invisible to the tool, which produces a confusing &quot;not active&quot; error on a file that plainly says <code>active<\/code>. If a run refuses a playbook you activated a moment ago, rebuild the index.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>An agent can flip <code>status<\/code> for you. An agent told to run a playbook may edit the field and rebuild the index itself, with no human reading anything. That defeats the gate. If you want the gate to mean something, do steps 1 to 3 yourself.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>The review-to-activate gate has no tooling. Activation is a hand edit of the header block plus an index rebuild, and no approval is recorded anywhere. There is no way to tell later who reviewed a playbook or when. If your team needs an audit trail, record the review in your own commit message or work tracker. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p>The <code>reviewed<\/code> state exists in the contract and is rarely used. Going straight from <code>draft<\/code> to <code>active<\/code> is fine, provided a person does the reading.<\/p>\n<h2 id=\"the-stock-checkout-problem\"><span>The stock-checkout problem<\/span><a class=\"h-anchor\" href=\"#/08-write-and-run-a-playbook/the-stock-checkout-problem\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>You cannot start the discovery loop on a fresh copy of the system.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>No discovery playbook is switched on out of the box. Six playbooks ship and only three are <code>active<\/code>, and all three of those are administrative. The one discovery playbook, <code>PB-005<\/code> at <code>playbooks/discovery/inspect-ui-discoverability.md<\/code>, is <code>draft<\/code>. The run command requires an <code>active<\/code> playbook whose category is <code>discovery<\/code>, so nothing will run until you either activate <code>PB-005<\/code> or write and activate your own. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p>The fix is procedure 2, applied to <code>PB-005<\/code> or to a playbook you wrote. Do it once, before your first run rather than partway through one.<\/p>\n<p>There is a second step for <code>PB-005<\/code>. Its header says <code>targets: [REQ-001, CAP-001]<\/code>: two seeded BuildOS records that are <code>draft<\/code>. A discovery run looks up every ID in <code>targets<\/code>, and each one must lead to an <code>active<\/code> record. A <code>draft<\/code> target stops the run with <code>redirect_inactive_terminal<\/code>, and nothing is written. So when you activate <code>PB-005<\/code>, also set its targets to an empty list, and then rebuild the playbook index (procedure 2, step 4), because the run reads the targets from the index:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>targets: []\n<\/code><\/pre><\/div>\n<p>Later, when records of your own are <code>active<\/code>, put their IDs there. A record becomes <code>active<\/code> only after a person reviewed it; the records you wrote in <a href=\"#/07-pull-knowledge-out-of-it\">Pull knowledge out of it<\/a> are still <code>draft<\/code>, so they cannot be targets yet.<\/p>\n<p>A second limit shapes how you plan the rest of the work.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>The shipped command is <code>buildos discovery run discovery<\/code>, and it accepts only a playbook whose category is <code>discovery<\/code>. There is no matching command for a <code>testing<\/code>, <code>build<\/code> or <code>administrative<\/code> playbook. Record those runs by hand, following the shape in <code>.os/contracts/run-record-contract.md<\/code>. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p>Playbooks in the other three categories still work as playbooks. You write them, a person activates them, and a person or an agent follows them. The missing piece is a tool to write the run record at the end.<\/p>\n<h2 id=\"procedure-3-run-it\"><span>Procedure 3 · Run it<\/span><a class=\"h-anchor\" href=\"#/08-write-and-run-a-playbook/procedure-3-run-it\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A <strong>run<\/strong> is one recorded attempt at doing something. A <strong>run record<\/strong> is the folder it leaves behind.<\/p>\n<p>Three things have to be in place before you start. Only the first of them is inside BuildOS.<\/p>\n<ul>\n<li>An <code>active<\/code> discovery playbook, visible in <code>runnable_playbooks<\/code>.<\/li>\n<li>A real browser, already signed in to the environment you are studying.<\/li>\n<li>The address of that environment, which you supply by hand.<\/li>\n<\/ul>\n<p>The steps:<\/p>\n<ol>\n<li><p>Check which branch you are on and commit anything outstanding. A <strong>branch<\/strong> is one line of history in your version control. A repository can hold several at once, and you are always working on one of them. Run:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>git branch --show-current\n<\/code><\/pre><\/div>\n<p>Your editor will happily show you one branch while your agent works on another. Committing first also gives you a point to roll back to.<\/p>\n<\/li>\n<li><p>Tell your agent which playbook to run, which environment, and which browser to use. Give it the environment address, either pasted in or by pointing the agent at the file where you keep addresses. Name the playbook by its ID.<\/p>\n<\/li>\n<li><p>Let it work. It reads <code>## Steps &amp; Guidance<\/code> and works through the job, clicking like a user. Expect this to be slow. An agent may take several times as long as a person would, and what that time buys you is the evidence.<\/p>\n<\/li>\n<li><p>Answer its questions. It will stop and ask, which is correct behaviour. When it asks which data to use, tell it to pick something that already exists rather than inventing a record. In one session an agent was about to create a test record that did not exist, and was told to use one that was already there.<\/p>\n<\/li>\n<li><p>When the job is done, record the run.<\/p>\n<p>Two of the arguments point at files you make yourself, before you run the command. <code>--evidence<\/code> takes something captured during the run: a screenshot, a log, an export. <code>--raw-finding<\/code> takes a plain text or Markdown file holding one observation, written in your own words. Neither has a defined home in BuildOS, so keep them outside the BuildOS directories. This example uses a <code>captures/<\/code> directory at your project root.<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos discovery run discovery --playbook-id PB-005 --outcome inconclusive --title &quot;Hold pickup notice&quot; --evidence captures/screenshot-01.png --raw-finding captures/observed.md\n<\/code><\/pre><\/div>\n<p>The command copies each evidence file into the run&#39;s <code>evidence/<\/code> folder, with a number in front of its name (here <code>001-screenshot-01.png<\/code>), and copies the text of each raw-finding file into <code>raw-findings.md<\/code> as its own numbered section.<\/p>\n<p><code>--outcome<\/code> is required and must be <code>positive<\/code>, <code>negative<\/code> or <code>inconclusive<\/code>. <code>--evidence<\/code> and <code>--raw-finding<\/code> can each be repeated. Add <code>--dry-run<\/code> to see what it would write without writing anything.<\/p>\n<\/li>\n<li><p>Read what it wrote. Open the new folder under <code>workspace/runs/<\/code> and check it says what you think happened.<\/p>\n<\/li>\n<\/ol>\n<p>If the playbook is not activated and indexed, step 5 stops with <code>buildos-discovery: error: playbook PB-005 is not active/runnable<\/code>. If you name a playbook from the wrong folder, it stops with <code>playbook PB-003 is &quot;administrative&quot;; run discovery requires category discovery<\/code>. If a target is not <code>active<\/code>, it stops with <code>resolve discovery target CAP-001: ... redirect_inactive_terminal<\/code> (see &quot;The stock-checkout problem&quot; above). Each is the gate refusing, rather than a fault.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>Your configuration file has no field for an environment address. The <code>environments<\/code> section holds an ID, a name, the systems it belongs to and a description, and nothing else. You supply the address on every single run. Keep the addresses in a file in your repository and point your agent at it, or paste from it. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p>The file to keep them in is your <strong>standing orientation note<\/strong>. That is an ordinary Markdown file, in the repository, holding the facts about your work that BuildOS has nowhere to store and your agent has no way to guess: what you are trying to achieve, which environment is which and at what address, who the people named in <code>owners<\/code> actually are, and any assumption your whole record set rests on. Nothing reads it automatically. You paste it, or point your agent at it, at the start of a session.<\/p>\n<p>BuildOS defines no name and no location for it, so pick one and keep it. A file called <code>ORIENTATION.md<\/code> at your project root works. Write the facts down as you learn them. When a generated set of documents turns out to be built on a wrong assumption, this is the file you correct first, before you regenerate anything. See <a href=\"#/15-working-with-your-agent\">Working with your agent<\/a>.<\/p>\n<h2 id=\"browser-and-computer-use\"><span>Browser and computer use<\/span><a class=\"h-anchor\" href=\"#/08-write-and-run-a-playbook/browser-and-computer-use\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The command in step 5 records a run. It does not drive a browser. The system says so about itself, in the router at <code>workspace/runs/AGENTS.md<\/code>: the live computer-use or browser harness remains external, and this directory records the inputs, evidence, raw findings and outcomes after the run.<\/p>\n<p>That split is deliberate. BuildOS is files on disk, and your agent tool does the clicking.<\/p>\n<p>Be ready for this to take time. Connecting an agent to a real browser can cost you an afternoon.<\/p>\n<p>It is also the one capability where agent tools genuinely differ. Most of BuildOS works the same whatever tool you use, because it is plain text and the instructions live next to the files. Browser and computer control varies instead. Some tools have it and some do not, some organisations block the tools that have it, and quality varies a lot. It is the most likely reason to switch tools.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Do not use your agent tool&#39;s built-in browser if it has one. A built-in browser often cannot hold a login, producing repeated sign-in prompts, an application that never loads, and bounces back to the home page. Drive a real desktop browser instead, one that already has your session in it.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Check which browser profile you are driving. Using the wrong one fails in ways that are easy to miss.<\/p>\n<\/div><\/aside>\n<p>For what differs between tools and what does not, see <a href=\"#/16-harness-independence-and-trust\">Harness independence and trust<\/a>.<\/p>\n<h2 id=\"credentials\"><span>Credentials<\/span><a class=\"h-anchor\" href=\"#/08-write-and-run-a-playbook/credentials\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>You sign in yourself, and the agent never sees your credentials.<\/p>\n<p>The agent gets no access to authentication. A person signs in to the browser, including whatever second factor is required, and the agent then drives a browser session that is already authenticated. You run it, you receive the second factor, and you pass the session through.<\/p>\n<p>Two things follow from that.<\/p>\n<p>The agent works as you. Everything it does in the target system is done by your account, under your permissions, and it will appear in that system&#39;s audit log as your activity. Run against a test environment where you can afford that.<\/p>\n<p>Nothing here bypasses a security control. The session is an ordinary authenticated browser session belonging to a real user who signed in normally.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Everyone tests as a highly privileged user, because that is who is sitting at the keyboard. That means behaviour that only shows up for a restricted user is not being exercised at all. BuildOS records a persona as a description, not as a set of permissions, so nothing in the system will flag this for you. If a finding depends on what a limited user can see, sign in as one.<\/p>\n<\/div><\/aside>\n<h2 id=\"what-lands-on-disk\"><span>What lands on disk<\/span><a class=\"h-anchor\" href=\"#/08-write-and-run-a-playbook/what-lands-on-disk\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>One run produces one folder plus one line in an index file.<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>workspace/runs/RUN-001/\n    run.md\n    raw-findings.md\n    evidence/\n<\/code><\/pre><\/div>\n<p><strong><code>run.md<\/code><\/strong> is the human-readable summary. It carries the run ID, a title, <code>status<\/code>, the <code>outcome<\/code>, the <code>playbook_id<\/code> it came from, the three scoped lists (<code>systems<\/code>, <code>environments<\/code>, <code>owners<\/code>), start and end timestamps, and three lists of links: evidence, raw findings, and qualified findings.<\/p>\n<p><code>status<\/code> is <code>running<\/code>, <code>closed<\/code> or <code>aborted<\/code>. <code>outcome<\/code> is <code>positive<\/code>, <code>negative<\/code> or <code>inconclusive<\/code>, and is required when the run closes.<\/p>\n<p><strong><code>evidence/<\/code><\/strong> holds the raw material captured during the run: screenshots, logs, command output, transcripts, exported data. Once the run closes, these files are frozen.<\/p>\n<p><strong><code>raw-findings.md<\/code><\/strong> holds the things somebody noticed but has not proved. They have no ID. The command writes one numbered heading per <code>--raw-finding<\/code> file you gave it:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code># Raw Findings for RUN-001\n\n## Raw Finding 1 {#raw-finding-1}\n\nThe hold screen showed no pickup notice for any of the three book copies tried.\n<\/code><\/pre><\/div>\n<p>The label in curly braces is the <strong>anchor<\/strong>: how you point at one heading inside a Markdown file. Qualification asks you for one of these.<\/p>\n<p><strong>One row in <code>.os/data/runs.jsonl<\/code>.<\/strong> This is the structured index of runs. It mirrors the fields in <code>run.md<\/code> and adds the path, the evidence count and the raw-finding count. The same command writes both the folder and the row.<\/p>\n<p>Closed and aborted run records are immutable. Do not go back and edit one to make a finding look better. Anything you learn afterwards belongs in a new run.<\/p>\n<p><code>inconclusive<\/code> is one of the three legitimate outcomes. It means the run could not confirm one way or the other whether the assertion was true, so no qualified finding came out of it.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>No example run ships with the system. <code>workspace/runs/<\/code> and <code>workspace/findings/<\/code> contain nothing but their router files. Your first run will be the first thing in there, and you will have nothing to compare it against. Read <code>.os/contracts/run-record-contract.md<\/code> before you decide your run record looks wrong.<\/p>\n<\/div><\/aside>\n<h2 id=\"what-a-raw-finding-is\"><span>What a raw finding is<\/span><a class=\"h-anchor\" href=\"#/08-write-and-run-a-playbook/what-a-raw-finding-is\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A <strong>raw finding<\/strong> is something you noticed during a run that has not been proven yet. It has no ID. It lives as an anchor inside that run&#39;s <code>raw-findings.md<\/code> and nowhere else.<\/p>\n<p>Its anchor is the numbered one the run command wrote: <code>#raw-finding-1<\/code>, <code>#raw-finding-2<\/code>, and so on. <a href=\"#/07-pull-knowledge-out-of-it\">Pull knowledge out of it<\/a> explains anchors in general, including the ones you write yourself.<\/p>\n<p>Noticing is not enough on its own. Observations arrive in different states of confidence: a suspected bug, a status written down with doubt, or a sense that several problems are tangled together. Each one is worth writing down, and none of them is yet something you could hand to somebody else and expect them to act on.<\/p>\n<p>The same idea shows up as a colour-coded spreadsheet: green means it looks fine, yellow means I need to talk to you about it, red means it is broken. The yellow rows are the raw findings.<\/p>\n<p>A raw finding becomes trustworthy when a repeatable test proves it. That step is <a href=\"#/09-qualify-what-you-found\">Qualify what you found<\/a>, and it is the next thing you should read.<\/p>\n<h2 id=\"procedure-4-write-a-guardrail\"><span>Procedure 4 · Write a guardrail<\/span><a class=\"h-anchor\" href=\"#/08-write-and-run-a-playbook/procedure-4-write-a-guardrail\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A guardrail is a playbook that states a rule. It never runs.<\/p>\n<ol>\n<li><p>Copy the guardrail template.<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>cp .os/templates/guardrail-playbook.md playbooks/administrative/never-edit-generated-indexes.md\n<\/code><\/pre><\/div>\n<\/li>\n<li><p>Set the header fields that make it a guardrail. All four are required and none is optional: <code>state_nature: guardrail<\/code>, <code>execution_mode: n/a<\/code>, <code>harness: [none]<\/code>, <code>produces: []<\/code>.<\/p>\n<\/li>\n<li><p>Write the body. A guardrail has a different shape from a procedure:<\/p>\n<ul>\n<li><code>## Scope<\/code>. When it applies and to whom. Say if it is always in force.<\/li>\n<li><code>## Rules<\/code>. A <strong>MUST NOT<\/strong> list and a <strong>MUST<\/strong> list.<\/li>\n<li><code>## Rationale<\/code>. Why the rule exists and what breaks without it.<\/li>\n<\/ul>\n<\/li>\n<li><p>Activate it with procedure 2. Only <code>active<\/code> guardrails apply.<\/p>\n<\/li>\n<\/ol>\n<p>The two shipped guardrails are the model. <code>PB-001<\/code> forbids editing the documentation plug-in&#39;s folders directly. <code>PB-002<\/code> requires every <code>systems<\/code>, <code>environments<\/code> and <code>owners<\/code> field to use an ID from the configuration file, with no legacy field names and no catch-all values like <code>both<\/code>, <code>all<\/code>, <code>any<\/code> or <code>default<\/code>.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>A guardrail works by being read, and no program enforces it. There is one validator you run by hand, and beyond that an agent obeys a guardrail because it found the file and chose to. Do not write a guardrail and assume the rule is now impossible to break.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>The <code>runnable_playbooks<\/code> list in <code>.os/indexes/playbooks.json<\/code> contains guardrails, which by contract never run. The list really means &quot;active playbooks&quot;. Do not read a guardrail&#39;s presence there as a sign that something will execute it.<\/p>\n<\/div><\/aside>\n<h2 id=\"traps\"><span>Traps<\/span><a class=\"h-anchor\" href=\"#/08-write-and-run-a-playbook/traps\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Collected here because they cut across the whole page.<\/p>\n<p><strong>You will not be able to find your own playbook.<\/strong> This happens to everyone. Stop browsing folders and indexes, and ask your agent in plain language instead. Ask for a table if the answer is a list.<\/p>\n<p><strong>The gate will stop you and you will not expect it.<\/strong> A <code>draft<\/code> status is what usually interrupts a first run. When a run refuses, check <code>status<\/code> first and the index second.<\/p>\n<p><strong>Signing in will stall.<\/strong> Budget for it. If the sign-in fails repeatedly and you are driving a real browser with a working profile, consider that something outside your control may be blocking it. Two likely causes are an organisation blocking agent-driven browsers, and a vendor blocking them at the application. Neither is something BuildOS can fix.<\/p>\n<p><strong>The agent stops for approval on every action.<\/strong> That is your tool&#39;s default setting, not BuildOS. Most tools have a mode that reduces the interruptions. Know where that setting is before you start a long run, and understand what you are agreeing to when you change it.<\/p>\n<p><strong>The agent may do work you did not ask for.<\/strong> Agents renumber references, run version-control commands to stay in sync, and install packages mid-run. Read the differences in version control after a run, which is where you see what it actually touched.<\/p>\n<p><strong>Long runs outlast the meeting.<\/strong> A run can take minutes or hours. Start long work well before you need the answer.<\/p>\n<p>More of these, with what to do about each, are in <a href=\"#/17-when-things-go-wrong\">When things go wrong<\/a>.<\/p>\n<h2 id=\"what-you-should-have-now\"><span>What you should have now<\/span><a class=\"h-anchor\" href=\"#/08-write-and-run-a-playbook/what-you-should-have-now\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>A playbook file in one of the four category folders, with all sixteen header fields filled in and a body that matches its <code>execution_mode<\/code> and <code>state_nature<\/code>.<\/li>\n<li>That playbook showing <code>status: active<\/code> and appearing in the <code>runnable_playbooks<\/code> list in <code>.os/indexes/playbooks.json<\/code>.<\/li>\n<li>A folder at <code>workspace/runs/RUN-NNN/<\/code> holding <code>run.md<\/code>, an <code>evidence/<\/code> directory and <code>raw-findings.md<\/code>, plus one matching row in <code>.os/data/runs.jsonl<\/code>.<\/li>\n<li>A clear sense of which of your observations are raw findings, and therefore not yet something anyone else should act on.<\/li>\n<li>If you wrote one, an <code>active<\/code> guardrail with <code>## Scope<\/code>, <code>## Rules<\/code> and <code>## Rationale<\/code>.<\/li>\n<\/ul>\n<h2 id=\"next\"><span>Next<\/span><a class=\"h-anchor\" href=\"#/08-write-and-run-a-playbook/next\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><a href=\"#/09-qualify-what-you-found\">Qualify what you found<\/a>, covering how a raw finding becomes a permanent record that somebody else can check.<\/p>\n","toc":[{"id":"what-you-need-first","text":"What you need first","level":2},{"id":"exploring-and-testing-use-the-same-loop","text":"Exploring and testing use the same loop","level":2},{"id":"what-a-playbook-is","text":"What a playbook is","level":2},{"id":"the-four-categories","text":"The four categories","level":2},{"id":"procedure-playbooks-and-guardrail-playbooks","text":"Procedure playbooks and guardrail playbooks","level":2},{"id":"the-two-typing-axes","text":"The two typing axes","level":2},{"id":"the-templates","text":"The templates","level":2},{"id":"procedure-1-write-a-playbook","text":"Procedure 1 · Write a playbook","level":2},{"id":"procedure-2-activate-it","text":"Procedure 2 · Activate it","level":2},{"id":"the-stock-checkout-problem","text":"The stock-checkout problem","level":2},{"id":"procedure-3-run-it","text":"Procedure 3 · Run it","level":2},{"id":"browser-and-computer-use","text":"Browser and computer use","level":2},{"id":"credentials","text":"Credentials","level":2},{"id":"what-lands-on-disk","text":"What lands on disk","level":2},{"id":"what-a-raw-finding-is","text":"What a raw finding is","level":2},{"id":"procedure-4-write-a-guardrail","text":"Procedure 4 · Write a guardrail","level":2},{"id":"traps","text":"Traps","level":2},{"id":"what-you-should-have-now","text":"What you should have now","level":2},{"id":"next","text":"Next","level":2}]},"09-qualify-what-you-found":{"slug":"09-qualify-what-you-found","num":"09","title":"Qualify what you found","lede":"This article shows you how something you noticed during a run becomes a permanent record that somebody else can check, and why that step is what makes the slow run worth doing.","html":"<h2 id=\"what-you-need-first\"><span>What you need first<\/span><a class=\"h-anchor\" href=\"#/09-qualify-what-you-found/what-you-need-first\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Read <a href=\"#/08-write-and-run-a-playbook\">Write and run a playbook<\/a> first. This page assumes you have a run record on disk at <code>workspace/runs/RUN-NNN/<\/code>, and that its <code>raw-findings.md<\/code> holds at least one observation worth pursuing.<\/p>\n<p>Run every command in this article from your project root.<\/p>\n<h2 id=\"two-kinds-of-finding\"><span>Two kinds of finding<\/span><a class=\"h-anchor\" href=\"#/09-qualify-what-you-found/two-kinds-of-finding\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A <strong>raw finding<\/strong> is something you noticed during a run that has not been proven yet. It has no ID. It lives as an anchor inside that run&#39;s <code>raw-findings.md<\/code>.<\/p>\n<p>A <strong>qualified finding<\/strong> is a raw finding that passed a repeatable test. It gets a <code>FIND-NNN<\/code> ID and its own folder, holding the finding and the test that proved it.<\/p>\n<p>What separates the two is whether somebody else can run the test and get the same answer. Confidence does not come into it, and neither does the seniority of whoever noticed the problem.<\/p>\n<p><strong>Qualification<\/strong> is that test.<\/p>\n<h2 id=\"why-this-step-exists\"><span>Why this step exists<\/span><a class=\"h-anchor\" href=\"#/09-qualify-what-you-found/why-this-step-exists\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The test exists to prove the gap to somebody who did not do the work. They do not have to take your word for anything. They run it and see the same result.<\/p>\n<p>It also keeps proving it. The test stays in place while the gap stays open, and when somebody fixes the underlying problem the same test changes its answer, which is how you learn the gap has closed. Nobody has to rewrite anything for that to work.<\/p>\n<p>There is an obvious objection: a test script has no value until the thing exists, and stops being useful once somebody changes it. The answer is the one above. What the script is really for is marking the moment the behaviour changed, and it does that whether or not anyone is watching.<\/p>\n<p>The slow run pays for itself here. An agent working through a system by hand is slow and never exactly repeatable, and you carry that cost once in exchange for a test anyone can re-run in seconds.<\/p>\n<p>There is a quieter reason too. When you actually go and do the thing, a lot of detail appears and the whole question becomes concrete. You run the query and real records come back. Now you can say that this is what you wanted, or that something you needed is missing. Writing the confirmation test forces that moment, because a claim you have not really pinned down is hard to write a passing test for.<\/p>\n<h2 id=\"what-qualification-requires\"><span>What qualification requires<\/span><a class=\"h-anchor\" href=\"#/09-qualify-what-you-found/what-qualification-requires\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Both of the following are required.<\/p>\n<p><strong>A raw-finding anchor.<\/strong> A pointer to the specific observation inside a specific run&#39;s <code>raw-findings.md<\/code>. This is what ties the claim back to the attempt that produced it. The procedure below shows one. See also <a href=\"#/07-pull-knowledge-out-of-it\">Pull knowledge out of it<\/a>, which explains what an anchor is and how to write one.<\/p>\n<p><strong>A confirmation test.<\/strong> A deterministic, repeatable procedure that reaches a pass. The contract is blunt about what does not count. A one-off observation, unrepeatable evidence and intuition all fail it. The test has to be specific enough that somebody else, later, can run it and reach the same conclusion.<\/p>\n<p>A finding also has a <strong>polarity<\/strong>. <code>positive<\/code> means the test confirms something is there. <code>negative<\/code> means the test confirms something reliably is not there, or reliably fails. A run that produces a negative finding has succeeded.<\/p>\n<p>Negative findings qualify only when the test asserts the negative and passes. &quot;I could not find it&quot; fails that bar. &quot;This procedure, run in this order, reliably produces no result at this step&quot; clears it.<\/p>\n<h2 id=\"procedure-qualify-a-finding\"><span>Procedure · Qualify a finding<\/span><a class=\"h-anchor\" href=\"#/09-qualify-what-you-found/procedure-qualify-a-finding\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ol>\n<li><p>Open <code>workspace/runs/RUN-NNN/raw-findings.md<\/code> and find the observation you want to pursue. Note its anchor.<\/p>\n<p>Here is what you are looking at. The run command wrote this file, and it gave every observation you passed it a numbered heading:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code># Raw Findings for RUN-001\n\n## Raw Finding 1 {#raw-finding-1}\n\nThe hold screen showed no pickup notice for any of the three book copies tried.\n\n## Raw Finding 2 {#raw-finding-2}\n\nThe copy list was slow to load on the third attempt.\n<\/code><\/pre><\/div>\n<p>The part in curly braces is the <strong>anchor<\/strong>: the label you use to point at one heading inside a Markdown file. Here the anchors are <code>#raw-finding-1<\/code> and <code>#raw-finding-2<\/code>. The tool numbers them in the order you passed the <code>--raw-finding<\/code> files, so the first file you named is Raw Finding 1. <a href=\"#/07-pull-knowledge-out-of-it\">Pull knowledge out of it<\/a> explains anchors in general, including the ones you write by hand.<\/p>\n<\/li>\n<li><p>Write the confirmation test. It must reproduce the observation on demand. Nothing in BuildOS writes this for you.<\/p>\n<\/li>\n<li><p>Run it yourself and keep what it produces. That output is your confirmation evidence.<\/p>\n<\/li>\n<li><p>Build the reference. <code>--raw-finding-ref<\/code> takes a path, then <code>#<\/code>, then the anchor. For Raw Finding 1 in the file above, the path is <code>workspace/runs/RUN-001/raw-findings.md<\/code> and the anchor is <code>#raw-finding-1<\/code>, so the argument is:<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>--raw-finding-ref workspace/runs/RUN-001/raw-findings.md#raw-finding-1\n<\/code><\/pre><\/div>\n<p>Two shorter forms work as well, because the command already knows the run from <code>--run-id<\/code>: <code>--raw-finding-ref raw-findings.md#raw-finding-1<\/code>, and just <code>--raw-finding-ref &#39;#raw-finding-1&#39;<\/code>. The command checks that the anchor exists in the file and stops if it does not.<\/p>\n<\/li>\n<li><p>Run the qualify command.<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>.os/scripts/buildos discovery qualify finding --run-id RUN-001 --raw-finding-ref workspace/runs/RUN-001/raw-findings.md#raw-finding-1 --outcome negative --title &quot;No pickup notice appears on a hold&quot; --confirmation-test tests/hold-pickup-notice.spec.ts --confirmation-evidence tests/output/hold-pickup-notice.txt\n<\/code><\/pre><\/div>\n<p><code>--outcome<\/code> is <code>positive<\/code> or <code>negative<\/code> here. There is no <code>inconclusive<\/code>, because an inconclusive result never becomes a qualified finding. Add <code>--dry-run<\/code> to see what it would write without writing anything.<\/p>\n<\/li>\n<li><p>Read what it wrote. Open the new folder under <code>workspace/findings/<\/code> and check that <code>qualification.md<\/code> describes a test you would be happy for a stranger to run.<\/p>\n<\/li>\n<\/ol>\n<h2 id=\"what-lands-on-disk\"><span>What lands on disk<\/span><a class=\"h-anchor\" href=\"#/09-qualify-what-you-found/what-lands-on-disk\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>One qualified finding produces one folder plus one line in an index file.<\/p>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>workspace/findings/FIND-001/\n    finding.md\n    qualification.md\n<\/code><\/pre><\/div>\n<p><strong><code>finding.md<\/code><\/strong> is the record itself. It carries the <code>FIND-NNN<\/code> ID, a title, <code>status<\/code>, <code>polarity<\/code>, the <code>origin_run<\/code> it came from, the <code>raw_anchor<\/code> pointing back into that run&#39;s raw findings, a link to the qualification test, the three scoped lists (<code>systems<\/code>, <code>environments<\/code>, <code>owners<\/code>), the timestamp it qualified at, and two lists of links: designs and related records.<\/p>\n<p><code>status<\/code> is <code>qualified<\/code>, <code>designed<\/code> or <code>archived<\/code>. <code>qualified<\/code> is where every finding starts.<\/p>\n<p><strong><code>qualification.md<\/code><\/strong> is the test. It must record five things:<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>What it holds<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>test_type<\/code><\/td>\n<td>What kind of test this is.<\/td>\n<\/tr>\n<tr>\n<td><code>procedure<\/code><\/td>\n<td>The exact repeatable path: the steps or the command.<\/td>\n<\/tr>\n<tr>\n<td><code>assertion<\/code><\/td>\n<td>What must be true for the finding to qualify.<\/td>\n<\/tr>\n<tr>\n<td><code>result<\/code><\/td>\n<td>Must be <code>pass<\/code>. A qualified finding requires a passing confirmation.<\/td>\n<\/tr>\n<tr>\n<td><code>evidence<\/code><\/td>\n<td>Links to the run&#39;s frozen evidence, or to the confirmation evidence.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>One row in <code>.os/data/findings.jsonl<\/code>.<\/strong> This is the structured index of findings. The same command writes both the folder and the row, with <code>status: &quot;qualified&quot;<\/code>.<\/p>\n<p>The qualification links back to the run&#39;s evidence and leaves the run itself untouched. Run records are immutable once closed, and qualifying a finding does not change that.<\/p>\n<p>Read <code>finding.md<\/code> and <code>qualification.md<\/code> directly. Do not try to read <code>findings.jsonl<\/code> by opening it. It holds one record per line with no line breaks inside a record, which suits a program and defeats a person. An editor may refuse to open one because the line is too long. When you want to see what is in there, ask your agent for a table.<\/p>\n<p>Moving a finding into a design is a separate step that a person decides. See <a href=\"#/12-designs-plans-and-prds\">Designs, plans and PRDs<\/a>.<\/p>\n<h2 id=\"a-mismatch-between-the-contract-and-the-tool\"><span>A mismatch between the contract and the tool<\/span><a class=\"h-anchor\" href=\"#/09-qualify-what-you-found/a-mismatch-between-the-contract-and-the-tool\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The contract and the shipped tool disagree about what a confirmation test may be, and you should know which one you are dealing with.<\/p>\n<p>The contract at <code>.os/contracts/finding-contract.md<\/code> is deliberately open. It defines <code>test_type<\/code> as a command, a manual procedure, a harness, a script, or any other deterministic method. By that definition a written procedure that anyone can follow and get the same answer is a legitimate confirmation test.<\/p>\n<p>The shipped tool is stricter. The <code>--confirmation-test<\/code> flag on <code>buildos discovery qualify finding<\/code> describes its argument as a deterministic browser-test file in one specific test technology. That is narrower than the contract allows.<\/p>\n<p>If your confirmation test is a browser test in the technology the tool expects, the command works as written. If your test is a command, a script in another language, or a written manual procedure, the contract is on your side. Use the command anyway, pass the file that holds your procedure, and describe the real <code>test_type<\/code> accurately in <code>qualification.md<\/code>. Do not misrepresent a manual procedure as an automated one to satisfy a flag.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>Nothing in BuildOS generates a confirmation test for you. There is no command, no template, and no defined place for test files to live. The three folders under <code>workspace/<\/code> are <code>runs/<\/code>, <code>findings/<\/code> and <code>datasets/<\/code>. There is no <code>tests/<\/code>. You write the test, you choose where it lives, and you pass its path to the qualify command as an argument. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p>In practice teams have done this two ways. In the first, a person performs the job by hand, writes down each step as they confirm it, and then writes the script from those confirmed steps. In the second, the agent writes the script while it performs the run, capturing a screenshot at each screen change. That one is faster and needs more checking, and both of them produce usable tests.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Confirmation tests need maintenance. Browser tests identify elements on a screen, and those identifiers change when the screen changes. The identifiers are not always captured reliably, and there comes a point where fixing the test costs more than testing by hand. Treat a confirmation test as something you own and maintain over time.<\/p>\n<\/div><\/aside>\n<h2 id=\"what-happens-to-a-finding-you-cannot-prove\"><span>What happens to a finding you cannot prove<\/span><a class=\"h-anchor\" href=\"#/09-qualify-what-you-found/what-happens-to-a-finding-you-cannot-prove\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Some findings cannot be qualified at all, and the contract does not acknowledge this.<\/p>\n<p>Consider a mismatch between the way a library lending system assumes copies are shared between branches and the way the library actually shelves them. Nothing in the software is broken. No repeatable test can prove a mismatch of that kind, because there is nothing to reproduce.<\/p>\n<p>An observation like that can matter more than anything else you found, and it still cannot pass the gate.<\/p>\n<p>Three things to do with one.<\/p>\n<p><strong>Leave it where it is.<\/strong> A raw finding that cannot be qualified stays as an anchor in its run&#39;s <code>raw-findings.md<\/code>. That file is part of an immutable run record. The observation is on disk, dated, attributed to a run, and readable by anyone who opens the folder.<\/p>\n<p><strong>Do not force it through.<\/strong> Do not write a test that proves something adjacent and attach it to a claim it does not support. A qualified finding whose test does not actually prove the claim carries an ID that makes it look settled, which is the opposite of what you want.<\/p>\n<p><strong>Carry it forward as its own thing.<\/strong> An observation about how a system is shaped, rather than how it behaves, usually belongs in a design document as a stated constraint, or in a comparison against a model of how the business works. See <a href=\"#/10-compare-two-systems\">Compare two systems<\/a>.<\/p>\n<p>Be aware of the consequence when your findings come from reading rather than from running. A gap list produced by comparing documents is a list of raw findings, all the way down. U

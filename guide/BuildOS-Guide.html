od?&quot;, it has not written anything yet.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>These runs are long and they will outlast your meeting. A plan for a small piece of work can take several minutes. A full plan-and-backlog run can take most of a day. Kick one off well ahead of the discussion where you want to talk about the result.<\/p>\n<\/div><\/aside>\n<h3 id=\"a-worked-example-1\"><span>A worked example<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/a-worked-example-1\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Continuing the renewal decision, you ask for a change plan and you give it coordinates: wave 2, revision 0.<\/p>\n<p>You get <code>docs/plans/2026-03-02-w2-r0-renewal-fine-recalculation/<\/code> holding <code>00-overview.md<\/code> and three phase files. The overview&#39;s <code>## Coordinate Decision<\/code> says <code>Coordinate: W2 R0<\/code>, <code>Classification: new-wave<\/code>, and gives the evidence for that choice. <code>## Phase Map<\/code> is a table of the three phase files with a line each. <code>## Dependencies<\/code> names the fine calculation work that has to land first. <code>## Validation<\/code> says the plan is complete when the owning requirements documents say what renewal now does and the delta backlog exists.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>A generated plan will happily open a brand-new wave directory for what is actually a correction to work you already planned. Send it back. A correction belongs inside the existing plan directory as a revision. Nothing enforces this, so you have to catch it yourself.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>The agent invents column names. A generated plan can use a heading such as &quot;Owned IDs&quot; that stops a reader cold and turns out to mean capability IDs. When a heading in generated output does not mean anything to you, ask what it means before you accept the document. Usually it is a fresh name for something you already had a name for.<\/p>\n<\/div><\/aside>\n<h2 id=\"requirements-documents\"><span>Requirements documents<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/requirements-documents\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<h3 id=\"the-set-shape\"><span>The set shape<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/the-set-shape\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>There is one active requirements set at a time. It lives flat in <code>docs/prd/<\/code> as <code>NN-&lt;slug&gt;.md<\/code> files.<\/p>\n<p>The set has a <strong>fixed core<\/strong> that is always the same five documents, and an <strong>adaptive middle<\/strong> that grows with the product.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Number<\/th>\n<th>File<\/th>\n<th>What it is for<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>00<\/code><\/td>\n<td><code>00-index.md<\/code><\/td>\n<td>The map. Reading order, a document map, and the paths for different audiences.<\/td>\n<\/tr>\n<tr>\n<td><code>01<\/code><\/td>\n<td><code>01-product-overview.md<\/code><\/td>\n<td>Users, key capabilities, system boundaries, current limitations.<\/td>\n<\/tr>\n<tr>\n<td><code>02<\/code><\/td>\n<td><code>02-architecture-overview.md<\/code><\/td>\n<td>Topology, module map, runtime boundaries, data flow, configuration surfaces.<\/td>\n<\/tr>\n<tr>\n<td><code>03<\/code><\/td>\n<td><code>03-open-questions-and-risk-register.md<\/code><\/td>\n<td>The living register: confirmed drift, open questions, rebuild risks.<\/td>\n<\/tr>\n<tr>\n<td><code>04<\/code><\/td>\n<td><code>04-glossary.md<\/code><\/td>\n<td>The vocabulary of the product being described.<\/td>\n<\/tr>\n<tr>\n<td><code>05<\/code>–<code>99<\/code><\/td>\n<td>your own<\/td>\n<td>Subsystem documents and reference documents, each named for a part of the product.<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Numbers <code>05<\/code> through <code>99<\/code> are yours. Keep the tree flat by default: the <code>NN-<\/code> numbers carry the reading order, and a flat directory shows all of them in one listing. Move a subsystem into a numbered subfolder only when one document is genuinely too big to read.<\/p>\n<p>People miss the risk register at <code>03<\/code>, which is where gaps, open questions and decisions all live. Items are numbered <code>D-001<\/code> for confirmed drift, <code>Q-001<\/code> for open questions and <code>R-001<\/code> for rebuild risks, each with a status of <code>Open<\/code>, <code>Confirming<\/code>, <code>Deferred<\/code> or <code>Closed<\/code>. You never renumber an item, even when it closes. Use that register rather than creating a separate questions file or decisions file next to it.<\/p>\n<h3 id=\"why-the-documents-are-short\"><span>Why the documents are short<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/why-the-documents-are-short\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>Every requirements document is deliberately thin, and every one carries a <code>## Source Anchors<\/code> section pointing outward at the material it came from.<\/p>\n<p>The reason is practical. The set is meant to be the authority on what the product is, but it also has to fit in an agent&#39;s working memory. Keeping each document lean means the agent can hold it in context and pull the exact reference out of another document when its attention lands there. A dense, self-contained specification would defeat that.<\/p>\n<p>A human reader gets the same benefit a bibliography gives, with short claims and the evidence one link away.<\/p>\n<h3 id=\"generating-the-set\"><span>Generating the set<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/generating-the-set\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<ol>\n<li>Commit first. Everything about to happen is a large write.<\/li>\n<li>Tell your agent to generate the requirements set from the accumulated material, meaning the extracted records, the designs, and the plan if you have one.<\/li>\n<li>Watch it work, and interrupt if you need to. Interrupting halfway through to ask it to call out what is already implemented works.<\/li>\n<li>Spot-check the result before you build anything on it. Open the glossary first to see whether the vocabulary was captured at all, then open one substantive document and read one table row carefully. Read <a href=\"#/15-working-with-your-agent/the-review-sweep\">The review sweep<\/a> in <a href=\"#/15-working-with-your-agent\">Working with your agent<\/a> before you start this step.<\/li>\n<\/ol>\n<h3 id=\"a-worked-example-2\"><span>A worked example<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/a-worked-example-2\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>For the library lending system, the adaptive middle might open with <code>05-loans-and-renewals.md<\/code>, <code>06-copy-availability.md<\/code>, <code>07-fines-and-payments.md<\/code>. Each uses <code>.make-docs/system/templates/prd-subsystem.md<\/code> and so carries <code>## Purpose<\/code>, <code>## Scope<\/code>, <code>## Component and Capability Map<\/code>, <code>## Contracts and Data<\/code>, <code>## Integrations<\/code>, <code>## Rebuild Notes<\/code>, an optional <code>## Requirement History<\/code>, and <code>## Source Anchors<\/code>.<\/p>\n<p>Then the renewal decision arrives. <code>07-fines-and-payments.md<\/code> owns fines, so its current text changes to say that renewal recalculates the fine, and a dated entry under its <code>## Requirement History<\/code> keeps what it said before. No new document is named for the change.<\/p>\n<p>The next section describes this properly.<\/p>\n<h2 id=\"you-can-work-in-either-order\"><span>You can work in either order<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/you-can-work-in-either-order\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The canonical order is design, then plan, then requirements set.<\/p>\n<p>Running it the other way round is sometimes the right call. If a substantial body of capability records already exists from earlier extraction work, generating a plan first would orphan them, so the requirements set comes first and the plans are derived from it.<\/p>\n<p>Deriving a plan from an existing requirements set is a supported case. The <code>plan-prd-decompose.md<\/code> template exists for exactly this shape of work.<\/p>\n<p>Use these criteria to choose.<\/p>\n<p><strong>Go design → plan → requirements set when<\/strong> you are starting from a decision and little else, or the product is new, or the material you have is thin. The design gives the plan its scope and the plan gives the requirements set its structure.<\/p>\n<p><strong>Go requirements set → plan when<\/strong> you already hold a substantial body of extracted records that a fresh start would strand, or the product already exists and you are documenting what is there before you change it. State the completeness constraint out loud when you ask, along the lines of &quot;do not leave any of the existing capability records unaccounted for&quot;, because that is the sentence that stops records being silently dropped.<\/p>\n<p>Either way, the ordering is your judgement call. Nothing in BuildOS checks the order you worked in.<\/p>\n<h2 id=\"changing-a-set-that-is-already-in-use\"><span>Changing a set that is already in use<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/changing-a-set-that-is-already-in-use\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Once other people are working from a requirements set, editing it casually breaks things. Somebody is reading document <code>07<\/code> while you edit it, and a backlog task points at a row you are about to delete.<\/p>\n<p>Make Docs 2.0.9 has one rule for this, in <code>.make-docs/system/references/prd-change-management.md<\/code>: <code>docs/prd/<\/code> describes the current shape of the product, and never the editing operation that changed it. So a change goes into the document that owns the subject, and the old wording is kept in that document&#39;s history.<\/p>\n<h3 id=\"the-rules\"><span>The rules<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/the-rules\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>From <code>.make-docs/system/references/prd-change-management.md<\/code>:<\/p>\n<ul>\n<li>Give every candidate change one decision: <code>update-existing<\/code> (a document already owns the subject: change its current text), <code>create<\/code> (a new part of the product with no owner yet: a new numbered document named for that part), <code>link-only<\/code> (the text is right, but a link or the index needs a pointer), or <code>none<\/code> (the set already covers it: record why in the plan or a history record).<\/li>\n<li>Put the current requirement in the owning section. A reader must not have to follow a history link to learn what the product requires now.<\/li>\n<li>Keep the text, anchors, and links that the change does not touch. Do not renumber documents.<\/li>\n<li>Never name a document for an editing action. Names such as <code>08-revise-renewal-fines.md<\/code> or &quot;Addition: ...&quot; are not allowed.<\/li>\n<li>When the old requirement matters for later readers, add a dated entry under <code>## Requirement History<\/code> in the same document, after the current sections and before <code>## Source Anchors<\/code>. Each entry records the date, the coordinate, the affected section, the previous contract, the replacement contract, the reason, and a source link.<\/li>\n<li>Update <code>03-open-questions-and-risk-register.md<\/code> directly for anything the change discovered or resolved.<\/li>\n<\/ul>\n<h3 id=\"where-superseded-sets-go\"><span>Where superseded sets go<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/where-superseded-sets-go\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>When you replace a whole set rather than evolve it, the old set moves to <code>.make-docs/archive/prds/YYYY-MM-DD/<\/code>. If that dated directory already exists, add a zero-padded increment: <code>.make-docs/archive/prds/YYYY-MM-DD-01/<\/code>. The <code>.make-docs/archive/<\/code> folder does not exist until something is archived; Make Docs creates it (<code>make-docs project surface ensure archive<\/code>), and its own router there holds the archive rules.<\/p>\n<p>The archive rules also say the agent must summarise the existing set and ask for your explicit approval before moving anything. Give that approval consciously.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Do not copy the old set into a <code>backup/<\/code> folder inside the repository, however natural the instinct feels. A sibling <code>backup/<\/code> directory silently breaks the one-active-set rule, and your agent will search it and reason over dead documents. Archive the set to the path above, or delete it and recover it from git.<\/p>\n<\/div><\/aside>\n<h3 id=\"deciding-what-an-incoming-document-is\"><span>Deciding what an incoming document is<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/deciding-what-an-incoming-document-is\" aria-label=\"Link to this section\">#<\/a><\/h3>\n<p>One more judgement call lives here. When a subject-matter expert hands you a requirements document, you have to decide whether it is new source material for extraction or a change request against what you already know.<\/p>\n<p>Routing such a document to the change-management side is often right, because planning against the existing set beats minting a pile of new requirements from it.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>No router, contract or tool makes this decision for you. It is a human judgement and it is written down nowhere in the shipped system. Make it consciously and say which choice you made, because the two paths produce very different work.<\/p>\n<\/div><\/aside>\n<h2 id=\"the-templates-and-the-prompt-starters\"><span>The templates and the prompt starters<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/the-templates-and-the-prompt-starters\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Everything above is governed by files that ship with the system. Knowing where they are makes the rest of the chapter usable.<\/p>\n<p><strong>The authority<\/strong> is in <code>.make-docs/system/contracts/<\/code> (rules) and <code>.make-docs/system/references/<\/code> (workflows). The ones that matter here:<\/p>\n<ul>\n<li><code>contracts/design-contract.md<\/code> and <code>references/design-workflow.md<\/code>, the design&#39;s required shape and how to write it<\/li>\n<li><code>references/planning-workflow.md<\/code>, what a plan must settle before it is finished<\/li>\n<li><code>contracts/output-contract.md<\/code>, the requirements tree, the fixed core, the section contracts, and the required paths<\/li>\n<li><code>references/prd-change-management.md<\/code>, the change rules above<\/li>\n<li><code>references/wave-model.md<\/code>, what wave, revision and phase mean<\/li>\n<\/ul>\n<p><strong>The starting shapes<\/strong> live in <code>.make-docs/system/templates/<\/code>. Nineteen templates ship, plus the folder&#39;s router files. The ones this article uses: <code>design.md<\/code>, <code>plan-overview.md<\/code>, <code>plan-prd.md<\/code>, <code>plan-prd-decompose.md<\/code>, <code>plan-prd-change.md<\/code>, <code>prd-index.md<\/code>, <code>prd-overview.md<\/code>, <code>prd-architecture.md<\/code>, <code>prd-risk-register.md<\/code>, <code>prd-glossary.md<\/code>, <code>prd-subsystem.md<\/code>, <code>prd-reference.md<\/code>.<\/p>\n<p><strong>The prompt starters<\/strong> live in <code>.make-docs/system/prompts/<\/code>. Twenty ship, plus the folder&#39;s router files. The ones this article uses: <code>request-to-design.prompt.md<\/code>, <code>designs-to-plan.prompt.md<\/code>, <code>designs-to-plan-change.prompt.md<\/code>, <code>plan-to-prd-green-field.prompt.md<\/code>, <code>plan-to-prd-change.prompt.md<\/code>.<\/p>\n<p>Be clear about the difference in authority. Prompts are optional starters rather than authority. A template is a convenience in the same way. <strong>A contract is the rule book for one document type: what sections are required and what states the document can be in.<\/strong> When a template and a contract disagree, the contract wins. And when your organisation genuinely does not want a section, change the convention. The repository belongs to you.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>These files name each other by their path from your project root, such as <code>.make-docs/system/references/wave-model.md<\/code>, or by a <code>make-docs://<\/code> address. A path from the project root is correct as written. Do not edit these files to fix a link: Make Docs manages them.<\/p>\n<\/div><\/aside>\n<h2 id=\"reviewing-what-came-back\"><span>Reviewing what came back<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/reviewing-what-came-back\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Everything in this article is generated prose. Expect it to come back structurally right and substantively wrong, with errors that run through the whole set rather than sitting in one place.<\/p>\n<p>The sweep described in <a href=\"#/10-compare-two-systems\">Compare two systems<\/a> starts from a single contradictory row in a generated requirements set, which is the same material this article produces.<\/p>\n<p>The full review procedure is the section called <em>The review sweep<\/em> in <a href=\"#/15-working-with-your-agent/the-review-sweep\">Working with your agent<\/a>. Read it before you accept a generated set.<\/p>\n<h2 id=\"what-you-should-have-now\"><span>What you should have now<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/what-you-should-have-now\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>A dated design at <code>docs/designs/YYYY-MM-DD-&lt;slug&gt;.md<\/code> with its frontmatter and every required section, including a route in <code>## Intended Follow-On<\/code><\/li>\n<li>A plan directory at <code>docs/plans/YYYY-MM-DD-w{W}-r{R}-&lt;slug&gt;/<\/code> holding <code>00-overview.md<\/code> and one file per phase<\/li>\n<li>An active requirements set in <code>docs/prd/<\/code> with the five fixed-core documents present and numbered correctly<\/li>\n<li>A decision, made consciously, about which order you worked in and why<\/li>\n<li>A way to change the set later in the document that owns each subject, with its history kept, and a place to put a set you replace<\/li>\n<li>Knowledge of which of the above is tooled (one command, <code>buildos design promote finding<\/code>, which needs Make Docs) and which is you and your agent writing against contracts (all the rest)<\/li>\n<\/ul>\n<h2 id=\"next\"><span>Next<\/span><a class=\"h-anchor\" href=\"#/12-designs-plans-and-prds/next\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><a href=\"#/13-build-the-work-backlog\">Build the work backlog<\/a> turns the requirements set and the plan into work items a delivery team can pick up.<\/p>\n","toc":[{"id":"what-you-need-first","text":"What you need first","level":2},{"id":"the-chain","text":"The chain","level":2},{"id":"there-is-no-tooling-in-this-article","text":"There is no tooling in this article","level":2},{"id":"the-design","text":"The design","level":2},{"id":"what-it-is-and-when-you-write-one","text":"What it is and when you write one","level":3},{"id":"where-it-lives-and-what-it-looks-like","text":"Where it lives and what it looks like","level":3},{"id":"a-worked-example","text":"A worked example","level":3},{"id":"promotion-from-a-finding","text":"Promotion from a finding","level":3},{"id":"the-plan","text":"The plan","level":2},{"id":"what-it-is-and-what-it-holds","text":"What it is and what it holds","level":3},{"id":"coordinates","text":"Coordinates","level":3},{"id":"writing-one","text":"Writing one","level":3},{"id":"a-worked-example-1","text":"A worked example","level":3},{"id":"requirements-documents","text":"Requirements documents","level":2},{"id":"the-set-shape","text":"The set shape","level":3},{"id":"why-the-documents-are-short","text":"Why the documents are short","level":3},{"id":"generating-the-set","text":"Generating the set","level":3},{"id":"a-worked-example-2","text":"A worked example","level":3},{"id":"you-can-work-in-either-order","text":"You can work in either order","level":2},{"id":"changing-a-set-that-is-already-in-use","text":"Changing a set that is already in use","level":2},{"id":"the-rules","text":"The rules","level":3},{"id":"where-superseded-sets-go","text":"Where superseded sets go","level":3},{"id":"deciding-what-an-incoming-document-is","text":"Deciding what an incoming document is","level":3},{"id":"the-templates-and-the-prompt-starters","text":"The templates and the prompt starters","level":2},{"id":"reviewing-what-came-back","text":"Reviewing what came back","level":2},{"id":"what-you-should-have-now","text":"What you should have now","level":2},{"id":"next","text":"Next","level":2}]},"13-build-the-work-backlog":{"slug":"13-build-the-work-backlog","num":"13","title":"Build the work backlog","lede":"This page turns your requirements set and your plan into work items a delivery team can pick up.","html":"<h2 id=\"what-you-need-first\"><span>What you need first<\/span><a class=\"h-anchor\" href=\"#/13-build-the-work-backlog/what-you-need-first\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Read <a href=\"#/12-designs-plans-and-prds\">Designs, plans and PRDs<\/a> first. This page assumes it.<\/p>\n<p>You need an active requirements set in <code>docs/prd/<\/code> and a plan directory in <code>docs/plans/<\/code>. The backlog is generated from the two together.<\/p>\n<h2 id=\"what-the-backlog-is-and-how-it-differs-from-the-plan\"><span>What the backlog is, and how it differs from the plan<\/span><a class=\"h-anchor\" href=\"#/13-build-the-work-backlog/what-the-backlog-is-and-how-it-differs-from-the-plan\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A <strong>work backlog<\/strong> is a directory of phase files. Each phase holds stages, and each stage holds checkbox tasks with acceptance criteria.<\/p>\n<p>The plan and the backlog look similar and people confuse them constantly. A useful way to hold the difference: <strong>the plan is the charter, and the backlog has a lot of phases that simply do not exist in the plan.<\/strong><\/p>\n<p>Make that concrete. A plan phase might read &quot;build the renewal fine recalculation in the library lending system, validate it against the business platform underneath, then release it to every branch.&quot; That is one line of a charter, and nobody can start work from it on Monday morning.<\/p>\n<p>The backlog takes that line and produces phases the plan never named: a data migration phase, a test-fixture phase, a permissions phase for the tester&#39;s role, a phase for the reporting change nobody thought about until the fine calculation moved. Where the plan gives you the shape of the work, the backlog gives you the work itself.<\/p>\n<p>Audience is the other way to hold the difference. A plan is written for people who need to agree that the shape is right, and a backlog is written for whoever picks up the next task, human or otherwise. That is why the plan&#39;s entry point is called an overview and the backlog&#39;s is called an index. You read one and you search the other.<\/p>\n<h2 id=\"where-it-lives\"><span>Where it lives<\/span><a class=\"h-anchor\" href=\"#/13-build-the-work-backlog/where-it-lives\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<div class=\"code-block\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code>docs/work/YYYY-MM-DD-w{W}-r{R}-&lt;slug&gt;/\n├── 00-index.md\n├── 01-&lt;phase&gt;.md\n├── 02-&lt;phase&gt;.md\n└── ...\n<\/code><\/pre><\/div>\n<p><code>w{W}-r{R}<\/code> is the wave and revision coordinate from <a href=\"#/12-designs-plans-and-prds\">Designs, plans and PRDs<\/a>, which backlogs carry and requirements sets and designs do not.<\/p>\n<p><code>00-index.md<\/code> holds three sections: <code>## Purpose<\/code>, <code>## Phase Map<\/code>, <code>## Usage Notes<\/code>. The phase map is a table linking each phase file with one line about it.<\/p>\n<p>Each <code>0N-&lt;phase&gt;.md<\/code> file holds <code>## Purpose<\/code>, <code>## Overview<\/code>, <code>## Source PRD Docs<\/code>, and then one or more <code>## Stage N - Name<\/code> sections. Every phase file must carry <code>## Source PRD Docs<\/code>, linking back to the requirements documents it implements, which is the link that keeps the backlog traceable.<\/p>\n<p>Order the phases by dependency rather than by whatever is convenient to build first.<\/p>\n<p>When you are adding to a requirements set that is already in use rather than building a whole set, leave the earlier backlog alone and write a dated delta backlog with a distinguishing slug, such as <code>2026-03-02-w2-r0-renewal-fine-recalculation-delta<\/code>.<\/p>\n<h2 id=\"the-shape-of-a-work-item\"><span>The shape of a work item<\/span><a class=\"h-anchor\" href=\"#/13-build-the-work-backlog/the-shape-of-a-work-item\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Inside each stage:<\/p>\n<div class=\"code-block\" data-lang=\"markdown\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-markdown\">## Stage 2 - Recalculate charge at return\n\n### Tasks\n\n- [ ] t4: Add a recalculation step to the return handler\n- [ ] t5: Write the superseded charge line rather than overwriting the original\n\n### Acceptance criteria\n\n- Returning a contract early produces a new charge line and leaves the original visible\n- The invoice total matches the recalculated charge on the same day the return is recorded\n\n### Dependencies\n\n- Stage 1 complete\n<\/code><\/pre><\/div>\n<p>The rules that govern that block:<\/p>\n<ul>\n<li>Tasks are Markdown task-list items with a phase-local ID: <code>- [ ] t1:<\/code> for open work, <code>- [x] t1:<\/code> for done.<\/li>\n<li>Task IDs start at <code>t1<\/code> in each phase file and keep counting across every stage in that file. Do not restart the numbering in a later stage.<\/li>\n<li>Never renumber an existing task ID, even when you insert or complete work around it.<\/li>\n<li>Acceptance criteria are always plain bullets, with no checkboxes and no <code>t<\/code> labels.<\/li>\n<\/ul>\n<p>Because the IDs are phase-local, a single task has a full address anywhere in the system: <code>w2 r0 p2 t4<\/code>. That is how something outside the backlog points at one specific piece of work.<\/p>\n<p>Adopt one extra convention and prefix every task that carries a capability with its capability ID. It keeps the backlog searchable when you come back to it in three months and want to know where <code>CAP-042<\/code> ended up.<\/p>\n<p>A good work item has a task line that names an outcome and acceptance criteria that could be handed to the tester without further explanation. Every dependency it has appears under <code>### Dependencies<\/code>.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Agents skip the checkbox convention. Plain bullets instead of <code>- [ ] t1:<\/code> will import as tasks that nothing can tick off and that nothing can address by ID. Open one phase file and look at the raw Markdown before you accept the backlog.<\/p>\n<\/div><\/aside>\n<h2 id=\"the-hierarchy-and-how-it-maps-to-a-work-tracker\"><span>The hierarchy, and how it maps to a work tracker<\/span><a class=\"h-anchor\" href=\"#/13-build-the-work-backlog/the-hierarchy-and-how-it-maps-to-a-work-tracker\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Four levels, and they line up with what most work trackers expect.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>BuildOS level<\/th>\n<th>Where it lives<\/th>\n<th>Typical tracker level<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>The work directory<\/td>\n<td><code>docs/work/YYYY-MM-DD-w{W}-r{R}-&lt;slug&gt;/<\/code><\/td>\n<td>Epic<\/td>\n<\/tr>\n<tr>\n<td>A phase file<\/td>\n<td><code>0N-&lt;phase&gt;.md<\/code><\/td>\n<td>Feature<\/td>\n<\/tr>\n<tr>\n<td>A stage<\/td>\n<td><code>## Stage N - Name<\/code><\/td>\n<td>Product backlog item<\/td>\n<\/tr>\n<tr>\n<td>A task<\/td>\n<td><code>- [ ] t1: ...<\/code><\/td>\n<td>Task<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>That mapping is the reason the folder structure looks the way it does. Treat <code>docs/<\/code> as a document-based version of a work tracker. The directory is the epic, the files in it are the features, the stages inside each file are the backlog items, and the tasks are what somebody does to deliver each one.<\/p>\n<p>The export covered in <a href=\"#/14-export-to-a-work-tracker\">Export to a work tracker<\/a> emits the first three levels by default and holds the fourth in reserve.<\/p>\n<h2 id=\"building-it\"><span>Building it<\/span><a class=\"h-anchor\" href=\"#/13-build-the-work-backlog/building-it\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ol>\n<li><strong>Commit first.<\/strong> This is a large write and you want a clean point to return to.<\/li>\n<li>Make sure the plan directory exists for the requirements documents you are about to work from. The backlog is generated from the requirements set <strong>and<\/strong> the plan together.<\/li>\n<li>Ask your agent to generate the work backlog from both. Name the requirements documents and name the plan directory.<\/li>\n<li><strong>State the completeness constraint out loud.<\/strong> Include a sentence like &quot;do not leave any of the existing capability records orphaned.&quot; Leave it out and records go missing without anything reporting it.<\/li>\n<li>Say you want the capability ID prefixed on every capability-bearing task. That prefix is what lets you search the backlog months later and find where a given capability ended up.<\/li>\n<li>Read one phase file when it comes back. It should carry its prerequisites, the capabilities it owns, and who the work is for.<\/li>\n<\/ol>\n<p><code>.make-docs/system/prompts/<\/code> holds prompt starters for this step: <code>prd-to-work-full-prd.prompt.md<\/code> for a whole set, <code>prd-to-work-prd-feature.prompt.md<\/code> for one feature, and <code>prd-change-to-work.prompt.md<\/code> for a delta backlog against an active set. The templates are <code>.make-docs/system/templates/work-index.md<\/code> and <code>.make-docs/system/templates/work-phase.md<\/code>. Both are starting shapes. The authority is <code>.make-docs/system/contracts/output-contract.md<\/code>, in the section <code>## Work Phase Structure Rules<\/code>.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>Nothing in this article is automated. <code>docs/work/<\/code> ships empty apart from its router files, no command generates a backlog, and no validator checks one. This is you and your agent writing Markdown against a written contract. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>BuildOS&#39;s own governance leaks into your backlog. A generated task may read &quot;confirm the operating register, the BuildOS traceability guardrails&quot;, which has nothing to do with the product being built. Delete tasks about BuildOS from a backlog about your product.<\/p>\n<\/div><\/aside>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Test coverage will be thinner than the backlog implies. If relatively little test discovery has been done, the test tasks will overstate the evidence behind them. You can back-fill test cases later, but do not read a confident-looking test phase as proof that anyone examined the testing.<\/p>\n<\/div><\/aside>\n<h2 id=\"where-the-writing-goes-wrong\"><span>Where the writing goes wrong<\/span><a class=\"h-anchor\" href=\"#/13-build-the-work-backlog/where-the-writing-goes-wrong\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A generated backlog arrives structurally correct well before the wording is any good. Expect the same in your own output.<\/p>\n<p>Two defects turn up repeatedly.<\/p>\n<p><strong>Titles and descriptions that restate the task ID instead of the outcome.<\/strong> A generated backlog item may carry a description that only says to deliver a numbered task as the source backlog bounds it, which forces the reader to go and find the source backlog to learn what the item is. A description that points at another document has not yet said what the work is.<\/p>\n<p><strong>Traceability boilerplate where a description belongs.<\/strong> A use-case field reading &quot;Must remain traceable to the approved BuildOS task&quot; records governance instead of content, and leaves the item hung up on governance rather than explaining the work.<\/p>\n<p>Titles fail the same way. They come back long, carrying phase and task coordinates that belong in a trace field, and sometimes carrying an abbreviation the agent invented, such as <code>PRC<\/code>, that nobody can decode.<\/p>\n<p>One rule covers all of this. <strong>The title, the description and the acceptance criteria must all refer to the same outcome.<\/strong> If the title says one thing, the description points at another document, and the acceptance criteria describe a third thing, nobody can work from the item however well-formed it is.<\/p>\n<p>Nothing checks this. No validator, script or contract rule can, because it is a judgement about meaning that belongs to you and your agent. Fixing it is cheap, and you do it by prompt rather than by hand. Ask for shorter titles that lose the structural noise, and ask for descriptions that explain the work rather than trace it.<\/p>\n<p>Prefer a qualitative instruction to a hard character limit. &quot;These need to be short, because the detail belongs in the item, not the title&quot; works better than &quot;120 characters&quot;, because occasionally an item genuinely needs the room.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>If the backlog is organised wrong for its audience, ask for a rewrite. Do not reorganise it by hand. Work for two different platforms interleaved across every phase makes a platform-by-platform roadmap impossible to present, and a backlog that size is too many phases to restructure manually without introducing errors.<\/p>\n<\/div><\/aside>\n<h2 id=\"archiving-finished-work\"><span>Archiving finished work<\/span><a class=\"h-anchor\" href=\"#/13-build-the-work-backlog/archiving-finished-work\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>When a backlog is done, the intent is to move it out of the working tree, optionally along with its plan and design, so the tree shows only what is in flight.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>There is no command for this. Make Docs keeps archives under <code>.make-docs/archive/<\/code>, which it creates only when something is archived (<code>make-docs project surface ensure archive<\/code>), and its output contract says never to archive designs, plans, or work unless you ask. It writes down the rules for archiving a replaced requirements set, but no archive structure for finished backlogs. If you want it, describe the structure you want to your agent and check what it did. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<p>Whatever you do, do not solve this with a <code>backup/<\/code> folder inside the repository. That trap and the correct archive path are covered in <a href=\"#/12-designs-plans-and-prds\">Designs, plans and PRDs<\/a>.<\/p>\n<h2 id=\"what-you-should-have-now\"><span>What you should have now<\/span><a class=\"h-anchor\" href=\"#/13-build-the-work-backlog/what-you-should-have-now\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>A work directory at <code>docs/work/YYYY-MM-DD-w{W}-r{R}-&lt;slug&gt;/<\/code> holding <code>00-index.md<\/code> and one file per phase<\/li>\n<li>Phase files that each carry <code>## Source PRD Docs<\/code> linking back to the requirements set<\/li>\n<li>Stages containing <code>- [ ] t1:<\/code> style tasks, numbered per phase file and never restarted, with plain-bullet acceptance criteria beside them<\/li>\n<li>A backlog you have read, in which every item&#39;s title, description and acceptance criteria describe the same outcome<\/li>\n<li>No tasks about BuildOS itself in a backlog about your product<\/li>\n<\/ul>\n<h2 id=\"next\"><span>Next<\/span><a class=\"h-anchor\" href=\"#/13-build-the-work-backlog/next\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><a href=\"#/14-export-to-a-work-tracker\">Export to a work tracker<\/a> turns this directory into a file your delivery team&#39;s tracker can import.<\/p>\n","toc":[{"id":"what-you-need-first","text":"What you need first","level":2},{"id":"what-the-backlog-is-and-how-it-differs-from-the-plan","text":"What the backlog is, and how it differs from the plan","level":2},{"id":"where-it-lives","text":"Where it lives","level":2},{"id":"the-shape-of-a-work-item","text":"The shape of a work item","level":2},{"id":"the-hierarchy-and-how-it-maps-to-a-work-tracker","text":"The hierarchy, and how it maps to a work tracker","level":2},{"id":"building-it","text":"Building it","level":2},{"id":"where-the-writing-goes-wrong","text":"Where the writing goes wrong","level":2},{"id":"archiving-finished-work","text":"Archiving finished work","level":2},{"id":"what-you-should-have-now","text":"What you should have now","level":2},{"id":"next","text":"Next","level":2}]},"14-export-to-a-work-tracker":{"slug":"14-export-to-a-work-tracker","num":"14","title":"Export to a work tracker","lede":"This page turns your finished work backlog into a file your team&#39;s project-tracking tool can import, with the three-level hierarchy intact.","html":"<h2 id=\"what-you-need-first\"><span>What you need first<\/span><a class=\"h-anchor\" href=\"#/14-export-to-a-work-tracker/what-you-need-first\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Read <a href=\"#/13-build-the-work-backlog\">Build the work backlog<\/a> first. This page assumes it. You need one finished work backlog under <code>docs/work/<\/code>, an agent tool you can install a skill into, and Node.js 24 or newer on the machine that runs the export, which every BuildOS command needs.<\/p>\n<h2 id=\"where-the-exporter-lives\"><span>Where the exporter lives<\/span><a class=\"h-anchor\" href=\"#/14-export-to-a-work-tracker/where-the-exporter-lives\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>A <strong>skill<\/strong> is a packaged instruction set your agent tool can use. The exporter is a skill named <code>buildos-export-azure-boards<\/code>. It ships in the BuildOS package, and <code>buildos init<\/code> copies it into your project at <code>.os/skills/buildos-export-azure-boards/<\/code>, with every other BuildOS skill.<\/p>\n<p>The exporter is a companion piece. The BuildOS flow ends at the work backlog directory, and the export is a separate step. From BuildOS <code>0.2.0<\/code>, the skill runs the command <code>buildos export azure-boards<\/code> through the project wrapper, and you can run the same command yourself to check a file. In a project that pins BuildOS <code>0.1.0<\/code>, the skill runs its own Node.js script instead, with the same subcommands; its <code>SKILL.md<\/code> names it.<\/p>\n<p>Run every command in this article from your project root.<\/p>\n<h2 id=\"what-it-does\"><span>What it does<\/span><a class=\"h-anchor\" href=\"#/14-export-to-a-work-tracker/what-it-does\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The exporter reads one work backlog and writes one CSV file that a tracker can import. It preserves the shape of the backlog as a parent-child tree of work items. A <strong>work item<\/strong> is one row in a tracker: an epic, a feature, or a backlog item.<\/p>\n<p>The default mapping is fixed:<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>BuildOS source<\/th>\n<th>Tracker work item<\/th>\n<th>Title column<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>The work backlog directory<\/td>\n<td>Epic<\/td>\n<td><code>Title 1<\/code><\/td>\n<\/tr>\n<tr>\n<td>One phase file<\/td>\n<td>Feature<\/td>\n<td><code>Title 2<\/code><\/td>\n<\/tr>\n<tr>\n<td>One stage inside a phase file<\/td>\n<td>Product Backlog Item<\/td>\n<td><code>Title 3<\/code><\/td>\n<\/tr>\n<tr>\n<td>Reserved, not written<\/td>\n<td>Task<\/td>\n<td><code>Title 4<\/code><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>Rows are written in tree order: the epic first, then a feature, then that feature&#39;s backlog items, then the next feature. Each row fills exactly one title column and leaves the others blank. The tracker builds the parent-child links from that indentation. There is no parent column and there are no identifiers to match up.<\/p>\n<p>Tasks inside a stage are not written as their own rows. They are folded into the backlog item&#39;s <code>TECHNICAL DETAILS<\/code> section, keeping their short <code>tN<\/code> identifiers so you can trace a tracker item back to the exact line in the source file.<\/p>\n<p>A single backlog directory can produce well over a hundred work items, arriving as a correct three-level tree.<\/p>\n<h2 id=\"before-you-export\"><span>Before you export<\/span><a class=\"h-anchor\" href=\"#/14-export-to-a-work-tracker/before-you-export\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>One work backlog directory under <code>docs/work/<\/code>, containing <code>00-index.md<\/code> and every phase file its index lists.<\/li>\n<li>The skill installed into your agent tool.<\/li>\n<li>Node.js 24 or newer. <strong>Node.js<\/strong> is a runtime that runs JavaScript programs outside a browser, and BuildOS is one. Install it from <code>nodejs.org<\/code>, then confirm it with <code>node --version<\/code>. Nothing else is needed: no Python.<\/li>\n<li>The column list your tracker expects. See step 3 below for the fastest way to get it.<\/li>\n<li>A tracker project you are allowed to import into, and a decision about which tracker that is.<\/li>\n<\/ul>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Confirm which tracker your organisation actually uses before you export. Ask first, because the answer changes which columns you need.<\/p>\n<\/div><\/aside>\n<h2 id=\"run-the-export\"><span>Run the export<\/span><a class=\"h-anchor\" href=\"#/14-export-to-a-work-tracker/run-the-export\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ol>\n<li><p><strong>Let your agent find the skill.<\/strong> Ask your agent to use the <code>buildos-export-azure-boards<\/code> skill. The router <code>.os/skills/AGENTS.md<\/code> tells it how to install one skill into the place its own app keeps skills, so you do not need to know where that is.<\/p>\n<\/li>\n<li><p><strong>Check the command runs.<\/strong> Open a terminal in your project root, and run:<\/p>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">.os/scripts/buildos export azure-boards adapters\n<\/code><\/pre><\/div>\n<p>It prints a short JSON block listing the registered adapters and the parameters each one requires. One adapter is registered today. On Windows, run <code>.os\\scripts\\buildos.cmd<\/code> with the same arguments, and write each command below on one line: Command Prompt does not read the <code>\\<\/code> line breaks.<\/p>\n<p>In a project that pins BuildOS <code>0.1.0<\/code>, the command does not exist yet. In each command on this page, write <code>node .os/skills/buildos-export-azure-boards/scripts/azure_boards_csv.mjs<\/code> in place of <code>.os/scripts/buildos export azure-boards<\/code>. The subcommands (<code>adapters<\/code>, <code>emit<\/code>, <code>validate<\/code>) and their options are the same.<\/p>\n<\/li>\n<li><p><strong>Get the column list from the destination, not from documentation.<\/strong> Open your tracker, run a saved query that returns some work items, export it, delete the columns you do not want, and save the result as a CSV. Hand that file to your agent as the format it must produce. The column template shipped with the skill was produced exactly this way, because a file from the destination reflects what the tracker will actually accept.<\/p>\n<\/li>\n<li><p><strong>Smoke-test the exporter before you trust it with your own backlog.<\/strong> The skill ships a synthetic example. From that same directory:<\/p>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">.os/scripts/buildos export azure-boards emit \\\n  --input .os/skills/buildos-export-azure-boards/assets/synthetic-manifest.json \\\n  --output workspace/azure-boards.csv \\\n  --profile target17-new\n<\/code><\/pre><\/div>\n<p>You should see:<\/p>\n<div class=\"code-block\" data-lang=\"json\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-json\">{\n  &quot;operation&quot;: &quot;emit&quot;,\n  &quot;output&quot;: &quot;&lt;project&gt;/workspace/azure-boards.csv&quot;,\n  &quot;valid&quot;: true,\n  &quot;profile&quot;: &quot;target17-new&quot;,\n  &quot;rowCount&quot;: 6,\n  &quot;counts&quot;: {\n    &quot;Epic&quot;: 1,\n    &quot;Feature&quot;: 2,\n    &quot;Product Backlog Item&quot;: 3\n  },\n  &quot;errors&quot;: [],\n  &quot;warnings&quot;: [\n    &quot;Run an Azure Boards import preview because this compatibility profile retains blank ID, State, and Assigned To columns.&quot;\n  ]\n}\n<\/code><\/pre><\/div>\n<p><code>&lt;project&gt;<\/code> stands for your project folder. The command writes only inside the project; an <code>--output<\/code> outside it needs <code>--allow-outside-root<\/code>. The file it writes is byte-for-byte identical to <code>.os/skills/buildos-export-azure-boards/assets/synthetic-golden-example.csv<\/code>. If it is not, stop and fix your install before going further.<\/p>\n<\/li>\n<li><p><strong>Ask your agent to run the export<\/strong>, naming the backlog directory you want. The skill reads the routing files in the tree, the backlog&#39;s <code>00-index.md<\/code>, and every phase file listed in its phase map.<\/p>\n<\/li>\n<li><p><strong>Answer its questions.<\/strong> It will stop and ask you several things before it writes anything. The next section explains each one. Answer them yourself rather than letting the agent guess, because a guessed answer produces work items that look correct and cannot be built.<\/p>\n<\/li>\n<li><p><strong>Let it write the manifest and emit the file.<\/strong> The agent turns the backlog into a JSON <strong>manifest<\/strong>, meaning a plain description of every row with no formatting in it, and then runs the emit command against that manifest. BuildOS builds the CSV from the manifest, so the formatting is produced by the command rather than written by the agent.<\/p>\n<\/li>\n<li><p><strong>Validate the file.<\/strong> From that same directory again:<\/p>\n<div class=\"code-block\" data-lang=\"sh\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-sh\">.os/scripts/buildos export azure-boards validate \\\n  --input &lt;your-export.csv&gt; \\\n  --profile target17-new\n<\/code><\/pre><\/div>\n<p>A passing run prints <code>&quot;valid&quot;: true<\/code> with an empty <code>errors<\/code> list and your row counts by type. A failing run prints the reason and exits with status 4.<\/p>\n<\/li>\n<li><p><strong>Open the CSV and read it.<\/strong> Check the headers, the row count, the title columns, and two or three descriptions in full. The command cannot do this part for you. See &quot;What the command can and cannot verify&quot; below.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>The CSV keeps a field that starts with <code>=<\/code>, <code>+<\/code>, <code>-<\/code>, or <code>@<\/code> as it is, so the file imports into Azure Boards unchanged. A spreadsheet program may read such a field as a formula and run it. Import the file with Azure Boards&#39; CSV import. To look inside it, read it as plain text or with a CSV reader that treats every cell as text. Open it in a spreadsheet program only when you trust every text in the manifest.<\/p>\n<\/div><\/aside>\n<\/li>\n<li><p><strong>Review the writing before you import.<\/strong> Generated titles and descriptions need a human read. See <a href=\"#/13-build-the-work-backlog\">Build the work backlog<\/a> and the section below.<\/p>\n<\/li>\n<\/ol>\n<h2 id=\"the-questions-it-asks-you\"><span>The questions it asks you<\/span><a class=\"h-anchor\" href=\"#/14-export-to-a-work-tracker/the-questions-it-asks-you\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The skill is written to stop and ask rather than to assume. It may stop several times in a row, which is the tool behaving as designed even though a newcomer reads it as failure.<\/p>\n<p><strong>Which backlog?<\/strong> It wants one work backlog directory, not several. It will not combine backlogs from different waves or revisions, and it will not run against a backlog whose index marks it as a candidate, superseded, blocked, or planning-only. Name the directory. If you are offered a list, pick by what the index says the backlog is for, not by date.<\/p>\n<p><strong>Which adapter?<\/strong> An adapter adds rules for one target platform. The next section explains what that means. Answer with the name of an adapter or with none, and expect the skill to wait for you rather than choosing on its own.<\/p>\n<p><strong>What are the adapter&#39;s parameters?<\/strong> Each adapter declares required values. The one shipped adapter requires a <strong>publisher prefix<\/strong>, the short string that the adapter&#39;s target platform puts in front of every custom component name so the customer&#39;s components are distinguishable from the vendor&#39;s. Get the real value from whoever administers that platform.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>Never let the agent infer a parameter. The skill&#39;s own rule forbids inferring a prefix from the project name, from the repository, from an example inside the skill, or from a previous export. If you do not know the value, stop and find out. A wrong prefix produces work items that look correct and cannot be built.<\/p>\n<\/div><\/aside>\n<p><strong>Which profile?<\/strong> A profile is the exact column list and column order. <code>target17-new<\/code> is the default: seventeen columns, with the identifier, state and assigned-user columns present but always blank. Use <code>new<\/code> if your tracker rejects those blank columns. Use <code>update<\/code> only when you are changing work items that already exist and you have their real identifiers.<\/p>\n<p>New items carry no identifier, no state and no assigned user on purpose, because the tracker assigns those on import. You fill in the rest at that point.<\/p>\n<h2 id=\"what-an-adapter-is\"><span>What an adapter is<\/span><a class=\"h-anchor\" href=\"#/14-export-to-a-work-tracker/what-an-adapter-is\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The base skill decides which part of your backlog becomes which kind of row. An <strong>adapter<\/strong> decides how the text inside those rows has to be written for one particular target platform: how deep each section must go, what properties each item must carry, and what its title has to look like.<\/p>\n<p>An adapter is running code, not a note to the agent. Its checks are part of the <code>buildos export azure-boards<\/code> command, alongside a Markdown file under <code>.os/skills/buildos-export-azure-boards/adapters/<\/code> that states its authoring rules for you and your agent to read.<\/p>\n<p>One adapter is registered today. It targets one business platform and the low-code components built on it. It sets a fixed title pattern, a fixed set of work-type codes, naming and quoting conventions, and a depth requirement for the technical section. Its code runs during <code>emit<\/code>, and its errors stop the file being written. Run the <code>adapters<\/code> command from step 2 to see its id and the one parameter it requires.<\/p>\n<p>You do not have to use an adapter. If your backlog describes ordinary software work, or work across more than one platform, choose none. The base contract still gives you the full hierarchy, the three description sections, acceptance criteria, and the source trace. What you give up is the platform-specific title grammar and the platform-specific depth checks. The skill documents that fallback as a supported route.<\/p>\n<h2 id=\"what-the-command-can-and-cannot-verify\"><span>What the command can and cannot verify<\/span><a class=\"h-anchor\" href=\"#/14-export-to-a-work-tracker/what-the-command-can-and-cannot-verify\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>This split matters, so read it before you trust a green result.<\/p>\n<p><strong>Structure is what the command checks.<\/strong><\/p>\n<ul>\n<li>The header row matches the profile exactly.<\/li>\n<li>The file is UTF-8 with a byte-order mark. A <strong>byte-order mark<\/strong> is a few invisible bytes at the start of a file that tell a spreadsheet program which text encoding it is reading.<\/li>\n<li>There are between 1 and 1,000 work item rows.<\/li>\n<li>Each row fills exactly one title level.<\/li>\n<li>Every child follows a valid parent.<\/li>\n<li>The work item type matches the title level.<\/li>\n<li>Every backlog item has all three description sections and at least one acceptance criterion.<\/li>\n<li>The HTML uses only the supported tags and is balanced.<\/li>\n<li>No <code>TODO<\/code>, <code>TBD<\/code>, template marker or Markdown checkbox survives.<\/li>\n<li>New-item profiles carry no identifier, state or assigned user.<\/li>\n<li>Every backlog item carries its source trace.<\/li>\n<li>If an adapter is selected, its own deterministic rules run too.<\/li>\n<\/ul>\n<p><strong>Meaning is beyond it.<\/strong><\/p>\n<ul>\n<li>Whether the description, the acceptance criteria and the title describe the same outcome.<\/li>\n<li>Whether the adapter you picked was the right one.<\/li>\n<li>Whether every stage in your backlog actually made it into the file.<\/li>\n<li>Whether the prose reads well enough to hand to a delivery team.<\/li>\n<\/ul>\n<p>Those four fall to you and your agent, and the skill says so in as many words.<\/p>\n<p>The split shows plainly in practice. A file can pass every structural check and import cleanly while the writing is still wrong. The use-case section describes traceability to the source task instead of a business need, and the description says to deliver the task exactly as bounded by the source backlog, which sends the reader back to the file they were trying to avoid opening. The item ends up hung up on governance instead of explaining what the work is for.<\/p>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>A green validation result does not mean the items are ready to work on. Read at least three backlog items in full before you import. When a whole column is wrong, ask your agent to rewrite it rather than editing rows by hand. On phrasing the titles, see <a href=\"#/13-build-the-work-backlog\">Build the work backlog<\/a>.<\/p>\n<\/div><\/aside>\n<h2 id=\"import-it-and-check-the-hierarchy\"><span>Import it and check the hierarchy<\/span><a class=\"h-anchor\" href=\"#/14-export-to-a-work-tracker/import-it-and-check-the-hierarchy\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The export stops at the file, and a person carries out the import. The skill is explicitly told not to save work items in a tracker without separate approval, so that hand-off is deliberate.<\/p>\n<ol>\n<li><strong>Find the import screen.<\/strong> In at least one common tracker it sits under Queries rather than under Work Items, for historical reasons.<\/li>\n<li><strong>Fill in what the export deliberately left blank<\/strong> before you import: tags, states, and the iteration path. An <strong>iteration path<\/strong> is the tracker&#39;s name for the sprint or time box a work item belongs to. An <strong>area path<\/strong> is its name for the part of the product the item belongs to.<\/li>\n<li><strong>Run the import<\/strong>, and use the tracker&#39;s preview step if it offers one.<\/li>\n<li><strong>Count what arrived.<\/strong> Search the work items and compare the count with the row count the validator reported. If they differ, find out why before doing anything else.<\/li>\n<li><strong>Open one epic and inspect its children.<\/strong> Confirm the features hang off the epic and the backlog items hang off the features. A flat list and a correct tree of the same items look identical in a count.<\/li>\n<li><strong>Open one backlog item<\/strong> and confirm the description sections and acceptance criteria survived the import as readable text.<\/li>\n<\/ol>\n<aside class=\"callout callout-warning\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3z\"/><path d=\"M12 10v4M12 17.5h.01\"/><\/svg><span>Watch out<\/span><\/p><div class=\"callout-body\">\n<p>The area path may be wrong, and fixing it can need a tracker administrator you do not have direct access to, which will stall you. Find out who owns area paths in your project before import day.<\/p>\n<\/div><\/aside>\n<h2 id=\"known-limitations\"><span>Known limitations<\/span><a class=\"h-anchor\" href=\"#/14-export-to-a-work-tracker/known-limitations\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p><strong>One prefix per file.<\/strong> The adapter permits exactly one publisher prefix across every item in the export, and it enforces that as a hard error. A backlog that spans one vendor&#39;s out-of-the-box components and one customer&#39;s own customisations therefore cannot use the adapter. The validator stops with a message of this shape:<\/p>\n<div class=\"code-block\" data-lang=\"text\"><button class=\"copy-btn\" type=\"button\">Copy<\/button><pre><code class=\"language-text\">CSV declares more than one publisher prefix: &lt;first&gt;, &lt;second&gt;. One export uses one prefix.\n<\/code><\/pre><\/div>\n<p>This blocked a legitimate mixed export in practice. It was raised at the time and it has not been changed. The documented fallback is the one that was used: run the export with no adapter, on the base contract, and accept one complete mixed file. That keeps the hierarchy and the trace at the cost of the platform-specific rules.<\/p>\n<p><strong>The generated prose needs review.<\/strong> Covered above and in <a href=\"#/13-build-the-work-backlog\">Build the work backlog<\/a>. Do not promise anyone ready-to-work items straight out of the export.<\/p>\n<p><strong>The output can land somewhere nobody chose.<\/strong> Agent tools have saved generated files to a desktop or a cloud folder without being asked. Name the destination path in your prompt every time, then check that the file is where you said.<\/p>\n<p><strong>The skill can change between sessions.<\/strong> A newer version may be installed without a changelog, so if the questions it asks change, that is usually the reason.<\/p>\n<aside class=\"callout callout-notbuilt\"><p class=\"callout-title\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16v12H4z\" stroke-dasharray=\"3 3\"/><path d=\"M8 12h8\"/><\/svg><span>Not available yet<\/span><\/p><div class=\"callout-body\">\n<p>Nothing syncs the tracker back to your work backlog. The export is one direction only. When work is completed in the tracker, the source files do not learn about it. <a href=\"#/18-what-is-not-built-yet\">What is not built yet<\/a> has the full list.<\/p>\n<\/div><\/aside>\n<h2 id=\"one-important-warning-about-the-examples\"><span>One important warning about the examples<\/span><a class=\"h-anchor\" href=\"#/14-export-to-a-work-tracker/one-important-warning-about-the-examples\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The example files inside the skill use one invented publisher prefix, <code>ex_<\/code>, throughout, in the adapter documentation, the pin-file example, the manifest schema, and the worked example CSV. The skill&#39;s own rule says never to take an identifier from an example into a real export.<\/p>\n<p>Confirm your own organisation&#39;s value with the person who administers the platform, and use only that. Do not infer it from an example, from the repository, or from a project name. The example value sits in the files in front of you and looks exactly like a default, which is how it ends up in real exports.<\/p>\n<h2 id=\"what-you-should-have-now\"><span>What you should have now<\/span><a class=\"h-anchor\" href=\"#/14-export-to-a-work-tracker/what-you-should-have-now\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<ul>\n<li>The exporter skill installed, and the <code>adapters<\/code> command printing its registered adapters.<\/li>\n<li>A successful smoke test whose output matches the shipped golden example.<\/li>\n<li>One export CSV built from your own work backlog.<\/li>\n<li>A validator run reporting <code>&quot;valid&quot;: true<\/code>, with row counts by work item type.<\/li>\n<li>A record of which adapter you chose, or a note that you chose none and why.<\/li>\n<li>Work items in your tracker, counted, with one epic opened and its children checked.<\/li>\n<li>A short list of the descriptions and titles you had to send back for rewriting.<\/li>\n<\/ul>\n<h2 id=\"next\"><span>Next<\/span><a class=\"h-anchor\" href=\"#/14-export-to-a-work-tracker/next\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Read <a href=\"#/15-working-with-your-agent\">Working with your agent<\/a>. Most of what went wrong in this article came down to how the work was asked for, reviewed, and corrected, rather than to the exporter itself.<\/p>\n","toc":[{"id":"what-you-need-first","text":"What you need first","level":2},{"id":"where-the-exporter-lives","text":"Where the exporter lives","level":2},{"id":"what-it-does","text":"What it does","level":2},{"id":"before-you-export","text":"Before you export","level":2},{"id":"run-the-export","text":"Run the export","level":2},{"id":"the-questions-it-asks-you","text":"The questions it asks you","level":2},{"id":"what-an-adapter-is","text":"What an adapter is","level":2},{"id":"what-the-command-can-and-cannot-verify","text":"What the command can and cannot verify","level":2},{"id":"import-it-and-check-the-hierarchy","text":"Import it and check the hierarchy","level":2},{"id":"known-limitations","text":"Known limitations","level":2},{"id":"one-important-warning-about-the-examples","text":"One important warning about the examples","level":2},{"id":"what-you-should-have-now","text":"What you should have now","level":2},{"id":"next","text":"Next","level":2}]},"15-working-with-your-agent":{"slug":"15-working-with-your-agent","num":"15","title":"Working with your agent","lede":"This page covers the working split between you and your agent: what you hand over, how you steer a run, how you check the result, and what you never delegate.","html":"<h2 id=\"what-you-need-first\"><span>What you need first<\/span><a class=\"h-anchor\" href=\"#/15-working-with-your-agent/what-you-need-first\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Read <a href=\"#/02-how-it-works\">How it works<\/a> first.  You also need a project with BuildOS in it and an agent tool you can point at that folder. Nothing here requires a particular product.<\/p>\n<p>Two terms carry most of the weight in this article:<\/p>\n<ul>\n<li>An <strong>agent harness<\/strong> is the software wrapped around a language model that gives it tools, a working directory and a loop. Your <strong>agent<\/strong> is the two together, working on your files.<\/li>\n<li>A <strong>router<\/strong> is a short instruction file named <code>AGENTS.md<\/code> that sits in a directory and says what belongs there, what does not, and where to go next. BuildOS ships 30 of them, one per directory. Most harnesses load them on their own.<\/li>\n<\/ul>\n<p>Several earlier pages send you here for one section in particular. If that is why you arrived, go straight to <a href=\"#/15-working-with-your-agent/the-review-sweep\">The review sweep<\/a>. Read it before your first large generation run.<\/p>\n<h2 id=\"the-division-of-labour\"><span>The division of labour<\/span><a class=\"h-anchor\" href=\"#/15-working-with-your-agent/the-division-of-labour\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>The agent is fast and reliable at anything the project has already given a fixed shape to, and unreliable at anything the project never records.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Hand to the agent<\/th>\n<th>Keep for yourself<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Reading across every file in the project to answer one question<\/td>\n<td>Deciding what is true<\/td>\n<\/tr>\n<tr>\n<td>Drafting a document into a shape the project already defines<\/td>\n<td>Supplying facts nobody ever wrote down<\/td>\n<\/tr>\n<tr>\n<td>Finding a file, a record or a procedure you cannot locate<\/td>\n<td>Signing in to anything<\/td>\n<\/tr>\n<tr>\n<td>Repetitive shape work: renaming, reformatting, filling a template<\/td>\n<td>Reading the result before it is committed<\/td>\n<\/tr>\n<tr>\n<td>Proposing a plan before any work starts<\/td>\n<td>Approving the plan, and committing the output<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>People skip the last three items in the right-hand column. Everything else in this article exists to make those three cheap enough that you actually do them.<\/p>\n<h2 id=\"routing-does-the-orienting-for-you\"><span>Routing does the orienting for you<\/span><a class=\"h-anchor\" href=\"#/15-working-with-your-agent/routing-does-the-orienting-for-you\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Do not explain the folder layout in your prompts.<\/p>\n<p>Point the agent at the project, ask a plain question, and watch what it opens first. Agents read the routers before answering, without ever being told the conventions.<\/p>\n<p>In practice it goes like this. You give an opening prompt with no conventions in it. The agent opens the root router, follows it into the operating router, and reports back the correct first step for the job you described. It then keeps to the layout on its own, putting generated datasets in <code>workspace/datasets/<\/code> and documents under <code>docs/<\/code>, because the routers say so.<\/p>\n<p>This holds even on agent tools BuildOS has never heard of.<\/p>\n<p>Two things follow for you.<\/p>\n<p><strong>Write prompts about the work rather than about the filing.<\/strong> &quot;Draft a design from the notes in this file&quot; is enough. Adding three sentences about where designs live wastes your time and occasionally contradicts the router.<\/p>\n<p><strong>Read the routers yourself.<\/strong> They are written for people as well as agents, despite what the filename suggests. Realising the <code>AGENTS.md<\/code> files are readable, and reading them, is what unblocks most people.<\/p>\n<h2 id=\"when-you-cannot-find-something-ask-instead-of-browsing\"><span>When you cannot find something, ask instead of browsing<\/span><a class=\"h-anchor\" href=\"#/15-working-with-your-agent/when-you-cannot-find-something-ask-instead-of-browsing\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Working through the indexes to find a playbook rarely pays. Ask the agent in plain language instead, saying something close to &quot;please check our data and see whether we have any discoveries we could test&quot;.<\/p>\n<p>Experienced users reach for this as readily as beginners do.<\/p>\n<ol>\n<li>Ask the ordinary question you actually have. What open questions has nobody answered? Do we have anything on this topic already? How close are we to a backlog?<\/li>\n<li>Add a phrase that forces the answer out of the files rather than out of model memory. &quot;Based on our data and documents&quot; is enough.<\/li>\n<li>Watch what it reads. That tells you where things are, which is often what you needed more than the answer itself.<\/li>\n<\/ol>\n<h2 id=\"ask-for-a-proposal-before-you-ask-for-work\"><span>Ask for a proposal before you ask for work<\/span><a class=\"h-anchor\" href=\"#/15-working-with-your-agent/ask-for-a-proposal-before-you-ask-for-work\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>This habit costs one sentence per prompt.<\/p>\n<ol>\n<li>Ask what the agent recommends rather than telling it what to build. Saying &quot;we will create X&quot; hands it a decision you have not made yet.<\/li>\n<li>End the prompt with a request for its view, so it answers instead of starting.<\/li>\n<li>Add one constraint at a time and ask again. Three rounds of one-constraint-then-re-ask will turn a wrong platform-specific recommendation into a usable one.<\/li>\n<li>When the answer is right, then ask for a plan.<\/li>\n<li>Expect clarifying questions before it works, and answer them. Do not push past them.<\/li>\n<\/ol>\n<p>Four constraints produced correct behaviour in a real extraction session. Reuse them as written:<\/p>\n<ul>\n<li>Do not invent a loader.<\/li>\n<li>Propose the exact rows for review.<\/li>\n<li>State for each output whether the step is tooled or manual.<\/li>\n<li>Proceed only with what I approve.<\/li>\n<\/ul>\n<p>This matches how BuildOS&#39;s own tools behave. Every mutating entity command plans by default and only writes when you pass <code>--apply<\/code>.<\/p>\n<h2 id=\"steering-a-run-that-is-already-going\"><span>Steering a run that is already going<\/span><a class=\"h-anchor\" href=\"#/15-working-with-your-agent/steering-a-run-that-is-already-going\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Long runs are normal here, ranging from ten minutes to several hours. Stopping a run loses everything it has done, so correct it while it works instead.<\/p>\n<ol>\n<li>Do not press stop.<\/li>\n<li>Type the correction into the running conversation.<\/li>\n<li>Say explicitly that the correction does not change the work in progress.<\/li>\n<li>Add &quot;please continue.&quot;<\/li>\n<\/ol>\n<p>The same move works after a run has blocked on something you then fixed. Telling a stalled session that the toolkits are now installed and asking it to try again resumed work from the previous day with no re-explaining at all.<\/p>\n<p>Kick long work off well ahead of the meeting where you want to discuss the result.<\/p>\n<h2 id=\"say-where-the-output-goes-every-time\"><span>Say where the output goes, every time<\/span><a class=\"h-anchor\" href=\"#/15-working-with-your-agent/say-where-the-output-goes-every-time\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Name the destination folder in the prompt, name the audience, and say what the piece has to land.<\/p>\n<p>Output lands in a personal cloud folder nobody chose, or arrives as a visually broken spreadsheet or slide deck, whenever the destination and the format go unstated.<\/p>\n<h2 id=\"check-that-the-agent-did-what-it-said\"><span>Check that the agent did what it said<\/span><a class=\"h-anchor\" href=\"#/15-working-with-your-agent/check-that-the-agent-did-what-it-said\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Agents report intentions as completions. The shape to watch for is a sentence about what <em>should<\/em> happen next presented as a claim that it happened. &quot;A later step should use it to correct those rows&quot; is not a correction of any rows.<\/p>\n<p>Here are some strategies for checking this:<\/p>\n<ol>\n<li>Notice the shape and name it out loud in your reply.<\/li>\n<li>State the required output explicitly. Say what file must change and how.<\/li>\n<li>Leave the agent room. Asking it to infer the values as best it can produced better results than demanding precision it could not deliver.<\/li>\n<li>Check the artifact, not the report.<\/li>\n<li>When it is wrong about <em>why<\/em> something happened, correct the causality explicitly. In one session an agent blamed a newly working validator for records it had written itself, and the correction had to be dictated back to it.<\/li>\n<\/ol>\n<h2 id=\"gating-and-approvals\"><span>Gating and approvals<\/span><a class=\"h-anchor\" href=\"#/15-working-with-your-agent/gating-and-approvals\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Most harnesses ask permission before each action by default, so you tend to have to supervise them closely.<\/p>\n<p>Both failure modes are common. Approval prompts on every step wear you down until you switch the tool to approve everything. In the other direction, clicking a proposed plan can begin executing it with no confirmation at all.<\/p>\n<p>The trade-off runs like this. Approval prompts stop working as a safety mechanism after about the twentieth one, when you stop reading them, and they earn their keep instead as a pacing mechanism while you are learning what a procedure does. Turn them down once you know the shape of the work, and rely on the diff. Leave them on while you are still finding out what a step touches.<\/p>\n<h2 id=\"the-safety-model\"><span>The safety model<\/span><a class=\"h-anchor\" href=\"#/15-working-with-your-agent/the-safety-model\" aria-label=\"Link to this section\">#<\/a><\/h2>\n<p>Because everything is in git, the work is mostly reversible. That is true, within limits.<\/p>\n<p>Source control is not a sandbox. The agent runs with whatever privileges your tool gives it, on your real files. What git buys you is that you can see every change and undo any of them.<\/p>\n<p>Both halves depend on you having committed. Commits routinely do not happen, and nothing causes more friction over time.<\/p>\n<p>Two habits make the model work, and neither is enforced by anything BuildOS ships:<\/p>\n<ul>\n<li><strong>Commit before you bring in new material.<\/strong> Conversion writes a set of new files into <code>assets/<\/code>. A clean starting point makes the di

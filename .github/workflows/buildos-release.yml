# BuildOS release (W1 R7 P8 t4 and t5; review rounds 1 and 2 and the final
# check; PRD 20
# Release). npm trusted publishing (OIDC) replaces a stored token; the
# reviewed tarball SHA-256 is committed in toolkits/buildos/release-candidates.json
# first; the package is only staged (`npm stage publish --provenance`), and a
# maintainer approves the stage on npm with 2FA. This workflow never publishes.
#
# Release flow (review round 2, P8-R2-05; GitHub's immutable-release
# procedure: attach every asset to a draft, then publish it):
# 1. The maintainer creates the tag v<version> on the reviewed commit and a
#    DRAFT GitHub Release for it.
# 2. prepare (workflow_dispatch on the default branch, purpose `prepare`):
#    resolve, verify, the real deny list, then `attach` puts the verified
#    tarball and the SBOM on the draft.
# 3. The maintainer reviews the draft and publishes it. With release
#    immutability on, its tag and assets are then fixed.
# 4. release (release: published): resolve, verify (a fresh rebuild that must
#    give the reviewed digest again), the real deny list, then `stage`
#    checks the rulesets, downloads the tarball and the SBOM from the release
#    assets, checks both (the SBOM against this run's verify SBOM), and
#    stages the tarball.
#
# Jobs and trust (toolkits/buildos/SECURITY.md, Release Trust Boundary):
# - resolve: runs no repository code. Validates every event value, resolves
#   ONE release commit SHA and the TRUSTED SHA (the default branch head), and
#   checks that the release commit is on the default branch.
# - verify: no secret, contents: read. Runs the candidate's build, tests, and
#   gates (scripts/release-gate.ts) with an invented deny list. Uploads the
#   tarball, build record, and SBOM only when every gate passed.
# - deny-list, attach, stage, discard: run ONLY release-control code from the
#   trusted SHA (scripts/release-stage-check.ts, scripts/release-github.ts,
#   scripts/check-deny-list.mjs; Node built-ins only, no npm install, no
#   build). They read the candidate as data: its ledger by commit and path
#   from git, its tree as files, and the tarball as bytes.
#
# Dry runs: workflow_dispatch with purpose `dry-run`, or a push to a branch
# named release-dry-run/**. They run resolve and verify only. `candidates:
# self` makes a self entry from build A and checks an independent build B
# against it (A64); `committed` reads the ledger from git. `plant` injects
# one known failure into one gate (A64, A65); a branch named
# release-dry-run/<name>-plant-<gate> plants that gate's failure.
#
# Reference build environment (t2): runner image ubuntu-24.04, Node 24.22.3,
# and the npm it bundles (11.19.1); scripts/release-lib.ts holds the same
# values. Event values reach a `run:` script only through `env:`.
name: buildos-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      purpose:
        description: "dry-run: gates only; prepare: gates, real deny list, and attach the assets to the draft release of the tag"
        required: true
        type: choice
        options: [dry-run, prepare]
        default: dry-run
      tag:
        description: Tag (prepare needs it; for a dry run, empty means v plus the package.json version)
        required: false
        type: string
        default: ""
      candidates:
        description: "self: an entry made from this run's build A; committed: the ledger in git (prepare uses committed)"
        required: true
        type: choice
        options: [self, committed]
        default: self
      plant:
        description: Planted failure (dry run only)
        required: true
        type: choice
        options: [none, tag, version, digest, eval, audit, osv, deny-list]
        default: none
  push:
    branches:
      - "release-dry-run/**"

permissions:
  contents: read

concurrency:
  group: buildos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      mode: ${{ steps.resolve.outputs.mode }}
      gate_mode: ${{ steps.resolve.outputs.gate_mode }}
      candidates: ${{ steps.resolve.outputs.candidates }}
      plant: ${{ steps.resolve.outputs.plant }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      release_id: ${{ steps.resolve.outputs.release_id }}
      trusted_sha: ${{ steps.resolve.outputs.trusted_sha }}
      default_branch: ${{ steps.resolve.outputs.default_branch }}
    steps:
      # The event commit by SHA, never by a name (a branch of the same name
      # would win over a tag). Full history: every branch and tag.
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Runs no file of the checkout: git and this script only.
      # test/release-workflow.test.ts runs this script on scratch repositories.
      - name: Validate the event and resolve one commit
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ format('{0}', github.event.release.prerelease) }}
          RELEASE_ID: ${{ format('{0}', github.event.release.id) }}
          INPUT_PURPOSE: ${{ inputs.purpose }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CANDIDATES: ${{ inputs.candidates }}
          INPUT_PLANT: ${{ inputs.plant }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          fail() { printf '::error title=Release resolve::%s\n' "$1"; exit 1; }
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver_tag="^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-${id}(\.${id})*)?$"
          release_id=""
          case "$EVENT_NAME" in
            release) mode=release; tag="$RELEASE_TAG"; candidates=committed; plant=none ;;
            workflow_dispatch)
              case "$INPUT_PURPOSE" in
                dry-run) mode=dry-run; tag="$INPUT_TAG"; candidates="$INPUT_CANDIDATES"; plant="$INPUT_PLANT" ;;
                prepare)
                  mode=prepare; tag="$INPUT_TAG"; candidates=committed; plant=none
                  [ "$INPUT_CANDIDATES" = committed ] || fail "prepare reads the committed ledger: choose candidates committed"
                  [ "$INPUT_PLANT" = none ] || fail "prepare refuses a planted failure"
                  [ -n "$tag" ] || fail "prepare needs the tag of the draft release" ;;
                *) fail "purpose must be dry-run or prepare" ;;
              esac ;;
            push)
              mode=dry-run; tag=""; candidates=self
              case "$GITHUB_REF_NAME" in
                release-dry-run/*-plant-*) plant="${GITHUB_REF_NAME##*-plant-}" ;;
                *) plant=none ;;
              esac ;;
            *) fail "this workflow does not run on that event" ;;
          esac
          case "$candidates" in self | committed) ;; *) fail "candidates must be self or committed" ;; esac
          case "$plant" in none | tag | version | digest | eval | audit | osv | deny-list) ;; *) fail "unknown planted failure" ;; esac
          [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || fail "the default branch name is not a plain branch name"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "the event commit is not a full commit SHA"
          [ "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA" ] || fail "the checkout is not the event commit"
          if [ -z "$tag" ]; then
            [ "$mode" = dry-run ] || fail "a release needs its tag"
            version=$(git show "$GITHUB_SHA:toolkits/buildos/package.json" | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).version)))')
            tag="v$version"
          fi
          if [ "${#tag}" -gt 128 ] || ! [[ "$tag" =~ $semver_tag ]]; then fail "the tag is not v followed by an exact semver version"; fi
          trusted=$(git rev-parse --verify --quiet --end-of-options "refs/remotes/origin/$DEFAULT_BRANCH^{commit}") || fail "the default branch is not in the checkout"
          sha="$GITHUB_SHA"
          prerelease=""
          case "$mode" in
            release)
              [ "$GITHUB_REF" = "refs/tags/$tag" ] || fail "the event ref is not the release tag ref"
              peeled=$(git rev-parse --verify --quiet --end-of-options "refs/tags/$tag^{commit}") || fail "the release tag is not in the checkout"
              [ "$peeled" = "$sha" ] || fail "the release tag does not point at the event commit"
              case "$RELEASE_PRERELEASE" in true | false) prerelease="$RELEASE_PRERELEASE" ;; *) fail "the release prerelease flag is not true or false" ;; esac
              [[ "$RELEASE_ID" =~ ^[1-9][0-9]{0,19}$ ]] || fail "the release ID is not a number"
              release_id="$RELEASE_ID"
              # npm makes provenance only for a public repository: stop before any build (P8-R2-01).
              [ "$REPOSITORY_VISIBILITY" = public ] || fail "npm provenance needs a public repository; this one is ${REPOSITORY_VISIBILITY:-of unknown visibility}" ;;
            prepare)
              # The workflow file of a prepare run must be the default branch's (P8-R2-01).
              [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ] || fail "run prepare from the default branch"
              sha=$(git rev-parse --verify --quiet --end-of-options "refs/tags/$tag^{commit}") || fail "the tag does not exist; create the tag and its draft release first" ;;
          esac
          on_default=false
          if git merge-base --is-ancestor "$sha" "$trusted"; then on_default=true; fi
          if [ "$mode" != dry-run ] && [ "$on_default" != true ]; then fail "the release commit is not on the default branch"; fi
          gate_mode=release
          if [ "$mode" = dry-run ]; then gate_mode=dry-run; fi
          {
            echo "sha=$sha"
            echo "tag=$tag"
            echo "mode=$mode"
            echo "gate_mode=$gate_mode"
            echo "candidates=$candidates"
            echo "plant=$plant"
            echo "prerelease=$prerelease"
            echo "release_id=$release_id"
            echo "trusted_sha=$trusted"
            echo "default_branch=$DEFAULT_BRANCH"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### BuildOS release gates ($mode)"
            echo "Commit \`$sha\`, tag \`$tag\`, candidates \`$candidates\`, planted failure \`$plant\`; on the default branch: $on_default; trusted code from \`$trusted\`."
            if [ "$mode" = dry-run ]; then echo "A dry run stops before staging. It never stages or publishes."; fi
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Release gates (candidate build, no secret)
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: toolkits/buildos
    env:
      MODE: ${{ needs.resolve.outputs.gate_mode }}
      PLANT: ${{ needs.resolve.outputs.plant }}
      CANDIDATES_SOURCE: ${{ needs.resolve.outputs.candidates }}
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
      REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      OSV_SCANNER_VERSION: "2.7.1"
      # SHA-256 of osv-scanner_linux_amd64 from the v2.7.1 release osv-scanner_SHA256SUMS.
      OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
    outputs:
      tarball_sha256: ${{ steps.digest.outputs.tarball_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      # The resolved SHA; full history for the identity gate.
      - name: Check out the resolved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24.22.3 (the reference build environment)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"

      - name: Check the reference build environment
        run: |
          echo "runner image: $ImageOS $ImageVersion; node $(node --version); npm $(npm --version)"
          test "$(node --version)" = "v24.22.3"
          test "$(npm --version)" = "11.19.1"
          test "$ImageOS" = "ubuntu24"
          test "$(git rev-parse HEAD)" = "$SHA"

      - name: Dependency policy guard (lockfile and .npmrc)
        run: node scripts/check-dependencies.ts

      - name: Install with install scripts off
        run: npm ci --ignore-scripts

      - name: Dependency policy guard (installed manifests)
        run: node scripts/check-dependencies.ts --installed

      - name: Release candidates file check (reviewed entries only)
        run: node scripts/release-candidate.ts check

      # Dry run, candidates self: build A at HEAD and a self entry from it,
      # outside the repository. Build B below is a separate clean build and
      # must give the same bytes (the agreement case of A64). Otherwise the
      # gates read the committed ledger from git at HEAD (P8-R2-08).
      - name: Self candidate entry from build A (dry run only)
        if: env.CANDIDATES_SOURCE == 'self'
        run: |
          if [ "$MODE" = "release" ]; then echo "A release never uses a self entry." >&2; exit 1; fi
          node scripts/release-build.ts --out "$RUNNER_TEMP/build-a"
          node scripts/release-candidate.ts self --build "$RUNNER_TEMP/build-a/release-build.json" --out "$RUNNER_TEMP/self-candidates.json"
          echo "CANDIDATES=$RUNNER_TEMP/self-candidates.json" >> "$GITHUB_ENV"

      - name: "Gate: tag, version, and reviewed entry"
        id: identity
        run: |
          args=(identity --mode "$MODE" --plant "$PLANT" --tag "$TAG" --head "$SHA")
          if [ -n "${CANDIDATES:-}" ]; then args+=(--candidates "$CANDIDATES"); fi
          if [ -n "$RELEASE_PRERELEASE" ]; then args+=(--prerelease "$RELEASE_PRERELEASE"); fi
          node scripts/release-gate.ts "${args[@]}"

      - name: Release build B and pack (version and the reviewed source revision)
        env:
          SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
        run: |
          node scripts/release-build.ts --out "$RUNNER_TEMP/release" --revision "$SOURCE_COMMIT"
          version="${TAG#v}"
          {
            echo "TARBALL=$RUNNER_TEMP/release/build-os-$version.tgz"
            echo "SBOM=$RUNNER_TEMP/release/buildos-$version.cdx.json"
            echo "SOURCE_COMMIT=$SOURCE_COMMIT"
          } >> "$GITHUB_ENV"

      - name: "Gate: rebuilt tarball digest equals the reviewed digest"
        id: digest
        run: |
          args=(digest --mode "$MODE" --plant "$PLANT" --tag "$TAG" --tarball "$TARBALL")
          if [ -n "${CANDIDATES:-}" ]; then args+=(--candidates "$CANDIDATES"); fi
          node scripts/release-gate.ts "${args[@]}"

      - name: "Gate: the packed CLI reports the version and source revision"
        run: node scripts/release-gate.ts version --mode "$MODE" --plant "$PLANT" --tarball "$TARBALL" --expect-revision "$SOURCE_COMMIT"

      - name: "Gate: typecheck, unit tests, and golden suites"
        run: node scripts/release-gate.ts tests --mode "$MODE" --plant "$PLANT"

      - name: "Gate: golden parity from the installed release-stamped tarball"
        run: node scripts/release-gate.ts installed --mode "$MODE" --plant "$PLANT" --tarball "$TARBALL" --expect-revision "$SOURCE_COMMIT"

      - name: "Gate: conversion eval"
        run: node scripts/release-gate.ts eval --mode "$MODE" --plant "$PLANT"

      - name: "Gate: npm audit"
        run: node scripts/release-gate.ts audit --mode "$MODE" --plant "$PLANT"

      - name: Install osv-scanner (checksum pinned)
        working-directory: .
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"

      - name: "Gate: OSV scan"
        run: |
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source --lockfile=package-lock.json --format=json --output-file="$RUNNER_TEMP/osv-results.json"
          scanner_exit=$?
          set -e
          node scripts/release-gate.ts osv --mode "$MODE" --plant "$PLANT" --exit-code "$scanner_exit" --results "$RUNNER_TEMP/osv-results.json"

      # No secret in this job: an invented list, which checks home-folder
      # paths and unread files and carries the planted failure. The real list
      # is checked by the deny-list job, from trusted code.
      - name: "Gate: deny-list scanner with an invented list (repository tree and the tarball)"
        run: node scripts/release-gate.ts deny-list --mode "$MODE" --plant "$PLANT" --invented-list --tarball "$TARBALL"

      - name: "Gate: CycloneDX SBOM (valid against the CycloneDX 1.5 schema)"
        run: node scripts/release-gate.ts sbom --mode "$MODE" --plant "$PLANT" --tarball "$TARBALL" --revision "$SOURCE_COMMIT" --out "$SBOM"

      - name: "Gate: provenance preconditions"
        run: node scripts/release-gate.ts provenance --mode "$MODE" --plant "$PLANT" --visibility "$REPOSITORY_VISIBILITY" --repository "$GITHUB_REPOSITORY"

      # Only after every gate passed (the default success() condition). The
      # name holds the run attempt, so a re-run never meets an older artifact.
      - name: Keep the tarball, SBOM, and build record
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buildos-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: ${{ needs.resolve.outputs.mode == 'dry-run' && 3 || 1 }}

  # Prepare and release. The real list, in the environment buildos-deny-list
  # (deployment refs: the default branch and v* tags), as the environment
  # secret BUILDOS_DENY_LIST_ENV, which no repository or organization secret
  # can stand in for (P8-R2-04). Trusted code only.
  deny-list:
    name: Release deny list (real list, trusted scanner)
    needs: [resolve, verify]
    if: needs.resolve.outputs.mode != 'dry-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: buildos-deny-list
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
      DEFAULT_BRANCH: ${{ needs.resolve.outputs.default_branch }}
      TARBALL_SHA256: ${{ needs.verify.outputs.tarball_sha256 }}
    steps:
      # Full history, so the candidate commit is readable with git as data.
      - name: Check out the trusted release scripts (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.trusted_sha }}
          path: trusted
          fetch-depth: 0
          sparse-checkout: toolkits/buildos/scripts
          persist-credentials: false

      - name: Check out the candidate tree (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: candidate
          persist-credentials: false

      - name: Set up Node 24.22.3
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"

      - name: The environment deploys only from the default branch and v* tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node trusted/toolkits/buildos/scripts/release-github.ts environment --name buildos-deny-list --allow "branch:$DEFAULT_BRANCH,tag:v*"

      # Before the step that holds the secret (P8-F-01). The job token reads
      # rulesets with the Metadata permission it always has.
      - name: The branch and tag rulesets are active
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node trusted/toolkits/buildos/scripts/release-github.ts rulesets --branch "$DEFAULT_BRANCH"

      - name: Download the checked tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: buildos-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact

      - name: The tarball is the reviewed one (ledger read from git at the release commit)
        run: |
          echo "TARBALL=$RUNNER_TEMP/artifact/build-os-${TAG#v}.tgz" >> "$GITHUB_ENV"
          node trusted/toolkits/buildos/scripts/release-stage-check.ts digest --repo trusted --commit "$SHA" --tag "$TAG" --tarball "$RUNNER_TEMP/artifact/build-os-${TAG#v}.tgz" --expect-sha256 "$TARBALL_SHA256"

      # The scanner prints redacted locations only (a file label and line,
      # never a term). A missing or empty list fails the check (fail closed).
      - name: Deny-list check (candidate tree and every file of the tarball)
        env:
          BUILDOS_DENY_LIST: ${{ secrets.BUILDOS_DENY_LIST_ENV }}
        run: |
          set -o pipefail
          status=0
          node trusted/toolkits/buildos/scripts/check-deny-list.mjs --root candidate --tarball "$TARBALL" | tee "$RUNNER_TEMP/deny-list.txt" || status=$?
          {
            echo "### Client-name deny list (real list)"
            grep '^deny-list: ' "$RUNNER_TEMP/deny-list.txt" | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Prepare only. Attaches the verified tarball and the SBOM to the draft
  # release of the tag, by release ID, after trusted checks. Assets go on a
  # draft: once an immutable release is published they cannot change.
  attach:
    name: Attach the verified assets to the draft release
    needs: [resolve, verify, deny-list]
    if: needs.resolve.outputs.mode == 'prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Check out the trusted release scripts (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.trusted_sha }}
          path: trusted
          fetch-depth: 0
          sparse-checkout: toolkits/buildos/scripts
          persist-credentials: false

      - name: Set up Node 24.22.3
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"

      - name: Find the draft release of the tag
        id: draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node trusted/toolkits/buildos/scripts/release-github.ts find-draft --tag "$TAG"

      - name: Download the checked tarball and SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: buildos-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact

      - name: Check and attach the tarball and the SBOM
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node trusted/toolkits/buildos/scripts/release-github.ts attach --release-id "$RELEASE_ID" --repo trusted --commit "$SHA" --tag "$TAG" --tarball "$RUNNER_TEMP/artifact/build-os-${TAG#v}.tgz" --sbom "$RUNNER_TEMP/artifact/buildos-${TAG#v}.cdx.json"

  # Release only. A required reviewer of buildos-npm-stage approves this job
  # in GitHub before it starts and gets its OIDC token. Trusted code only; it
  # stages the tarball from the published, immutable release assets.
  stage:
    name: Stage on npm (approval with 2FA needed)
    needs: [resolve, verify, deny-list]
    if: needs.resolve.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: buildos-npm-stage
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
      TARBALL_SHA256: ${{ needs.verify.outputs.tarball_sha256 }}
      REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      DEFAULT_BRANCH: ${{ needs.resolve.outputs.default_branch }}
    steps:
      - name: Check out the trusted release scripts (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.trusted_sha }}
          path: trusted
          fetch-depth: 0
          sparse-checkout: toolkits/buildos/scripts
          persist-credentials: false

      # No registry-url: setup-node would write an npmrc and point npm at it.
      - name: Set up Node 24.22.3
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"

      - name: Check npm (staged publishing needs 11.15.0 or newer)
        run: test "$(npm --version)" = "11.19.1"

      - name: "Check first: a public repository and the OIDC token request"
        run: node trusted/toolkits/buildos/scripts/release-stage-check.ts precheck --visibility "$REPOSITORY_VISIBILITY" --repository "$GITHUB_REPOSITORY" --require-oidc

      - name: "Check: the environment has a required reviewer, who approved this run"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node trusted/toolkits/buildos/scripts/release-github.ts environment --name buildos-npm-stage --allow "tag:v*" --require-reviewers --run-id "$GITHUB_RUN_ID"

      # Before npm is started (P8-F-01).
      - name: "Check: the branch and tag rulesets are active"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node trusted/toolkits/buildos/scripts/release-github.ts rulesets --branch "$DEFAULT_BRANCH"

      # The SBOM that this run's verify job generated from the tagged commit
      # (data only): the release SBOM must have the same bytes (P8-F-02).
      - name: Download this run's verify SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: buildos-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact

      - name: Download and check the tarball and the SBOM of the published release
        id: asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node trusted/toolkits/buildos/scripts/release-github.ts download-asset --release-id "$RELEASE_ID" --tag "$TAG" --out "$RUNNER_TEMP/asset" --repo trusted --commit "$SHA" --expect-sha256 "$TARBALL_SHA256" --verify-sbom "$RUNNER_TEMP/artifact/buildos-${TAG#v}.cdx.json"

      # The digest, layout, and manifest checks, then npm stage publish from
      # an empty folder with a clean npm environment (P8-R2-02).
      - name: Check and stage the reviewed tarball with npm trusted publishing and provenance
        env:
          ASSET: ${{ steps.asset.outputs.tarball }}
        run: node trusted/toolkits/buildos/scripts/release-stage-check.ts publish --repo trusted --commit "$SHA" --tag "$TAG" --tarball "$ASSET" --expect-sha256 "$TARBALL_SHA256" --visibility "$REPOSITORY_VISIBILITY" --repository "$GITHUB_REPOSITORY" --require-oidc --work "$RUNNER_TEMP/stage"

      - name: Record the npm approval step
        run: |
          {
            echo "### npm approval needed"
            echo "BuildOS $TAG is staged on npm. It is not public."
            echo "Publish it only after the recorded maintainer approval: on npmjs.com (signed in), open the Staged Packages tab in your account settings, review it (or run npm stage view <stage-id> and npm stage download <stage-id>), and approve it with two-factor authentication (or run npm stage approve <stage-id>). Reject it if it is wrong."
          } >> "$GITHUB_STEP_SUMMARY"

  # Prepare and release: when the real deny-list check fails, the uploaded
  # tarball may hold a name on the list, so it is deleted at once. Only an
  # artifact of this run, with this run attempt's name, is deleted.
  discard:
    name: Delete the artifact after a deny-list failure
    needs: [resolve, verify, deny-list]
    if: always() && needs.resolve.outputs.mode != 'dry-run' && needs.deny-list.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    defaults:
      run:
        shell: bash
    env:
      ARTIFACT_ID: ${{ needs.verify.outputs.artifact_id }}
      ARTIFACT_NAME: buildos-release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the trusted release scripts (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.trusted_sha }}
          path: trusted
          sparse-checkout: toolkits/buildos/scripts
          persist-credentials: false

      - name: Set up Node 24.22.3
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"

      - name: Delete this run's tarball artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node trusted/toolkits/buildos/scripts/release-github.ts discard --run-id "$GITHUB_RUN_ID" --artifact-id "$ARTIFACT_ID" --name "$ARTIFACT_NAME"

# BuildOS published-package smoke test (W1 R7 P8 t15). It runs
# toolkits/buildos/scripts/published-smoke.ts on three operating systems with
# Node 24: `npx -y build-os@<version>` in clean folders with a clean npm cache
# (version, init with no TTY, init --skip-make-docs, one intake conversion,
# entities validate, validate, one legacy name, and the project wrapper with
# Node.js missing and present). It is not a release workflow: it reads the
# public npm registry only, holds no secret, uses no environment, and has
# read-only repository access. npm install scripts are off for every install
# (npm_config_ignore_scripts=true, set by the script). The captured output,
# with temporary paths and the user name replaced, is kept as an artifact.
name: buildos-smoke

# A maintainer runs it for any published version; a pull request runs it
# (for the default version) only when this file or the script changes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published build-os version to smoke-test (for example 0.1.0)"
        required: true
        default: "0.1.0"
        type: string
  pull_request:
    paths:
      - ".github/workflows/buildos-smoke.yml"
      - "toolkits/buildos/scripts/published-smoke.ts"
      - "toolkits/buildos/scripts/printed-fix-step.ts"

permissions:
  contents: read

concurrency:
  group: buildos-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (${{ matrix.os }}, Node 24)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: toolkits/buildos
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The version reaches the script through the environment, never as
      # workflow text in the script; the script accepts only a plain version.
      - name: Smoke test of the published package
        env:
          SMOKE_VERSION: ${{ inputs.version || '0.1.0' }}
        run: node scripts/published-smoke.ts --version "$SMOKE_VERSION" --out "$RUNNER_TEMP/smoke"

      - name: Keep the captured output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buildos-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: error
          retention-days: 30
